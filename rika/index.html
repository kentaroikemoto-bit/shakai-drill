 {"id": "L005", "u": "光合成", "lv": "標準", "r": 60, "f": "知識", "q": "日かげで育てた植物は、日なたで育てた植物と比べてどうなりますか。", "c": ["葉は小さくうすい緑色、茎は細く、草たけは高い", "葉は大きくこい緑色、茎は太く、草たけは低い", "葉は小さくうすい緑色、茎は太く、草たけは低い", "日なたと同じように育つ"], "e": "日かげの植物は光を求めてひょろ長くのびますが、葉は小さく、茎も細くなります。"}, {"id": "L006", "u": "光合成", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "ふ入りのアサガオの葉で光合成の実験をするとき、前の日に葉を一晩暗い所に置くのはなぜですか。", "c": ["葉の中にあるでんぷんをなくすため", "葉の中のでんぷんを増やすため", "葉を大きく成長させるため", "葉の水分をなくすため"], "e": "暗い所では光合成ができず、葉にあったでんぷんは使われたり運ばれたりして、なくなります。"}, {"id": "L007", "u": "光合成", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "光合成の実験で、つみ取った葉を最初に熱湯につけるのはなぜですか。", "c": ["葉をやわらかくし、葉のはたらきを止めるため", "葉の緑色をぬくため", "でんぷんを増やすため", "ヨウ素液をしみこみやすくするため"], "e": "熱湯につけると葉がやわらかくなり、はたらきが止まって、でんぷんが分解されるのを防げます。"}, {"id": "L008", "u": "光合成", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "光合成の実験で、葉を温めたアルコールにつけるのはなぜですか。", "c": ["葉の緑色をとかし出して色をぬき、ヨウ素液の色の変化を見やすくするため", "葉をやわらかくするため", "でんぷんをつくらせるため", "葉の中の水をなくすため"], "e": "緑色が残っていると、青紫色に変わったかどうかが分かりにくくなります。"}, {"id": "L009", "u": "光合成", "lv": "標準", "r": 58, "f": "しくみ・理由", "q": "光合成の実験で、アルコールの入ったビーカーをアルコールランプで直接温めず、湯で温めるのはなぜですか。", "c": ["アルコールは気体になりやすく、引火しやすいため", "アルコールは有毒で口に入る危険があるため", "アルコールが葉をかたくするため", "湯の方が早く温まるため"], "e": "アルコールに直接火を近づけると、火がついてとても危険です。"}, {"id": "L010", "u": "光合成", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "ふ入りの葉の一部をアルミはくでおおって日光に当て、ヨウ素液につけました。青紫色になったのはどこですか。", "c": ["アルミはくでおおっていない緑色の部分", "アルミはくでおおった緑色の部分", "アルミはくでおおっていないふの部分", "葉全体"], "e": "光合成には日光と葉緑体の両方が必要なので、日光が当たった緑色の部分だけででんぷんができます。"}, {"id": "L011", "u": "光合成", "lv": "応用", "r": 50, "f": "図の読み取り", "q": "ふ入りの葉の実験で、Aは日光○・葉緑体○、Bは日光×・葉緑体○、Cは日光○・葉緑体×です。「光合成には葉緑体が必要」ということを確かめるには、どれとどれを比べればよいですか。", "c": ["AとC", "AとB", "BとC", "AとBとC"], "e": "ちがう条件が葉緑体の有無だけになるAとCを比べます。AとBを比べると、日光が必要なことが分かります。"}, {"id": "L012", "u": "光合成", "lv": "標準", "r": 58, "f": "知識", "q": "条件を1つだけ変えて結果を比べ、その条件が必要かどうかを確かめる実験を何といいますか。", "c": ["比較対照実験", "仮説実験", "観察実験", "燃焼実験"], "e": "1度に2つ以上の条件を変えると、どちらが原因か分からなくなります。"}, {"id": "L013", "u": "光合成", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "アサガオの葉にポリエチレンの袋をかぶせ、袋の中に水酸化ナトリウム水溶液をしみこませたろ紙を入れました。日光に当てたあと、この葉はヨウ素液で変化しませんでした。分かることはどれですか。", "c": ["光合成には二酸化炭素が必要である", "光合成には酸素が必要である", "光合成には水が必要である", "光合成にはポリエチレンが必要である"], "e": "水酸化ナトリウム水溶液や石灰水は二酸化炭素を吸収するので、袋の中の二酸化炭素がなくなります。"}, {"id": "L014", "u": "光合成", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "葉の一部をアルミはくでおおい、昼間日光に当てたあと、葉をつまずにさらに一晩おいてからヨウ素液につけました。おおわなかった部分の色と理由の組み合わせとして正しいものはどれですか。", "c": ["茶かっ色のままで、夜の間にでんぷんが使われたり運ばれたりしたから", "青紫色で、昼にできたでんぷんが残っているから", "青紫色で、夜にもでんぷんがつくられるから", "緑色で、アルミはくをはずしたから"], "e": "葉でできたでんぷんは、夜の間に水に溶けやすい糖に変わって、からだの各部に運ばれます。"}, {"id": "L015", "u": "光合成", "lv": "基礎", "r": 80, "f": "知識", "q": "植物が気体を吸収したり放出したりするときの出入り口を何といいますか。また、ふつう葉のどちら側に多くありますか。", "c": ["気孔で、葉の裏側に多い", "気孔で、葉の表側に多い", "葉緑体で、葉の裏側に多い", "孔辺細胞で、葉の表側に多い"], "e": "気孔は2つの孔辺細胞にはさまれたすき間で、孔辺細胞の形が変わることで開いたり閉じたりします。"}, {"id": "L016", "u": "光合成", "lv": "基礎", "r": 82, "f": "知識", "q": "植物は、光合成と呼吸をいつ行っていますか。", "c": ["光合成は昼間のみ、呼吸は1日中", "光合成も呼吸も昼間のみ", "光合成は1日中、呼吸は夜間のみ", "光合成は夜間のみ、呼吸は昼間のみ"], "e": "光合成は光が当たっている間だけですが、呼吸は動物と同じように1日中行っています。"}, {"id": "L017", "u": "光合成", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "昼間、植物全体で見ると二酸化炭素を取り入れ、酸素を出しているのはなぜですか。", "c": ["呼吸よりも光合成のはたらきの方が大きいから", "昼間は呼吸をしていないから", "光合成で二酸化炭素がつくられるから", "呼吸で酸素がつくられるから"], "e": "昼間も呼吸はしていますが、光合成の方がさかんなので、全体として二酸化炭素を吸収し、酸素を出しています。"}, {"id": "L018", "u": "光合成", "lv": "標準", "r": 58, "f": "知識", "q": "夜間、植物はどのように気体を出し入れしていますか。", "c": ["酸素を取り入れ、二酸化炭素を出している", "二酸化炭素を取り入れ、酸素を出している", "気体の出し入れはまったくしていない", "酸素も二酸化炭素も取り入れている"], "e": "夜は光合成ができず、呼吸だけを行うので、動物と同じように酸素を取り入れて二酸化炭素を出します。"}, {"id": "L019", "u": "光合成", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "植物に透明な袋をかぶせて息を吹きこみ、明るい所に置いたあと暗い所に移しました。袋の中の二酸化炭素の量の変化として正しいものはどれですか。", "c": ["明るい所では減り、暗い所に移すと増えていく", "明るい所では増え、暗い所に移すと減っていく", "ずっと増え続ける", "ずっと変わらない"], "e": "明るい所では光合成で二酸化炭素が使われ、暗い所では呼吸だけになるので二酸化炭素が増えます。酸素はその反対の変化をします。"}, {"id": "L020", "u": "光合成", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "明るい所と暗い所で種子を発芽させ、乾燥させた重さを毎日はかりました。明るい所の種子は7日目ごろから重くなりましたが、暗い所の種子は減り続けました。その理由として正しいものはどれですか。", "c": ["明るい所では本葉が出て光合成で養分をつくれるが、暗い所では呼吸で養分を使うだけだから", "暗い所の方が水を多く吸うから", "明るい所では呼吸をしないから", "暗い所では発芽しないから"], "e": "どちらもはじめは種子の養分を呼吸に使うので軽くなります。暗い所では光合成ができないので、軽くなり続けます。"}, {"id": "L021", "u": "光合成", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "メダカ2匹を入れた容器に、オオカナダモを0本・1本・2本・4本入れて、明るい所に置きました。メダカが最も長生きすると考えられるのはどれですか。また、暗い所ではどうですか。", "c": ["明るい所では4本、暗い所では0本", "明るい所でも暗い所でも4本", "明るい所では0本、暗い所では4本", "どちらでも同じ"], "e": "明るい所ではオオカナダモが光合成で酸素を出します。暗い所では呼吸だけをするので、酸素を使って減らしてしまいます。"}, {"id": "L022", "u": "光合成", "lv": "標準", "r": 62, "f": "知識", "q": "水草を入れたビーカーに息を吹きこんで日光に当てると、泡が出ました。この泡は何ですか。", "c": ["酸素", "二酸化炭素", "窒素", "水蒸気"], "e": "息にふくまれる二酸化炭素を使って光合成が行われ、酸素ができます。一度ふっとうさせて冷ました水では二酸化炭素がないので泡は出ません。"}, {"id": "L023", "u": "光合成", "lv": "標準", "r": 60, "f": "知識", "q": "「ネズミと植物を入れた容器では、明るい所ならネズミは死ななかったが、暗い所では死んでしまった」という実験から分かることはどれですか。", "c": ["植物に光が当たると、ネズミが生きるのに必要な酸素がつくられる", "植物は暗い所で酸素をつくる", "ネズミは光がないと生きられない", "植物はネズミの二酸化炭素を必要としない"], "e": "プリーストリやインゲンホウスが行った実験をもとにしています。"}, {"id": "L024", "u": "光合成", "lv": "標準", "r": 58, "f": "知識", "q": "葉が1つの節から2枚ずつ向かい合ってつく葉のつき方を何といいますか。", "c": ["対生", "互生", "輪生", "根生"], "e": "互生は1枚ずつ互いちがい、輪生は3枚以上が茎をとり囲むようにつき、根生は根から出ているように見えるつき方です。"}, {"id": "L025", "u": "光合成", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "植物の葉が上下で重なりにくいようについているのはなぜですか。", "c": ["どの葉にも効率よく光が当たるようにするため", "雨水をためやすくするため", "虫に食べられないようにするため", "風を受けやすくするため"], "e": "上から見ると、葉は少しずつずれてついています。"}, {"id": "L026", "u": "光合成", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "アサガオが支柱につるを巻きつけながら上にのびることの利点として、最もふさわしいものはどれですか。", "c": ["太い茎をつくらなくても、高い所までのびて光を受けやすくなる", "根を深くまでのばせる", "花が多くさく", "水を多く吸える"], "e": "キュウリやエンドウは、巻きひげをほかのものにからみつけてのびます。"}, {"id": "L027", "u": "光合成", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ヤドリギはほかの木の枝に根をはって育ちます。この育ち方の利点として、最もふさわしいものはどれですか。", "c": ["高い所で光を受けられ、水や養分の一部をほかの木からもらえる", "土がなくても光合成をしなくてよい", "地面の虫に食べられない", "冬に葉を落とさなくてよい"], "e": "ヤドリギは緑色の葉で自分でも光合成をしますが、水や養分の一部を枝から吸い取っています。"}, {"id": "L028", "u": "光合成", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "アサガオの葉の一部をアルミはくでおおい、日光に4時間当てたところ、おおった部分だけ青紫色になりませんでした。これだけでは「日光が当たらなかったから」とはいいきれません。ほかに考えられる理由はどれですか。", "c": ["アルミはくでおおったため、二酸化炭素が葉に入りにくくなったから", "アルミはくが葉の緑色をとかしたから", "アルミはくが酸素を出したから", "アルミはくで葉が冷えすぎたから"], "e": "条件を1つにしぼるには、日光は通さないが空気は通すおおい方をするなど、工夫が必要です。"}, {"id": "L029", "u": "光合成", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "家のアサガオで一部をアルミはくでおおう実験をしたら、どの葉も全体が青紫色になりました。考えられる原因はどれですか。", "c": ["実験の前に葉を暗い所に置かず、はじめからでんぷんがあったから", "アルミはくが厚すぎたから", "ヨウ素液がうすかったから", "アサガオに肥料をあげたから"], "e": "前日に一晩暗い所に置いて、葉のでんぷんをなくしてから実験する必要があります。"}, {"id": "L030", "u": "光合成", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "インゲンマメの種子で、発芽して植物のからだになる部分(胚)にふくまれないものはどれですか。", "c": ["種皮", "幼芽", "胚軸", "子葉"], "e": "胚は幼芽・胚軸・幼根・子葉からできています。インゲンマメの子葉も胚の一部です。"}, {"id": "L031", "u": "光合成", "lv": "標準", "r": 58, "f": "知識", "q": "しし座の1等星と、しし座の2等星で春の大三角をつくる星の組み合わせとして正しいものはどれですか。", "c": ["1等星はレグルス、春の大三角の星はデネボラ", "1等星はデネボラ、春の大三角の星はレグルス", "1等星はスピカ、春の大三角の星はアークトゥルス", "1等星はポルックス、春の大三角の星はカストル"], "e": "春の大三角は、しし座のデネボラ、おとめ座のスピカ、うしかい座のアークトゥルスでつくります。"}, {"id": "L032", "u": "光合成", "lv": "標準", "r": 58, "f": "知識", "q": "カエルの卵の様子として正しい組み合わせはどれですか。", "c": ["ヒキガエルはひも状、モリアオガエルは木の上の白い泡の中", "ヒキガエルは白い泡の中、モリアオガエルはひも状", "どちらもひも状", "どちらも1つずつばらばら"], "e": "モリアオガエルの泡は卵を乾燥から守ります。ふ化したオタマジャクシは下の池などに落ちて泳ぎます。"}, {"id": "L033", "u": "光合成", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "アヤメ科ではないものはどれですか。", "c": ["ショウブ", "カキツバタ", "ハナショウブ", "シャガ"], "e": "ショウブはショウブ科で、水辺に生えます。端午の節句には菖蒲湯に入る習慣があります。"}, {"id": "L034", "u": "光合成", "lv": "標準", "r": 60, "f": "知識", "q": "一年中日本で生活する留鳥で、漢字で「翡翠」と書く鳥はどれですか。", "c": ["カワセミ", "アオサギ", "ツバメ", "マガモ"], "e": "アオサギも留鳥で、田んぼや水辺で魚やカエルなどを食べます。"}, {"id": "T001", "u": "生き物のつながり", "lv": "基礎", "r": 86, "f": "知識", "q": "生き物どうしの「食べる・食べられる」の関係の中で、光合成で自ら養分をつくる生き物を何といいますか。", "c": ["生産者", "消費者", "分解者", "天敵"], "e": "植物は食物連鎖の出発点で、生産者とよばれます。草食動物・肉食動物はまとめて消費者とよばれます。"}, {"id": "T002", "u": "生き物のつながり", "lv": "基礎", "r": 82, "f": "知識", "q": "バッタにとってのカマキリのように、主に数を減らす原因となる生き物を何といいますか。", "c": ["天敵", "生産者", "分解者", "共生者"], "e": "ミジンコにとってのメダカも天敵です。"}, {"id": "T003", "u": "生き物のつながり", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "小川の「食べる・食べられる」の関係として正しいものはどれですか(左が食べられる生き物)。", "c": ["ミカヅキモ→ミジンコ→メダカ", "ミジンコ→ミカヅキモ→メダカ", "メダカ→ミジンコ→ミカヅキモ", "ミカヅキモ→メダカ→ミジンコ"], "e": "光合成をするミカヅキモが出発点です。"}, {"id": "T004", "u": "生き物のつながり", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "次のうち、食物連鎖で生産者にあたるものの組み合わせとして正しいものはどれですか。", "c": ["ミドリムシ・イカダモ", "ラッパムシ・ワムシ", "メダカ・ヤゴ", "ミジンコ・ミドリムシ"], "e": "葉緑体をもつミドリムシやイカダモは光合成で養分をつくります。ラッパムシやワムシは小さな生き物を食べる消費者です。"}, {"id": "T005", "u": "生き物のつながり", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "池の生き物をピラミッドの形で表しました。いちばん下(数が最も多い段)に入るのはどれですか。", "c": ["イカダモやミドリムシ", "ラッパムシやワムシ", "メダカ", "ヤゴ"], "e": "食物連鎖の出発点の生産者ほど数が多く、上位ほど少なくなります。"}, {"id": "T006", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "ピラミッドの真ん中の草食動物が、何らかの理由で急に増えました。その後の変化の順として正しいものはどれですか。", "c": ["肉食動物が増え植物が減る→草食動物が減る→もとの数にもどる", "植物が増える→肉食動物が減る→もとの数にもどる", "草食動物がずっと増え続ける", "肉食動物が減り植物が増える→もとの数にもどる"], "e": "えさが増えた肉食動物が増え、食べられた植物が減ります。すると草食動物が減り、やがてもとのつり合いにもどります。"}, {"id": "T007", "u": "生き物のつながり", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "海の食物連鎖のピラミッドで、イワシ・マアジの数が増えると、その上の段と下の段の生き物の数はどうなりますか。", "c": ["上の段は増加し、下の段は減少する", "上の段は減少し、下の段は増加する", "どちらも増加する", "どちらも減少する"], "e": "食べる側(上)はえさが増えて増え、食べられる側(下)は減ります。十分な時間がたつと、もとにもどります。"}, {"id": "T008", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "海の生き物のうち、海の食物連鎖のピラミッドのいちばん下(生産者)に入るものはどれですか。", "c": ["ケイソウ", "カツオ", "サンマ", "イルカ"], "e": "ケイソウは植物プランクトンで、光合成をします。カツオやイルカはピラミッドの上の方です。"}, {"id": "T009", "u": "生き物のつながり", "lv": "基礎", "r": 84, "f": "知識", "q": "生き物の死がいやふんなどから養分を得ている生き物を何といいますか。", "c": ["分解者", "生産者", "消費者", "天敵"], "e": "ミミズ・ダンゴムシ・カビ・キノコ・細菌などが分解者です。"}, {"id": "T010", "u": "生き物のつながり", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "分解者にあたるものの組み合わせとして正しいものはどれですか。", "c": ["ダンゴムシ・カビ・キノコ", "バッタ・カビ・キノコ", "ススキ・ダンゴムシ・カビ", "ミジンコ・バッタ・キノコ"], "e": "ススキは生産者、バッタやミジンコは消費者です。"}, {"id": "T011", "u": "生き物のつながり", "lv": "基礎", "r": 82, "f": "知識", "q": "植物は、光合成と呼吸をいつ行っていますか。また、動物はどうですか。", "c": ["植物は光合成を昼間のみ、呼吸を1日中。動物は呼吸だけを1日中", "植物も動物も光合成と呼吸を1日中", "植物は呼吸を昼間のみ、動物は夜間のみ", "植物は光合成だけ、動物は呼吸だけを昼間のみ"], "e": "植物は昼間は光合成と呼吸、夜は呼吸だけをします。動物は1日中呼吸だけです。"}, {"id": "T012", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "呼吸を行っている生き物をすべて選んだ組み合わせはどれですか。\nア アサガオ イ メダカ ウ ダイズ エ カブトムシ オ オオカナダモ", "c": ["ア・イ・ウ・エ・オ", "イ・エ", "ア・ウ・オ", "イ・エ・オ"], "e": "呼吸は動物だけでなく、植物も1日中行っています。光合成をしているのはアサガオ・ダイズ・オオカナダモです。"}, {"id": "T013", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "昼間の図で、植物が気体Aを取り入れて気体Bを出し、動物が気体Bを取り入れて気体Aを出しています。気体Aと気体Bの組み合わせとして正しいものはどれですか。", "c": ["Aは二酸化炭素、Bは酸素", "Aは酸素、Bは二酸化炭素", "Aは窒素、Bは酸素", "Aは酸素、Bは窒素"], "e": "昼間の植物は光合成で二酸化炭素を取り入れ酸素を出します。動物は呼吸で酸素を取り入れ二酸化炭素を出します。"}, {"id": "T014", "u": "生き物のつながり", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "昼間、植物は二酸化炭素を取り入れ、動物は二酸化炭素を出しています。夜になると、矢印の向きが反対になるのはどれですか。", "c": ["植物が二酸化炭素を取り入れる矢印と、植物が酸素を出す矢印", "動物が二酸化炭素を出す矢印", "動物が酸素を取り入れる矢印", "どの矢印も変わらない"], "e": "夜は植物も呼吸だけになるので、植物の矢印だけが反対の向きになります。動物は昼も夜も同じです。"}, {"id": "T015", "u": "生き物のつながり", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "密閉した水そうに、メダカとミジンコだけを入れておくとどうなりますか。", "c": ["酸素が減り二酸化炭素が増えていき、やがて生きていけなくなる", "酸素が増え続ける", "二酸化炭素が減り続ける", "何も変わらない"], "e": "どちらも呼吸しかしないので酸素は減る一方です。えさもなくなり、ふんもたまります。"}, {"id": "T016", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "メダカにとってミカヅキモはどのような役割をしていますか。", "c": ["えさとなり、昼間は光合成で酸素も出してくれる", "メダカを食べる天敵", "メダカの出した酸素を吸収する", "メダカのふんを分解する"], "e": "反対に、ミカヅキモにとってメダカは、光合成に必要な二酸化炭素を出してくれます。"}, {"id": "T017", "u": "生き物のつながり", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "水そうに川底の砂やどろを入れて飼育すると、生き物が全滅せずに保たれました。どろの中の目に見えない生き物Yのはたらきとして正しいものはどれですか。", "c": ["死がいや排出物を分解し、植物が育つための養分にする", "酸素をつくり出す", "ミジンコを食べる", "光合成でえさをつくる"], "e": "どろの中の細菌などの分解者が、死がいやふんを分解して、植物プランクトンの肥料をつくります。"}, {"id": "T018", "u": "生き物のつながり", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "生き物が保たれている水そうから、ミジンコのえさの植物プランクトンをすべて取り除きました。その後のミジンコの数はどうなりますか。", "c": ["えさがなくなり、減っていく", "増え続ける", "少し増えてから一定になる", "変わらない"], "e": "えさがなくなるので、ミジンコは減っていきます。反対にミジンコを取り除くと、植物プランクトンは食べられなくなるので増えます。"}, {"id": "T019", "u": "生き物のつながり", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "カエルやモズなど、植物以外の生き物がすべて生き続けるために、いなくてはならない生き物はどれですか。\n(エノコログサ・ススキ・バッタ・クモ・カエル・モズの6種類)", "c": ["バッタ", "クモ", "カエル", "モズ"], "e": "植物を食べるのはバッタだけです。バッタがいないと、植物がつくった養分が、ほかの動物に渡りません。"}, {"id": "T020", "u": "生き物のつながり", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "大気中の二酸化炭素がなくならないのはなぜですか。", "c": ["生き物の呼吸や分解で、二酸化炭素が再び大気中へ出されているから", "植物は二酸化炭素を使わないから", "二酸化炭素は空気中で増えるから", "動物が二酸化炭素を吸収するから"], "e": "二酸化炭素は光合成ででんぷんなどの有機物に変わり、食物連鎖で移動し、呼吸で再び二酸化炭素にもどります(物質の循環)。"}, {"id": "T021", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "有機物ではないものはどれですか。", "c": ["二酸化炭素", "でんぷん", "プラスチック", "ろうそく"], "e": "炭素をふくむ物質のうち、複雑なつくりのものを有機物といいます。二酸化炭素のように単純なものは有機物とはよびません。"}, {"id": "T022", "u": "生き物のつながり", "lv": "標準", "r": 60, "f": "知識", "q": "肥料の3要素のはたらきの組み合わせとして正しいものはどれですか。", "c": ["窒素は葉を、リン酸は花や実を、カリウムは根を肥やす", "窒素は根を、リン酸は葉を、カリウムは花や実を肥やす", "窒素は花や実を、リン酸は根を、カリウムは葉を肥やす", "どれも同じはたらきをする"], "e": "「葉・花実・根」と「窒素・リン酸・カリウム」をセットで覚えましょう。"}, {"id": "T023", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "知識", "q": "根の先にある細かい毛のようなものを何といいますか。また、どんなはたらきがありますか。", "c": ["根毛で、土にふれる面積を大きくし、水や肥料を吸収しやすくする", "根かんで、根の先を守る", "成長点で、根をのばす", "根粒で、窒素を取り入れる"], "e": "根の先には根をのばす成長点や、それを守る根かんもあります。"}, {"id": "T024", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "知識", "q": "マメ科植物の根にいる根粒菌と植物の関係として正しいものはどれですか。", "c": ["根粒菌は空気中の窒素から肥料をつくって植物にわたし、植物から養分をもらう", "根粒菌が植物の養分をうばうだけ", "植物が根粒菌に肥料をわたす", "根粒菌は植物を病気から守るだけ"], "e": "このようにたがいに助け合う関係を共生といいます。"}, {"id": "T025", "u": "生き物のつながり", "lv": "過去問型", "r": 36, "f": "計算", "q": "1年間に大気中へ出される二酸化炭素は、海から970、人間が燃料を燃やして50、陸上生物と地中生物の呼吸で250と100、火山から1(単位は億トン)です。大気中から取り入れられるのは、海に溶けこむ1000と植物の光合成で350です。1年間に大気中の二酸化炭素は何億トン増えていますか。", "c": ["21億トン", "20億トン", "50億トン", "1億トン"], "e": "出される量は970+50+250+100+1=1371億トン、取り入れられる量は1000+350=1350億トンなので、1371−1350=21億トン増えています。"}, {"id": "T026", "u": "生き物のつながり", "lv": "標準", "r": 62, "f": "知識", "q": "地球温暖化の原因と考えられている気体と、その主な増加の理由の組み合わせとして正しいものはどれですか。", "c": ["二酸化炭素で、石油や石炭などの燃料を大量に燃やしているから", "酸素で、植物が増えたから", "窒素で、火山が増えたから", "二酸化炭素で、海が広くなったから"], "e": "森林伐採で光合成をする植物が減ることも原因の1つです。"}, {"id": "T027", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "コウノトリの野生の数を増やすために、最もふさわしい取り組みはどれですか。", "c": ["田んぼや畑にまく農薬を減らして、いろいろな生き物がいるようにする", "えさ台をつくり、いつもえさを置いておく", "タカなどをおいはらう", "川を広げ、田んぼを増やす"], "e": "えさになるドジョウやフナ、カエルなど多くの生き物がすめる環境をつくることが大切です。"}, {"id": "T028", "u": "生き物のつながり", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "トキが野生で生きていくためには、食物連鎖がどのようになっていることが必要ですか。", "c": ["えさとなるたくさんの種類の生き物がいて、食物連鎖があみの目のように広がっていること", "えさとなる生き物が1種類だけ大量にいること", "トキを食べる天敵が多いこと", "田んぼに生き物がいないこと"], "e": "トキはドジョウ・カエル・タニシ・ミミズなどいろいろなものを食べます。冬も水を張った田んぼなど、1年中えさがある環境が必要です。"}, {"id": "T029", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "知識", "q": "ダンゴムシとワラジムシのちがいとして正しいものはどれですか。", "c": ["ダンゴムシは丸まるが、ワラジムシは丸まらない", "ワラジムシは丸まるが、ダンゴムシは丸まらない", "どちらも丸まる", "ダンゴムシは昆虫だが、ワラジムシは昆虫ではない"], "e": "どちらもエビやカニの仲間(甲殻類)で、落ち葉などを食べる分解者です。"}, {"id": "T030", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "知識", "q": "ヘチマなどウリ科の植物の花の特ちょうとして正しいものはどれですか。", "c": ["おしべだけのお花とめしべだけのめ花の2種類の花をさかせる", "1つの花におしべとめしべの両方がある", "花びらがない", "花がさかない"], "e": "このような花を単性花といいます。ヘチマ・キュウリ・カボチャ・スイカ・ゴーヤー・ユウガオなどがウリ科です。"}, {"id": "T031", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "アサガオ・ヒルガオ・ユウガオ・ヨルガオのうち、ウリ科の植物はどれですか。", "c": ["ユウガオ", "アサガオ", "ヒルガオ", "ヨルガオ"], "e": "ユウガオの実を干したものがかんぴょうです。アサガオ・ヒルガオ・ヨルガオはヒルガオ科です。"}, {"id": "T032", "u": "生き物のつながり", "lv": "標準", "r": 60, "f": "知識", "q": "おとめ座の1等星で、春の大三角をつくる星の1つはどれですか。", "c": ["スピカ", "レグルス", "デネボラ", "アークトゥルス"], "e": "スピカは青白色の1等星です。"}, {"id": "T033", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "知識", "q": "サケの一生として正しいものはどれですか。", "c": ["川で生まれ、海で成長し、秋に産卵のため生まれた川にもどる", "海で生まれ、川で成長し、春に海にもどる", "一生を川で過ごす", "一生を海で過ごす"], "e": "5〜6月ごろにとれるサケは「時鮭(ときしらず)」とよばれます。"}, {"id": "T034", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "知識", "q": "ミツバチの後ろあしについている、白や黄色のだんご状のものは何ですか。", "c": ["花粉だんご", "みつのかたまり", "卵", "ろう"], "e": "ミツバチは花粉を後ろあしに丸めてつけ、巣に運びます。"}];

function ckt(t){
  const bulb=(x,y)=>`<line x1="${x-12}" y1="${y}" x2="${x+12}" y2="${y}" class="bg"/><circle cx="${x}" cy="${y}" r="11" class="bl"/><path d="M${x-7} ${y-7}L${x+7} ${y+7}M${x+7} ${y-7}L${x-7} ${y+7}" class="w"/>`;
  const cell=(x,y)=>`<line x1="${x-9}" y1="${y}" x2="${x+9}" y2="${y}" class="bg"/><line x1="${x-5}" y1="${y-14}" x2="${x-5}" y2="${y+14}" class="w"/><line x1="${x+5}" y1="${y-7}" x2="${x+5}" y2="${y+7}" class="w th"/><text x="${x-12}" y="${y-16}" class="ax">+</text>`;
  let s=`<rect x="40" y="40" width="160" height="80" class="w" fill="none"/>`;
  if(t==='l2s')s+=bulb(90,40)+bulb(150,40);
  else if(t==='l2p')s+=`<path d="M70 40V0H170V40" class="w" fill="none"/>`+bulb(120,40)+bulb(120,0);
  else s+=bulb(120,40);
  if(t==='b2s')s+=cell(100,120)+cell(140,120);
  else if(t==='b2p')s+=`<path d="M70 120V146H170V120" class="w" fill="none"/>`+cell(120,120)+cell(120,146);
  else s+=cell(120,120);
  return `<svg viewBox="0 -18 240 182" class="ckt" role="img" aria-label="回路の図">${s}</svg>`;
}
function moon(p,label){
  const c=30,r=22,k={三日月:.55,二十七日:.55}[p];
  let lit='';
  if(p==='満月')lit=`<circle cx="${c}" cy="${c}" r="${r}" class="lit"/>`;
  else if(p==='上弦')lit=`<path d="M${c} ${c-r}A${r} ${r} 0 0 1 ${c} ${c+r}Z" class="lit"/>`;

const SAPIX={focus:['生き物のつながり','光合成','発芽と呼吸','気体の発生','二酸化炭素','燃焼と酸素','天体総合(暦)','星①','太陽①'],weak:[]};
const KIDWEAK=['昼の長さ・南中時刻の計算(日の出・日の入りの時刻から求める)','月の形と、見える時刻・方角(上弦は夕方に南、下弦は明け方に南)','星の動きの計算(1時間に15度、1か月に30度、北の空は反時計回り)','直列つなぎと並列つなぎのちがい(乾電池・豆電球・電磁石)','ろうそくの炎(炎心・内炎・外炎)と、消火で欠ける条件の見分け','燃やしたあとに重くなる物・軽くなる物(できた物が気体か固体か)','気体の集め方(水上・下方・上方置換法)と、二酸化マンガン・石灰石・塩酸のかわりになるもの','種子のつくり(胚・胚乳・子葉)と、ジャガイモ・サツマイモの芽と根の出方','光合成の実験の手順の理由(一晩暗い所・熱湯・アルコール)','呼吸はすべての生き物が1日中行う/夜に向きが変わるのは植物の矢印だけ','ピラミッドの数の変化と、二酸化炭素の出入りの計算(火山の1も足す)'];
const LEVELS=['基礎','標準','応用','過去問型'];
const RANGE={'基礎':[75,92],'標準':[55,72],'応用':[40,55],'過去問型':[25,45]};

// 学習記録と追加問題:この端末のブラウザに保存し、Claude上ではアカウントにも保存
const KEY='rika4-drill-v1';
let store={rec:{},extra:[],updated:0};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');
  if(v){store=v.rec?{rec:v.rec,extra:v.extra||[],updated:v.updated||0}:{rec:v,extra:[],updated:0}}}catch(e){}
let docRef=null,saving=false,again=false,timer=null;
function save(){
  store.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
  if(docRef){clearTimeout(timer);timer=setTimeout(flush,1500)}
}
async function flush(){
  if(!docRef)return;if(saving){again=true;return}
  saving=true;
  try{await docRef.set({rec:store.rec,extra:store.extra,skip:store.skip,updated:store.updated})}
  catch(e){if(e&&e.code!=='unavailable')docRef=null}
  saving=false;if(again){again=false;flush()}
}
store.extra.forEach(fixUnit);if(!store.skip)store.skip={};
const allQ=()=>Q.concat(store.extra);
function R(id){return store.rec[id]||(store.rec[id]={n:0,ok:0,miss:0,streak:0,last:0})}

const skipped=q=>!!store.skip[q.id];
const inReview=q=>{const x=store.rec[q.id];return !skipped(q)&&x&&x.miss>0&&x.streak<2};
const unseen=q=>!store.rec[q.id]||!store.rec[q.id].n;
const priority=q=>{const x=store.rec[q.id]||{miss:1,streak:0};return q.r*(1+0.25*Math.min(x.miss-1,4))+(x.streak===1?-15:0)};
const reviewList=()=>allQ().filter(inReview).sort((a,b)=>priority(b)-priority(a));

function rateLabel(r){return r>=70?'ほぼ全員が正解':r>=55?'合格者は正解する':r>=40?'差がつく問題':'難問'}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let S={view:'home',units:new Set(UNITS.filter(u=>!NOT_YET.includes(u))),levels:new Set(LEVELS),forms:new Set(FORMS),count:10,set:[],i:0,picked:null,order:[],score:0,wrong:[],mode:'normal',confirmReset:false,
  ai:false,gen:{busy:false,msg:''},genUnit:'auto',confirmDel:false};
const app=document.getElementById('app');
const poolNow=()=>allQ().filter(q=>!skipped(q)&&S.units.has(q.u)&&S.levels.has(q.lv)&&S.forms.has(q.f||'知識'));

function buildSet(mode){
  if(mode==='review') return reviewList().slice(0,S.count);
  const pool=mode==='fig'?allQ().filter(q=>!skipped(q)&&isFig(q)):mode==='calc'?allQ().filter(q=>!skipped(q)&&q.f==='計算'):poolNow();
  const rv=pool.filter(inReview).sort((a,b)=>priority(b)-priority(a)).slice(0,Math.ceil(S.count*0.4));
  const others=pool.filter(q=>!rv.includes(q));
  // まだ解いていない問題を先に使う
  const rest=shuffle(others.filter(unseen)).concat(shuffle(others.filter(q=>!unseen(q)))).slice(0,S.count-rv.length);
  return shuffle(rv.concat(rest));
}
function start(mode){
  S.mode=mode;S.set=buildSet(mode);if(!S.set.length)return;
  S.i=0;S.score=0;S.wrong=[];S.view='quiz';S.autoDone=false;newQ();render();window.scrollTo(0,0);
}
function newQ(){S.picked=null;S.confirmDel=false;S.order=shuffle([0,1,2,3]);S.wasReview=inReview(S.set[S.i])}
function answer(k){
  if(S.picked!==null)return;
  const q=S.set[S.i];S.picked=k;const ok=S.order[k]===q.a;const x=R(q.id);
  x.n++;x.last=Date.now();
  if(ok){x.ok++;x.streak=x.miss>0?x.streak+1:2;S.score++}else{x.miss++;x.streak=0;S.wrong.push(q)}
  save();render();
  const nb=document.getElementById('next');if(nb)nb.focus({preventScroll:true});
}
function next(){

}
function skipCurrent(){
  const q=S.set[S.i];store.skip[q.id]=Date.now();save();
  S.set.splice(S.i,1);
  if(!S.set.length){S.view=S.score||S.wrong.length?'result':'home';render();return}
  if(S.i>=S.set.length){S.view='result';render();return}
  newQ();render();
}
function deleteCurrent(){
  const q=S.set[S.i];
  store.extra=store.extra.filter(x=>x.id!==q.id);delete store.rec[q.id];save();
  S.set.splice(S.i,1);
  if(!S.set.length){S.view='home';render();return}
  if(S.i>=S.set.length){S.view='result';render();return}

let sampleFn=null;
function weakestUnit(){
  const units=[...S.units];if(!units.length)return UNITS[0];
  return units.map(u=>{
    const qs=allQ().filter(q=>q.u===u&&S.levels.has(q.lv));
    const left=qs.filter(unseen).length;
    let n=0,ok=0;qs.forEach(q=>{const x=store.rec[q.id];if(x){n+=x.n;ok+=x.ok}});
    const gap=n?(ok/n*100)-qs.reduce((s,q)=>s+q.r,0)/Math.max(qs.length,1):0;
    return{u,score:left*10+gap-(SAPIX.focus.includes(u)?40:0)};
  }).sort((a,b)=>a.score-b.score)[0].u;
}
function buildPrompt(unit,levels,n){
  const existing=allQ().filter(q=>q.u===unit).map(q=>'・'+q.q).slice(-90).join('\n');
  const lvText=levels.map(l=>`${l}(予測正答率${RANGE[l][0]}〜${RANGE[l][1]}%)`).join('、');
  return `あなたは難関中学受験塾の理科講師です。小学4年生向けに、単元「${unit}」の4択問題を${n}問作ってください。

条件:
- 難易度は次から選び、まんべんなく混ぜる:${lvText}。「過去問型」は難関中学の入試でよく問われる形式(理由を問う、組み合わせ、資料の読み取りの文章化など)のオリジナル問題。
- 小4の塾カリキュラムで習う範囲。事実は教科書・塾テキストで定番の、確実に正しいものだけを使う。実験の結果や数値は教科書・塾テキストで定番のものだけを使う。図がないと答えられない問題は作らない。
- 正解は1つだけ。誤りの選択肢3つは、まぎらわしいが明らかに誤りのもの。

- 次の内容はまだ習っていないので、似た内容も出さない:
${allQ().filter(skipped).slice(-30).map(q=>'・'+q.q).join('\n')||'(なし)'}
- 問われ方を混ぜる:「ふさわしくないもの」を選ぶ問題、2つの文(I・II)の正誤の組み合わせ、時刻や角度の計算、しくみや理由を選ぶ問題。2つの文の正誤では、誤りの文は一部の語句(直列⇔並列、東⇔西、時計回り⇔反時計回りなど)だけを入れかえる。
- 次の既存の問題と同じ内容は出さない:
${existing}

出力はJSON配列のみ。形式:
[{"lv":"標準","r":62,"q":"問題文","correct":"正解の選択肢","wrong":["誤答1","誤答2","誤答3"],"e":"解説"}]
lvは「基礎」「標準」「応用」「過去問型」のどれか。rは難関校志望の小4生の予測正答率(整数)。`;
}
function addGenerated(arr,unit){
  if(!Array.isArray(arr))return 0;
  const seen=new Set(allQ().map(q=>q.q.replace(/\s/g,'')));
  let k=0;
  arr.forEach((g,i)=>{
    if(!g||typeof g.q!=='string'||typeof g.correct!=='string'||!Array.isArray(g.wrong))return;
    const wrong=g.wrong.filter(w=>typeof w==='string'&&w.trim()&&w!==g.correct).slice(0,3);
    if(wrong.length<3||new Set(wrong).size<3)return;
    const lv=LEVELS.includes(g.lv)?g.lv:'標準';
    const key=g.q.replace(/\s/g,'');if(seen.has(key))return;seen.add(key);
    let r=Math.round(+g.r);if(!(r>0))r=Math.round((RANGE[lv][0]+RANGE[lv][1])/2);
    r=Math.max(RANGE[lv][0],Math.min(RANGE[lv][1],r));
    store.extra.push({id:'ai'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5),u:unit,lv,r,
      q:g.q.trim(),c:[g.correct.trim(),...wrong.map(w=>w.trim())],e:typeof g.e==='string'?g.e.trim():'',a:0,ai:1,t:Date.now()});
    k++;
  });
  if(store.extra.length>800)store.extra=store.extra.slice(-800);
  if(k)save();
  return k;
}
async function generate(unit,auto){
  if(!sampleFn||S.gen.busy)return;

  try{
    const arr=await sampleFn.json(buildPrompt(unit,levels,8),{modelTier:'default',cache:false});
    const k=addGenerated(arr,unit);
    S.gen={busy:false,msg:k?`「${unit}」に新しい問題を${k}問追加しました。次のスタートから出題されます。`:'問題をうまく作れませんでした。もう一度ためしてください。'};
  }catch(e){
    const c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){S.ai=false;S.gen={busy:false,msg:''}}
    else if(c==='rate_limited')S.gen={busy:false,msg:'いまは問題を作れません。しばらく時間をおいてからためしてください。'};
    else if(c==='session_expired')S.gen={busy:false,msg:'Claudeにもう一度ログインしてから、ためしてください。'};
    else S.gen={busy:false,msg:'問題をうまく作れませんでした。もう一度ためしてください。'};
  }
  render();
}
function autoGenerate(){

  S.autoDone=true;

}

    <div class="qhead"><span class="prog">${S.mode==='review'?'復習 ':''}${S.i+1} / ${S.set.length}問</span><button class="btn ghost" data-act="home" style="padding:6px 12px;font-size:14px">やめる</button></div>
    <div class="pbar"><i style="width:${(S.i+(done?1:0))/S.set.length*100}%"></i></div>
    <div class="meta"><span class="lv lv-${q.lv}">${q.lv}</span><span>${q.u}</span>${q.f&&q.f!=='知識'?`<span class="ftag">${q.f}</span>`:''}${q.ai?'<span class="ai-tag">AI作成</span>':''}${S.wasReview?'<span class="review-tag">復習</span>':''}</div>
    <div class="rate">予測正答率 <b>${q.r}%</b><div class="track"><div class="fill" style="width:${q.r}%"></div></div><span>${rateLabel(q.r)}</span></div>
    <div class="qtext">${qhtml(q.q)}</div>${uzhtml(q)}${tbl(q)}
    <div class="choices">${S.order.map((ci,k)=>{
      let cls='';if(done){if(ci===q.a)cls='ok';else if(k===S.picked)cls='ng'}
      return `<button class="choice ${cls}" data-pick="${k}" ${done?'disabled':''}><span class="k">${'アイウエ'[k]}</span><span>${esc(q.c[ci])}</span></button>`}).join('')}</div>
    ${done?'':`<div class="skiprow"><button class="btn ghost small" data-act="skip">まだ習っていない</button><span class="note">この問題をとばして、出題しないようにします</span></div>`}
    ${done?`<div class="fb ${ok?'ok':'ng'}">
      <div class="mark">${ok?'○ 正解':'× ざんねん'}</div>
      ${ok?'':`<p><b>正解:${esc(q.c[q.a])}</b></p>`}
      <p>${esc(q.e)}</p>
      ${!ok&&q.r>=55?`<div class="alert">合格する人の多くが正解する問題です。復習リストの上位に入れました。</div>`:''}
      ${ok&&S.wasReview?`<p class="note">${R(q.id).streak>=2?'2回連続正解。復習リストから外しました。':'あと1回正解で復習リストから外れます。'}</p>`:''}
      <div class="row"><button class="btn" id="next" data-act="next">${S.i<S.set.length-1?'次の問題へ':'結果を見る'}</button></div>
      ${q.ai?(S.confirmDel?`<div class="confirm" style="margin-top:10px">この問題を削除しますか?<button class="btn alt" data-act="del-yes">削除する</button><button class="btn ghost" data-act="del-no">やめる</button></div>`
        :`<p class="note"><button class="linkbtn" data-act="del">内容がおかしいので、この問題を削除する</button></p>`):''}
    </div>`:''}
  </section>`;
}

function result(){
  const pct=Math.round(S.score/S.set.length*100);
  const exp=Math.round(S.set.reduce((s,q)=>s+q.r,0)/S.set.length);
  return `
  <section class="card">
    <h2>結果</h2>
    <div class="big">${S.score}<small> / ${S.set.length}問</small></div>
    <p>正答率 <b>${pct}%</b>(この問題セットの予測正答率 ${exp}%)。${pct>=exp?'合格ラインを上回っています。':'予測を下回りました。まちがえた問題を復習しよう。'}</p>
    ${genStatus()}
    <div class="row"><button class="btn alt" data-act="review" ${reviewList().length?'':'disabled'}>すぐ復習する</button><button class="btn" data-act="again">続けて解く</button><button class="btn ghost" data-act="home">ホームへ</button></div>
  </section>
  ${S.wrong.length?`<section class="card"><h2>まちがえた問題</h2><div class="list">${S.wrong.map(itemHtml).join('')}</div></section>`:''}`;
}
function itemHtml(q){
  const x=store.rec[q.id]||{miss:0,streak:0};
  return `<div class="item"><div class="m"><span class="lv lv-${q.lv}">${q.lv}</span><span>${q.u}</span>${q.ai?'<span class="ai-tag">AI作成</span>':''}<span>予測正答率 ${q.r}%</span><span>ミス ${x.miss}回</span>${q.r>=55?'<span class="pri">落とせない</span>':''}</div>
  <div class="q">${qhtml(q.q)}</div>${uzhtml(q)}${tbl(q)}<div class="a">正解:${esc(q.c[q.a])}</div><div class="note" style="margin-top:4px">${esc(q.e)}</div></div>`;
}
function list(){
  const rl=reviewList();
  return `<section class="card">
    <div class="qhead"><h2 style="margin:0">復習リスト(${rl.length}問)</h2><button class="btn ghost" data-act="home" style="padding:6px 12px;font-size:14px">ホームへ</button></div>
    <p class="note">優先度の高い順。予測正答率が高く、ミスが多い問題ほど上に来ます。</p>
    ${rl.length?`<div class="list">${rl.map(itemHtml).join('')}</div><div class="row"><button class="btn alt" data-act="review">この順で復習する</button></div>`:'<p class="empty">復習待ちの問題はありません。</p>'}
  </section>`;
}

function skips(){
  const qs=allQ().filter(skipped);
  const by=UNITS.map(u=>[u,qs.filter(q=>q.u===u)]).filter(x=>x[1].length);
  return `<section class="card">
    <div class="qhead"><h2 style="margin:0">まだ習っていない問題(${qs.length}問)</h2><button class="btn ghost" data-act="home" style="padding:6px 12px;font-size:14px">ホームへ</button></div>
    <p class="note">授業で習ったら「習った」を押すと、また出題されるようになります。</p>
    ${qs.length?by.map(([u,l])=>`<h3>${u}(${l.length}問)<button class="linkbtn" data-unskipunit="${u}" style="margin-left:10px">この単元をすべて戻す</button></h3><div class="list">${l.map(q=>`<div class="item"><div class="m"><span class="lv lv-${q.lv}">${q.lv}</span><span>予測正答率 ${q.r}%</span></div><div class="q">${esc(q.q)}</div><div class="row" style="margin-top:6px"><button class="btn ghost small" data-unskip="${q.id}" style="flex:0 0 auto">習った</button></div></div>`).join('')}</div>`).join(''):'<p class="empty">ありません。</p>'}
  </section>`;
}
function render(){
  app.innerHTML=S.view==='home'?home():S.view==='quiz'?quiz():S.view==='result'?result():S.view==='skips'?skips():list();
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.unit){const u=b.dataset.unit;S.units.has(u)?S.units.delete(u):S.units.add(u);render();return}
  if(b.dataset.level){const l=b.dataset.level;S.levels.has(l)?S.levels.delete(l):S.levels.add(l);render();return}
  if(b.dataset.form){const f=b.dataset.form;S.forms.has(f)?S.forms.delete(f):S.forms.add(f);render();return}
  if(b.dataset.count){S.count=+b.dataset.count;render();return}
  if(b.dataset.gen){S.genUnit=b.dataset.gen;render();return}
  if(b.dataset.pick!==undefined){answer(+b.dataset.pick);return}
  if(b.dataset.unskip){delete store.skip[b.dataset.unskip];save();render();return}
  if(b.dataset.unskipunit){allQ().filter(q=>q.u===b.dataset.unskipunit).forEach(q=>delete store.skip[q.id]);save();render();return}
  const a=b.dataset.act;
  if(a==='start')start('normal');
  else if(a==='review')start('review');
  else if(a==='fig')start('fig');
  else if(a==='calc')start('calc');
  else if(a==='again')start(S.mode==='fig'||S.mode==='calc'?S.mode:'normal');
  else if(a==='focus'){S.units=new Set(SAPIX.focus);S.levels=new Set(LEVELS);S.forms=new Set(FORMS);start('normal')}
  else if(a==='focusform'){S.units=new Set(UNITS);S.levels=new Set(LEVELS);S.forms=new Set(FORMS.filter(f=>f!=='知識'));start('normal')}
  else if(a==='next')next();
  else if(a==='gen')generate(S.genUnit==='auto'?weakestUnit():S.genUnit,false);
  else if(a==='skip')skipCurrent();
  else if(a==='skips'){S.view='skips';render();window.scrollTo(0,0)}
  else if(a==='del'){S.confirmDel=true;render()}
  else if(a==='del-no'){S.confirmDel=false;render()}
  else if(a==='del-yes')deleteCurrent();
  else if(a==='list'){S.view='list';render();window.scrollTo(0,0)}
  else if(a==='home'){S.view='home';render();window.scrollTo(0,0)}
  else if(a==='reset'){S.confirmReset=true;render()}
  else if(a==='reset-no'){S.confirmReset=false;render()}
  else if(a==='reset-yes'){store.rec={};save();S.confirmReset=false;render()}
});
render();

// Claude上で開いたとき:AIの問題作成とアカウントへの保存を有効にする
(async()=>{
  if(!window.claude||!claude.use)return;
  try{sampleFn=await claude.use('sample');if(sampleFn){S.ai=true;render()}}catch(e){}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/rika');
    const snap=await ref.get();
    docRef=ref;
    const v=snap.exists?snap.data():null;
    if(v&&(v.updated||0)>(store.updated||0)){
      store={rec:v.rec||{},extra:Array.isArray(v.extra)?v.extra.map(fixUnit):[],skip:v.skip||{},updated:v.updated};
      try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
      if(S.view!=='quiz')render();
    }else if(store.updated){flush()}
  }catch(e){docRef=null}
})();
</script>
