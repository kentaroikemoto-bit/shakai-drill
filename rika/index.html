 {"id": "L005", "u": "光合成", "lv": "標準", "r": 60, "f": "知識", "q": "日かげで育てた植物は、日なたで育てた植物と比べてどうなりますか。", "c": ["葉は小さくうすい緑色、茎は細く、草たけは高い", "葉は大きくこい緑色、茎は太く、草たけは低い", "葉は小さくうすい緑色、茎は太く、草たけは低い", "日なたと同じように育つ"], "e": "日かげの植物は光を求めてひょろ長くのびますが、葉は小さく、茎も細くなります。"}, {"id": "L006", "u": "光合成", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "ふ入りのアサガオの葉で光合成の実験をするとき、前の日に葉を一晩暗い所に置くのはなぜですか。", "c": ["葉の中にあるでんぷんをなくすため", "葉の中のでんぷんを増やすため", "葉を大きく成長させるため", "葉の水分をなくすため"], "e": "暗い所では光合成ができず、葉にあったでんぷんは使われたり運ばれたりして、なくなります。"}, {"id": "L007", "u": "光合成", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "光合成の実験で、つみ取った葉を最初に熱湯につけるのはなぜですか。", "c": ["葉をやわらかくし、葉のはたらきを止めるため", "葉の緑色をぬくため", "でんぷんを増やすため", "ヨウ素液をしみこみやすくするため"], "e": "熱湯につけると葉がやわらかくなり、はたらきが止まって、でんぷんが分解されるのを防げます。"}, {"id": "L008", "u": "光合成", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "光合成の実験で、葉を温めたアルコールにつけるのはなぜですか。", "c": ["葉の緑色をとかし出して色をぬき、ヨウ素液の色の変化を見やすくするため", "葉をやわらかくするため", "でんぷんをつくらせるため", "葉の中の水をなくすため"], "e": "緑色が残っていると、青紫色に変わったかどうかが分かりにくくなります。"}, {"id": "L009", "u": "光合成", "lv": "標準", "r": 58, "f": "しくみ・理由", "q": "光合成の実験で、アルコールの入ったビーカーをアルコールランプで直接温めず、湯で温めるのはなぜですか。", "c": ["アルコールは気体になりやすく、引火しやすいため", "アルコールは有毒で口に入る危険があるため", "アルコールが葉をかたくするため", "湯の方が早く温まるため"], "e": "アルコールに直接火を近づけると、火がついてとても危険です。"}, {"id": "L010", "u": "光合成", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "ふ入りの葉の一部をアルミはくでおおって日光に当て、ヨウ素液につけました。青紫色になったのはどこですか。", "c": ["アルミはくでおおっていない緑色の部分", "アルミはくでおおった緑色の部分", "アルミはくでおおっていないふの部分", "葉全体"], "e": "光合成には日光と葉緑体の両方が必要なので、日光が当たった緑色の部分だけででんぷんができます。"}, {"id": "L011", "u": "光合成", "lv": "応用", "r": 50, "f": "図の読み取り", "q": "ふ入りの葉の実験で、Aは日光○・葉緑体○、Bは日光×・葉緑体○、Cは日光○・葉緑体×です。「光合成には葉緑体が必要」ということを確かめるには、どれとどれを比べればよいですか。", "c": ["AとC", "AとB", "BとC", "AとBとC"], "e": "ちがう条件が葉緑体の有無だけになるAとCを比べます。AとBを比べると、日光が必要なことが分かります。"}, {"id": "L012", "u": "光合成", "lv": "標準", "r": 58, "f": "知識", "q": "条件を1つだけ変えて結果を比べ、その条件が必要かどうかを確かめる実験を何といいますか。", "c": ["比較対照実験", "仮説実験", "観察実験", "燃焼実験"], "e": "1度に2つ以上の条件を変えると、どちらが原因か分からなくなります。"}, {"id": "L013", "u": "光合成", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "アサガオの葉にポリエチレンの袋をかぶせ、袋の中に水酸化ナトリウム水溶液をしみこませたろ紙を入れました。日光に当てたあと、この葉はヨウ素液で変化しませんでした。分かることはどれですか。", "c": ["光合成には二酸化炭素が必要である", "光合成には酸素が必要である", "光合成には水が必要である", "光合成にはポリエチレンが必要である"], "e": "水酸化ナトリウム水溶液や石灰水は二酸化炭素を吸収するので、袋の中の二酸化炭素がなくなります。"}, {"id": "L014", "u": "光合成", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "葉の一部をアルミはくでおおい、昼間日光に当てたあと、葉をつまずにさらに一晩おいてからヨウ素液につけました。おおわなかった部分の色と理由の組み合わせとして正しいものはどれですか。", "c": ["茶かっ色のままで、夜の間にでんぷんが使われたり運ばれたりしたから", "青紫色で、昼にできたでんぷんが残っているから", "青紫色で、夜にもでんぷんがつくられるから", "緑色で、アルミはくをはずしたから"], "e": "葉でできたでんぷんは、夜の間に水に溶けやすい糖に変わって、からだの各部に運ばれます。"}, {"id": "L015", "u": "光合成", "lv": "基礎", "r": 80, "f": "知識", "q": "植物が気体を吸収したり放出したりするときの出入り口を何といいますか。また、ふつう葉のどちら側に多くありますか。", "c": ["気孔で、葉の裏側に多い", "気孔で、葉の表側に多い", "葉緑体で、葉の裏側に多い", "孔辺細胞で、葉の表側に多い"], "e": "気孔は2つの孔辺細胞にはさまれたすき間で、孔辺細胞の形が変わることで開いたり閉じたりします。"}, {"id": "L016", "u": "光合成", "lv": "基礎", "r": 82, "f": "知識", "q": "植物は、光合成と呼吸をいつ行っていますか。", "c": ["光合成は昼間のみ、呼吸は1日中", "光合成も呼吸も昼間のみ", "光合成は1日中、呼吸は夜間のみ", "光合成は夜間のみ、呼吸は昼間のみ"], "e": "光合成は光が当たっている間だけですが、呼吸は動物と同じように1日中行っています。"}, {"id": "L017", "u": "光合成", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "昼間、植物全体で見ると二酸化炭素を取り入れ、酸素を出しているのはなぜですか。", "c": ["呼吸よりも光合成のはたらきの方が大きいから", "昼間は呼吸をしていないから", "光合成で二酸化炭素がつくられるから", "呼吸で酸素がつくられるから"], "e": "昼間も呼吸はしていますが、光合成の方がさかんなので、全体として二酸化炭素を吸収し、酸素を出しています。"}, {"id": "L018", "u": "光合成", "lv": "標準", "r": 58, "f": "知識", "q": "夜間、植物はどのように気体を出し入れしていますか。", "c": ["酸素を取り入れ、二酸化炭素を出している", "二酸化炭素を取り入れ、酸素を出している", "気体の出し入れはまったくしていない", "酸素も二酸化炭素も取り入れている"], "e": "夜は光合成ができず、呼吸だけを行うので、動物と同じように酸素を取り入れて二酸化炭素を出します。"}, {"id": "L019", "u": "光合成", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "植物に透明な袋をかぶせて息を吹きこみ、明るい所に置いたあと暗い所に移しました。袋の中の二酸化炭素の量の変化として正しいものはどれですか。", "c": ["明るい所では減り、暗い所に移すと増えていく", "明るい所では増え、暗い所に移すと減っていく", "ずっと増え続ける", "ずっと変わらない"], "e": "明るい所では光合成で二酸化炭素が使われ、暗い所では呼吸だけになるので二酸化炭素が増えます。酸素はその反対の変化をします。"}, {"id": "L020", "u": "光合成", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "明るい所と暗い所で種子を発芽させ、乾燥させた重さを毎日はかりました。明るい所の種子は7日目ごろから重くなりましたが、暗い所の種子は減り続けました。その理由として正しいものはどれですか。", "c": ["明るい所では本葉が出て光合成で養分をつくれるが、暗い所では呼吸で養分を使うだけだから", "暗い所の方が水を多く吸うから", "明るい所では呼吸をしないから", "暗い所では発芽しないから"], "e": "どちらもはじめは種子の養分を呼吸に使うので軽くなります。暗い所では光合成ができないので、軽くなり続けます。"}, {"id": "L021", "u": "光合成", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "メダカ2匹を入れた容器に、オオカナダモを0本・1本・2本・4本入れて、明るい所に置きました。メダカが最も長生きすると考えられるのはどれですか。また、暗い所ではどうですか。", "c": ["明るい所では4本、暗い所では0本", "明るい所でも暗い所でも4本", "明るい所では0本、暗い所では4本", "どちらでも同じ"], "e": "明るい所ではオオカナダモが光合成で酸素を出します。暗い所では呼吸だけをするので、酸素を使って減らしてしまいます。"}, {"id": "L022", "u": "光合成", "lv": "標準", "r": 62, "f": "知識", "q": "水草を入れたビーカーに息を吹きこんで日光に当てると、泡が出ました。この泡は何ですか。", "c": ["酸素", "二酸化炭素", "窒素", "水蒸気"], "e": "息にふくまれる二酸化炭素を使って光合成が行われ、酸素ができます。一度ふっとうさせて冷ました水では二酸化炭素がないので泡は出ません。"}, {"id": "L023", "u": "光合成", "lv": "標準", "r": 60, "f": "知識", "q": "「ネズミと植物を入れた容器では、明るい所ならネズミは死ななかったが、暗い所では死んでしまった」という実験から分かることはどれですか。", "c": ["植物に光が当たると、ネズミが生きるのに必要な酸素がつくられる", "植物は暗い所で酸素をつくる", "ネズミは光がないと生きられない", "植物はネズミの二酸化炭素を必要としない"], "e": "プリーストリやインゲンホウスが行った実験をもとにしています。"}, {"id": "L024", "u": "光合成", "lv": "標準", "r": 58, "f": "知識", "q": "葉が1つの節から2枚ずつ向かい合ってつく葉のつき方を何といいますか。", "c": ["対生", "互生", "輪生", "根生"], "e": "互生は1枚ずつ互いちがい、輪生は3枚以上が茎をとり囲むようにつき、根生は根から出ているように見えるつき方です。"}, {"id": "L025", "u": "光合成", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "植物の葉が上下で重なりにくいようについているのはなぜですか。", "c": ["どの葉にも効率よく光が当たるようにするため", "雨水をためやすくするため", "虫に食べられないようにするため", "風を受けやすくするため"], "e": "上から見ると、葉は少しずつずれてついています。"}, {"id": "L026", "u": "光合成", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "アサガオが支柱につるを巻きつけながら上にのびることの利点として、最もふさわしいものはどれですか。", "c": ["太い茎をつくらなくても、高い所までのびて光を受けやすくなる", "根を深くまでのばせる", "花が多くさく", "水を多く吸える"], "e": "キュウリやエンドウは、巻きひげをほかのものにからみつけてのびます。"}, {"id": "L027", "u": "光合成", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ヤドリギはほかの木の枝に根をはって育ちます。この育ち方の利点として、最もふさわしいものはどれですか。", "c": ["高い所で光を受けられ、水や養分の一部をほかの木からもらえる", "土がなくても光合成をしなくてよい", "地面の虫に食べられない", "冬に葉を落とさなくてよい"], "e": "ヤドリギは緑色の葉で自分でも光合成をしますが、水や養分の一部を枝から吸い取っています。"}, {"id": "L028", "u": "光合成", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "アサガオの葉の一部をアルミはくでおおい、日光に4時間当てたところ、おおった部分だけ青紫色になりませんでした。これだけでは「日光が当たらなかったから」とはいいきれません。ほかに考えられる理由はどれですか。", "c": ["アルミはくでおおったため、二酸化炭素が葉に入りにくくなったから", "アルミはくが葉の緑色をとかしたから", "アルミはくが酸素を出したから", "アルミはくで葉が冷えすぎたから"], "e": "条件を1つにしぼるには、日光は通さないが空気は通すおおい方をするなど、工夫が必要です。"}, {"id": "L029", "u": "光合成", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "家のアサガオで一部をアルミはくでおおう実験をしたら、どの葉も全体が青紫色になりました。考えられる原因はどれですか。", "c": ["実験の前に葉を暗い所に置かず、はじめからでんぷんがあったから", "アルミはくが厚すぎたから", "ヨウ素液がうすかったから", "アサガオに肥料をあげたから"], "e": "前日に一晩暗い所に置いて、葉のでんぷんをなくしてから実験する必要があります。"}, {"id": "L030", "u": "光合成", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "インゲンマメの種子で、発芽して植物のからだになる部分(胚)にふくまれないものはどれですか。", "c": ["種皮", "幼芽", "胚軸", "子葉"], "e": "胚は幼芽・胚軸・幼根・子葉からできています。インゲンマメの子葉も胚の一部です。"}, {"id": "L031", "u": "光合成", "lv": "標準", "r": 58, "f": "知識", "q": "しし座の1等星と、しし座の2等星で春の大三角をつくる星の組み合わせとして正しいものはどれですか。", "c": ["1等星はレグルス、春の大三角の星はデネボラ", "1等星はデネボラ、春の大三角の星はレグルス", "1等星はスピカ、春の大三角の星はアークトゥルス", "1等星はポルックス、春の大三角の星はカストル"], "e": "春の大三角は、しし座のデネボラ、おとめ座のスピカ、うしかい座のアークトゥルスでつくります。"}, {"id": "L032", "u": "光合成", "lv": "標準", "r": 58, "f": "知識", "q": "カエルの卵の様子として正しい組み合わせはどれですか。", "c": ["ヒキガエルはひも状、モリアオガエルは木の上の白い泡の中", "ヒキガエルは白い泡の中、モリアオガエルはひも状", "どちらもひも状", "どちらも1つずつばらばら"], "e": "モリアオガエルの泡は卵を乾燥から守ります。ふ化したオタマジャクシは下の池などに落ちて泳ぎます。"}, {"id": "L033", "u": "光合成", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "アヤメ科ではないものはどれですか。", "c": ["ショウブ", "カキツバタ", "ハナショウブ", "シャガ"], "e": "ショウブはショウブ科で、水辺に生えます。端午の節句には菖蒲湯に入る習慣があります。"}, {"id": "L034", "u": "光合成", "lv": "標準", "r": 60, "f": "知識", "q": "一年中日本で生活する留鳥で、漢字で「翡翠」と書く鳥はどれですか。", "c": ["カワセミ", "アオサギ", "ツバメ", "マガモ"], "e": "アオサギも留鳥で、田んぼや水辺で魚やカエルなどを食べます。"}, {"id": "T001", "u": "生き物のつながり", "lv": "基礎", "r": 86, "f": "知識", "q": "生き物どうしの「食べる・食べられる」の関係の中で、光合成で自ら養分をつくる生き物を何といいますか。", "c": ["生産者", "消費者", "分解者", "天敵"], "e": "植物は食物連鎖の出発点で、生産者とよばれます。草食動物・肉食動物はまとめて消費者とよばれます。"}, {"id": "T002", "u": "生き物のつながり", "lv": "基礎", "r": 82, "f": "知識", "q": "バッタにとってのカマキリのように、主に数を減らす原因となる生き物を何といいますか。", "c": ["天敵", "生産者", "分解者", "共生者"], "e": "ミジンコにとってのメダカも天敵です。"}, {"id": "T003", "u": "生き物のつながり", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "小川の「食べる・食べられる」の関係として正しいものはどれですか(左が食べられる生き物)。", "c": ["ミカヅキモ→ミジンコ→メダカ", "ミジンコ→ミカヅキモ→メダカ", "メダカ→ミジンコ→ミカヅキモ", "ミカヅキモ→メダカ→ミジンコ"], "e": "光合成をするミカヅキモが出発点です。"}, {"id": "T004", "u": "生き物のつながり", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "次のうち、食物連鎖で生産者にあたるものの組み合わせとして正しいものはどれですか。", "c": ["ミドリムシ・イカダモ", "ラッパムシ・ワムシ", "メダカ・ヤゴ", "ミジンコ・ミドリムシ"], "e": "葉緑体をもつミドリムシやイカダモは光合成で養分をつくります。ラッパムシやワムシは小さな生き物を食べる消費者です。"}, {"id": "T005", "u": "生き物のつながり", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "池の生き物をピラミッドの形で表しました。いちばん下(数が最も多い段)に入るのはどれですか。", "c": ["イカダモやミドリムシ", "ラッパムシやワムシ", "メダカ", "ヤゴ"], "e": "食物連鎖の出発点の生産者ほど数が多く、上位ほど少なくなります。"}, {"id": "T006", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "ピラミッドの真ん中の草食動物が、何らかの理由で急に増えました。その後の変化の順として正しいものはどれですか。", "c": ["肉食動物が増え植物が減る→草食動物が減る→もとの数にもどる", "植物が増える→肉食動物が減る→もとの数にもどる", "草食動物がずっと増え続ける", "肉食動物が減り植物が増える→もとの数にもどる"], "e": "えさが増えた肉食動物が増え、食べられた植物が減ります。すると草食動物が減り、やがてもとのつり合いにもどります。"}, {"id": "T007", "u": "生き物のつながり", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "海の食物連鎖のピラミッドで、イワシ・マアジの数が増えると、その上の段と下の段の生き物の数はどうなりますか。", "c": ["上の段は増加し、下の段は減少する", "上の段は減少し、下の段は増加する", "どちらも増加する", "どちらも減少する"], "e": "食べる側(上)はえさが増えて増え、食べられる側(下)は減ります。十分な時間がたつと、もとにもどります。"}, {"id": "T008", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "海の生き物のうち、海の食物連鎖のピラミッドのいちばん下(生産者)に入るものはどれですか。", "c": ["ケイソウ", "カツオ", "サンマ", "イルカ"], "e": "ケイソウは植物プランクトンで、光合成をします。カツオやイルカはピラミッドの上の方です。"}, {"id": "T009", "u": "生き物のつながり", "lv": "基礎", "r": 84, "f": "知識", "q": "生き物の死がいやふんなどから養分を得ている生き物を何といいますか。", "c": ["分解者", "生産者", "消費者", "天敵"], "e": "ミミズ・ダンゴムシ・カビ・キノコ・細菌などが分解者です。"}, {"id": "T010", "u": "生き物のつながり", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "分解者にあたるものの組み合わせとして正しいものはどれですか。", "c": ["ダンゴムシ・カビ・キノコ", "バッタ・カビ・キノコ", "ススキ・ダンゴムシ・カビ", "ミジンコ・バッタ・キノコ"], "e": "ススキは生産者、バッタやミジンコは消費者です。"}, {"id": "T011", "u": "生き物のつながり", "lv": "基礎", "r": 82, "f": "知識", "q": "植物は、光合成と呼吸をいつ行っていますか。また、動物はどうですか。", "c": ["植物は光合成を昼間のみ、呼吸を1日中。動物は呼吸だけを1日中", "植物も動物も光合成と呼吸を1日中", "植物は呼吸を昼間のみ、動物は夜間のみ", "植物は光合成だけ、動物は呼吸だけを昼間のみ"], "e": "植物は昼間は光合成と呼吸、夜は呼吸だけをします。動物は1日中呼吸だけです。"}, {"id": "T012", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "呼吸を行っている生き物をすべて選んだ組み合わせはどれですか。\nア アサガオ イ メダカ ウ ダイズ エ カブトムシ オ オオカナダモ", "c": ["ア・イ・ウ・エ・オ", "イ・エ", "ア・ウ・オ", "イ・エ・オ"], "e": "呼吸は動物だけでなく、植物も1日中行っています。光合成をしているのはアサガオ・ダイズ・オオカナダモです。"}, {"id": "T013", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "昼間の図で、植物が気体Aを取り入れて気体Bを出し、動物が気体Bを取り入れて気体Aを出しています。気体Aと気体Bの組み合わせとして正しいものはどれですか。", "c": ["Aは二酸化炭素、Bは酸素", "Aは酸素、Bは二酸化炭素", "Aは窒素、Bは酸素", "Aは酸素、Bは窒素"], "e": "昼間の植物は光合成で二酸化炭素を取り入れ酸素を出します。動物は呼吸で酸素を取り入れ二酸化炭素を出します。"}, {"id": "T014", "u": "生き物のつながり", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "昼間、植物は二酸化炭素を取り入れ、動物は二酸化炭素を出しています。夜になると、矢印の向きが反対になるのはどれですか。", "c": ["植物が二酸化炭素を取り入れる矢印と、植物が酸素を出す矢印", "動物が二酸化炭素を出す矢印", "動物が酸素を取り入れる矢印", "どの矢印も変わらない"], "e": "夜は植物も呼吸だけになるので、植物の矢印だけが反対の向きになります。動物は昼も夜も同じです。"}, {"id": "T015", "u": "生き物のつながり", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "密閉した水そうに、メダカとミジンコだけを入れておくとどうなりますか。", "c": ["酸素が減り二酸化炭素が増えていき、やがて生きていけなくなる", "酸素が増え続ける", "二酸化炭素が減り続ける", "何も変わらない"], "e": "どちらも呼吸しかしないので酸素は減る一方です。えさもなくなり、ふんもたまります。"}, {"id": "T016", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "メダカにとってミカヅキモはどのような役割をしていますか。", "c": ["えさとなり、昼間は光合成で酸素も出してくれる", "メダカを食べる天敵", "メダカの出した酸素を吸収する", "メダカのふんを分解する"], "e": "反対に、ミカヅキモにとってメダカは、光合成に必要な二酸化炭素を出してくれます。"}, {"id": "T017", "u": "生き物のつながり", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "水そうに川底の砂やどろを入れて飼育すると、生き物が全滅せずに保たれました。どろの中の目に見えない生き物Yのはたらきとして正しいものはどれですか。", "c": ["死がいや排出物を分解し、植物が育つための養分にする", "酸素をつくり出す", "ミジンコを食べる", "光合成でえさをつくる"], "e": "どろの中の細菌などの分解者が、死がいやふんを分解して、植物プランクトンの肥料をつくります。"}, {"id": "T018", "u": "生き物のつながり", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "生き物が保たれている水そうから、ミジンコのえさの植物プランクトンをすべて取り除きました。その後のミジンコの数はどうなりますか。", "c": ["えさがなくなり、減っていく", "増え続ける", "少し増えてから一定になる", "変わらない"], "e": "えさがなくなるので、ミジンコは減っていきます。反対にミジンコを取り除くと、植物プランクトンは食べられなくなるので増えます。"}, {"id": "T019", "u": "生き物のつながり", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "カエルやモズなど、植物以外の生き物がすべて生き続けるために、いなくてはならない生き物はどれですか。\n(エノコログサ・ススキ・バッタ・クモ・カエル・モズの6種類)", "c": ["バッタ", "クモ", "カエル", "モズ"], "e": "植物を食べるのはバッタだけです。バッタがいないと、植物がつくった養分が、ほかの動物に渡りません。"}, {"id": "T020", "u": "生き物のつながり", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "大気中の二酸化炭素がなくならないのはなぜですか。", "c": ["生き物の呼吸や分解で、二酸化炭素が再び大気中へ出されているから", "植物は二酸化炭素を使わないから", "二酸化炭素は空気中で増えるから", "動物が二酸化炭素を吸収するから"], "e": "二酸化炭素は光合成ででんぷんなどの有機物に変わり、食物連鎖で移動し、呼吸で再び二酸化炭素にもどります(物質の循環)。"}, {"id": "T021", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "有機物ではないものはどれですか。", "c": ["二酸化炭素", "でんぷん", "プラスチック", "ろうそく"], "e": "炭素をふくむ物質のうち、複雑なつくりのものを有機物といいます。二酸化炭素のように単純なものは有機物とはよびません。"}, {"id": "T022", "u": "生き物のつながり", "lv": "標準", "r": 60, "f": "知識", "q": "肥料の3要素のはたらきの組み合わせとして正しいものはどれですか。", "c": ["窒素は葉を、リン酸は花や実を、カリウムは根を肥やす", "窒素は根を、リン酸は葉を、カリウムは花や実を肥やす", "窒素は花や実を、リン酸は根を、カリウムは葉を肥やす", "どれも同じはたらきをする"], "e": "「葉・花実・根」と「窒素・リン酸・カリウム」をセットで覚えましょう。"}, {"id": "T023", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "知識", "q": "根の先にある細かい毛のようなものを何といいますか。また、どんなはたらきがありますか。", "c": ["根毛で、土にふれる面積を大きくし、水や肥料を吸収しやすくする", "根かんで、根の先を守る", "成長点で、根をのばす", "根粒で、窒素を取り入れる"], "e": "根の先には根をのばす成長点や、それを守る根かんもあります。"}, {"id": "T024", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "知識", "q": "マメ科植物の根にいる根粒菌と植物の関係として正しいものはどれですか。", "c": ["根粒菌は空気中の窒素から肥料をつくって植物にわたし、植物から養分をもらう", "根粒菌が植物の養分をうばうだけ", "植物が根粒菌に肥料をわたす", "根粒菌は植物を病気から守るだけ"], "e": "このようにたがいに助け合う関係を共生といいます。"}, {"id": "T025", "u": "生き物のつながり", "lv": "過去問型", "r": 36, "f": "計算", "q": "1年間に大気中へ出される二酸化炭素は、海から970、人間が燃料を燃やして50、陸上生物と地中生物の呼吸で250と100、火山から1(単位は億トン)です。大気中から取り入れられるのは、海に溶けこむ1000と植物の光合成で350です。1年間に大気中の二酸化炭素は何億トン増えていますか。", "c": ["21億トン", "20億トン", "50億トン", "1億トン"], "e": "出される量は970+50+250+100+1=1371億トン、取り入れられる量は1000+350=1350億トンなので、1371−1350=21億トン増えています。"}, {"id": "T026", "u": "生き物のつながり", "lv": "標準", "r": 62, "f": "知識", "q": "地球温暖化の原因と考えられている気体と、その主な増加の理由の組み合わせとして正しいものはどれですか。", "c": ["二酸化炭素で、石油や石炭などの燃料を大量に燃やしているから", "酸素で、植物が増えたから", "窒素で、火山が増えたから", "二酸化炭素で、海が広くなったから"], "e": "森林伐採で光合成をする植物が減ることも原因の1つです。"}, {"id": "T027", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "コウノトリの野生の数を増やすために、最もふさわしい取り組みはどれですか。", "c": ["田んぼや畑にまく農薬を減らして、いろいろな生き物がいるようにする", "えさ台をつくり、いつもえさを置いておく", "タカなどをおいはらう", "川を広げ、田んぼを増やす"], "e": "えさになるドジョウやフナ、カエルなど多くの生き物がすめる環境をつくることが大切です。"}, {"id": "T028", "u": "生き物のつながり", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "トキが野生で生きていくためには、食物連鎖がどのようになっていることが必要ですか。", "c": ["えさとなるたくさんの種類の生き物がいて、食物連鎖があみの目のように広がっていること", "えさとなる生き物が1種類だけ大量にいること", "トキを食べる天敵が多いこと", "田んぼに生き物がいないこと"], "e": "トキはドジョウ・カエル・タニシ・ミミズなどいろいろなものを食べます。冬も水を張った田んぼなど、1年中えさがある環境が必要です。"}, {"id": "T029", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "知識", "q": "ダンゴムシとワラジムシのちがいとして正しいものはどれですか。", "c": ["ダンゴムシは丸まるが、ワラジムシは丸まらない", "ワラジムシは丸まるが、ダンゴムシは丸まらない", "どちらも丸まる", "ダンゴムシは昆虫だが、ワラジムシは昆虫ではない"], "e": "どちらもエビやカニの仲間(甲殻類)で、落ち葉などを食べる分解者です。"}, {"id": "T030", "u": "生き物のつながり", "lv": "応用", "r": 48, "f": "知識", "q": "ヘチマなどウリ科の植物の花の特ちょうとして正しいものはどれですか。", "c": ["おしべだけのお花とめしべだけのめ花の2種類の花をさかせる", "1つの花におしべとめしべの両方がある", "花びらがない", "花がさかない"], "e": "このような花を単性花といいます。ヘチマ・キュウリ・カボチャ・スイカ・ゴーヤー・ユウガオなどがウリ科です。"}, {"id": "T031", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "アサガオ・ヒルガオ・ユウガオ・ヨルガオのうち、ウリ科の植物はどれですか。", "c": ["ユウガオ", "アサガオ", "ヒルガオ", "ヨルガオ"], "e": "ユウガオの実を干したものがかんぴょうです。アサガオ・ヒルガオ・ヨルガオはヒルガオ科です。"}, {"id": "T032", "u": "生き物のつながり", "lv": "標準", "r": 60, "f": "知識", "q": "おとめ座の1等星で、春の大三角をつくる星の1つはどれですか。", "c": ["スピカ", "レグルス", "デネボラ", "アークトゥルス"], "e": "スピカは青白色の1等星です。"}, {"id": "T033", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "知識", "q": "サケの一生として正しいものはどれですか。", "c": ["川で生まれ、海で成長し、秋に産卵のため生まれた川にもどる", "海で生まれ、川で成長し、春に海にもどる", "一生を川で過ごす", "一生を海で過ごす"], "e": "5〜6月ごろにとれるサケは「時鮭(ときしらず)」とよばれます。"}, {"id": "T034", "u": "生き物のつながり", "lv": "標準", "r": 58, "f": "知識", "q": "ミツバチの後ろあしについている、白や黄色のだんご状のものは何ですか。", "c": ["花粉だんご", "みつのかたまり", "卵", "ろう"], "e": "ミツバチは花粉を後ろあしに丸めてつけ、巣に運びます。"}, {"id": "W001", "u": "水溶液①", "lv": "基礎", "r": 86, "f": "知識", "q": "物質が水に溶けてできた液体を水溶液といいます。水溶液の見た目の特ちょうとして正しいものはどれですか。", "c": ["透明である(色がついていることもある)", "必ず白くにごっている", "必ず色がない", "底に物質がたまっている"], "e": "水溶液は向こう側が透けて見える「透明」です。食塩水は無色透明ですが、硫酸銅の水溶液のように色のついた透明なものもあります。"}, {"id": "W002", "u": "水溶液①", "lv": "基礎", "r": 84, "f": "知識", "q": "ある水温で100gの水に溶かすことのできる限界の量を何といいますか。", "c": ["溶解度", "飽和", "融解", "結晶"], "e": "溶解度は、物質の種類と水温によって変わります。"}, {"id": "W003", "u": "水溶液①", "lv": "標準", "r": 62, "f": "知識", "q": "ある物質を限界の量まで溶かした状態を何といいますか。また、その水溶液を何といいますか。", "c": ["飽和、飽和水溶液", "溶解、溶解水溶液", "融解、融解水溶液", "結晶、結晶水溶液"], "e": "飽和すると、それ以上その物質は溶けません。"}, {"id": "W004", "u": "水溶液①", "lv": "基礎", "r": 82, "f": "まちがい探し", "q": "水に溶けないものはどれですか。", "c": ["片栗粉(でんぷん)", "食塩", "砂糖", "ホウ酸"], "e": "片栗粉・油・ろう・木炭・鉄などは水に溶けません。片栗粉を水に入れると白くにごり、しばらく置くと底にたまります。"}, {"id": "W005", "u": "水溶液①", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "液体のうち、水に溶けないものはどれですか。", "c": ["サラダ油", "アルコール", "酢", "料理酒"], "e": "アルコールは水に溶けてアルコール水になります。酢は酢酸という液体が水に溶けた水溶液です。油は水に溶けず、分かれてしまいます。"}, {"id": "W006", "u": "水溶液①", "lv": "標準", "r": 62, "f": "知識", "q": "「とける」には3つの意味があります。組み合わせとして正しいものはどれですか。", "c": ["氷がとける=融解、食塩が水にとける=溶解、卵の殻が酢にとける=化学変化", "氷がとける=溶解、食塩が水にとける=融解、卵の殻が酢にとける=化学変化", "氷がとける=化学変化、食塩が水にとける=溶解、卵の殻が酢にとける=融解", "どれも溶解"], "e": "融解は固体が液体になる状態変化、溶解は物質が細かいつぶになって水のつぶの間に入りこむこと、化学変化は別の物質ができる変化です。"}, {"id": "W007", "u": "水溶液①", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "次のうち、化学変化の「とける」はどれですか。", "c": ["石灰石が塩酸にとける", "雪がとける", "紅茶に砂糖をとかす", "鉄を高温で熱するとどろどろにとける"], "e": "石灰石が塩酸にとけると二酸化炭素が発生し、別の物質ができます。雪や鉄がとけるのは融解、砂糖は溶解です。"}, {"id": "W008", "u": "水溶液①", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "次のうち、溶解の「とける」はどれですか。", "c": ["炭酸飲料に二酸化炭素がとけている", "卵の殻が酢にとけた", "鉄を熱するとどろどろにとけた", "ろうそくのろうがとけた"], "e": "気体の二酸化炭素が水に溶けているのも溶解です。"}, {"id": "W009", "u": "水溶液①", "lv": "基礎", "r": 80, "f": "計算", "q": "水100gに食塩30gを溶かしました。できた食塩水の重さは何gですか。", "c": ["130g", "100g", "70g", "30g"], "e": "溶けて見えなくなっても、溶けた物質はなくなっていません。水溶液の重さは、水と溶けている物質の重さの和です。"}, {"id": "W010", "u": "水溶液①", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "砂糖を水に入れてしばらく置くと、はじめは下の方がもやもやしていましたが、やがて見えなくなりました。このあと、上の方と下の方の濃さはどうなっていますか。", "c": ["どこも同じ濃さ(均一)になっている", "下の方が濃い", "上の方が濃い", "まん中が最も濃い"], "e": "もやもやは砂糖水が濃いところです。時間がたつと全体に広がり、濃さは均一になります。そのあと置いておいても、下にたまることはありません。"}, {"id": "W011", "u": "水溶液①", "lv": "標準", "r": 62, "f": "知識", "q": "水の温度による溶解度の変化について正しいものはどれですか。", "c": ["ホウ酸は水温によって大きく変わるが、食塩はあまり変わらない", "食塩は水温によって大きく変わるが、ホウ酸はあまり変わらない", "どちらも水温によって大きく変わる", "どちらも水温に関係ない"], "e": "食塩は0℃で35.6g、100℃で39.3g。ホウ酸は0℃で3g、100℃で38gです。どの水温でも食塩の方がよく溶けます。"}, {"id": "W012", "u": "水溶液①", "lv": "標準", "r": 60, "f": "計算", "q": "80℃の水100gに食塩は38g溶けます。80℃の水300gには食塩は何g溶けますか。", "c": ["114g", "38g", "76g", "152g"], "e": "溶ける量は水の量に比例します。38×3=114gです。"}, {"id": "W013", "u": "水溶液①", "lv": "標準", "r": 58, "f": "計算", "q": "80℃の水100gにホウ酸は24g溶けます。80℃の水50gには何g溶けますか。", "c": ["12g", "24g", "48g", "6g"], "e": "水の量が半分なので、24÷2=12gです。200gなら48gになります。"}, {"id": "W014", "u": "水溶液①", "lv": "応用", "r": 50, "f": "計算", "q": "20℃の水100gにホウ酸は5g溶けます。20℃の水200gにはホウ酸は何g溶けますか。", "c": ["10g", "5g", "20g", "2.5g"], "e": "5×2=10gです。"}, {"id": "W015", "u": "水溶液①", "lv": "応用", "r": 48, "f": "計算", "q": "80℃の水100gにホウ酸を限界(24g)まで溶かし、20℃まで冷やしました(20℃の溶解度は5g)。ホウ酸の結晶は何g出てきますか。", "c": ["19g", "24g", "5g", "29g"], "e": "24−5=19gが溶けていられなくなって出てきます。"}, {"id": "W016", "u": "水溶液①", "lv": "応用", "r": 48, "f": "計算", "q": "80℃の水100gに食塩を限界(38.0g)まで溶かし、20℃まで冷やしました(20℃の溶解度は35.8g)。食塩の結晶は何g出てきますか。", "c": ["2.2g", "38.0g", "35.8g", "19g"], "e": "38.0−35.8=2.2gしか出てきません。食塩は温度を下げてもあまり取り出せません。"}, {"id": "W017", "u": "水溶液①", "lv": "過去問型", "r": 36, "f": "計算", "q": "100℃の水100gにホウ酸と食塩をそれぞれ限界まで溶かし、20℃まで冷やしました。正しいものはどれですか。(100℃:食塩39.3g・ホウ酸38g、20℃:食塩35.8g・ホウ酸5g)", "c": ["出てくる結晶の量は、食塩よりホウ酸の方が多い", "出てくる結晶の量は、ホウ酸より食塩の方が多い", "出てくる量は同じ", "どちらも結晶は出てこない"], "e": "ホウ酸は38−5=33g、食塩は39.3−35.8=3.5gです。"}, {"id": "W018", "u": "水溶液①", "lv": "過去問型", "r": 36, "f": "計算", "q": "20℃の水100gに食塩とホウ酸をそれぞれ限界まで溶かし(食塩35.8g、ホウ酸5g)、水分をすべて蒸発させました。どちらが何g多くとり出せますか。", "c": ["食塩の方が30.8g多い", "ホウ酸の方が30.8g多い", "食塩の方が40.8g多い", "どちらも同じ"], "e": "蒸発させると溶けていたものがすべて出てくるので、35.8−5=30.8gです。"}, {"id": "W019", "u": "水溶液①", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "水にホウ酸をよりたくさん溶かす方法として正しいものの組み合わせはどれですか。", "c": ["水温を上げる・水の量を増やす", "水温を下げる・よくかき混ぜる", "よくかき混ぜる・つぶを細かくする", "水の量を減らす・水温を上げる"], "e": "かき混ぜたり細かくしたりすると「はやく」溶けますが、溶ける限界の量は変わりません。"}, {"id": "W020", "u": "水溶液①", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "水に砂糖をはやく溶かす方法として、ふさわしくないものはどれですか。", "c": ["つぶの大きい砂糖を入れる", "よくかき混ぜる", "水温を上げる", "粉にした砂糖を入れる"], "e": "細かくすると水とふれる表面積が大きくなり、はやく溶けます。"}, {"id": "W021", "u": "水溶液①", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "食塩をたくさん溶かしたいとき、水温を上げる方法があまり有効でないのはなぜですか。", "c": ["食塩は水温が変わっても溶解度があまり変化しないから", "食塩は熱でこげてしまうから", "食塩は水温を上げると溶けなくなるから", "食塩は水に溶けないから"], "e": "食塩をたくさん溶かすには、水の量を増やすのが有効です。"}, {"id": "W022", "u": "水溶液①", "lv": "標準", "r": 62, "f": "知識", "q": "食塩水から食塩を取り出す方法として最も適したものはどれですか。", "c": ["水を蒸発させる", "氷水で冷やす", "ろ過する", "かき混ぜる"], "e": "食塩は温度を下げても溶解度があまり変わらないので、蒸発させて取り出します。ホウ酸は冷やす方法が有効です。"}, {"id": "W023", "u": "水溶液①", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "ホウ酸水を蒸発皿で加熱して水をすべて蒸発させました。蒸発皿の様子と、蒸発した水についての組み合わせとして正しいものはどれですか。", "c": ["ホウ酸だけが残り、蒸発した水にはホウ酸は含まれていない", "何も残らず、ホウ酸も水といっしょに蒸発した", "ホウ酸と水が結びついた物質が残る", "ホウ酸だけが残り、蒸発した水にもホウ酸が含まれている"], "e": "水だけが蒸発して、溶けていた物質が残ります。"}, {"id": "W024", "u": "水溶液①", "lv": "基礎", "r": 80, "f": "知識", "q": "食塩とホウ酸の結晶の形の組み合わせとして正しいものはどれですか。", "c": ["食塩は立方体、ホウ酸は六角形の板(六角柱)", "食塩は六角形、ホウ酸は立方体", "食塩は正八面体、ホウ酸は立方体", "どちらも立方体"], "e": "ミョウバンは正八面体、硫酸銅は青色の平たい結晶です。結晶の形から、溶けていた物質が分かります。"}, {"id": "W025", "u": "水溶液①", "lv": "標準", "r": 58, "f": "知識", "q": "青色の結晶をつくる物質はどれですか。", "c": ["硫酸銅", "食塩", "ホウ酸", "ミョウバン"], "e": "硫酸銅の水溶液も青色の透明な液体です。"}, {"id": "W026", "u": "水溶液①", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "ホウ酸の大きな結晶を作る方法として正しいものの組み合わせはどれですか。", "c": ["まわりを発泡スチロールでおおってゆっくり冷やす・小さな結晶(種結晶)を糸でつるしておく", "口の大きな容器で急いで蒸発させる・アルコールランプで加熱する", "氷水で急に冷やす・よくかき混ぜる", "種結晶を入れず、急に冷やす"], "e": "できるだけゆっくり溶け残りを出すと、種結晶が少しずつ大きく育ちます。"}, {"id": "W027", "u": "水溶液①", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "食塩の大きな結晶を作るときの方法として正しいものはどれですか。", "c": ["飽和食塩水に種結晶をつるし、容器の口にガーゼでふたをして、ゆっくり水を蒸発させる", "飽和食塩水をゆっくり冷やす", "飽和食塩水を急に加熱してふっとうさせる", "食塩水を冷蔵庫で0℃に冷やす"], "e": "食塩は冷やしてもあまり出てこないので、ゆっくり蒸発させます。"}, {"id": "W028", "u": "水溶液①", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "20℃の水100gに食塩36gを入れてかき混ぜ、種結晶をつるし、ガスバーナーで加熱してふっとうさせました。この方法で大きな結晶ができない理由として最もふさわしいものはどれですか。", "c": ["急に水を蒸発させると、小さな結晶が一度にたくさんでき、底や壁にもついてしまうから", "食塩は加熱すると燃えてしまうから", "食塩は水に溶けないから", "種結晶がとけて大きくなるから"], "e": "20℃では食塩は35.8gしか溶けず、溶け残りも出ます。大きな結晶はゆっくり育てる必要があります。"}, {"id": "W029", "u": "水溶液①", "lv": "標準", "r": 58, "f": "知識", "q": "食塩水を加熱して出てくる白いけむりのような「湯気」と、目に見えない「水蒸気」のちがいとして正しいものはどれですか。", "c": ["水蒸気は気体の水で見えず、湯気は冷えて小さな水のつぶになったもので見える", "湯気は気体で見えず、水蒸気は水のつぶで見える", "どちらも食塩のつぶ", "どちらも同じもの"], "e": "湯気を集めた液体には食塩は含まれていないので、味はしません。"}, {"id": "W030", "u": "水溶液①", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "食塩を湯で溶かしてラップをかけておくと、ラップの内側に水滴がつきました。この水滴を蒸発させるとどうなりますか。", "c": ["ラップには何も残らない", "食塩の結晶が残る", "小さな食塩の結晶が残る", "食塩とはちがう形の結晶が残る"], "e": "蒸発してラップについたのは水だけで、食塩は含まれていません。"}, {"id": "W031", "u": "水溶液①", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "次の分類で、A「固体で水に溶ける」に入らないものはどれですか。", "c": ["鉄", "食塩", "ホウ酸", "氷"], "e": "鉄やガラスは固体で水に溶けません。なたね油やガソリンは液体で水に溶けず、アルコールやガムシロップは液体で水に溶けます。"}, {"id": "W032", "u": "水溶液①", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "海水から食塩をとり出したあとに残る苦い味の液体「にがり」は、豆腐をつくるのに使われます。にがりに多く溶けている物質はどれですか。", "c": ["塩化マグネシウム", "ホウ酸", "でんぷん", "硫酸銅"], "e": "塩化マグネシウムは食塩より溶解度が大きいので、最後まで溶けたまま残ります。"}, {"id": "W033", "u": "水溶液①", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "干し柿の表面に白い粉がふくのは、柿の中の糖分が出てきたものです。渋柿と甘柿を同じ方法で干すと、渋柿の方が白い粉をふきやすいことから考えられることはどれですか。", "c": ["甘柿は渋柿に比べて糖分が少ない", "甘柿は渋柿に比べてタンニンが多い", "甘柿は渋柿に比べて水分が少ない", "渋柿には糖分が含まれていない"], "e": "干したときに表面に出てくる糖分が多いほど、白い粉がふきます。"}, {"id": "W034", "u": "水溶液①", "lv": "標準", "r": 58, "f": "知識", "q": "カイコガの説明として正しいものはどれですか。", "c": ["幼虫はクワの葉を食べ、成虫ははねがあっても飛ばず、えさも食べない", "幼虫はキャベツを食べ、成虫は花のみつを吸う", "成虫はクワの葉を食べてよく飛ぶ", "自然の野山にたくさんすんでいる"], "e": "カイコガは家畜化された昆虫で自然にはいません。まゆからとり出した繊維が絹です。"}, {"id": "W035", "u": "水溶液①", "lv": "標準", "r": 58, "f": "知識", "q": "タンポポの花のつくりとして正しいものはどれですか。", "c": ["小さな花がたくさん集まり、1つの花のように見える", "1つの花に花びらが何十枚もついている", "花びらがない", "4枚の花びらがある"], "e": "キク科の特ちょうです。総苞が反り返っているのは外来種のセイヨウタンポポです。"}, {"id": "W036", "u": "水溶液①", "lv": "標準", "r": 58, "f": "知識", "q": "キャベツとレタスの科の組み合わせとして正しいものはどれですか。", "c": ["キャベツはアブラナ科、レタスはキク科", "キャベツはキク科、レタスはアブラナ科", "どちらもアブラナ科", "どちらもキク科"], "e": "見た目は似ていますが、ちがう仲間です。ヨモギやハルジオンもキク科です。"}, {"id": "W037", "u": "水溶液①", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "両生類の仲間の組み合わせとして正しいものはどれですか。", "c": ["オオサンショウウオ・アカハライモリ", "ゾウガメ・シマヘビ", "ゾウガメ・オオサンショウウオ", "シマヘビ・カナヘビ"], "e": "イモリやサンショウウオ、カエルは両生類です。ゾウガメ・シマヘビ・カナヘビ(トカゲの仲間)はは虫類です。"}, {"id": "V001", "u": "水溶液②", "lv": "基礎", "r": 84, "f": "知識", "q": "塩酸に溶けている物質はどれですか。", "c": ["塩化水素(気体)", "食塩(固体)", "二酸化炭素(気体)", "酢酸(液体)"], "e": "塩酸は塩化水素という気体が溶けた水溶液です。胃液にも含まれています。"}, {"id": "V002", "u": "水溶液②", "lv": "基礎", "r": 82, "f": "知識", "q": "石灰水に溶けている物質はどれですか。", "c": ["消石灰(水酸化カルシウム)", "二酸化炭素", "炭酸カルシウム", "食塩"], "e": "石灰水は消石灰という固体が溶けた水溶液です。二酸化炭素を吸収すると白くにごります。"}, {"id": "V003", "u": "水溶液②", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "気体が溶けている水溶液の組み合わせとして正しいものはどれですか。", "c": ["塩酸・炭酸水・アンモニア水", "塩酸・食塩水・アンモニア水", "炭酸水・アルコール水・石灰水", "アンモニア水・ホウ酸水・砂糖水"], "e": "塩酸は塩化水素、炭酸水は二酸化炭素、アンモニア水はアンモニアという気体が溶けています。"}, {"id": "V004", "u": "水溶液②", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "液体が溶けている水溶液の組み合わせとして正しいものはどれですか。", "c": ["アルコール水・酢酸水溶液", "アルコール水・塩酸", "酢酸水溶液・炭酸水", "アンモニア水・アルコール水"], "e": "アルコールと酢酸は液体です。食酢には酢酸が含まれています。"}, {"id": "V005", "u": "水溶液②", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "固体が溶けている水溶液の組み合わせとして正しいものはどれですか。", "c": ["食塩水・砂糖水・ホウ酸水・石灰水", "食塩水・砂糖水・塩酸・石灰水", "食塩水・炭酸水・ホウ酸水・石灰水", "アルコール水・砂糖水・ホウ酸水・石灰水"], "e": "水酸化ナトリウム水溶液や重そう水も固体が溶けています。"}, {"id": "V006", "u": "水溶液②", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "加熱して水を蒸発させると、何も残らない水溶液はどれですか。", "c": ["炭酸水", "食塩水", "石灰水", "ホウ酸水"], "e": "気体や液体が溶けている水溶液は、水といっしょに溶けていたものも出ていくので何も残りません。"}, {"id": "V007", "u": "水溶液②", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "加熱して水を蒸発させると、白い固体が残る水溶液の組み合わせとして正しいものはどれですか。", "c": ["食塩水・石灰水・ホウ酸水・水酸化ナトリウム水溶液", "食塩水・砂糖水・塩酸・石灰水", "炭酸水・石灰水・ホウ酸水・食塩水", "アンモニア水・食塩水・ホウ酸水・石灰水"], "e": "砂糖水は加熱すると黒くこげます。"}, {"id": "V008", "u": "水溶液②", "lv": "標準", "r": 60, "f": "知識", "q": "加熱して水を蒸発させると、黒くこげたものが残る水溶液はどれですか。", "c": ["砂糖水", "食塩水", "ホウ酸水", "石灰水"], "e": "砂糖は加熱すると、だんだんのり状になり黒くこげます。"}, {"id": "V009", "u": "水溶液②", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "においのある水溶液の組み合わせとして正しいものはどれですか。", "c": ["塩酸・アンモニア水・アルコール水・酢酸水溶液", "塩酸・食塩水・アルコール水・酢酸水溶液", "炭酸水・アンモニア水・アルコール水・石灰水", "塩酸・アンモニア水・砂糖水・ホウ酸水"], "e": "固体が溶けている水溶液にはにおいがありません。炭酸水も無臭です。"}, {"id": "V010", "u": "水溶液②", "lv": "標準", "r": 62, "f": "知識", "q": "水溶液のにおいの正しいかぎ方はどれですか。", "c": ["手であおいで空気と混ぜ、うすめてかぐ", "鼻を直接近づけてかぐ", "加熱してからかぐ", "一度にたくさん吸いこむ"], "e": "塩酸やアンモニア水のにおいは鼻やのどを痛める危険があります。"}, {"id": "V011", "u": "水溶液②", "lv": "標準", "r": 58, "f": "知識", "q": "蒸発皿で水溶液を加熱するとき、火を消すのはいつがよいですか。", "c": ["液が少し残っているとき(残りは余熱で蒸発させる)", "液が完全になくなってから", "液が半分くらいになったとき、残りは自然に蒸発させる", "加熱し始めてすぐ"], "e": "最後まで加熱すると、残った固体が飛び散ることがあります。"}, {"id": "V012", "u": "水溶液②", "lv": "基礎", "r": 84, "f": "知識", "q": "酸性の水溶液をリトマス紙につけたときの変化として正しいものはどれですか。", "c": ["青色リトマス紙が赤色に変わる", "赤色リトマス紙が青色に変わる", "どちらも変化しない", "どちらも白色に変わる"], "e": "アルカリ性は赤色リトマス紙が青色に、中性はどちらも変化しません。"}, {"id": "V013", "u": "水溶液②", "lv": "基礎", "r": 82, "f": "知識", "q": "リトマス紙の正しい使い方はどれですか。", "c": ["ピンセットで持ち、ガラス棒で水溶液をつける", "手で持ち、水溶液に直接入れる", "手で持ち、ガラス棒で水溶液をつける", "ピンセットで持ち、ビーカーに直接入れる"], "e": "手の汗などで色が変わらないように、リトマス紙はピンセットで扱います。"}, {"id": "V014", "u": "水溶液②", "lv": "標準", "r": 62, "f": "知識", "q": "緑色のBTB液を加えたときの色の組み合わせとして正しいものはどれですか。", "c": ["酸性=黄色、中性=緑色、アルカリ性=青色", "酸性=青色、中性=緑色、アルカリ性=黄色", "酸性=赤色、中性=紫色、アルカリ性=青色", "酸性=黄色、中性=無色、アルカリ性=赤色"], "e": "「サンキ(酸=黄)・アオアル(青=アルカリ)」のように覚えましょう。"}, {"id": "V015", "u": "水溶液②", "lv": "応用", "r": 48, "f": "知識", "q": "ムラサキキャベツ液の色で、強いアルカリ性を示すのはどれですか。", "c": ["黄色", "赤色", "ピンク色", "紫色"], "e": "酸性が強いと赤、弱いとピンク、中性は紫、アルカリ性が弱いと緑、強いと黄色です。"}, {"id": "V016", "u": "水溶液②", "lv": "応用", "r": 48, "f": "知識", "q": "フェノールフタレイン液の説明として正しいものはどれですか。", "c": ["無色透明で、アルカリ性の水溶液にだけ反応して赤色になる", "酸性の水溶液で赤色になる", "緑色で、酸性で黄色になる", "紫色で、酸性で赤色になる"], "e": "酸性と中性では無色のままです。"}, {"id": "V017", "u": "水溶液②", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "酸性の水溶液の組み合わせとして正しいものはどれですか。", "c": ["塩酸・炭酸水・ホウ酸水・酢酸水溶液", "塩酸・石灰水・ホウ酸水・酢酸水溶液", "食塩水・炭酸水・ホウ酸水・酢酸水溶液", "塩酸・炭酸水・アンモニア水・酢酸水溶液"], "e": "ホウ酸水は弱い酸性です。"}, {"id": "V018", "u": "水溶液②", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "アルカリ性の水溶液の組み合わせとして正しいものはどれですか。", "c": ["石灰水・水酸化ナトリウム水溶液・アンモニア水・重そう水", "石灰水・水酸化ナトリウム水溶液・ホウ酸水・重そう水", "食塩水・水酸化ナトリウム水溶液・アンモニア水・重そう水", "石灰水・炭酸水・アンモニア水・重そう水"], "e": "虫さされの薬にはアンモニアが使われることがあり、アルカリ性です。"}, {"id": "V019", "u": "水溶液②", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "中性の水溶液の組み合わせとして正しいものはどれですか。", "c": ["食塩水・砂糖水・アルコール水", "食塩水・砂糖水・ホウ酸水", "食塩水・炭酸水・アルコール水", "砂糖水・アルコール水・重そう水"], "e": "中性の水溶液はリトマス紙の色を変えません。"}, {"id": "V020", "u": "水溶液②", "lv": "応用", "r": 48, "f": "知識", "q": "電流を通す水溶液について正しいものはどれですか。", "c": ["酸性とアルカリ性の水溶液は電流を通し、中性では食塩水は通すが砂糖水やアルコール水は通さない", "酸性の水溶液だけが電流を通す", "中性の水溶液はすべて電流を通す", "どの水溶液も電流を通さない"], "e": "中性でも食塩水は電流をよく通すことに注意しましょう。"}, {"id": "V021", "u": "水溶液②", "lv": "標準", "r": 58, "f": "知識", "q": "酸性とアルカリ性の水溶液の味の特ちょうとして正しいものはどれですか。", "c": ["酸性は酸っぱく、アルカリ性は苦い", "酸性は苦く、アルカリ性は酸っぱい", "どちらも甘い", "どちらも塩辛い"], "e": "ただし、実験で水溶液をなめてはいけません。"}, {"id": "V022", "u": "水溶液②", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "酸性の水溶液とアルカリ性の水溶液を混ぜ、たがいの性質を打ち消し合う反応を何といいますか。", "c": ["中和", "溶解", "融解", "燃焼"], "e": "酸っぱいグレープフルーツに重そうをかけると食べやすくなるのも中和を利用しています。"}, {"id": "V023", "u": "水溶液②", "lv": "標準", "r": 62, "f": "知識", "q": "二つの水溶液を混ぜたとき、白くにごる組み合わせはどれですか。", "c": ["石灰水と炭酸水", "食塩水と砂糖水", "塩酸とアンモニア水", "アルコール水と食塩水"], "e": "石灰水は二酸化炭素と反応して白くにごります。"}, {"id": "V024", "u": "水溶液②", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "石灰水と炭酸水を混ぜて白くにごった液をろ過し、残った白い固体を別の水溶液に入れると、気泡を出しながら溶けました。この水溶液はどれですか。", "c": ["塩酸", "食塩水", "石灰水", "砂糖水"], "e": "白い固体は炭酸カルシウムで、塩酸と反応して二酸化炭素を出します。"}, {"id": "V025", "u": "水溶液②", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "次の2つのグループに分けた操作として最もふさわしいものはどれですか。\nグループ1:石灰水・水酸化ナトリウム水溶液・食塩水・砂糖水\nグループ2:塩酸・アンモニア水・炭酸水", "c": ["加熱して水を蒸発させる(固体が残るか残らないか)", "リトマス紙につける", "においをかぐ", "BTB液を加える"], "e": "グループ1は固体が溶けているので何か残り、グループ2は気体が溶けているので何も残りません。"}, {"id": "V026", "u": "水溶液②", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "食塩水と炭酸水をそれぞれ蒸発皿で加熱するとどうなりますか。", "c": ["食塩水は白い固体が残り、炭酸水は何も残らない", "どちらも白い固体が残る", "どちらも何も残らない", "食塩水は何も残らず、炭酸水は白い固体が残る"], "e": "アンモニア水・アルコール水も、溶けているものが水といっしょに出ていくので炭酸水と同じく何も残りません。ホウ酸水は食塩水と同じで白い固体が残ります。"}, {"id": "V027", "u": "水溶液②", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "無色透明の液A・Bのどちらが砂糖水かを、なめずに調べる方法として最もふさわしいものはどれですか(もう一方は別の固体が溶けた水溶液)。", "c": ["少しとって加熱し、こげて黒くなる方が砂糖水", "かき混ぜて、もやもやが見える方が砂糖水", "においをかいで、においがする方が砂糖水", "リトマス紙につけて、赤くなる方が砂糖水"], "e": "なめて調べるのは危険です。何が溶けているか分からない液体はなめてはいけません。"}, {"id": "V028", "u": "水溶液②", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "同じ量の水に濃さの違う食塩水C・Dを作りました。水分を蒸発させて出てくる食塩の量を比べると、どちらが濃いか分かります。濃い方の結果はどうなりますか。", "c": ["出てくる食塩の量が多い", "出てくる食塩の量が少ない", "何も出てこない", "どちらも同じ量になる"], "e": "さらに食塩を加えていく方法では、濃い方が溶け残りが出るまでに加えられる量が少なくなります。"}, {"id": "V029", "u": "水溶液②", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "紫キャベツを使った焼きそばの麺が青緑色に変わったのは、麺に含まれるかん水(炭酸ナトリウム)が原因でした。かん水の液性と、そこに酢をかけたときの色の組み合わせとして正しいものはどれですか。", "c": ["アルカリ性で、酢をかけると赤くなる", "酸性で、酢をかけると青くなる", "中性で、酢をかけても変わらない", "アルカリ性で、酢をかけると黄色になる"], "e": "ムラサキキャベツ液は酸性で赤〜ピンク、アルカリ性で緑〜黄色になります。"}, {"id": "V030", "u": "水溶液②", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ムラサキキャベツ液に炭酸水を加えると薄いピンク色になりましたが、これを沸騰させると紫色にもどりました。その理由はどれですか。", "c": ["溶けていた二酸化炭素が出ていき、中性にもどったから", "水が増えて薄まったから", "ムラサキキャベツ液がこげたから", "加熱すると酸性が強くなるから"], "e": "炭酸水は二酸化炭素が溶けた弱い酸性の水溶液です。"}, {"id": "V031", "u": "水溶液②", "lv": "標準", "r": 60, "f": "計算", "q": "20℃の水100gにホウ酸を10g加えてよくかき混ぜました(20℃で溶ける限界は5g)。できたホウ酸水は何gですか。", "c": ["105g", "110g", "100g", "5g"], "e": "溶けたのは5gだけで、残りの5gは溶け残ります。水溶液は水100g+溶けた5g=105gです。"}, {"id": "V032", "u": "水溶液②", "lv": "過去問型", "r": 36, "f": "計算", "q": "60℃でホウ酸は水100gに15g溶けます。60℃で溶け残りが出るのはどれですか。", "c": ["水50gにホウ酸10g", "水100gにホウ酸6g", "水200gにホウ酸28g", "水100gにホウ酸15g"], "e": "水50gには7.5gまでしか溶けないので、10gでは溶け残ります。水200gには30gまで溶けます。"}, {"id": "V033", "u": "水溶液②", "lv": "標準", "r": 58, "f": "知識", "q": "モンシロチョウ・アゲハ・オオムラサキの幼虫の食草の組み合わせとして正しいものはどれですか。", "c": ["モンシロチョウ=アブラナ科、アゲハ=ミカン科、オオムラサキ=エノキ", "モンシロチョウ=ミカン科、アゲハ=アブラナ科、オオムラサキ=エノキ", "モンシロチョウ=アブラナ科、アゲハ=セリ科、オオムラサキ=クヌギ", "モンシロチョウ=エノキ、アゲハ=ミカン科、オオムラサキ=アブラナ科"], "e": "キアゲハはセリ科(ニンジン・ミツバ)、ギフチョウはカンアオイ、ヤマトシジミはカタバミを食べます。"}, {"id": "V034", "u": "水溶液②", "lv": "応用", "r": 48, "f": "知識", "q": "幼虫のすがたで冬越しするチョウはどれですか。", "c": ["オオムラサキ", "モンシロチョウ", "アゲハ", "キアゲハ"], "e": "オオムラサキの幼虫は、冬はエノキの根元の落ち葉の裏にいます。モンシロチョウやアゲハはさなぎで冬越しします。"}, {"id": "V035", "u": "水溶液②", "lv": "標準", "r": 58, "f": "知識", "q": "ビワの花粉は主に何によって運ばれますか。", "c": ["鳥", "昆虫", "風", "水"], "e": "冬に咲くので昆虫がほとんどおらず、鳥によって花粉が運ばれる鳥媒花です。"}, {"id": "V036", "u": "水溶液②", "lv": "標準", "r": 60, "f": "知識", "q": "コムギの種子で、発芽に必要な養分をたくわえている部分と、その主な養分の組み合わせとして正しいものはどれですか。", "c": ["胚乳で、でんぷん", "子葉で、でんぷん", "胚乳で、脂肪", "子葉で、たんぱく質"], "e": "コムギの胚乳を粉にしたものが小麦粉です。ヨウ素液をつけると青紫色になります。"}, {"id": "X001", "u": "水溶液③", "lv": "基礎", "r": 84, "f": "知識", "q": "液体の体積を正確にはかりとる実験器具はどれですか。", "c": ["メスシリンダー", "ビーカー", "三角フラスコ", "蒸発皿"], "e": "メスシリンダーは水平な場所に置いて使います。物体の体積をはかることもできます。"}, {"id": "X002", "u": "水溶液③", "lv": "標準", "r": 62, "f": "知識", "q": "メスシリンダーの目もりの読み方として正しいものはどれですか。", "c": ["目の高さを液面と同じにし、液面のいちばん平らなところを最小の目もりの1/10まで読む", "上から見下ろして、液面のいちばん高いところを読む", "下から見上げて、液面のふちを読む", "目もりの近いほうの数だけを読む"], "e": "1目もりが1mLなら、0.1mLの位まで目分量で読みとります。"}, {"id": "X003", "u": "水溶液③", "lv": "標準", "r": 60, "f": "計算", "q": "メスシリンダーに水を60.0mL入れ、物体を沈めると水面が72.5mLになりました。物体の体積は何cm³ですか。", "c": ["12.5cm³", "72.5cm³", "60.0cm³", "132.5cm³"], "e": "増えた分が物体の体積です。72.5−60.0=12.5で、1mL=1cm³です。"}, {"id": "X004", "u": "水溶液③", "lv": "標準", "r": 62, "f": "知識", "q": "ろ過で、ろうとに入れたろ紙を密着させるために注ぐものはどれですか。", "c": ["蒸留水", "ろ過する液", "食塩水", "アルコール"], "e": "ろ紙は4つに折って円すい形に広げ、ろうとに入れて蒸留水でぬらして密着させます。"}, {"id": "X005", "u": "水溶液③", "lv": "標準", "r": 60, "f": "知識", "q": "ろ紙の大きさとして正しいものはどれですか。", "c": ["ろうとに入れたとき、ろうとより少し小さくなるもの", "ろうとからはみ出すくらい大きいもの", "ろうとの半分くらいの大きさのもの", "どんな大きさでもよい"], "e": "ろ紙がはみ出すと、液がろ紙を伝って外にこぼれやすくなります。"}, {"id": "X006", "u": "水溶液③", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "ろ過で、ろうとの先のとがったほうをビーカーの内側のかべにつけるのはなぜですか。", "c": ["ろ液が飛び散るのを防ぎ、ろ過を早く行うため", "液の温度を一定に保つため", "ろうとが割れるのを防ぐため", "ろ紙を乾かすため"], "e": "液がかべを伝って静かに流れ落ちるので飛び散らず、早く流れます。"}, {"id": "X007", "u": "水溶液③", "lv": "標準", "r": 58, "f": "しくみ・理由", "q": "ろ過で、液をガラス棒に伝わらせて注ぐのはなぜですか。", "c": ["液が飛び散ったり、ろうとの外にこぼれたりするのを防ぐため", "液を冷やすため", "液をかき混ぜて溶かすため", "ガラス棒に溶け残りをつけるため"], "e": "ガラス棒の先は、ろ紙が三重になっているところに当てて、少しずつ注ぎます。"}, {"id": "X008", "u": "水溶液③", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ガラス棒の先を、ろ紙が三重になっているところに当てるのはなぜですか。", "c": ["ろ紙が破れにくいから", "液が早く冷めるから", "ろうとにくっつかないから", "液が多く入るから"], "e": "一重のところに当てると、ろ紙が破れてしまうことがあります。"}, {"id": "X009", "u": "水溶液③", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "ろ過のし方として、まちがっているものはどれですか。", "c": ["液をろうとのふちいっぱいまで一度に入れる", "液はろ紙の8分目より高くならないように入れる", "ろうとの先のとがった方をビーカーのかべにつける", "液はガラス棒に伝わらせて少しずつ入れる"], "e": "液はろ紙の下から8分目より高くならないようにします。"}, {"id": "X010", "u": "水溶液③", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "4つ折りにしたろ紙を広げると、溶け残りはどこについていますか。", "c": ["折り目で4つに分けた部分のうち、半分(2つ分)の半円の部分", "全体", "4分の1の部分", "4分の3の部分"], "e": "4つ折りのろ紙を広げると、液がついていた部分は半円の形になります。"}, {"id": "X011", "u": "水溶液③", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "ろ過で、溶け残った食塩と食塩水を分けられるのはなぜですか。", "c": ["ろ紙には小さな穴が開いていて、水や水に溶けているものは通るが、溶けていない大きなつぶは通れないから", "ろ紙が食塩だけを吸いとるから", "ろ紙が食塩水だけを選んで通すから", "食塩水は軽いから"], "e": "水に溶けているものはとても小さなつぶになっているので、ろ紙を通りぬけます。"}, {"id": "X012", "u": "水溶液③", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "水と混ぜたあとにろ過して分けることができる混合物はどれですか。", "c": ["食塩とでんぷん", "食塩と砂糖", "水とエタノール", "鉄粉と銅粉"], "e": "食塩は水に溶けて通りぬけ、でんぷんは溶けないのでろ紙に残ります。両方溶けたり、両方溶けなかったりすると分けられません。"}, {"id": "X013", "u": "水溶液③", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "食塩水をろ過すると、ろ紙には何が残りますか。", "c": ["何も残らない(食塩水はそのまま通りぬける)", "食塩が残る", "水が残る", "食塩の半分が残る"], "e": "溶けているものはろ過では取り出せません。取り出すには水を蒸発させます。"}, {"id": "X014", "u": "水溶液③", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "80℃の水に食塩を溶けるだけ溶かし20℃まで冷やすと、結晶が出てきました。これをろ過したろ液について正しいものはどれですか。", "c": ["20℃のままでは、さらに食塩を加えても溶かすことができない", "さらに食塩を溶かすことができる", "食塩のつぶが見える", "もう一度ろ過すると食塩をとり出すことができる"], "e": "ろ液は20℃の飽和食塩水なので、それ以上溶けません。"}, {"id": "X015", "u": "水溶液③", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "泥が混ざった液をろ過すると、ろ液ににおいが残っていました。活性炭を加えてよくかき混ぜてからろ過すると、においがなくなりました。活性炭のはたらきはどれですか。", "c": ["においのもとを吸着する", "泥を溶かす", "水を蒸発させる", "においを発生させる"], "e": "活性炭は木炭と同じものでできていて、小さな穴にいろいろな物質を吸いつけます。"}, {"id": "X016", "u": "水溶液③", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "泥の混ざった液をろ過すると泥はろ紙に残り、においのもとはろ紙を通りぬけました。この実験から分かる大きさの関係として正しいものはどれですか。", "c": ["泥はろ紙の穴より大きく、においのもとはろ紙の穴より小さい", "泥はろ紙の穴より小さい", "においのもとはろ紙の穴より大きい", "泥もにおいのもとも、ろ紙の穴より大きい"], "e": "ろ紙を通りぬけるかどうかは、つぶの大きさで決まります。"}, {"id": "X017", "u": "水溶液③", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "ろ過と同じように、ものの大きさの違いを利用して分けている例はどれですか。", "c": ["流しの排水口のごみ受けのかご", "砂に磁石を入れて砂鉄を集める", "海水を加熱して出てきた水蒸気を冷やす", "食塩水を蒸発させて食塩をとり出す"], "e": "掃除機の排気フィルターも同じしくみです。磁石は磁石につく性質、蒸留は沸とうする温度の違いを利用しています。"}, {"id": "X018", "u": "水溶液③", "lv": "標準", "r": 58, "f": "知識", "q": "ミョウバンの結晶の形として正しいものはどれですか。", "c": ["正八面体", "立方体", "六角柱", "針のような形"], "e": "食塩は立方体、ホウ酸は六角柱(六角形の板)の形です。"}, {"id": "X019", "u": "水溶液③", "lv": "基礎", "r": 82, "f": "知識", "q": "水溶液を自然に蒸発させるときに使う、口が広くて浅い容器はどれですか。", "c": ["ペトリ皿(シャーレ)", "メスシリンダー", "三角フラスコ", "試験管"], "e": "口が広く浅いので、水が蒸発しやすくなります。"}, {"id": "X020", "u": "水溶液③", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "蒸発皿で水溶液を加熱するとき、液が少し残っているうちに火を消すのはなぜですか。", "c": ["最後まで加熱すると、残った固体のつぶがはねて飛び散るから", "液が少ないと蒸発皿が割れるから", "液が残っていないと固体が溶けてしまうから", "アルコールランプのアルコールが足りなくなるから"], "e": "残った水分は余熱で蒸発させます。"}, {"id": "X021", "u": "水溶液③", "lv": "基礎", "r": 82, "f": "知識", "q": "アルコールランプのアルコールの量と、しんの長さの組み合わせとして正しいものはどれですか。", "c": ["アルコールは容器の7〜8分目、しんは5mmくらい出す", "アルコールは容器の半分以下、しんは2cm出す", "アルコールは容器いっぱい、しんは5mmくらい出す", "アルコールは2分目、しんは出さない"], "e": "アルコールが少ないと、容器にたまったアルコールの気体に引火して爆発することがあります。"}, {"id": "X022", "u": "水溶液③", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "アルコールランプの使い方として、まちがっているものはどれですか。", "c": ["火のついたアルコールランプから、ほかのアルコールランプに火を移す", "マッチの火を横から近づけて火をつける", "火を消すときは、ふたをななめ上からかぶせる", "近くにぬれぞうきんを準備しておく"], "e": "火を移したり、かたむけたりすると、アルコールがこぼれて大変危険です。"}, {"id": "X023", "u": "水溶液③", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "アルコールランプの火をふたで消すことができるのはなぜですか。", "c": ["ふたをすると酸素が不足するから", "ふたで温度が上がるから", "燃えるものがなくなるから", "ふたが火を吸いとるから"], "e": "燃焼に必要な酸素が届かなくなるため火が消えます。息で吹き消してはいけません。"}, {"id": "X024", "u": "水溶液③", "lv": "基礎", "r": 82, "f": "知識", "q": "液体を熱して気体にし、それを冷やして純粋な液体にする方法を何といいますか。", "c": ["蒸留", "ろ過", "蒸発", "溶解"], "e": "食塩水を蒸留すると、試験管に純粋な水(蒸留水)がたまります。"}, {"id": "X025", "u": "水溶液③", "lv": "標準", "r": 62, "f": "知識", "q": "蒸留で、丸底フラスコに入れる液体の量はどのくらいにしますか。", "c": ["フラスコの1/3〜1/2程度", "フラスコいっぱい", "フラスコの1/10程度", "フラスコの9分目"], "e": "入れすぎるとふっとうした液が管のほうへ流れ出てしまいます。"}, {"id": "X026", "u": "水溶液③", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "蒸留で火を消す前に、必ず試験管にさしてあるガラス管を先に抜くのはなぜですか。", "c": ["フラスコ内の水蒸気が水にもどって圧力が下がり、試験管の水が逆流してフラスコが割れるのを防ぐため", "試験管の水が蒸発するのを防ぐため", "ガラス管が熱くなりすぎるのを防ぐため", "アルコールランプの火が強くなるのを防ぐため"], "e": "冷たい水が熱いフラスコに流れこむと、急に冷やされて割れることがあります。"}, {"id": "X027", "u": "水溶液③", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "食塩水を蒸留し続けると、フラスコの中はどうなりますか。", "c": ["液量が減って濃くなり、やがて食塩の結晶が出てくる", "液量が増えてうすくなる", "食塩も水といっしょに試験管に移る", "何も変化しない"], "e": "水だけが蒸発するので、フラスコの中の食塩水はだんだん濃くなります。"}, {"id": "X028", "u": "水溶液③", "lv": "応用", "r": 46, "f": "まちがい探し", "q": "蒸留したとき、試験管にたまる液体が、食塩水を蒸留したときと同じように純粋な水になるものをすべて選んだ組み合わせはどれですか。\nア 炭酸水 イ 水酸化ナトリウム水溶液 ウ ホウ酸水 エ アルコール水", "c": ["イとウ", "アとエ", "ア・イ・ウ・エ", "ウだけ"], "e": "固体が溶けている水溶液は、水だけが出てきます。気体や液体が溶けているものは、溶けているものも出てきます。"}, {"id": "X029", "u": "水溶液③", "lv": "基礎", "r": 82, "f": "知識", "q": "実験中に薬品が手についたときの正しい対応はどれですか。", "c": ["すぐに水道水でしばらくの間洗い流す", "乾いた布でふきとるだけにする", "そのまま実験を続ける", "別の薬品をかけて打ち消す"], "e": "加熱実験や気体が発生する実験では、窓を開けて換気をよくします。"}, {"id": "X030", "u": "水溶液③", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "実験を行うときの注意点として、正しくないものはどれですか。", "c": ["液体を加熱する実験では、フラスコや試験管になるべくたくさんの液体を入れる", "実験を行うときは、窓を開けて換気をする", "使った水溶液は流し場に直接捨てず、決められた入れ物に捨てる", "火を使う実験では、まわりにノートなど燃えるものを置かない"], "e": "入れすぎると、ふっとうしたときに液があふれて危険です。"}, {"id": "X031", "u": "水溶液③", "lv": "標準", "r": 62, "f": "知識", "q": "リトマス紙で気体の性質を調べるときの正しい方法はどれですか。", "c": ["水(蒸留水)でぬらしたリトマス紙を気体にかざす", "乾いたリトマス紙を気体にかざす", "リトマス紙を気体の中に投げ入れる", "リトマス紙を加熱してから近づける"], "e": "気体がリトマス紙の水に溶けて水溶液になるので、色が変わります。"}, {"id": "X032", "u": "水溶液③", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "試験管に水溶液を入れて加熱し、口に水でぬらした青色リトマス紙を近づけると、赤色に変化しました。この水溶液はどれですか。", "c": ["塩酸", "アンモニア水", "砂糖水", "食塩水"], "e": "塩酸から出た塩化水素がリトマス紙の水に溶けて酸性になります。アンモニア水なら赤色リトマス紙が青色になります。"}, {"id": "X033", "u": "水溶液③", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "身のまわりの物のうち、アルカリ性を示すものはどれですか。", "c": ["せっけん水", "酢", "レモンの汁", "サイダー(炭酸飲料)"], "e": "pHが7より大きいとアルカリ性、小さいと酸性、7が中性です。"}, {"id": "X034", "u": "水溶液③", "lv": "標準", "r": 62, "f": "知識", "q": "雨水がもともと弱い酸性を示すのはなぜですか。", "c": ["空気中の二酸化炭素が溶けているから", "空気中の窒素が溶けているから", "空気中の酸素が溶けているから", "雨水に食塩が溶けているから"], "e": "pHが5.6より小さい雨を酸性雨といいます。"}, {"id": "X035", "u": "水溶液③", "lv": "応用", "r": 48, "f": "知識", "q": "酸性雨の原因となる物質の組み合わせとして正しいものはどれですか。", "c": ["自動車の排気ガスや工場の煙に含まれる窒素酸化物や硫黄酸化物", "植物が出す酸素", "海水に含まれる食塩", "火山灰に含まれる鉄"], "e": "森林の木々に影響をあたえたり、湖沼の生き物が死滅したりするなど問題になっています。"}, {"id": "X036", "u": "水溶液③", "lv": "標準", "r": 62, "f": "知識", "q": "「混ぜるな危険」と書かれた酸性タイプの洗浄剤と塩素系の漂白剤を混ぜると、何が発生しますか。", "c": ["有毒な塩素ガス", "酸素", "二酸化炭素", "水蒸気"], "e": "洗剤や薬品を使うときは、使用上の注意をよく読みましょう。"}, {"id": "X037", "u": "水溶液③", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "砂が混ざった食塩水から食塩だけを得るための2つの実験操作の順として正しいものはどれですか。", "c": ["ろ過で砂を取り除き、そのろ液を蒸発皿で加熱して水を蒸発させる", "蒸発皿で加熱して水を蒸発させてから、ろ過する", "蒸留して試験管にたまった液を集める", "ろ過して、ろ紙に残ったものを集める"], "e": "先にろ過で溶けていない砂を分け、溶けている食塩はろ液を蒸発させて取り出します。"}, {"id": "X038", "u": "水溶液③", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "夏鳥の組み合わせとして正しいものはどれですか。", "c": ["ツバメ・ホトトギス・カッコウ", "マガモ・ハクチョウ・マガン", "スズメ・カラス・ツバメ", "ツバメ・マガモ・カラス"], "e": "夏鳥は春に南から来て秋に南へ帰ります。マガモ・ハクチョウ・マガンは冬鳥、スズメ・カラスは留鳥です。"}, {"id": "X039", "u": "水溶液③", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "春の七草のうち、アブラナ科のものの組み合わせとして正しいものはどれですか。", "c": ["ナズナ・カブ(すずな)・ダイコン(すずしろ)", "セリ・ナズナ・ハコベ", "ハハコグサ・カブ・ダイコン", "セリ・カブ・コオニタビラコ"], "e": "セリはセリ科、ハハコグサとコオニタビラコはキク科、ハコベはナデシコ科です。"}, {"id": "B001", "u": "花と受粉", "lv": "基礎", "r": 86, "f": "知識", "q": "花の4要素の組み合わせとして正しいものはどれですか。", "c": ["がく・花びら・おしべ・めしべ", "がく・花びら・おしべ・子房", "花びら・おしべ・めしべ・胚珠", "がく・花びら・やく・柱頭"], "e": "がくはつぼみのときに内部を守り、花びらは昆虫などをおびき寄せ、おしべはやくで花粉を作り、めしべは受粉後に実や種子になります。"}, {"id": "B002", "u": "花と受粉", "lv": "基礎", "r": 84, "f": "知識", "q": "おしべのやくで作られた花粉が、めしべの柱頭につくことを何といいますか。", "c": ["受粉", "受精", "発芽", "開花"], "e": "受粉後、花粉から花粉管がのびて、胚珠に花粉の中身を届けます。"}, {"id": "B003", "u": "花と受粉", "lv": "基礎", "r": 82, "f": "知識", "q": "受粉したあと、子房と胚珠はそれぞれ何になりますか。", "c": ["子房は果実(実)、胚珠は種子になる", "子房は種子、胚珠は果実になる", "どちらも種子になる", "どちらも果実になる"], "e": "このように花を咲かせて種子を作る植物を種子植物といいます。"}, {"id": "B004", "u": "花と受粉", "lv": "標準", "r": 62, "f": "知識", "q": "めしべの各部分の名前を、先のほうから順に並べたものはどれですか。", "c": ["柱頭→花柱→子房(中に胚珠)", "子房→花柱→柱頭", "花柱→柱頭→子房", "やく→花糸→子房"], "e": "柱頭はねばりけがあって花粉がつきやすくなっています。やくと花糸はおしべの部分です。"}, {"id": "B005", "u": "花と受粉", "lv": "標準", "r": 62, "f": "知識", "q": "アブラナの花のつくりとして正しいものはどれですか。", "c": ["がく4枚・花びら4枚・おしべ6本(長い4本と短い2本)・めしべ1本", "がく5枚・花びら5枚・おしべ5本・めしべ1本", "がく4枚・花びら4枚・おしべ4本・めしべ2本", "がくがなく、花びら6枚・おしべ6本"], "e": "おしべの根元には、みつを出すみつせんがあります。"}, {"id": "B006", "u": "花と受粉", "lv": "標準", "r": 60, "f": "知識", "q": "同じ種類のほかの花の柱頭に花粉がつくことを何といいますか。", "c": ["他家受粉", "自家受粉", "風媒", "単性花"], "e": "虫・風・鳥などに運ばれて行われます。1つの花(株)の中で受粉することは自家受粉といいます。"}, {"id": "B007", "u": "花と受粉", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "アサガオが自家受粉するのはいつですか。", "c": ["花が開くとき(つぼみのときは短かったおしべがのびて、やくが柱頭にふれる)", "つぼみの間", "開花してしばらくあと", "花がしぼむとき"], "e": "自家受粉を行うものには、イネやエンドウもあります。"}, {"id": "B008", "u": "花と受粉", "lv": "標準", "r": 62, "f": "知識", "q": "昆虫によって花粉が運ばれる花(虫媒花)の特ちょうとして、ふさわしくないものはどれですか。", "c": ["小さくて軽い花粉をたくさん作る", "目立つ花びらがある", "においやみつを出す", "花粉にとげやねばり気がある"], "e": "小さくて軽い花粉を大量に作るのは風媒花の特ちょうです。"}, {"id": "B009", "u": "花と受粉", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "風媒花の組み合わせとして正しいものはどれですか。", "c": ["マツ・スギ・トウモロコシ・イネ", "アブラナ・ヒマワリ・アサガオ", "ツバキ・ビワ・サザンカ", "タンポポ・ユリ・カボチャ"], "e": "風媒花は目立つ花びらやにおい、みつがありません。花粉症の原因となるものも多いです。"}, {"id": "B010", "u": "花と受粉", "lv": "標準", "r": 62, "f": "知識", "q": "マツの花粉についている、風で飛びやすくするためのつくりを何といいますか。", "c": ["空気袋", "とげ", "ねばり気", "綿毛"], "e": "カボチャやヒマワリの花粉にはとげがあり、昆虫のからだにつきやすくなっています。"}, {"id": "B011", "u": "花と受粉", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "鳥(メジロなど)によって花粉が運ばれることのある植物の組み合わせとして正しいものはどれですか。", "c": ["ツバキ・ビワ", "タンポポ・アブラナ", "スギ・マツ", "ユリ・カボチャ"], "e": "昆虫がほとんど活動しない冬に花を咲かせるツバキ・サザンカ・ビワなどは、鳥が花粉を運ぶ鳥媒花です。"}, {"id": "B012", "u": "花と受粉", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "花粉の形を観察しました。昆虫に運ばれる花粉の組み合わせとして正しいものはどれですか。", "c": ["ツツジ・ユリ・カボチャ", "マツ・スギ・トウモロコシ", "ツツジ・マツ・スギ", "ユリ・トウモロコシ・スギ"], "e": "ツツジの花粉は糸のようなものでつながり、ユリの花粉はねばり気があり、カボチャの花粉にはとげがあります。"}, {"id": "B013", "u": "花と受粉", "lv": "標準", "r": 62, "f": "知識", "q": "花の4要素がすべてそろっている花を何といいますか。", "c": ["完全花", "不完全花", "両性花", "単性花"], "e": "1つでも欠けている花を不完全花といいます。"}, {"id": "B014", "u": "花と受粉", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "花びらやがくがない不完全花の組み合わせとして正しいものはどれですか。", "c": ["イネ・トウモロコシ・マツ", "サクラ・アブラナ・エンドウ", "アサガオ・ツツジ・タンポポ", "サクラ・イネ・アサガオ"], "e": "イネの花には花びらとがくがありません。サクラやアブラナ、アサガオは完全花です。"}, {"id": "B015", "u": "花と受粉", "lv": "標準", "r": 62, "f": "知識", "q": "1つの花の中におしべとめしべの両方がある花を何といいますか。", "c": ["両性花", "単性花", "完全花", "合弁花"], "e": "おしべかめしべの一方だけがあり、お花とめ花に分かれている花を単性花といいます。"}, {"id": "B016", "u": "花と受粉", "lv": "応用", "r": 50, "f": "まちがい探し", "q": "単性花(お花とめ花に分かれている花)の組み合わせとして正しいものはどれですか。", "c": ["ヘチマ・トウモロコシ・マツ", "サクラ・アブラナ・アサガオ", "ヘチマ・サクラ・タンポポ", "マツ・アサガオ・エンドウ"], "e": "ウリ科の植物(ヘチマ・カボチャ・キュウリ・ツルレイシ)のほか、マツ・スギ・イチョウ・トウモロコシ・カキ・クリなども単性花です。"}, {"id": "B017", "u": "花と受粉", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "花びらがつながっている合弁花の組み合わせとして正しいものはどれですか。", "c": ["アサガオ・タンポポ・ツツジ", "エンドウ・サクラ・アブラナ", "アサガオ・サクラ・ツツジ", "タンポポ・エンドウ・アブラナ"], "e": "花びらが1枚1枚離れているものは離弁花といいます。"}, {"id": "B018", "u": "花と受粉", "lv": "応用", "r": 48, "f": "知識", "q": "トウモロコシのお花とめ花のつき方として正しいものはどれですか。", "c": ["お花は茎の先(上)、め花は葉のつけ根につく", "お花は葉のつけ根、め花は茎の先につく", "お花もめ花も茎の先につく", "1つの花におしべとめしべがある"], "e": "め花から長くのびているひげのようなものはめしべの花柱と柱頭で、風で飛んできた花粉を受けとります。"}, {"id": "B019", "u": "花と受粉", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "トウモロコシのお花が上、め花が下についていることの利点として最もふさわしいものはどれですか。", "c": ["花粉がほかの株のめ花に落ちたり風で運ばれたりしやすく、ほかの株と受粉しやすい", "花粉が雨にぬれないようにするため", "昆虫に見つかりやすくするため", "自分の花粉だけで受粉するため"], "e": "上から花粉を飛ばし、下のめ花が受けとるつくりになっています。"}, {"id": "B020", "u": "花と受粉", "lv": "基礎", "r": 80, "f": "知識", "q": "胚珠が子房につつまれている植物を何といいますか。", "c": ["被子植物", "裸子植物", "単性花", "不完全花"], "e": "被子植物は受粉すると子房が果実に、胚珠が種子になります。"}, {"id": "B021", "u": "花と受粉", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "子房がなく、胚珠がむき出しになっている裸子植物の組み合わせとして正しいものはどれですか。", "c": ["マツ・イチョウ・スギ", "サクラ・エンドウ・アサガオ", "マツ・サクラ・アブラナ", "イチョウ・アサガオ・エンドウ"], "e": "裸子植物の花はすべてお花とめ花に分かれ、花びらもがくもありません。子房がないため果実はできません。"}, {"id": "B022", "u": "花と受粉", "lv": "応用", "r": 46, "f": "知識", "q": "マツのめ花が受粉したあとの説明として正しいものはどれですか。", "c": ["受粉の翌年に大きくなり、2年後にマツカサになって、胚珠が羽のついた種子になる", "受粉した年に赤い果実ができる", "受粉するとすぐに子房が果実になる", "花びらが落ちて綿毛になる"], "e": "種子の羽は、種子を遠くに飛ばすのに役立ちます。"}, {"id": "B023", "u": "花と受粉", "lv": "標準", "r": 58, "f": "知識", "q": "アブラナのつぼみ・花・実のつき方として正しいものはどれですか。", "c": ["茎の先のほうにつぼみがあり、下にいくほど花、そして実(さや)がついている", "茎の下のほうにつぼみがあり、上にいくほど実がつく", "つぼみ・花・実がばらばらにつく", "花が全部咲いてから一度に実になる"], "e": "花は下から順に咲いていくので、下のほうほど早く実になります。子房の中の多くの胚珠の数だけ種子ができます。"}, {"id": "B024", "u": "花と受粉", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "アサガオの花が受粉したあとの変化として正しい順番はどれですか。", "c": ["花が咲く→花がしぼみ子房がふくらむ→がくに包まれた実が大きくなる→実が茶色く熟す", "実が熟す→花が咲く→子房がふくらむ", "つぼみ→実が熟す→花が咲く", "花がしぼむ→花が咲く→実ができる"], "e": "アサガオの果実は3つの部屋に分かれ、ふつう6つの種子があります。"}, {"id": "B025", "u": "花と受粉", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "タンポポの綿毛は、花のどの部分が変化したものですか。", "c": ["がく(冠毛)", "花びら", "おしべ", "めしべ"], "e": "タンポポのたねは、正確には子房が変化した果実で、その中に種子があります。がくが変化した綿毛で風に乗って飛びます。"}, {"id": "B026", "u": "花と受粉", "lv": "応用", "r": 46, "f": "まちがい探し", "q": "タンポポのように、たね(果実)が種子をつつんでいるものはどれですか。", "c": ["イチゴのつぶつぶ", "リンゴの種", "メロンの種", "インゲンマメの豆"], "e": "イチゴの表面のつぶつぶ1つ1つが果実で、中に種子があります。私たちが食べる赤い部分は花たくがふくらんだものです。"}, {"id": "B027", "u": "花と受粉", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "タンポポの花のつくりは、どのようになっていますか。", "c": ["小さな花がたくさん集まり、1つの花のように見えている", "1つの大きな花に花びらがたくさんある", "花びらのない花が1つある", "おしべとめしべのない花が集まっている"], "e": "1つ1つの小さな花に、花びら5枚(つながっている)・おしべ5本・めしべ1本があります。"}, {"id": "B028", "u": "花と受粉", "lv": "標準", "r": 58, "f": "知識", "q": "タンポポやチューリップの花は1日のうちで開いたり閉じたりします。花が開閉するきっかけの組み合わせとして正しいものはどれですか。", "c": ["タンポポは明るさの変化、チューリップは温度の変化", "タンポポは温度、チューリップは明るさの変化", "どちらも雨", "どちらも音"], "e": "花が開く前のタンポポに箱をかぶせて暗いままにすると、花は開きません。"}, {"id": "B029", "u": "花と受粉", "lv": "標準", "r": 60, "f": "知識", "q": "スミレの種子をアリが巣に運ぶのはなぜですか。", "c": ["種子にアリが好むえさとなる物質(エライオソーム)がついているから", "アリが種子を食べて育てるから", "種子がアリを食べるから", "種子がアリの巣を作るから"], "e": "アリは好物の部分だけを食べ、残りの種子を巣の外に捨てます。スミレはアリの力で生息範囲を広げています。"}, {"id": "B030", "u": "花と受粉", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "ミツバチが花から花へと飛びまわるとき、何をしていますか。", "c": ["花のみつや花粉を集め、同時に花粉を運んで受粉を助けている", "花の葉を食べている", "花に卵を産んでいる", "花の水を吸っている"], "e": "植物は花粉を運んでもらい、昆虫はえさを得るという共生関係にあります。"}, {"id": "B031", "u": "花と受粉", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ビニルハウスでイチゴを育てるとき、花の咲く時期にミツバチを放すのはなぜですか。", "c": ["ハウスの中には花粉を運ぶ昆虫が少ないので、ミツバチに受粉させて実をならせるため", "ミツバチにイチゴの葉を食べさせるため", "ハウスの温度を上げるため", "害虫を追いはらうため"], "e": "ミツバチを使わない場合は、人が筆などで花粉をつける必要があり、手間がかかります。"}, {"id": "B032", "u": "花と受粉", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ツツジの花粉が粉状ではなく、糸のようなものでつながっていることの利点として最もふさわしいものはどれですか。", "c": ["昆虫のからだに一度にたくさんの花粉がつき、まとめて運んでもらえる", "風で遠くまで飛ぶ", "雨で流れにくくなる", "花粉が乾燥しにくくなる"], "e": "マルハナバチのように隣の花へ移動するのではなく、アゲハのように遠くの株まで飛ぶ昆虫に花粉を運んでもらうと、ほかの株と受粉しやすくなります。"}, {"id": "B033", "u": "花と受粉", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "マルハナバチの足についていた白い団子状のかたまりは何で、何に使われますか。", "c": ["花粉を丸めたもので、巣に運んで幼虫のえさにする", "みつを固めたもので、巣の材料にする", "ろうで、巣を作るのに使う", "卵で、巣で育てる"], "e": "ミツバチの後ろあしの花粉団子も同じです。"}, {"id": "B034", "u": "花と受粉", "lv": "標準", "r": 62, "f": "知識", "q": "ミツバチのはたらきバチについて正しいものはどれですか。", "c": ["すべてメスで、えさを集めたり、卵・幼虫・さなぎの世話をしたりする", "すべてオスで、卵を産む", "オスとメスが半分ずつ", "1つの巣に1匹だけいる"], "e": "卵を産むのは1つの巣に1匹だけいる女王バチです。ミツバチのように役割を決めて集団で生活する昆虫を社会性昆虫といいます。"}, {"id": "B035", "u": "花と受粉", "lv": "標準", "r": 60, "f": "知識", "q": "ミツバチの巣のように、正六角形がぴったり重なった形のつくりを何といいますか。", "c": ["ハニカム構造", "ピラミッド構造", "らせん構造", "アーチ構造"], "e": "非常に丈夫で、少ない材料で効率よく作れるつくりです。"}, {"id": "B036", "u": "花と受粉", "lv": "標準", "r": 58, "f": "知識", "q": "ハチミツはどのようにしてできますか。", "c": ["はたらきバチが持ち帰った花のみつを集めて、水分を蒸発させて濃くしたもの", "花のみつをそのまま集めたもの", "花粉を水に溶かしたもの", "女王バチが作り出すもの"], "e": "ハチミツは単に花のみつを集めたものではありません。"}, {"id": "B037", "u": "花と受粉", "lv": "標準", "r": 58, "f": "知識", "q": "カキやクリの花の説明として正しいものはどれですか。", "c": ["めしべのないお花と、おしべのないめ花の2種類の花を咲かせる", "1つの花におしべとめしべがある", "花が咲かない", "花びらがなく風で受粉するだけの両性花"], "e": "カキはカキノキ科、クリはブナ科で、どちらも単性花です。"}, {"id": "B038", "u": "花と受粉", "lv": "標準", "r": 58, "f": "知識", "q": "ミョウガで主に食べている部分はどこですか。", "c": ["花(つぼみ)", "根", "葉", "種子"], "e": "ミョウガはショウガ科で、旬は夏〜秋です。ウメはバラ科で、2〜4月ごろに花が咲き、6月ごろに実がなります。"}, {"id": "B039", "u": "花と受粉", "lv": "標準", "r": 58, "f": "知識", "q": "ネムノキの説明として正しいものはどれですか。", "c": ["マメ科で、夜になると葉が閉じて眠ったように見える", "キク科で、夜に花が咲く", "ブナ科で、秋に葉が茶色になる", "バラ科で、春に実がなる"], "e": "ネムノキは成虫で冬越しをするキチョウの幼虫の食草です。"}, {"id": "B040", "u": "花と受粉", "lv": "応用", "r": 48, "f": "知識", "q": "地球について正しいものはどれですか。", "c": ["水星・金星に次いで太陽から3番目に近い惑星で、衛星の月をもつ", "太陽のまわりを回る恒星", "太陽から最も近い惑星", "月のまわりを回る衛星"], "e": "太陽からの距離は約1億5000万kmで、光の速さで約500秒かかります。"}, {"id": "B041", "u": "花と受粉", "lv": "標準", "r": 62, "f": "知識", "q": "ろ過で、ろ紙を入れて使う実験器具は何ですか。", "c": ["ろうと", "ビーカー", "ガラス棒", "ろうと台"], "e": "ろうとの先のとがった方をビーカーの内側につけます。液はガラス棒に伝わらせて注ぎます。"}, {"id": "J001", "u": "種子と発芽", "lv": "基礎", "r": 84, "f": "知識", "q": "発芽したときに子葉が2枚出る植物を何といいますか。", "c": ["双子葉植物", "単子葉植物", "裸子植物", "有胚乳植物"], "e": "アサガオ・アブラナ・ヘチマ・インゲンマメなどが双子葉植物です。子葉が1枚の植物は単子葉植物といいます。"}, {"id": "J002", "u": "種子と発芽", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "単子葉植物の組み合わせとして正しいものはどれですか。", "c": ["イネ・トウモロコシ", "アサガオ・アブラナ", "マツ・スギ", "イネ・アサガオ"], "e": "イネ・トウモロコシ・ムギ・ツユクサ・ユリなどが単子葉植物です。マツやスギは子葉が3枚以上の裸子植物です。"}, {"id": "J003", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "発芽したあと、子葉が地上に出ずに地中に残る植物の組み合わせとして正しいものはどれですか。", "c": ["エンドウ・ソラマメ・アズキ", "インゲンマメ・アサガオ・ヘチマ", "ダイズ・アブラナ・ヒマワリ", "エンドウ・インゲンマメ・アサガオ"], "e": "クリも子葉が地中に残ります。インゲンマメやダイズは子葉が地上に出ます。"}, {"id": "J004", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "知識", "q": "マツの発芽のようすとして正しいものはどれですか。", "c": ["子葉が3枚以上出る", "子葉が1枚出る", "子葉が2枚出る", "子葉が出ない"], "e": "マツやスギは双子葉植物とも単子葉植物ともちがう発芽をし、種子は胚乳のある有胚乳種子です。"}, {"id": "J005", "u": "種子と発芽", "lv": "標準", "r": 60, "f": "知識", "q": "イネの種子の発芽のようすとして正しいものはどれですか。", "c": ["子葉が1枚出て、胚乳は地中に残る", "子葉が2枚出て、胚乳は地上に出る", "子葉が2枚出て、地中に残る", "子葉が出ずに根だけがのびる"], "e": "イネやトウモロコシは発芽しても胚乳が地中に残ります。"}, {"id": "J006", "u": "種子と発芽", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "イネを水の中で発芽させると、子葉と根のどちらが先に出ますか。", "c": ["子葉が先に出る", "根が先に出る", "同時に出る", "水の中では発芽しない"], "e": "インゲンマメなど多くの種子は根が先に出ますが、水中で発芽させたイネは子葉(芽)が先に出ます。"}, {"id": "J007", "u": "種子と発芽", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "イネの種子にヨウ素液をつけ、発芽してから成長するまでを観察しました。青紫色になる部分はどのように変化しますか。", "c": ["胚乳のでんぷんが使われて、青紫色になる部分がだんだん小さくなる", "青紫色になる部分がだんだん大きくなる", "最初から最後まで変わらない", "根の部分が青紫色になる"], "e": "胚乳にたくわえられたでんぷんが、発芽や成長とともに使われて減っていきます。"}, {"id": "J008", "u": "種子と発芽", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "有胚乳種子の組み合わせとして正しいものはどれですか。", "c": ["イネ・カキ・トウモロコシ・オシロイバナ", "インゲンマメ・ヒマワリ・アサガオ", "イネ・インゲンマメ・ヒマワリ", "カキ・ダイズ・アブラナ"], "e": "単子葉植物と一部の双子葉植物(カキ・オシロイバナなど)が有胚乳種子です。双子葉植物のほとんどは無胚乳種子です。"}, {"id": "J009", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "カキ・インゲンマメ・イネの種子の断面図で、胚乳の部分だけをすべて選ぶとき、ふくまれないものはどれですか。", "c": ["インゲンマメの大きな子葉", "カキの白くて大きな部分", "イネの大部分をしめるところ", "カキの種子の子葉以外のやわらかい部分"], "e": "インゲンマメには胚乳がなく、大きな子葉に養分をたくわえています。子葉を胚乳とまちがえないようにしましょう。"}, {"id": "J010", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "知識", "q": "カキの種子で、発芽後に植物のからだになる部分の組み合わせとして正しいものはどれですか。", "c": ["子葉・胚軸・幼根(胚)", "胚乳・種皮", "胚乳・子葉", "種皮・幼根"], "e": "胚は発芽して植物のからだになる部分で、胚乳は養分をたくわえる部分です。"}, {"id": "J011", "u": "種子と発芽", "lv": "標準", "r": 58, "f": "知識", "q": "インゲンマメの種子で、発芽して「ふたば」になる部分はどれですか。", "c": ["子葉", "幼芽", "胚軸", "幼根"], "e": "幼芽は本葉、胚軸は茎、幼根は根になります。"}, {"id": "J012", "u": "種子と発芽", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "次のうち、イネの種子と同じく有胚乳種子のつくりをしているものはどれですか。", "c": ["トウモロコシ", "エンドウ", "ヘチマ", "インゲンマメ"], "e": "トウモロコシは胚乳に養分をたくわえています。エンドウ・ヘチマ・インゲンマメは子葉に養分をたくわえる無胚乳種子です。"}, {"id": "J013", "u": "種子と発芽", "lv": "標準", "r": 62, "f": "知識", "q": "三大栄養素の組み合わせとして正しいものはどれですか。", "c": ["でんぷん(炭水化物)・たんぱく質・脂肪", "でんぷん・水・二酸化炭素", "ビタミン・ミネラル・水", "たんぱく質・酸素・脂肪"], "e": "イネ・ムギ・トウモロコシにはでんぷん、ダイズにはたんぱく質、ゴマには脂肪が多く含まれています。"}, {"id": "J014", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "イネ・ダイズ・インゲンマメの種子に含まれる栄養素の量を円グラフにしました。でんぷんがとても多く、脂肪とたんぱく質が少ないのはどれですか。", "c": ["イネ", "ダイズ", "インゲンマメ", "どれも同じ"], "e": "ダイズはたんぱく質と脂肪が多く、インゲンマメはでんぷんとたんぱく質が多い種子です。"}, {"id": "J015", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "次の食品のうち、ダイズを原料にしていないものはどれですか。", "c": ["パン", "とうふ", "納豆", "みそ"], "e": "パンやパスタはコムギ、もちやせんべいはイネ(もち米・うるち米)、あんやようかんはアズキが原料です。"}, {"id": "J016", "u": "種子と発芽", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "アズキを原料にしている食品の組み合わせとして正しいものはどれですか。", "c": ["あん・ようかん", "もち・せんべい", "パン・パスタ", "とうふ・納豆"], "e": "ダイズのしぼりかすの「おから」や、豆乳・しょうゆもダイズからつくられます。"}, {"id": "J017", "u": "種子と発芽", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "かわいた土の上にダイズの種子を置いた実験(ともくんの実験)だけでは、「発芽には水が必要」とはいえません。その理由として正しいものはどれですか。", "c": ["水がある場合と比べていないから", "土を使っているから", "ダイズの数が少ないから", "明るい部屋で行ったから"], "e": "水以外の条件を同じにして、水がある場合と水がない場合を比べる必要があります(比較対照実験)。"}, {"id": "J018", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "種子1個だけで発芽の実験をすると正しく調べられないことがあるのはなぜですか。", "c": ["その種子がもともと発芽しない悪い種子かもしれないから", "種子1個では水を吸わないから", "種子1個では光が当たらないから", "種子1個では呼吸できないから"], "e": "たくさんの種子を使うと、たまたま発芽しない種子があっても結果を正しく判断できます。"}, {"id": "J019", "u": "種子と発芽", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "発芽の実験で、湯ざましの水を使うのはなぜですか。", "c": ["水にとけている空気をできるだけぬくため", "水を温めるため", "水をきれいにするため", "水を冷やすため"], "e": "湯ざましの水の中は空気がほとんどないので、水の中に沈めた種子は空気がない状態になります。"}, {"id": "J020", "u": "種子と発芽", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "発芽に肥料が必要かを調べるには、どの実験とどの実験を比べればよいですか。\nA:肥料をとかした水でしめらせた脱脂綿・明るい\nC:水でしめらせた脱脂綿・明るい\nD:水でしめらせた脱脂綿・暗い", "c": ["AとC", "AとD", "CとD", "A・C・Dすべて"], "e": "肥料の有無以外の条件が同じAとCを比べます。どちらも発芽すれば、発芽に肥料は必要ないことが分かります。"}, {"id": "J021", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "発芽に適当な温度が必要かを調べるとき、冷ぞう庫の中(5℃・暗い)の種子と比べる実験として最もふさわしいものはどれですか。", "c": ["25℃で、箱をかぶせて暗くした水でしめらせた脱脂綿の種子", "25℃で、明るい所に置いた水でしめらせた脱脂綿の種子", "25℃で、かわいた脱脂綿の種子", "5℃で、明るい所に置いた水でしめらせた脱脂綿の種子"], "e": "冷ぞう庫の中は暗いので、比べる方も暗くして、温度だけがちがうようにします。"}, {"id": "J022", "u": "種子と発芽", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "肥料をとかした25℃の水をビーカーいっぱいに入れて中に種子を置き、エアポンプで空気を送りました。この種子は発芽しますか。", "c": ["発芽する(水・空気・適当な温度がそろっているから)", "発芽しない(水の中だから)", "発芽しない(肥料があるから)", "どちらともいえない"], "e": "エアポンプで空気を送っているので、発芽の3条件がそろっています。"}, {"id": "J023", "u": "種子と発芽", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "肥料をとかした水でしめらせた脱脂綿の上に種子を置き、10℃の明るい場所に置きました。発芽するかどうか、これまでの5℃と25℃の実験の結果から判断するとどうなりますか。", "c": ["どちらともいえない(10℃が発芽に適当な温度か分からないから)", "必ず発芽する", "必ず発芽しない", "肥料があるので発芽する"], "e": "5℃では発芽せず25℃では発芽しましたが、その間の10℃がどうなるかは、この実験からは分かりません。"}, {"id": "J024", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "発芽したインゲンマメを暗い箱の中で育てると、よく育ちませんでした。よく育てるために必要なことの組み合わせとして正しいものはどれですか。", "c": ["箱を取って光を当てる・肥料をあたえる", "箱を二重にする・熱湯をしみこませる", "ビニール袋で包む・水だけにする", "箱を二重にする・光を当てない"], "e": "発芽には光や肥料は必要ありませんが、成長するには光と肥料が必要です。"}, {"id": "J025", "u": "種子と発芽", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "真空パックにして空気をぬいたダイズは、発芽しないので長持ちします。このダイズを発芽させるにはどうすればよいですか。", "c": ["袋から出して、水でしめらせた脱脂綿の上に置き、適当な温度にする", "真空パックのまま冷蔵庫に入れる", "真空パックのまま日光に当てる", "乾燥させて保存する"], "e": "発芽の3条件(水・空気・適当な温度)をそろえれば発芽します。"}, {"id": "J026", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "お店の種子のパッケージで、種子が発芽しないように工夫されている点の組み合わせとして正しいものはどれですか。", "c": ["ぬれないつるつるの素材でできている・密閉してある", "白っぽい紙でできている・手でやぶれる", "うすい素材でできている・手でやぶれる", "白っぽい紙でできている・うすい素材"], "e": "水が入らないようにし、空気にふれないように密閉することで、発芽を防いでいます。"}, {"id": "J027", "u": "種子と発芽", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "レタスの種子は、水・空気・適当な温度がそろっていても、暗い箱の中では発芽しませんでした。このことから分かることはどれですか。", "c": ["レタスの発芽には光が必要である", "レタスの発芽には光は必要ない", "レタスの発芽には肥料が必要である", "レタスは空気がなくても発芽する"], "e": "インゲンマメの発芽には光は必要ありませんが、レタスのように光がないと発芽しない種子もあります。"}, {"id": "J028", "u": "種子と発芽", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "レタスの種子をまくとき、土に深くうめないように注意するのはなぜですか。", "c": ["レタスの種子は小さく養分が少ないので、光が届く浅いところで発芽して、すぐに光合成を始める必要があるから", "深くうめると水を吸いすぎるから", "深くうめると温度が高くなりすぎるから", "浅いほうが虫に食べられないから"], "e": "種子が小さいほど、発芽後すぐに光合成で養分をつくらないと成長できません。"}, {"id": "J029", "u": "種子と発芽", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "リンゴの種子は、最低1か月ほど冷蔵庫など低温の場所に置かないと発芽しにくいそうです。この特ちょうはどのような点で役立ちますか。", "c": ["寒い冬を種ですごして、春が来てから発芽できる", "季節に関係なく発芽できる", "気温が高い夏から秋のうちに芽を出せる", "雪が残っている間にいちはやく芽を出せる"], "e": "秋にできた種子がすぐに発芽すると、冬の寒さで枯れてしまうおそれがあります。"}, {"id": "J030", "u": "種子と発芽", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "風によって種子を遠くに運ぶ植物の組み合わせとして正しいものはどれですか。", "c": ["タンポポ・ススキ・カエデ・マツ", "オナモミ・センダングサ・ヌスビト", "ホウセンカ・カタバミ・スミレ", "カキ・サクラ・ナンテン"], "e": "オナモミなどは動物の毛について、ホウセンカなどははじけて、カキなどは鳥に食べられて種子を散布します。"}, {"id": "J031", "u": "種子と発芽", "lv": "標準", "r": 62, "f": "知識", "q": "梅雨の説明として正しいものはどれですか。", "c": ["6〜7月ごろ、南のあたたかく湿った気団と北の冷たく湿った気団がぶつかって梅雨前線ができ、長雨になる", "冬に北西の季節風がふいて雪が降る", "秋に台風が来て大雨が降る", "春に南から強い風がふく"], "e": "南は小笠原気団、北はオホーツク海気団です。"}, {"id": "J032", "u": "種子と発芽", "lv": "標準", "r": 60, "f": "知識", "q": "火星について正しいものはどれですか。", "c": ["地球のすぐ外側を公転する惑星で、表土に鉄の赤さびが多く含まれるため赤く見える", "地球のすぐ内側を公転する惑星", "地球のまわりを回る衛星", "表面が青い海でおおわれている"], "e": "火星の大気は主に二酸化炭素で、極地には氷やドライアイスでできた極冠が見られます。"}, {"id": "J033", "u": "種子と発芽", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "軟体動物ではないものはどれですか。", "c": ["ダンゴムシ", "カタツムリ", "サザエ", "タコ"], "e": "イカ・タコ・貝の仲間・ナメクジなどは骨格のない軟体動物です。ダンゴムシはエビやカニの仲間(甲殻類)です。"}, {"id": "J034", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "貝の仲間の組み合わせとして正しいものはどれですか。", "c": ["サザエ・カタツムリ", "ダンゴムシ・ヤドカリ", "サザエ・ヤドカリ", "カタツムリ・ダンゴムシ"], "e": "カタツムリは陸で生活する貝の仲間です。ヤドカリはエビやカニの仲間で、貝殻を借りてすんでいます。"}, {"id": "J035", "u": "種子と発芽", "lv": "標準", "r": 58, "f": "知識", "q": "ナメクジに食塩をかけると縮んでしまうのはなぜですか。", "c": ["からだのほとんどをしめる水分が、食塩にうばわれるから", "食塩でとけてなくなるから", "食塩で冷やされるから", "食塩がからだの中に入るから"], "e": "ナメクジは殻が見えない陸の貝の仲間です。"}, {"id": "J036", "u": "種子と発芽", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "単子葉植物の組み合わせとして正しいものはどれですか。", "c": ["ツユクサ・ヤマユリ", "アジサイ・カタバミ", "ハス・アジサイ", "ツユクサ・カタバミ"], "e": "ツユクサは花びらが3枚(青2枚・白1枚)、ヤマユリは花びらのようながく3枚と花びら3枚があります。"}, {"id": "J037", "u": "種子と発芽", "lv": "標準", "r": 58, "f": "知識", "q": "葉も花も光によって開閉し、種子がホウセンカのようにはじけ飛ぶ植物はどれですか。", "c": ["カタバミ", "ツユクサ", "アジサイ", "ハス"], "e": "カタバミはヤマトシジミの幼虫の食草でもあります。"}, {"id": "J038", "u": "種子と発芽", "lv": "標準", "r": 58, "f": "知識", "q": "アジサイで、花びらのように見える部分は何が変形したものですか。", "c": ["がく", "花びら", "おしべ", "葉"], "e": "アジサイの本当の花びらは小さく、花の中央にあります。"}, {"id": "J039", "u": "種子と発芽", "lv": "応用", "r": 48, "f": "知識", "q": "オシロイバナの花と種子について正しいものはどれですか。", "c": ["午後4時ごろに花が咲き、黒い種子の中には白い粉のような胚乳がある", "朝に花が咲き、種子に子葉が多い", "夜に咲き、種子は赤い", "昼に咲き、種子には養分がない"], "e": "オシロイバナは、双子葉植物ですが有胚乳種子です。"}, {"id": "J040", "u": "種子と発芽", "lv": "標準", "r": 58, "f": "知識", "q": "ツルレイシ(ゴーヤー)について正しいものはどれですか。", "c": ["ウリ科で、つるをほかの物に巻きつけながら成長するため、緑のカーテンに利用される", "マメ科で、根粒菌がある", "キク科で、綿毛で種子を飛ばす", "アブラナ科で、つぼみを食べる"], "e": "未熟な緑の実を食用にします。熟すと黄色になり、中の種子は赤く見えます。"}, {"id": "Z001", "u": "生き物のふえ方", "lv": "基礎", "r": 84, "f": "知識", "q": "ジャガイモで主に食べている部分はどこですか。", "c": ["地下の茎(地下茎)がふくらんだもの", "根がふくらんだもの", "葉が重なったもの", "種子"], "e": "サツマイモは根、タマネギは葉(りん葉)がふくらんだものを食べています。"}, {"id": "Z002", "u": "生き物のふえ方", "lv": "基礎", "r": 82, "f": "知識", "q": "タマネギで主に食べている部分はどこですか。", "c": ["葉", "根", "茎", "花"], "e": "タマネギは、養分をたくわえた厚い葉が重なっています。ネギやキャベツ、ハクサイ、ホウレンソウも葉を食べています。"}, {"id": "Z003", "u": "生き物のふえ方", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "主に花やつぼみを食べている野菜の組み合わせとして正しいものはどれですか。", "c": ["ブロッコリー・カリフラワー・ミョウガ", "キャベツ・ネギ・タマネギ", "ゴボウ・ニンジン・ダイコン", "ジャガイモ・タケノコ・レンコン"], "e": "ゴボウ・ニンジン・ダイコン・サツマイモは根、ジャガイモ・タケノコ・レンコンは茎を食べています。"}, {"id": "Z004", "u": "生き物のふえ方", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "主に茎を食べている野菜の組み合わせとして正しいものはどれですか。", "c": ["ジャガイモ・タケノコ・レンコン・アスパラガス", "サツマイモ・ニンジン・ゴボウ", "ホウレンソウ・キャベツ・ネギ", "ナス・カボチャ・トウモロコシ"], "e": "レンコンはハスの地下茎、タケノコはタケの若い茎です。"}, {"id": "Z005", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "主に根を食べている野菜の組み合わせとして正しいものはどれですか。", "c": ["サツマイモ・ニンジン・ダイコン", "ジャガイモ・サトイモ・レンコン", "タマネギ・ネギ・ニンニク", "ジャガイモ・サツマイモ・タマネギ"], "e": "サトイモはジャガイモと同じく地下の茎を食べています。"}, {"id": "Z006", "u": "生き物のふえ方", "lv": "標準", "r": 60, "f": "知識", "q": "枝豆は、どの植物のどの部分を食べていますか。", "c": ["ダイズの未熟な種子", "ダイズの熟した果実", "インゲンマメの葉", "エンドウの根"], "e": "熟した種子はみそ・とうふ・納豆の原料になります。枝豆のさやは果実です。"}, {"id": "Z007", "u": "生き物のふえ方", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "主に果実を食べている野菜の組み合わせとして正しいものはどれですか。", "c": ["ナス・カボチャ・ピーマン", "トウモロコシ・ダイズ・ナス", "キャベツ・ナス・カボチャ", "ダイコン・ピーマン・ナス"], "e": "トウモロコシやダイズは種子を食べています。ナスやカボチャは果実と、その中の種子もいっしょに食べています。"}, {"id": "Z008", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "知識", "q": "リンゴやイチゴで、主に食べている部分はどこですか。", "c": ["花床(花たく)がふくらんでできた部分(偽果)", "子房がふくらんでできた真果", "種子", "がく"], "e": "ウメやモモは子房がふくらんでできた果実(真果)を食べています。"}, {"id": "Z009", "u": "生き物のふえ方", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "ウメ・モモ・リンゴ・イチゴは何科の植物ですか。", "c": ["バラ科", "ウリ科", "マメ科", "ミカン科"], "e": "サクラやビワもバラ科です。"}, {"id": "Z010", "u": "生き物のふえ方", "lv": "標準", "r": 62, "f": "知識", "q": "ジャガイモの子いものつき方として正しいものはどれですか。", "c": ["種いもからのびた地下の茎にできる", "根のとちゅうにできる", "根の先の方にできる", "地上の茎の先にできる"], "e": "サツマイモは根がふくらんでいもになるので、つき方がちがいます。"}, {"id": "Z011", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ジャガイモの芽と根はどこから出ますか。", "c": ["芽はくぼみから出て、根は芽のつけ根から出る", "芽も根もくぼみ以外から出る", "芽は根のつけ根から出る", "根はくぼみから、芽は根の先から出る"], "e": "種いもはくぼみ(芽)が2〜3個ずつになるように切ります。"}, {"id": "Z012", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "知識", "q": "ジャガイモを切ったときに出る白い汁にヨウ素液を加えると、どうなりますか。", "c": ["こい青紫色になる", "赤色になる", "白くにごる", "変化しない"], "e": "ジャガイモの養分はでんぷんです。けんび鏡で見ると、でんぷんのつぶが見えます。"}, {"id": "Z013", "u": "生き物のふえ方", "lv": "標準", "r": 60, "f": "知識", "q": "チューリップのように、地下の茎に養分をたくわえた葉が重なったもので仲間をふやす部分を何といいますか。", "c": ["球根", "種いも", "地下茎", "根こぶ"], "e": "ジャガイモやサツマイモは種いもを使って仲間をふやします。"}, {"id": "Z014", "u": "生き物のふえ方", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "風で種子が運ばれる植物の組み合わせとして正しいものはどれですか。", "c": ["タンポポ・ススキ・マツ・カエデ", "オナモミ・イノコヅチ・ヌスビトハギ", "ホウセンカ・カタバミ・スミレ", "ナンテン・ヤドリギ・カキ"], "e": "綿毛やはねのようなものがついていて、風で飛ばされます。"}, {"id": "Z015", "u": "生き物のふえ方", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "はじけて種子が飛ぶ植物の組み合わせとして正しいものはどれですか。", "c": ["ホウセンカ・カタバミ・スミレ", "タンポポ・ススキ", "オナモミ・ヌスビトハギ", "ナンテン・カキ"], "e": "果実が熟して形が変化したときのいきおいで、種子がはじけ飛びます。"}, {"id": "Z016", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "動物の毛などについて運ばれる種子の組み合わせとして正しいものはどれですか。", "c": ["オナモミ・ヌスビトハギ・イノコヅチ", "タンポポ・マツ", "ホウセンカ・カタバミ", "ナンテン・ヤドリギ"], "e": "とげやねばり気がついていて、動物の毛や人の服にくっつきます。"}, {"id": "Z017", "u": "生き物のふえ方", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "ナンテンやカキの種子は、主にどのように運ばれますか。", "c": ["果実が動物に食べられ、ふんとともに運ばれる", "風で飛ばされる", "はじけ飛ぶ", "水に流される"], "e": "ヤシの実(ココナッツ)のように、水に流されて運ばれる種子もあります。"}, {"id": "Z018", "u": "生き物のふえ方", "lv": "標準", "r": 62, "f": "知識", "q": "卵でふえる動物の組み合わせとして正しいものはどれですか。", "c": ["サケ・カメ・ミジンコ", "イルカ・ウサギ", "ゾウリムシ・ミドリムシ", "イルカ・カメ"], "e": "ミジンコは卵で仲間をふやします。イルカやウサギは子を産んでふえる動物です。"}, {"id": "Z019", "u": "生き物のふえ方", "lv": "標準", "r": 60, "f": "知識", "q": "ゾウリムシやミドリムシは、どのように仲間をふやしますか。", "c": ["1つのからだ(細胞)が2つに分かれてふえる", "卵を産んでふえる", "子を産んでふえる", "種子でふえる"], "e": "ミジンコは卵で仲間をふやします。"}, {"id": "Z020", "u": "生き物のふえ方", "lv": "標準", "r": 60, "f": "知識", "q": "ヒト・ネコ・クジラなどの哺乳類のふえ方として正しいものはどれですか。", "c": ["母親の胎内で子が育ち、産まれたあとはしばらく母親の乳で育つ", "卵を産み、親は世話をしない", "からだが2つに分かれてふえる", "卵を水草につける"], "e": "クジラやイルカは海にすむ哺乳類です。"}, {"id": "Z021", "u": "生き物のふえ方", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "ニワトリの卵で、ひなのからだになる部分はどこですか。", "c": ["胚(卵黄の上の小さな白い部分)", "卵黄", "卵白", "カラザ"], "e": "卵黄は胚が育つための養分で、カラザは卵黄を卵のまん中に支えるものです。"}, {"id": "Z022", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ニワトリの卵とイネの種子の共通点として正しいものはどれですか。", "c": ["からだになる部分(胚)と、養分をたくわえた部分(卵黄・胚乳)がある", "どちらも光合成をする", "どちらも種皮がある", "どちらも水の中で育つ"], "e": "イネの胚乳とニワトリの卵黄は、どちらも成長するための養分です。"}, {"id": "Z023", "u": "生き物のふえ方", "lv": "標準", "r": 58, "f": "知識", "q": "ニワトリの卵の殻の役割として正しいものはどれですか。", "c": ["卵の内部を乾燥などから守る", "ひなのえさになる", "卵を温める", "卵を水にうかせる"], "e": "炭酸カルシウムを含む固い殻でおおわれています。"}, {"id": "Z024", "u": "生き物のふえ方", "lv": "標準", "r": 58, "f": "知識", "q": "メダカの卵についている毛のようなものの役割として正しいものはどれですか。", "c": ["水草などにからみついて、卵を固定する", "卵を温める", "えさをとる", "泳ぐ"], "e": "メダカの卵の中では、油のつぶと卵黄の養分を使って子が育ちます。"}, {"id": "Z025", "u": "生き物のふえ方", "lv": "標準", "r": 62, "f": "知識", "q": "ビールやなっとうのように、生物のはたらきによって変化させてつくった食品を何といいますか。", "c": ["発酵食品", "加工食品", "冷凍食品", "保存食品"], "e": "みそやしょうゆ、ヨーグルトも発酵食品です。かまぼこやソーセージは発酵食品ではありません。"}, {"id": "Z026", "u": "生き物のふえ方", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "モンシロチョウがアブラナの花に来ることは、アブラナにとってどんな利点がありますか。", "c": ["からだに花粉がついて運ばれ、受粉できる", "葉を食べてもらえる", "花のみつが増える", "種子を食べてもらえる"], "e": "受粉するとめしべのもとが実になり、その中に種子ができます。"}, {"id": "Z027", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "幼虫が陸上で生活する昆虫の組み合わせとして正しいものはどれですか。", "c": ["ミツバチ・バッタ", "トンボ・ゲンジボタル", "カブトムシ・セミ", "トンボ・ミツバチ"], "e": "トンボとゲンジボタルの幼虫は水中、カブトムシとセミの幼虫は土の中で生活します。"}, {"id": "Z028", "u": "生き物のふえ方", "lv": "標準", "r": 62, "f": "知識", "q": "ゲンジボタルの幼虫は何を食べて育ちますか。", "c": ["カワニナなどの貝", "花のみつ", "木の葉", "ミジンコ"], "e": "成虫になると水分以外は何も食べません。卵→幼虫→さなぎ→成虫と成長し、すべての時期に発光します。"}, {"id": "Z029", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "アゲハとモンシロチョウの1年間の成長を調べると、冬は「さなぎ」で過ごしていました。分かることとして正しいものはどれですか。", "c": ["冬はえさとなる植物が少ないので、さなぎの姿で冬を越す", "成虫のまま冬を越す", "卵のまま冬を越す", "幼虫は土の中で冬を越す"], "e": "1年間に卵を産む回数は、モンシロチョウの方がアゲハより多くなっています。"}, {"id": "Z030", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "タラコ1腹(1匹のメスの2つの卵巣)に、約24万個の卵が入っていました。海の魚の多くが、このように非常にたくさんの卵を産むのはなぜですか。", "c": ["卵や子がほかの生き物に食べられやすいので、たくさん産んで子孫を残そうとしているから", "海は水温が低いから", "海の水が多いから", "卵がとても大きいから"], "e": "ブリは約180万個、メダカは500〜800個の卵を産みます。"}, {"id": "Z031", "u": "生き物のふえ方", "lv": "過去問型", "r": 36, "f": "計算", "q": "タラコ1つは平均40gで、0.5g中に約1500個の卵が入っていました。1匹のメスには2つのタラコ(卵巣)があります。1匹のメスが産む卵は約何万個ですか。", "c": ["約24万個", "約12万個", "約3000個", "約6万個"], "e": "40÷0.5×1500=12万個が1つ分です。2つあるので、12万×2=24万個です。"}, {"id": "Z032", "u": "生き物のふえ方", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "サケが大きな卵を産むことの利点として正しいものはどれですか。", "c": ["卵に養分が多いので、生まれてくる子が大きく、生き残りやすい", "卵が水にうきやすい", "卵がたくさん産める", "卵が海藻にくっつきやすい"], "e": "サケの産卵数は2000〜3000個と少ないかわりに、大きくて沈む卵を産みます。"}, {"id": "Z033", "u": "生き物のふえ方", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ヤドリギが冬に遠くからでもよく目立つのはなぜですか。", "c": ["ヤドリギは冬も緑の葉をつけているが、寄生している高木は葉を落としているから", "ヤドリギは冬に大きくなるから", "冬はヤドリギの花が咲くから", "高木が冬に枯れてしまうから"], "e": "ヤドリギは自分でも光合成をしますが、寄生根で高木から水や養分をもらっています。"}, {"id": "Z034", "u": "生き物のふえ方", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ヤドリギの果実が秋の終わりから冬にかけて熟すことの利点として最もふさわしいものはどれですか。", "c": ["鳥のえさが少ない時期なので、ヒレンジャクなどに食べられやすく、種子を運んでもらいやすい", "冬は気温が低く、果実が腐らない", "冬は風が強く、種子が飛ぶ", "冬は雨が多く、水で運ばれる"], "e": "種子は、生きている枝にとりついたものだけが成長できます。"}, {"id": "Z035", "u": "生き物のふえ方", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ヤドリギの種子が高木の高いところに散布されるために重要な特ちょうはどれですか。", "c": ["種子がねばり気のあるもので包まれていて、鳥のふんとともに枝にくっつく", "種子が大きくて重い", "種子に綿毛がある", "種子がはじけ飛ぶ"], "e": "ねばり気によって、ふんといっしょに出た種子が枝にくっつきます。"}, {"id": "Z036", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "知識", "q": "ヤドリギの葉が乾燥しやすい高いところでも水の蒸発量を少なくするには、どのような葉が適していますか。", "c": ["表面積が小さく、厚い葉", "表面積が大きく、うすい葉", "表面積が大きく、厚い葉", "表面積が小さく、うすい葉"], "e": "表面積が小さく厚い葉は、水が蒸発しにくくなります。"}, {"id": "Z037", "u": "生き物のふえ方", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "1年で最も昼が長く、夜が短い日の太陽の動きとして正しいものはどれですか。", "c": ["夏至で、真東よりも北からのぼり、真西よりも北にしずむ", "夏至で、真東からのぼり真西にしずむ", "冬至で、真東よりも南からのぼる", "冬至で、真東よりも北からのぼる"], "e": "春分・秋分は真東からのぼり真西にしずみ、冬至は真東よりも南からのぼります。"}, {"id": "Z038", "u": "生き物のふえ方", "lv": "標準", "r": 58, "f": "知識", "q": "銀河(天の川銀河)とは何ですか。", "c": ["無数の恒星が集まったもので、太陽や地球をふくむ", "月のまわりの星の集まり", "地球の大気の層", "惑星だけの集まり"], "e": "天の川は、天の川銀河を内側から見たものです。"}, {"id": "Z039", "u": "生き物のふえ方", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "夏に花を咲かせ、子葉が1枚の単子葉植物として正しいものはどれですか。", "c": ["ツユクサ", "カタバミ", "アブラナ", "ニンジン"], "e": "ツユクサやヤマユリ・スイセンも単子葉植物です。"}, {"id": "Z040", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "次の花のうち、キク科の植物はどれですか。", "c": ["シュンギク", "ヤマユリ", "スイセン", "カタクリ"], "e": "ヤマユリ・カタクリはユリ科、スイセンはヒガンバナ科です。"}, {"id": "Q001", "u": "膨張と収縮", "lv": "基礎", "r": 86, "f": "知識", "q": "物の体積が温度などによって大きくなることを何といいますか。また、小さくなることを何といいますか。", "c": ["大きくなる=膨張、小さくなる=収縮", "大きくなる=収縮、小さくなる=膨張", "大きくなる=伝導、小さくなる=収縮", "大きくなる=膨張、小さくなる=伝導"], "e": "あたためられると膨張し、冷やされると収縮します。"}, {"id": "Q002", "u": "膨張と収縮", "lv": "基礎", "r": 82, "f": "知識", "q": "熱と温度の説明として正しいものはどれですか。", "c": ["熱はエネルギーを表す言葉の1つで、物のあたたかさの度合いは温度で表す", "熱と温度はまったく同じ意味", "温度はエネルギーを表す言葉で、熱はあたたかさの度合い", "熱は物の重さを表す"], "e": "物に熱が加わると温度が上がり、熱をうばわれると温度が下がります。"}, {"id": "Q003", "u": "膨張と収縮", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "アルコール温度計の液だめを湯につけると液面が上がるのはなぜですか。", "c": ["中の灯油があたためられて体積が大きくなるから", "中の灯油が蒸発するから", "ガラスが縮むから", "灯油の重さが増えるから"], "e": "アルコール温度計の中には、赤く色をつけた灯油が入っています。"}, {"id": "Q004", "u": "膨張と収縮", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "温度計の目もりを読むガラス管が、液だめよりも細くなっているのはなぜですか。", "c": ["わずかな体積変化でも、液面の高さの変化を大きくして見やすくするため", "温度による液体の体積の変化を大きくするため", "中に入れる液体の量を少なくするため", "温度計をこわれにくくするため"], "e": "液体の体積の変化そのものは管の太さで変わりませんが、細い管を通すと高さの変化が大きくなります。"}, {"id": "Q005", "u": "膨張と収縮", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "試験管に色をつけた灯油を入れて温度計を作りましたが、うまく温度をはかれませんでした。主な理由はどれですか。", "c": ["試験管が太いので、体積が変わっても液面の高さがほとんど変わらないから", "灯油は温度で体積が変わらないから", "試験管はガラスでできているから", "灯油に色をつけたから"], "e": "温度計は、液だめの液体が細い管に入っていく形にくふうされています。"}, {"id": "Q006", "u": "膨張と収縮", "lv": "基礎", "r": 84, "f": "知識", "q": "温度計の目もりの正しい読み方はどれですか。", "c": ["液面を自分の目線と同じ高さにし、最小目もりの1/10まで目分量で読む", "温度計を持つ手を目線と同じ高さにして読む", "上から見下ろして読む", "温度計に直射日光を当てて読む"], "e": "温度計の両はしをにぎると、手の熱で液体があたたまってしまいます。"}, {"id": "Q007", "u": "膨張と収縮", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "温度計の中の液体の温度が高くなったとき、変わらないものはどれですか。", "c": ["温度計全体の重さ", "液体の体積", "液面の高さ", "液体の温度"], "e": "体積が増えても、液体の量(重さ)は変わりません。"}, {"id": "Q008", "u": "膨張と収縮", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "水をびんに入れて湯であたためても、重さは変わりませんでした。同じ体積で比べると、あたためた水の重さはどうなりますか。", "c": ["軽くなる", "重くなる", "変わらない", "2倍になる"], "e": "膨張すると全体の重さは変わりませんが、体積が増えるので、同じ体積あたりの重さは軽くなります。"}, {"id": "Q009", "u": "膨張と収縮", "lv": "標準", "r": 62, "f": "知識", "q": "水1gの体積が最も小さくなるのは何℃のときですか。", "c": ["4℃", "0℃", "10℃", "100℃"], "e": "水は4℃より温度が下がっても、上がっても体積が大きくなります。"}, {"id": "Q010", "u": "膨張と収縮", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "温度計の液体にふつう水が使われない理由として、ふさわしくないものはどれですか。", "c": ["水は温度が変わっても体積がまったく変わらないから", "水は4℃のとき体積が最も小さく、温度による体積変化が一定ではないから", "水は0℃でこおってしまい、低い温度がはかれないから", "水は100℃でふっとうしてしまい、高い温度がはかれないから"], "e": "水も温度で体積は変わりますが、変わり方が一定ではなく、液体でいられる範囲もせまいので温度計には向きません。"}, {"id": "Q011", "u": "膨張と収縮", "lv": "基礎", "r": 82, "f": "知識", "q": "同じ体積の空気と水を試験管に入れて湯であたためました。体積が変化しやすいのはどちらですか。", "c": ["空気", "水", "どちらも同じ", "どちらも変化しない"], "e": "色水のまくも水面も上がりますが、色水のまくの方が大きく上がります。"}, {"id": "Q012", "u": "膨張と収縮", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "固体・液体・気体を、温度による体積変化が大きい順に並べたものはどれですか。", "c": ["気体→液体→固体", "固体→液体→気体", "液体→気体→固体", "気体→固体→液体"], "e": "固体の金属も膨張・収縮しますが、水や空気と比べるとずっと小さい変化です。"}, {"id": "Q013", "u": "膨張と収縮", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "空気を入れた試験管(色水のまく)と水を入れた試験管(水面)を、同じ高さに印をつけて氷水に入れました。印と比べたようすとして正しいものはどれですか。", "c": ["色水のまくは印より大きく下がり、水面は印より少しだけ下がる", "どちらも印より上がる", "色水のまくは上がり、水面は下がる", "どちらも変わらない"], "e": "冷やされると収縮します。空気の方が収縮しやすいので、まくが大きく下がります。"}, {"id": "Q014", "u": "膨張と収縮", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "注射器に空気を入れてピストンを押すと体積が小さくなり、手をはなすと元にもどります。水を入れて押すとどうなりますか。", "c": ["体積はほとんど変化しない", "空気と同じように小さくなる", "空気より大きく小さくなる", "ピストンが自然に引き出される"], "e": "押す力を加えたときも、水より空気の方が大きく体積が変化します。空気でっぽうは、縮んだ空気が元にもどろうとする力を利用しています。"}, {"id": "Q015", "u": "膨張と収縮", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ガリレオ温度計は、ガラス球の中の空気の体積変化を利用しています。ガラス球をあたためると、ガラス管の中の液面はどうなりますか。", "c": ["空気の体積が増えるので、液面は下がる", "空気の体積が減るので、液面は上がる", "色水の体積が増えるので、液面は上がる", "色水の体積が減るので、液面は下がる"], "e": "あたためると液面が下がるので、ガラス球に近い(上の)目もりほど温度が低く、数字が小さくなります。"}, {"id": "Q016", "u": "膨張と収縮", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ガリレオ温度計の目もりの間かくが等しくなっていないのはなぜですか。", "c": ["空気の膨張だけでなく、蒸発して増えた水蒸気の体積も液面の高さを変えるから", "ガラス管の太さがそろっていないから", "空気は温度によって体積が変わらないから", "色水がこおるから"], "e": "水を使っているので、はかれる温度の範囲もせまいという欠点があります。"}, {"id": "Q017", "u": "膨張と収縮", "lv": "基礎", "r": 82, "f": "知識", "q": "金属の球と輪で、同じ温度のときにちょうど通りぬけられるものがあります。球だけを熱するとどうなりますか。", "c": ["球が膨張して、輪を通らなくなる", "球が収縮して、輪を通る", "球と輪がくっつく", "何も変わらない"], "e": "球を冷やすと収縮して通り、輪を熱すると輪が膨張して通り、輪を冷やすと通らなくなります。"}, {"id": "Q018", "u": "膨張と収縮", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "金属の輪を熱したとき、輪の外側の直径・内側の直径(あなの大きさ)・高さはそれぞれどうなりますか。", "c": ["すべて長くなる", "外側の直径は長くなり、内側の直径は短くなる", "外側は長くなり、内側と高さは変わらない", "すべて短くなる"], "e": "金属全体が膨張するので、あなも大きくなります。だから輪を熱すると球が通るようになります。"}, {"id": "Q019", "u": "膨張と収縮", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "開けにくい金属のびんのふたを湯であたためると、開けやすくなるのはなぜですか。", "c": ["金属のふたがガラスのびんより大きく膨張するから", "ふたが収縮するから", "びんが膨張するから", "湯でふたがやわらかくとけるから"], "e": "金属はガラスより膨張しやすいので、ふたとびんの間にすき間ができます。"}, {"id": "Q020", "u": "膨張と収縮", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "夏と冬の電線と、電車のレールのつぎ目のようすとして正しいものはどれですか。", "c": ["夏は電線がたるみ、レールのすき間はせまい。冬は電線がはり、すき間は広い", "夏は電線がはり、すき間は広い", "夏も冬も同じ", "冬は電線がたるみ、すき間はせまい"], "e": "夏は金属が膨張し、冬は収縮します。暑い夏にレールが膨張して曲がらないよう、すき間が空けてあります。"}, {"id": "Q021", "u": "膨張と収縮", "lv": "応用", "r": 48, "f": "知識", "q": "膨張する度合いがちがう2つの金属をはり合わせたものを何といいますか。また、あたためるとどちらに曲がりますか。", "c": ["バイメタルで、膨張しにくい金属の側に曲がる", "バイメタルで、膨張しやすい金属の側に曲がる", "ニクロム線で、まっすぐのびる", "バイメタルで、まったく曲がらない"], "e": "膨張しやすい金属が外側になるように曲がります。火災報知器や電気回路のスイッチに利用されています。"}, {"id": "Q022", "u": "膨張と収縮", "lv": "基礎", "r": 84, "f": "知識", "q": "熱が物を伝って温度の高い方から低い方へだんだん移動する伝わり方を何といいますか。", "c": ["伝導", "膨張", "収縮", "蒸発"], "e": "熱は低い方から高い方へ移動することはありません。"}, {"id": "Q023", "u": "膨張と収縮", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "鉄・アルミニウム・ガラス・銅を、熱が伝わりやすい順に並べたものはどれですか。", "c": ["銅→アルミニウム→鉄→ガラス", "銅→鉄→アルミニウム→ガラス", "アルミニウム→銅→鉄→ガラス", "ガラス→鉄→アルミニウム→銅"], "e": "同じ温度の物でも、さわったときのあたたかさの感じ方がちがうのは、熱の伝わりやすさがちがうからです。"}, {"id": "Q024", "u": "膨張と収縮", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "銅の棒にマッチをろうでとめ、棒をかたむけて真ん中をアルコールランプで熱しました。マッチの落ち方として正しいものはどれですか。", "c": ["熱した部分からの距離が同じなら、上下どちらも同時に落ちる", "上の方から先に落ちる", "下の方から先に落ちる", "熱した部分から遠い方から落ちる"], "e": "伝導の速さは、かたむきによって変わりません。熱した部分に近いマッチから落ちます。"}, {"id": "Q025", "u": "膨張と収縮", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "表面にろうをぬった銅板の1つの角をアルコールランプで熱しました。ろうがとけるようすとして正しいものはどれですか。", "c": ["熱した点を中心に、同じ距離の所から円をえがくように広がる", "板の上の方から先にとける", "熱した点から遠い所から先にとける", "板全体が同時にとける"], "e": "熱は物を伝って、熱した所から近い順にだんだん伝わります。"}, {"id": "Q026", "u": "膨張と収縮", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "80℃の湯を入れたビーカーを15℃の水の中に入れ、それぞれの温度をはかりました。温度の変化として正しいものはどれですか。", "c": ["湯の温度は下がり、水の温度は上がって、やがて同じ温度になり、その後ゆっくり室温に近づく", "湯も水も温度が上がり続ける", "水の温度は下がり、湯の温度は上がる", "湯は80℃のまま変わらない"], "e": "熱は温度の高い湯から低い水へ移動します。"}, {"id": "Q027", "u": "膨張と収縮", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "筒の真ん中にしきりを入れ、両側の空気を同じ量にして、左を金属のせん、右をガラスのせんでふさぎました。両側から同じようにあたためると、しきりはどうなりますか。", "c": ["右に動く(金属のせんの方が熱を伝えやすく、左の空気が先にあたたまって膨張するから)", "左に動く", "いつまでたっても動かない", "上下にゆれる"], "e": "熱の伝わりやすさのちがいで、空気があたたまる速さが変わります。"}, {"id": "Q028", "u": "膨張と収縮", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "筒のしきりの左に水、右に空気を入れ、右側だけをあたためました。しきりはどちらに動き始めますか。", "c": ["左に動く(右の空気があたためられて膨張し、しきりをおすから)", "右に動く", "動かない", "左右に交互に動く"], "e": "あたためた側の空気が膨張して、しきりを反対側へおします。"}, {"id": "Q029", "u": "膨張と収縮", "lv": "標準", "r": 58, "f": "知識", "q": "日本にやってくる鳥として正しいものはどれですか。", "c": ["カッコウは春に南から日本にやってくる", "ツバメは秋に南からやってくる", "ハクチョウは春に北からやってくる", "ホトトギスは秋に北からやってくる"], "e": "カッコウ・ツバメ・ホトトギスは夏鳥、ハクチョウは秋に北から来る冬鳥です。"}, {"id": "Q030", "u": "膨張と収縮", "lv": "標準", "r": 60, "f": "知識", "q": "地震のゆれの大きさと規模を表すものの組み合わせとして正しいものはどれですか。", "c": ["ゆれの大きさ=震度(10段階)、規模=マグニチュード", "ゆれの大きさ=マグニチュード、規模=震度", "ゆれの大きさ=震度(7段階)、規模=マグニチュード", "どちらも震度で表す"], "e": "震度は0・1・2・3・4・5弱・5強・6弱・6強・7の10段階です。"}, {"id": "Q031", "u": "膨張と収縮", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "火山がふん火すると、火山灰は火山の東側に積もりやすくなります。その理由はどれですか。", "c": ["日本付近の上空には西から東へ偏西風がふいているから", "日本付近では北風がふくから", "東側の方が標高が低いから", "火口がいつも東を向いているから"], "e": "偏西風によって火山灰が東へ運ばれます。"}, {"id": "Q032", "u": "膨張と収縮", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "秋の季節の生き物として、モズについて正しいものはどれですか。", "c": ["秋に「はやにえ」(えものを枝にさしておく)をする鳥", "春に南から来る夏鳥", "冬に北から来て水辺でくらす", "夜に活動するフクロウの仲間"], "e": "アリジゴクはウスバカゲロウの幼虫、キンモクセイは秋にかおりの強いだいだい色の花を咲かせます。"}, {"id": "Q033", "u": "膨張と収縮", "lv": "標準", "r": 62, "f": "知識", "q": "秋分の日の太陽の動きと、同じように太陽が動く日の組み合わせとして正しいものはどれですか。", "c": ["真東からのぼり真西にしずむ。春分の日(3月21日ごろ)も同じ", "真東からのぼり真西にしずむ。夏至の日(6月21日ごろ)も同じ", "真東より北からのぼる。春分の日も同じ", "真東より南からのぼる。冬至の日も同じ"], "e": "春分・秋分の日は昼と夜の長さがほぼ同じになります。"}, {"id": "Q034", "u": "膨張と収縮", "lv": "標準", "r": 60, "f": "知識", "q": "太陽系の惑星の中で、太陽から最も遠い軌道を公転している惑星はどれですか。", "c": ["海王星", "天王星", "土星", "木星"], "e": "水星・金星・地球・火星・木星・土星・天王星・海王星の順に遠くなります。"}, {"id": "Q035", "u": "膨張と収縮", "lv": "応用", "r": 48, "f": "知識", "q": "イチョウの種子は何とよばれ、果実はできますか。", "c": ["銀杏(ぎんなん)とよばれ、裸子植物なので果実はできない", "銀杏とよばれ、果実ができる", "クリとよばれ、果実ができない", "マツカサとよばれ、果実ができる"], "e": "イチョウは子房がない裸子植物です。くさいにおいの部分も種子の一部(種皮)です。"}, {"id": "Q036", "u": "膨張と収縮", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "モズ・ウスバカゲロウ・カマキリ・ジョロウグモのうち、昆虫と、さなぎの時期がある昆虫の組み合わせとして正しいものはどれですか。", "c": ["昆虫はウスバカゲロウとカマキリ、さなぎの時期があるのはウスバカゲロウ", "昆虫はカマキリとジョロウグモ、さなぎの時期があるのはカマキリ", "昆虫はウスバカゲロウとカマキリ、さなぎの時期があるのはカマキリ", "昆虫はすべて、さなぎの時期があるのはモズ"], "e": "モズは鳥、ジョロウグモはクモの仲間です。ウスバカゲロウの幼虫がアリジゴクです。"}, {"id": "Q037", "u": "膨張と収縮", "lv": "標準", "r": 58, "f": "知識", "q": "千葉県市原市の地層にちなんで名づけられた、約77万年前から13万年前の時代の名前はどれですか。", "c": ["チバニアン", "ジュラシック", "カンブリア", "ペルミアン"], "e": "地球の歴史の時代の名前に、日本の地名が初めて使われました。"}, {"id": "Q038", "u": "膨張と収縮", "lv": "標準", "r": 60, "f": "知識", "q": "富士山のような形をした火山を何といいますか。", "c": ["成層火山", "たて状火山", "ドーム状火山", "カルデラ"], "e": "富士山は古い火山の上に新しい火山が重なってできています。"}, {"id": "U001", "u": "地層", "lv": "基礎", "r": 84, "f": "知識", "q": "流水のはたらきで運ばれた小石・砂・泥などが、海底や湖底で層になって積もったものを何といいますか。", "c": ["地層", "化石", "岩石", "火山灰"], "e": "山を切り開いた道(切り通し)や、がけなどで岩はだが見える露頭で見られます。"}, {"id": "U002", "u": "地層", "lv": "基礎", "r": 82, "f": "知識", "q": "小石・砂・泥はつぶの大きさで分けられます。正しい組み合わせはどれですか。", "c": ["小石=2mm以上、砂=0.06〜2mm、泥=0.06mm以下", "小石=1cm以上、砂=1mm〜1cm、泥=1mm以下", "小石=0.06mm以下、砂=0.06〜2mm、泥=2mm以上", "小石=2mm以上、砂=0.06mm以下、泥=0.06〜2mm"], "e": "つぶの大きさで名前が決まります。"}, {"id": "U003", "u": "地層", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "小石・砂・泥をメスシリンダーに入れ、水を入れてよくかき混ぜて置いておきました。下から順に積もったものはどれですか。", "c": ["小石→砂→泥", "泥→砂→小石", "砂→小石→泥", "すべて混ざったまま積もる"], "e": "つぶの大きいものほど先に沈み、小さいものは沈むのに時間がかかります。"}, {"id": "U004", "u": "地層", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "1つの砂の層をよく観察しました。層の中のつぶの大きさのようすとして正しいものはどれですか。", "c": ["下の方のつぶが大きく、上の方のつぶが小さい", "上の方のつぶが大きく、下の方のつぶが小さい", "どの部分もまったく同じ", "まん中のつぶが最も大きい"], "e": "積もるときに大きいつぶが先に沈むためです。"}, {"id": "U005", "u": "地層", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "川から流れ出た土砂が海に積もるとき、河口に近い方から順に積もるものとして正しいものはどれですか。", "c": ["小石→砂→泥", "泥→砂→小石", "砂→泥→小石", "すべて同じ所に積もる"], "e": "つぶの大きいものほど流されにくく、河口の近くに積もります。泥は流されやすく、沖合の深い所まで運ばれます。"}, {"id": "U006", "u": "地層", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "河口を中心とした海底に土砂を流す実験で、A(河口に近い)・B・C(遠い)に積もったものの組み合わせとして正しいものはどれですか。", "c": ["A=小石、B=砂、C=ねん土", "A=ねん土、B=砂、C=小石", "A=砂、B=小石、C=ねん土", "A=小石、B=ねん土、C=砂"], "e": "河口に近いほど大きなつぶが積もります。"}, {"id": "U007", "u": "地層", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "河口から土砂を流す実験で、流す勢いを強くすると、砂の積もる位置はどうなりますか。", "c": ["河口から遠い側にずれる", "河口に近い側にずれる", "変わらない", "積もらなくなる"], "e": "流れが強いと、つぶが遠くまで運ばれます。"}, {"id": "U008", "u": "地層", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "岩石が流水のはたらきでけずられ、運ばれ、積もるまでのはたらきとして、ふさわしくないものはどれですか。", "c": ["光合成", "風化", "しん食", "運ぱん"], "e": "岩石は風化作用などでもろくなり、流水のしん食・運ぱん・たい積のはたらきで地層になります。"}, {"id": "U009", "u": "地層", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "地層が「しま模様」に見えるのはなぜですか。", "c": ["層をつくるつぶの大きさや色が層ごとにちがうから", "層ごとに温度がちがうから", "層ごとに水の量がちがうから", "層ごとに化石の数がちがうから"], "e": "1つの層の中ではつぶの大きさがほぼそろ
