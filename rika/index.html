<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小4理科 合格ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 理科ノートのような紙面:方眼と赤ペンの丸つけ。1カラムのアプリ */
:root{
  --paper:#F4F7F3; --surface:#FFFFFF; --ink:#1E3240; --muted:#5E7180; --line:#D5DED8;
  --sea:#2A6C96; --sea-soft:#E3EEF5; --land:#4F8443; --land-soft:#E5F0E0;
  --red:#CF412C; --red-soft:#FBE6E2; --gold:#B8860B; --gold-soft:#FBF1D9;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11181D; --surface:#1A242B; --ink:#E3ECEA; --muted:#9AAEB8; --line:#2C3A43;
  --sea:#6EB0DB; --sea-soft:#1C3242; --land:#8CC274; --land-soft:#1E3324;
  --red:#F0806C; --red-soft:#3A2220; --gold:#E2B64A; --gold-soft:#36301C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181D; --surface:#1A242B; --ink:#E3ECEA; --muted:#9AAEB8; --line:#2C3A43;
  --sea:#6EB0DB; --sea-soft:#1C3242; --land:#8CC274; --land-soft:#1E3324;
  --red:#F0806C; --red-soft:#3A2220; --gold:#E2B64A; --gold-soft:#36301C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:relative;border-radius:18px;padding:22px 22px 18px;overflow:hidden;background:var(--sea-soft);border:1px solid var(--line)}
header.top::before{content:"";position:absolute;inset:-40% -20% auto auto;width:360px;height:360px;border-radius:50%;
  background:repeating-radial-gradient(circle at center,transparent 0 13px,var(--sea) 13px 14px);opacity:.14;pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--sea);font-weight:700}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,6vw,34px);line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0;max-width:52ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;position:relative}
.stat{background:var(--surface);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.stat.warn b{color:var(--red)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
h2{font-family:var(--display);font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:13px;color:var(--muted);margin:14px 0 8px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--surface);font-weight:700}
.chip:focus-visible,.btn:focus-visible,.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:none;border-radius:12px;padding:13px 18px;cursor:pointer;background:var(--sea);color:var(--surface);font-size:16px}
.btn.alt{background:var(--red)}
.btn.ghost{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1 1 200px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.lv{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.lv-基礎{background:var(--land-soft);color:var(--land)}
.lv-標準{background:var(--sea-soft);color:var(--sea)}
.lv-応用{background:var(--gold-soft);color:var(--gold)}
.lv-過去問型{background:var(--red-soft);color:var(--red)}
.unitbars{display:grid;gap:8px}
.ub{display:grid;grid-template-columns:5.5em 1fr 6.5em;gap:10px;align-items:center;font-size:14px}
.track{height:10px;background:var(--paper);border-radius:6px;position:relative;border:1px solid var(--line)}
.fill{position:absolute;inset:0 auto 0 0;background:var(--land);border-radius:6px}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.ub .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.pbar{height:6px;background:var(--line);border-radius:4px;margin:10px 0 16px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sea);transition:width .3s}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rate{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:13px}
.rate .track{flex:1;max-width:220px}
.rate .fill{background:var(--gold)}
.rate b{font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink)}
.qtext{font-size:18px;font-weight:700;margin:14px 0 16px;line-height:1.75}
.choices{display:grid;gap:10px}
.choice{text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.choice .k{font-family:var(--display);font-weight:900;color:var(--sea);min-width:1.2em}
.choice:hover:not(:disabled){border-color:var(--sea)}
.choice:disabled{cursor:default}
.choice.ok{border-color:var(--land);background:var(--land-soft)}
.choice.ng{border-color:var(--red);background:var(--red-soft)}
.fb{margin-top:16px;border-radius:12px;padding:14px;border:1.5px solid var(--line)}
.fb .mark{font-family:var(--display);font-weight:900;font-size:22px}
.fb.ok .mark{color:var(--land)} .fb.ng .mark{color:var(--red)}
.fb p{margin:6px 0 0}
.alert{margin-top:10px;background:var(--red-soft);color:var(--red);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700}
.review-tag{background:var(--red);color:var(--surface);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
/* lists */
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.item .q{font-weight:700;margin:4px 0}
.item .a{font-size:14px;color:var(--land);font-weight:700}
.item .m{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pri{font-family:var(--display);font-weight:900;color:var(--red);font-size:13px}
.big{font-family:var(--display);font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (max-width:460px){.stats{grid-template-columns:repeat(3,1fr);gap:6px}.stat b{font-size:20px}}
.ai-tag{background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
.gen{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--sea-soft);color:var(--ink);font-size:14px}
.gen.busy{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
.ub small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.chartbox{overflow-x:auto}
svg.dev{width:100%;max-width:520px;height:auto;display:block}
svg.dev .g{stroke:var(--line);stroke-width:1}
svg.dev .ax{fill:var(--muted);font-size:10px;font-family:var(--body)}
svg.dev .v{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--body)}
svg.dev .ln{fill:none;stroke:var(--sea);stroke-width:2.5}
svg.dev .d{fill:var(--sea)} svg.dev .dl{fill:var(--red)}
ul.weak{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:15px}
details.parts{margin-top:14px} details.parts summary{cursor:pointer;color:var(--sea);font-weight:700;font-size:14px}
.chip .yet{margin-left:6px;font-size:10px;color:var(--gold)}
.chip[aria-pressed="true"] .yet{color:inherit}
.ub{grid-template-columns:7.5em 1fr 7.5em}
@media (max-width:460px){.ub{grid-template-columns:6em 1fr 6.4em;font-size:13px}}
.skiprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn.small{padding:7px 12px;font-size:14px}
.ftag{background:var(--sea-soft);color:var(--sea);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
.chip .fnote{display:block;font-size:10px;font-weight:400;opacity:.8;line-height:1.3}
.tbwrap{overflow-x:auto;margin:-4px 0 16px}
table.tb{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%}
table.tb th,table.tb td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
table.tb th{background:var(--paper);font-weight:700}
.item .tbwrap{margin:6px 0}
.uzgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 6px}
.uzgrid.n1{grid-template-columns:minmax(0,320px)}
.uz{margin:0;border:1px solid var(--line);border-radius:10px;padding:6px 6px 4px;background:var(--surface)}
.uz figcaption{font-weight:700;font-size:14px;text-align:center}
.uz svg{width:100%;height:auto;display:block}
.uz .g{stroke:var(--line);stroke-width:.6}.uz .z{stroke:var(--muted);stroke-width:.8}
.uz .bar{fill:var(--sea);opacity:.55}.uz .ln{fill:none;stroke:var(--red);stroke-width:1.8}.uz .dot{fill:var(--red)}
.uz .ax{fill:var(--muted);font-size:12px;font-family:var(--body)}
.uzsum{font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.uzkey{font-size:11px;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.uznum{margin:-6px 0 14px;font-size:13px}.uznum summary{cursor:pointer;color:var(--sea);font-weight:700}.uznum .tbwrap{margin:6px 0 0}
.uzkey .kb{display:inline-block;width:12px;height:10px;background:var(--sea);opacity:.55}
.uzkey .kl{display:inline-block;width:14px;height:2px;background:var(--red);margin-left:8px}
.figbox{margin:0 0 16px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
svg.ckt{width:100%;max-width:280px;height:auto}
svg.ckt .w{stroke:var(--ink);stroke-width:2.5;fill:none}svg.ckt .th{stroke-width:5}
svg.ckt .bg{stroke:var(--surface);stroke-width:6}svg.ckt .bl{fill:var(--gold-soft);stroke:var(--ink);stroke-width:2.5}
svg.ckt .ax{fill:var(--red);font-size:14px;font-weight:700;font-family:var(--body)}
.mo{margin:0;text-align:center}.mo svg{width:64px;height:64px;display:block}
.mo .dark{fill:#3C4650}.mo .lit{fill:#FFF6C8}.mo .rim{fill:none;stroke:var(--ink);stroke-width:1.5}
.mo figcaption{font-weight:700;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
// 問題データ:a は正解の選択肢番号(表示時にシャッフル)/ r は予測正答率(難関校志望の小4生を想定した目安)
const Q=[{"id": "M001", "u": "磁石の性質", "lv": "基礎", "r": 90, "f": "知識", "q": "磁石に引きつけられるものはどれですか。", "c": ["鉄のくぎ", "アルミニウムの1円玉", "銅の10円玉", "ガラスのビー玉"], "e": "磁石につくのは鉄など一部の金属だけです。アルミニウムや銅は金属でも磁石につきません。"}, {"id": "M002", "u": "磁石の性質", "lv": "基礎", "r": 84, "f": "まちがい探し", "q": "磁石に引きつけられないものはどれですか。", "c": ["アルミ缶", "スチール缶", "鉄のクリップ", "砂鉄"], "e": "スチール缶は鉄でできているので磁石につきます。アルミ缶はアルミニウムなのでつきません。ごみの分別に利用されます。"}, {"id": "M003", "u": "磁石の性質", "lv": "基礎", "r": 88, "f": "知識", "q": "2つの磁石を近づけたとき、しりぞけ合うのはどれですか。", "c": ["N極とN極", "N極とS極", "S極とN極", "どの組み合わせでも引き合う"], "e": "同じ極どうしはしりぞけ合い、ちがう極どうしは引き合います。"}, {"id": "M004", "u": "磁石の性質", "lv": "基礎", "r": 82, "f": "知識", "q": "棒磁石で、鉄を引きつける力がいちばん強いのはどこですか。", "c": ["両はしの部分", "まん中の部分", "どこでも同じ", "N極のはしだけ"], "e": "磁石の力は両はし(極)がいちばん強く、まん中はほとんど鉄を引きつけません。"}, {"id": "M005", "u": "磁石の性質", "lv": "標準", "r": 66, "f": "しくみ・理由", "q": "方位磁針のN極が北をさすのはなぜですか。", "c": ["地球全体が大きな磁石で、北極付近がS極になっているから", "地球の北極付近がN極になっているから", "北の方が気温が低いから", "太陽が南にあるから"], "e": "N極はS極に引かれます。方位磁針のN極が北をさすのは、地球の北極付近がS極のはたらきをしているからです。"}, {"id": "M006", "u": "磁石の性質", "lv": "標準", "r": 62, "f": "知識", "q": "棒磁石をまん中で2つに切りました。切り口にできるのはどれですか。", "c": ["もとのN極側の切り口はS極、S極側の切り口はN極になる", "切り口には極ができない", "両方の切り口がN極になる", "両方の切り口がS極になる"], "e": "磁石は切っても、それぞれがN極とS極をもつ磁石になります。N極側のかけらの切り口はS極になります。"}, {"id": "M007", "u": "磁石の性質", "lv": "標準", "r": 64, "f": "知識", "q": "鉄のくぎを磁石のN極で一方向に何度もこすりました。くぎはどうなりますか。", "c": ["くぎが磁石になり、鉄を引きつけるようになる", "くぎがアルミニウムに変わる", "くぎは磁石の力をまったく受けない", "くぎがとけてやわらかくなる"], "e": "鉄は磁石でこすると磁石になります(磁化)。このようにしてできた磁石は、たたいたり熱したりすると弱くなります。"}, {"id": "M008", "u": "磁石の性質", "lv": "応用", "r": 50, "f": "しくみ・理由", "q": "鉄のくぎの頭をN極でこすって、とがった先の方へ動かすことをくり返しました。くぎの先は何極になりますか。", "c": ["S極", "N極", "極はできない", "先も頭もN極"], "e": "こすり終わりの部分には、こすった極と反対の極ができます。N極で先の方へこすったので、先はS極になります。"}, {"id": "M009", "u": "磁石の性質", "lv": "標準", "r": 60, "f": "知識", "q": "磁石と鉄のクリップの間に、あるものをはさみました。はさむと磁石の力がほとんど伝わらなくなるものはどれですか。", "c": ["うすい鉄の板", "紙", "プラスチックの下じき", "うすいアルミニウムの板"], "e": "磁石の力は紙・プラスチック・アルミニウムなどを通りぬけます。鉄の板は磁石の力を自分に引きこむため、向こう側まで伝わりにくくなります。"}, {"id": "M010", "u": "磁石の性質", "lv": "標準", "r": 58, "f": "2文の正誤", "q": "次の2つの文の正誤の組み合わせとして正しいものはどれですか。\nI 磁石の力は、はなれていてもはたらく。\nII 磁石の力は、水の中ではたらかなくなる。", "c": ["I 正しい・II 誤り", "I 正しい・II 正しい", "I 誤り・II 正しい", "I 誤り・II 誤り"], "e": "磁石の力ははなれていてもはたらき、水の中でもはたらきます。"}, {"id": "M011", "u": "磁石の性質", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "棒磁石の上に紙をのせて砂鉄をまくと、砂鉄は模様をつくります。この模様のようすとして正しいものはどれですか。", "c": ["両はしに多く集まり、N極からS極へ向かう曲線のように並ぶ", "まん中にいちばん多く集まる", "紙全体に同じようにちらばる", "N極のはしにだけ集まり、S極には集まらない"], "e": "砂鉄の模様は磁石の力のはたらく向き(磁力線)を表し、N極から出てS極に入る曲線になります。極の近くほど多く集まります。"}, {"id": "M012", "u": "磁石の性質", "lv": "応用", "r": 52, "f": "しくみ・理由", "q": "方位磁針を棒磁石のN極に近づけました。方位磁針のどちらの極が棒磁石の方を向きますか。", "c": ["S極", "N極", "どちらも向かない", "くるくる回り続ける"], "e": "ちがう極どうしは引き合うので、方位磁針のS極が棒磁石のN極の方を向きます。"}, {"id": "M013", "u": "磁石の性質", "lv": "過去問型", "r": 40, "f": "しくみ・理由", "q": "鉄のくぎを2本つなげて磁石の極にぶら下げることができます。この理由として正しいものはどれですか。", "c": ["磁石についた1本目のくぎが磁石になり、2本目を引きつけるから", "くぎどうしがもともと引き合うから", "1本目のくぎが電気を通すから", "空気が2本目のくぎをおし上げるから"], "e": "磁石についた鉄は一時的に磁石になります。そのため、くぎの先に次のくぎがつきます。磁石からはなすと力は弱くなります。"}, {"id": "M014", "u": "磁石の性質", "lv": "過去問型", "r": 38, "f": "まちがい探し", "q": "磁石の性質についての説明として、まちがっているものはどれですか。", "c": ["磁石の力は、磁石を2つに割るとなくなる", "ちがう極どうしは引き合う", "磁石の力は、はなれていてもはたらく", "N極だけ、S極だけの磁石はない"], "e": "磁石は割っても、それぞれがN極とS極をもつ磁石になり、力はなくなりません。"}, {"id": "M015", "u": "磁石の性質", "lv": "応用", "r": 46, "f": "知識", "q": "地球を大きな磁石と考えたとき、南極付近は何極のはたらきをしていますか。", "c": ["N極", "S極", "極のはたらきはない", "N極とS極が入れかわり続ける"], "e": "方位磁針のS極が南をさすことから、南極付近はN極のはたらきをしていると分かります(北極付近はS極)。"}, {"id": "E001", "u": "電気の性質", "lv": "基礎", "r": 90, "f": "知識", "q": "乾電池の、でっぱりのある方の極を何といいますか。", "c": ["+極", "−極", "N極", "S極"], "e": "乾電池のでっぱりのある方が+極、平らな方が−極です。電流は+極から出て−極へ流れます。"}, {"id": "E002", "u": "電気の性質", "lv": "基礎", "r": 86, "f": "知識", "q": "回路に流れる電流の向きとして正しいものはどれですか。", "c": ["乾電池の+極から出て、−極にもどる", "乾電池の−極から出て、+極にもどる", "豆電球から乾電池へ向かう", "流れる向きは決まっていない"], "e": "電流は乾電池の+極から出て、豆電球などを通り、−極にもどります。"}, {"id": "E003", "u": "電気の性質", "lv": "基礎", "r": 84, "f": "まちがい探し", "q": "電気を通さないものはどれですか。", "c": ["ガラスのコップ", "アルミニウムはく", "銅の導線", "鉄のスプーン"], "e": "金属は電気を通します。ガラス・プラスチック・紙・木・ゴムなどは電気を通しません。"}, {"id": "E004", "u": "電気の性質", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "図のように、乾電池2個を直列につないで豆電球を光らせました。豆電球の明るさは、乾電池1個のときと比べてどうなりますか。", "c": ["明るくなる", "同じ", "暗くなる", "光らない"], "e": "乾電池を直列につなぐと、豆電球に流れる電流が大きくなり、明るく光ります。", "ck": "b2s"}, {"id": "E005", "u": "電気の性質", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "図のように、乾電池2個を並列につないで豆電球を光らせました。豆電球の明るさは、乾電池1個のときと比べてどうなりますか。", "c": ["同じ", "明るくなる", "暗くなる", "光らない"], "e": "乾電池を並列につないでも、豆電球の明るさは1個のときと同じです。そのかわり長い時間光り続けます。", "ck": "b2p"}, {"id": "E006", "u": "電気の性質", "lv": "標準", "r": 58, "f": "知識", "q": "乾電池1個に、豆電球2個を直列につなぎました。豆電球1個の明るさは、豆電球1個だけのときと比べてどうなりますか。", "c": ["暗くなる", "明るくなる", "同じ", "片方だけ光る"], "e": "豆電球を直列につなぐと、流れる電流が小さくなり、1個ずつは暗くなります。", "ck": "l2s"}, {"id": "E007", "u": "電気の性質", "lv": "標準", "r": 56, "f": "知識", "q": "乾電池1個に、豆電球2個を並列につなぎました。豆電球1個の明るさは、豆電球1個だけのときと比べてどうなりますか。", "c": ["同じ", "明るくなる", "暗くなる", "両方とも光らない"], "e": "豆電球を並列につなぐと、それぞれの豆電球の明るさは1個のときと同じです。", "ck": "l2p"}, {"id": "E008", "u": "電気の性質", "lv": "応用", "r": 50, "f": "しくみ・理由", "q": "豆電球2個を直列につないだ回路で、1個をソケットからはずしました。もう1個はどうなりますか。", "c": ["消える", "明るくなる", "同じ明るさで光る", "暗くなって光り続ける"], "e": "直列つなぎは電流の通り道が1本なので、1個はずすと回路が切れて、もう1個も消えます。並列つなぎなら、もう1個は光り続けます。"}, {"id": "E009", "u": "電気の性質", "lv": "応用", "r": 48, "f": "2文の正誤", "q": "次の2つの文の正誤の組み合わせとして正しいものはどれですか。\nI 乾電池を並列につなぐと、1個のときより長い時間、豆電球が光る。\nII 豆電球を並列につなぐと、1個がはずれても、残りの豆電球は光り続ける。", "c": ["I 正しい・II 正しい", "I 正しい・II 誤り", "I 誤り・II 正しい", "I 誤り・II 誤り"], "e": "どちらも正しい文です。並列つなぎは電流の通り道が分かれているのが特ちょうです。"}, {"id": "E010", "u": "電気の性質", "lv": "標準", "r": 64, "f": "知識", "q": "導線が豆電球を通らずに、乾電池の+極と−極を直接つないでしまうつなぎ方を何といいますか。また、そのときどうなりますか。", "c": ["ショート回路で、大きな電流が流れて導線や乾電池が熱くなり、危ない", "ショート回路で、電流がまったく流れない", "並列回路で、豆電球が明るく光る", "直列回路で、豆電球が暗く光る"], "e": "ショート回路では大きな電流が流れ、導線や乾電池が熱くなってきけんです。ぜったいにやってはいけません。"}, {"id": "E011", "u": "電気の性質", "lv": "標準", "r": 60, "f": "知識", "q": "豆電球の中で、電流が流れると熱くなって光る細い線を何といいますか。", "c": ["フィラメント", "ソケット", "導入線", "口金"], "e": "豆電球はフィラメントに電流が流れて熱くなり、光ります。"}, {"id": "E012", "u": "電気の性質", "lv": "応用", "r": 46, "f": "知識", "q": "発光ダイオード(LED)の特ちょうとして正しいものはどれですか。", "c": ["電流が決まった向きに流れるときだけ光り、豆電球より少ない電気で光る", "どちら向きにつないでも光る", "豆電球よりたくさんの電気を使う", "光るときに豆電球より熱くなる"], "e": "LEDは長い足を+極側につないだときだけ光ります。熱をあまり出さず、少ない電気で光ります。"}, {"id": "E013", "u": "電気の性質", "lv": "応用", "r": 44, "f": "しくみ・理由", "q": "懐中電灯で、スイッチを入れても光らないとき、まず考えられる原因としてふさわしくないものはどれですか。", "c": ["乾電池を並列につないでいる", "乾電池の向きが逆に入っている", "乾電池が古くなっている", "豆電球のフィラメントが切れている"], "e": "乾電池を並列につないでも豆電球は光ります。光らないのは、回路がどこかで切れているか、電池の向きや電池切れが原因です。"}, {"id": "E014", "u": "電気の性質", "lv": "過去問型", "r": 36, "f": "図の読み取り", "q": "乾電池2個と豆電球1個の回路で、豆電球が最も明るく光り、しかも乾電池が最も早くなくなるつなぎ方はどれですか。", "c": ["乾電池2個を直列につなぐ", "乾電池2個を並列につなぐ", "乾電池1個だけをつなぐ", "乾電池2個の+極どうしを向かい合わせにつなぐ"], "e": "直列では電流が大きくなるので明るく光る一方、電池は早く使い切ります。+極どうしを向かい合わせにすると電流が流れません。"}, {"id": "E015", "u": "電気の性質", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "乾電池2個を直列につないだつもりが、1個の向きが逆になっていました。豆電球はどうなりますか。", "c": ["光らない(または、ほとんど光らない)", "乾電池1個のときより明るく光る", "乾電池1個のときと同じ明るさで光る", "乾電池が並列つなぎのときと同じ明るさで光る"], "e": "向きが逆の乾電池は、電流を流そうとするはたらきが打ち消し合うので、豆電球はほとんど光りません。"}, {"id": "D001", "u": "電磁石のはたらき", "lv": "基礎", "r": 86, "f": "知識", "q": "導線をまいたコイルに鉄しんを入れ、電流を流すと磁石になるものを何といいますか。", "c": ["電磁石", "永久磁石", "方位磁針", "発電機"], "e": "電流を流している間だけ磁石になるものを電磁石といいます。"}, {"id": "D002", "u": "電磁石のはたらき", "lv": "基礎", "r": 82, "f": "しくみ・理由", "q": "電磁石の、ふつうの磁石(永久磁石)にはない特ちょうはどれですか。", "c": ["電流を止めると、磁石のはたらきがなくなる", "鉄を引きつける", "N極とS極がある", "はなれていても力がはたらく"], "e": "電磁石は電流を流している間だけ磁石になります。鉄を引きつけること、極があることは、ふつうの磁石と同じです。"}, {"id": "D003", "u": "電磁石のはたらき", "lv": "標準", "r": 66, "f": "知識", "q": "電磁石のN極とS極を入れかえるにはどうすればよいですか。", "c": ["電流の向きを逆にする", "コイルのまき数をふやす", "乾電池を直列にふやす", "鉄しんを太くする"], "e": "電流の向きを逆にすると、電磁石の極も入れかわります。まき数や電流の大きさを変えると、強さが変わります。"}, {"id": "D004", "u": "電磁石のはたらき", "lv": "標準", "r": 64, "f": "まちがい探し", "q": "電磁石を強くする方法として、ふさわしくないものはどれですか。", "c": ["鉄しんをアルミニウムのしんにかえる", "コイルのまき数をふやす", "乾電池を直列につないで電流を大きくする", "鉄しんを入れる"], "e": "鉄しんを入れると電磁石は強くなります。アルミニウムは磁石にならないので、強くなりません。"}, {"id": "D005", "u": "電磁石のはたらき", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "コイルのまき数と電磁石の強さの関係を調べる実験で、まき数以外にそろえる条件として最も大切なものはどれですか。", "c": ["導線全体の長さと、流す電流の大きさ", "実験する時刻", "導線の色", "つり上げるクリップの色"], "e": "まき数だけを変えて比べるため、導線の長さや電流の大きさなど、ほかの条件はそろえます。まかなかった導線は切らずに残しておきます。"}, {"id": "D006", "u": "電磁石のはたらき", "lv": "標準", "r": 58, "f": "知識", "q": "乾電池を並列に2個つないでも、電磁石の強さは1個のときとほぼ同じです。電磁石を強くするには乾電池をどうつなぎますか。", "c": ["直列につなぐ", "並列につなぐ", "向きを逆にしてつなぐ", "つなぎ方は関係ない"], "e": "直列につなぐとコイルに流れる電流が大きくなり、電磁石は強くなります。"}, {"id": "D007", "u": "電磁石のはたらき", "lv": "標準", "r": 62, "f": "知識", "q": "電磁石を利用しているものはどれですか。", "c": ["鉄くずを運ぶクレーン", "方位磁針", "虫めがね", "ふりこ時計"], "e": "電磁石のクレーンは、電流を流して鉄くずを持ち上げ、電流を止めて下ろします。モーターやスピーカーにも使われています。"}, {"id": "D008", "u": "電磁石のはたらき", "lv": "応用", "r": 50, "f": "しくみ・理由", "q": "ごみ処理場で、電磁石を使って取り出しやすいのはどれですか。", "c": ["スチール缶", "アルミ缶", "ペットボトル", "ガラスびん"], "e": "鉄でできたスチール缶は電磁石に引きつけられるので、ほかのごみから取り出せます。"}, {"id": "D009", "u": "電磁石のはたらき", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "電磁石の両はしに方位磁針を置いて電流を流すと、右はしの方位磁針のN極が電磁石の方を向きました。電磁石の右はしは何極ですか。", "c": ["S極", "N極", "極はない", "電流の大きさで変わる"], "e": "方位磁針のN極が引き寄せられたので、電磁石の右はしはS極です。"}, {"id": "D010", "u": "電磁石のはたらき", "lv": "応用", "r": 44, "f": "図の読み取り", "q": "電磁石の右はしに方位磁針を置いて電流を流すと、方位磁針のN極が電磁石の方を向きました。乾電池の向きを逆にすると、方位磁針はどうなりますか。", "c": ["S極が電磁石の方を向く", "N極が電磁石の方を向いたまま", "針が動かなくなる", "針がくるくる回り続ける"], "e": "電流の向きを逆にすると電磁石の極が入れかわり、右はしはN極になります。そのため方位磁針のS極が引き寄せられます。"}, {"id": "D011", "u": "電磁石のはたらき", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "リニアモーターカーは、電磁石を使って車体をうかせたり進めたりしています。電磁石が使われる理由として最もふさわしいものはどれですか。", "c": ["電流の向きや大きさで、極や強さを自由に切りかえられるから", "電流を流さなくても強い磁石だから", "鉄だけを引きつけ、ほかの金属をしりぞけるから", "電気を使わずに動かせるから"], "e": "電磁石は電流で極や強さを変えられるので、引き合う力としりぞけ合う力を切りかえて車体を前に進められます。"}, {"id": "D012", "u": "電磁石のはたらき", "lv": "過去問型", "r": 38, "f": "2文の正誤", "q": "次の2つの文の正誤の組み合わせとして正しいものはどれですか。\nI コイルに鉄しんを入れなくても、電流を流せば弱い磁石のはたらきがある。\nII 電磁石の強さは、コイルのまき数を多くするほど強くなる。", "c": ["I 正しい・II 正しい", "I 正しい・II 誤り", "I 誤り・II 正しい", "I 誤り・II 誤り"], "e": "鉄しんがなくても電流を流したコイルは弱い磁石になります。鉄しんを入れると強くなります。電流の大きさが同じなら、まき数が多いほど強くなります。"}, {"id": "D013", "u": "電磁石のはたらき", "lv": "標準", "r": 60, "f": "知識", "q": "電流を流した導線のそばに方位磁針を置くと、針はどうなりますか。", "c": ["針がふれる(向きが変わる)", "何も変わらない", "針がとける", "針が赤くなる"], "e": "電流が流れると、そのまわりに磁石の力が生まれるため、方位磁針の針がふれます。電磁石もこのはたらきを利用しています。"}, {"id": "D014", "u": "電磁石のはたらき", "lv": "応用", "r": 48, "f": "知識", "q": "モーターの中で、電磁石が回転しつづけるために使われている性質はどれですか。", "c": ["電磁石と磁石が引き合ったりしりぞけ合ったりする性質", "電磁石が熱を出す性質", "電磁石が光を出す性質", "電磁石が電気を通さない性質"], "e": "モーターは、電磁石の極を切りかえながら、まわりの磁石と引き合ったりしりぞけ合ったりして回ります。"}, {"id": "K001", "u": "昆虫①", "lv": "基礎", "r": 90, "f": "知識", "q": "昆虫のからだは、いくつの部分に分かれていますか。", "c": ["頭・胸・腹の3つ", "頭と胴の2つ", "頭・胸・腹・尾の4つ", "分かれていない"], "e": "昆虫のからだは頭・胸・腹の3つに分かれています。"}, {"id": "K002", "u": "昆虫①", "lv": "基礎", "r": 88, "f": "知識", "q": "昆虫のあしは何本で、からだのどこについていますか。", "c": ["6本で、胸についている", "6本で、腹についている", "8本で、胸についている", "8本で、腹についている"], "e": "昆虫のあしは6本で、すべて胸についています。はねも胸についています。"}, {"id": "K003", "u": "昆虫①", "lv": "基礎", "r": 84, "f": "まちがい探し", "q": "昆虫ではないものはどれですか。", "c": ["クモ", "カブトムシ", "トンボ", "アリ"], "e": "クモはあしが8本で、からだは頭胸部と腹部の2つに分かれているので昆虫ではありません。"}, {"id": "K004", "u": "昆虫①", "lv": "基礎", "r": 80, "f": "まちがい探し", "q": "昆虫ではないものはどれですか。", "c": ["ダンゴムシ", "セミ", "バッタ", "チョウ"], "e": "ダンゴムシはあしが14本あり、昆虫ではありません(エビやカニのなかま)。"}, {"id": "K005", "u": "昆虫①", "lv": "標準", "r": 64, "f": "知識", "q": "昆虫が呼吸のために空気を取り入れる穴を何といい、主にどこにありますか。", "c": ["気門といい、胸や腹の横にある", "鼻といい、頭にある", "えらといい、頭にある", "気門といい、あしの先にある"], "e": "昆虫は胸や腹の横にある気門から空気を取り入れています。"}, {"id": "K006", "u": "昆虫①", "lv": "標準", "r": 62, "f": "知識", "q": "チョウの口のつくりとして正しいものはどれですか。", "c": ["ストローのような口で、花のみつを吸う", "かむ口で、葉を食べる", "さす口で、動物の血を吸う", "なめる口で、木のしるをなめる"], "e": "チョウの口はストローのようにのびて、花のみつを吸います。ふだんはぜんまいのように丸まっています。"}, {"id": "K007", "u": "昆虫①", "lv": "標準", "r": 58, "f": "知識", "q": "かむ口をもち、植物の葉を食べる昆虫はどれですか。", "c": ["バッタ", "セミ", "カ", "チョウ"], "e": "バッタはかむ口で葉を食べます。セミは木にさして汁を吸い、カは動物の血を吸います。"}, {"id": "K008", "u": "昆虫①", "lv": "標準", "r": 60, "f": "知識", "q": "雑木林で、クヌギやコナラの木のしるに集まる昆虫として最もふさわしいものはどれですか。", "c": ["カブトムシ", "モンシロチョウ", "アメンボ", "ショウリョウバッタ"], "e": "カブトムシやクワガタムシ、カナブンは、クヌギやコナラの木から出るしるをなめにきます。夜に活動することが多いです。"}, {"id": "K009", "u": "昆虫①", "lv": "応用", "r": 48, "f": "知識", "q": "はねが2枚しかない昆虫はどれですか。", "c": ["ハエ", "チョウ", "トンボ", "カブトムシ"], "e": "ハエやカのはねは2枚です。多くの昆虫ははねが4枚です。カブトムシは前のかたいはね2枚の下に、うすい後ろばね2枚があります。"}, {"id": "K010", "u": "昆虫①", "lv": "応用", "r": 46, "f": "知識", "q": "昆虫の目について正しいものはどれですか。", "c": ["小さな目がたくさん集まった複眼と、明るさを感じる単眼がある", "目は1つしかない", "すべての昆虫に目がない", "複眼だけがあり、単眼をもつ昆虫はいない"], "e": "昆虫の多くは、小さな目が集まった大きな複眼と、小さな単眼をもっています。"}, {"id": "K011", "u": "昆虫①", "lv": "応用", "r": 50, "f": "しくみ・理由", "q": "コノハチョウがはねを閉じると、かれ葉のように見えます。このように、まわりのものに形や色をにせることを何といいますか。", "c": ["擬態", "変態", "冬眠", "脱皮"], "e": "まわりのものにすがたをにせることを擬態といい、敵に見つかりにくくなります。ナナフシ(木の枝)やシャクトリムシ(小枝)も擬態をしています。"}, {"id": "K012", "u": "昆虫①", "lv": "応用", "r": 44, "f": "2文の正誤", "q": "次の2つの文の正誤の組み合わせとして正しいものはどれですか。\nI 昆虫のはねは、すべて腹についている。\nII 昆虫のしょっ角は、ふつう2本で頭についている。", "c": ["I 誤り・II 正しい", "I 正しい・II 正しい", "I 正しい・II 誤り", "I 誤り・II 誤り"], "e": "はねは胸についています。しょっ角は頭に2本あり、においやまわりのようすを感じとります。"}, {"id": "K013", "u": "昆虫①", "lv": "過去問型", "r": 36, "f": "まちがい探し", "q": "次の生き物のうち、からだのつくりの特ちょうから昆虫といえるものはどれですか。", "c": ["あしが6本で、からだが3つに分かれ、はねがない生き物", "あしが8本で、からだが2つに分かれている生き物", "あしが10本以上あり、からだがたくさんの節に分かれている生き物", "あしが6本あるが、からだが2つに分かれている生き物"], "e": "はねのない昆虫もいます(働きアリなど)。昆虫かどうかは、あしが6本・からだが頭胸腹の3つに分かれていることで判断します。"}, {"id": "K014", "u": "昆虫①", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "カブトムシが夜に木のしるに集まるのはなぜだと考えられますか。最もふさわしいものを選びなさい。", "c": ["昼に活動する鳥などの敵に見つかりにくいから", "夜の方が木のしるがあまくなるから", "昼は木のしるが出ないから", "夜は気温が高いから"], "e": "夜に活動すると、昼に活動する鳥などの天敵から身を守りやすくなります。"}, {"id": "K015", "u": "昆虫①", "lv": "標準", "r": 58, "f": "知識", "q": "水の上をすべるように動く昆虫はどれですか。", "c": ["アメンボ", "カブトムシ", "カマキリ", "モンシロチョウ"], "e": "アメンボはあしの先に細かい毛があり、水の表面に立って、すべるように動きます。"}, {"id": "Y001", "u": "メダカの生態", "lv": "基礎", "r": 84, "f": "知識", "q": "メダカのオスの特ちょうとして正しいものはどれですか。", "c": ["背びれに切れこみがあり、しりびれが平行四辺形に近く大きい", "背びれに切れこみがなく、しりびれが小さい", "腹が大きくふくらんでいる", "体にもようがある"], "e": "オスは背びれに切れこみがあり、しりびれが大きく平行四辺形に近い形です。メスは背びれに切れこみがなく、しりびれは小さく、腹がふくらんでいます。"}, {"id": "Y002", "u": "メダカの生態", "lv": "基礎", "r": 86, "f": "知識", "q": "メダカのメスは、産んだ卵をどこにつけますか。", "c": ["水草", "水そうのガラス", "水面にうかべる", "すなの中にうめる"], "e": "メダカのメスは、卵を水草にからみつけます。卵には毛のようなものがあり、水草にくっつきます。"}, {"id": "Y003", "u": "メダカの生態", "lv": "基礎", "r": 80, "f": "知識", "q": "メダカの卵の大きさとして最も近いものはどれですか。", "c": ["約1mm", "約0.1mm", "約1cm", "約5cm"], "e": "メダカの卵は直径約1mmです。"}, {"id": "Y004", "u": "メダカの生態", "lv": "標準", "r": 64, "f": "知識", "q": "メダカを飼うときの方法として正しいものはどれですか。", "c": ["日光が直接当たらない明るい所に水そうを置き、くみ置きの水を使う", "日光が直接よく当たる所に置く", "水道の水をそのまま使う", "えさは食べ残すくらいたくさんあたえる"], "e": "直射日光が当たると水温が上がりすぎます。水道の水はくみ置きして使い、えさは食べ残さない量をあたえます。"}, {"id": "Y005", "u": "メダカの生態", "lv": "標準", "r": 62, "f": "知識", "q": "かえったばかりのメダカの子が、2〜3日えさを食べなくても育つのはなぜですか。", "c": ["腹のふくらみに養分がたくわえられているから", "水の中の空気を食べているから", "親がえさを運ぶから", "光を浴びて養分をつくるから"], "e": "かえったばかりの子は、腹のふくらみに養分をもっていて、しばらくはその養分で育ちます。"}, {"id": "Y006", "u": "メダカの生態", "lv": "標準", "r": 58, "f": "知識", "q": "メダカの卵が育つ順番として正しいものはどれですか。", "c": ["あわのようなものが見える→目ができる→心臓が動き血液が流れる→卵の中で動き、かえる", "目ができる→あわのようなものが見える→かえる→心臓が動く", "心臓が動く→あわのようなものが見える→目ができる→かえる", "かえる→目ができる→心臓が動く→あわのようなものが見える"], "e": "受精卵は、あわのようなものが見えるようになり、やがて目ができ、心臓が動いて血液が流れ、卵の中でよく動くようになってかえります。"}, {"id": "Y007", "u": "メダカの生態", "lv": "応用", "r": 50, "f": "計算", "q": "メダカの卵は、水温25℃では約11日でかえります。水温×日数がほぼ一定(約250)だとすると、水温20℃ではかえるまでに約何日かかりますか。", "c": ["約13日", "約8日", "約11日", "約20日"], "e": "250÷20=12.5なので、約13日かかります。水温が低いほど、かえるまでに日数がかかります。"}, {"id": "Y008", "u": "メダカの生態", "lv": "標準", "r": 60, "f": "知識", "q": "メダカが卵を産みやすいのは、1日のうちいつごろですか。", "c": ["早朝", "正午ごろ", "夕方", "真夜中"], "e": "メダカは早朝に卵を産むことが多いです。"}, {"id": "Y009", "u": "メダカの生態", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "メダカを入れた水そうの水をぐるぐるかき回すと、メダカは流れに逆らって泳ぎます。この性質を何といいますか。また、自然の中でどんな役に立ちますか。", "c": ["走流性といい、川の流れに流されず同じ場所にとどまれる", "走光性といい、明るい方へ集まれる", "擬態といい、敵から身をかくせる", "冬眠といい、寒い冬をこせる"], "e": "流れに逆らって泳ぐ性質を走流性といいます。これによって川の下流へ流されずにすみます。"}, {"id": "Y010", "u": "メダカの生態", "lv": "応用", "r": 46, "f": "2文の正誤", "q": "次の2つの文の正誤の組み合わせとして正しいものはどれですか。\nI メダカは、春から夏にかけて卵を産む。\nII メダカの卵は、オスとメスがいなくても受精卵になる。", "c": ["I 正しい・II 誤り", "I 正しい・II 正しい", "I 誤り・II 正しい", "I 誤り・II 誤り"], "e": "メダカは水温が上がり日が長くなる春から夏に卵を産みます。メスが産んだ卵にオスが精子をかけて受精卵になるので、オスとメスがいっしょに必要です。"}, {"id": "Y011", "u": "メダカの生態", "lv": "応用", "r": 44, "f": "図の読み取り", "q": "メダカが卵を産む時期と、日照時間・水温の関係を調べました。卵を産む時期として最もふさわしいものはどれですか。", "c": ["日照時間が長く、水温が高くなる時期", "日照時間が短く、水温が低い時期", "日照時間に関係なく、水温が最も低い時期", "1年中同じように産む"], "e": "メダカは、日が長くなり水温が上がる春から夏(4月〜9月ごろ)に卵を産みます。"}, {"id": "Y012", "u": "メダカの生態", "lv": "標準", "r": 58, "f": "知識", "q": "メダカのからだのつくりで、メスの腹がふくらんでいる理由として正しいものはどれですか。", "c": ["卵が入っているから", "えさを食べすぎたから", "空気が入っているから", "オスより年をとっているから"], "e": "メスの腹がふくらんでいるのは、中に卵があるからです。"}, {"id": "Y013", "u": "メダカの生態", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "日本の川や田んぼのメダカが減って、絶滅のおそれがある生き物に指定されています。原因としてふさわしくないものはどれですか。", "c": ["川の水がきれいになりすぎたから", "田んぼの水路がコンクリートになり、すみかや産卵場所が減ったから", "外来種のカダヤシなどに追いやられたから", "農薬などで水がよごれたから"], "e": "すみかの変化、水のよごれ、外来種などが原因と考えられています。"}, {"id": "Y014", "u": "メダカの生態", "lv": "標準", "r": 66, "f": "計算", "q": "メダカのメスが1日に20個の卵を産み、そのうち4分の3がかえりました。何びきかえりましたか。", "c": ["15ひき", "5ひき", "12ひき", "16ひき"], "e": "20×3/4=15で、15ひきかえります。"}, {"id": "F001", "u": "食物連鎖", "lv": "基礎", "r": 88, "f": "知識", "q": "生き物どうしの「食べる・食べられる」のつながりを何といいますか。", "c": ["食物連鎖", "光合成", "擬態", "変態"], "e": "食べる・食べられるの関係が、くさりのようにつながっていることを食物連鎖といいます。"}, {"id": "F002", "u": "食物連鎖", "lv": "基礎", "r": 84, "f": "知識", "q": "生態系の中で、植物のように光を使って自分で養分をつくる生き物を何といいますか。", "c": ["生産者", "消費者", "分解者", "捕食者"], "e": "植物は日光を使って養分をつくるので生産者とよばれます。動物は消費者です。"}, {"id": "F003", "u": "食物連鎖", "lv": "基礎", "r": 80, "f": "知識", "q": "落ち葉や動物の死がいなどを分解して、土の養分にもどす生き物を何といいますか。", "c": ["分解者", "生産者", "消費者", "寄生者"], "e": "カビやキノコなどの菌類や細菌などは、死がいやふんを分解して、植物が使える養分にもどします。"}, {"id": "F004", "u": "食物連鎖", "lv": "標準", "r": 64, "f": "図の読み取り", "q": "「食べる・食べられる」の関係として正しいものはどれですか(左が食べられる生き物)。", "c": ["イネ→バッタ→カエル→ヘビ", "バッタ→イネ→カエル→ヘビ", "イネ→カエル→バッタ→ヘビ", "ヘビ→カエル→バッタ→イネ"], "e": "植物(生産者)から始まり、草食の動物、それを食べる肉食の動物とつながります。"}, {"id": "F005", "u": "食物連鎖", "lv": "標準", "r": 62, "f": "知識", "q": "生き物の数の関係を、食べられる方を下にしてピラミッドの形で表したとき、いちばん数が多いのはどれですか。", "c": ["植物", "草食の動物", "小型の肉食の動物", "大型の肉食の動物"], "e": "食べられる生き物ほど数が多いので、生産者である植物がピラミッドのいちばん下で、いちばん多くなります。"}, {"id": "F006", "u": "食物連鎖", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ある草原で、シカを食べるオオカミを人間がすべて取りのぞきました。その後のシカの数の変化として最も考えられるものはどれですか。", "c": ["一時的に急に増えたあと、食べ物の草が足りなくなって急に減る", "ずっと増え続ける", "すぐに減って、いなくなる", "まったく変わらない"], "e": "天敵がいなくなるとシカは急に増えますが、草を食べつくして食べ物が足りなくなり、こんどは急に減ります。アメリカのカイバブ高原で実際に起きたことです。"}, {"id": "F007", "u": "食物連鎖", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "外来種ではないものはどれですか。", "c": ["メダカ", "アメリカザリガニ", "ブラックバス(オオクチバス)", "ウシガエル"], "e": "メダカは日本にもとからすむ生き物です。外来種は、人によってほかの地域から持ちこまれた生き物です。"}, {"id": "F008", "u": "食物連鎖", "lv": "標準", "r": 58, "f": "知識", "q": "水の中の小さな生き物で、植物のように緑色をして養分をつくるプランクトンはどれですか。", "c": ["ミカヅキモ", "ミジンコ", "ゾウリムシ", "ワムシ"], "e": "ミカヅキモやクンショウモ、ケイソウは植物プランクトンです。ミジンコやワムシは動物プランクトンです。"}, {"id": "F009", "u": "食物連鎖", "lv": "応用", "r": 50, "f": "知識", "q": "田んぼや池の中の食物連鎖として正しいものはどれですか(左が食べられる生き物)。", "c": ["植物プランクトン→ミジンコ→メダカ→ザリガニ", "ミジンコ→植物プランクトン→メダカ→ザリガニ", "メダカ→ミジンコ→植物プランクトン→ザリガニ", "ザリガニ→メダカ→ミジンコ→植物プランクトン"], "e": "水中でも、生産者である植物プランクトンから食物連鎖が始まります。"}, {"id": "F010", "u": "食物連鎖", "lv": "応用", "r": 46, "f": "2文の正誤", "q": "次の2つの文の正誤の組み合わせとして正しいものはどれですか。\nI 1種類の動物は、ふつう決まった1種類の生き物だけを食べている。\nII 食物連鎖は、実際にはあみの目のように複雑につながっている。", "c": ["I 誤り・II 正しい", "I 正しい・II 正しい", "I 正しい・II 誤り", "I 誤り・II 誤り"], "e": "多くの動物はいろいろな生き物を食べるので、食物連鎖はあみの目のようにつながっています(食物網)。"}, {"id": "F011", "u": "食物連鎖", "lv": "応用", "r": 44, "f": "しくみ・理由", "q": "池にブラックバスが放されると、もとからいた魚が減ることがあります。その理由として最もふさわしいものはどれですか。", "c": ["ブラックバスがもとからいた魚を食べ、天敵が少ないので増えるから", "ブラックバスが水をきれいにするから", "ブラックバスが植物プランクトンだけを食べるから", "もとからいた魚がブラックバスを食べるから"], "e": "外来種は、その土地に天敵がいないことが多く、もとからいる生き物を食べて増え、生態系のつり合いをくずします。"}, {"id": "F012", "u": "食物連鎖", "lv": "標準", "r": 60, "f": "知識", "q": "ビオトープとはどのような場所ですか。", "c": ["いろいろな生き物がくらせるように、自然に近い環境をつくった場所", "魚を育てて売るための池", "植物だけを育てる温室", "動物を見るための動物園"], "e": "ビオトープは、生き物がくらしやすい自然に近い環境をつくった場所です。学校や公園につくられることもあります。"}, {"id": "F013", "u": "食物連鎖", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "田んぼでカエルが急にいなくなったとします。そのすぐあとに起こると考えられることの組み合わせとして正しいものはどれですか。", "c": ["カエルに食べられていたバッタが増え、カエルを食べていたヘビが減る", "バッタもヘビも増える", "バッタもヘビも減る", "バッタが減り、ヘビが増える"], "e": "食べる相手がいなくなったヘビは減り、食べられることがなくなったバッタは増えます。その後、バッタが増えるとイネが食べられるなど、影響が広がります。"}, {"id": "F014", "u": "食物連鎖", "lv": "過去問型", "r": 38, "f": "知識", "q": "生産者・消費者・分解者のうち、どれか1つがいなくなっても生態系はなりたつでしょうか。分解者がいなくなった場合に起こることとして最もふさわしいものはどれですか。", "c": ["死がいや落ち葉が分解されずにたまり、植物が育つための養分が土にもどらなくなる", "植物が光合成できなくなる", "肉食の動物だけが増える", "何も変わらない"], "e": "分解者は、死がいや落ち葉を植物が使える養分にもどすはたらきをしています。"}, {"id": "F015", "u": "食物連鎖", "lv": "標準", "r": 62, "f": "知識", "q": "ミミズやダンゴムシは、生態系の中で主にどんなはたらきをしていますか。", "c": ["落ち葉などを食べて細かくし、分解を助ける", "光を使って養分をつくる", "大型の動物を食べる", "水をきれいにする光合成をする"], "e": "ミミズやダンゴムシは落ち葉などを食べ、土にもどるはたらきを助けます。"}, {"id": "S001", "u": "太陽①", "lv": "基礎", "r": 86, "f": "知識", "q": "太陽はどの方角からのぼり、どの方角にしずみますか。", "c": ["東からのぼり、南の空を通って西にしずむ", "西からのぼり、南の空を通って東にしずむ", "東からのぼり、北の空を通って西にしずむ", "北からのぼり、南にしずむ"], "e": "日本では、太陽は東からのぼり、南の空で最も高くなり、西にしずみます。"}, {"id": "S002", "u": "太陽①", "lv": "基礎", "r": 82, "f": "知識", "q": "太陽の光でできる影は、どちらの方向にできますか。", "c": ["太陽と反対の方向", "太陽と同じ方向", "いつも北", "いつも南"], "e": "影は、太陽の光がさえぎられてできるので、太陽と反対側にできます。"}, {"id": "S003", "u": "太陽①", "lv": "標準", "r": 64, "f": "知識", "q": "正午ごろ、太陽が南の空にあるとき、棒の影はどの方角にできますか。また、影の長さはどうですか。", "c": ["北にでき、1日のうちで最も短い", "南にでき、1日のうちで最も短い", "北にでき、1日のうちで最も長い", "東にでき、最も長い"], "e": "太陽が南にあるので影は北にできます。太陽が最も高いので、影は1日のうちで最も短くなります。"}, {"id": "S004", "u": "太陽①", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "午前10時・11時・12時に、棒の影の先に印をつけました。影の先は時間とともにどの向きに動きますか。", "c": ["西から北の方へ動く", "東から北の方へ動く", "北から西の方へ動く", "南から東の方へ動く"], "e": "太陽が東から南へ動くので、反対側にできる影は西から北の方へ動きます。"}, {"id": "S005", "u": "太陽①", "lv": "標準", "r": 62, "f": "知識", "q": "夕方に出る虹は、どの方角の空に見えますか。", "c": ["東", "西", "南", "北"], "e": "虹は太陽と反対側に見えます。夕方は太陽が西にあるので、虹は東の空に見えます。「夕方に虹が出ると晴れ」といわれます。"}, {"id": "S006", "u": "太陽①", "lv": "基礎", "r": 80, "f": "知識", "q": "太陽の表面の温度は約何℃ですか。", "c": ["約6000℃", "約600℃", "約60000℃", "約100℃"], "e": "太陽の表面温度は約6000℃です。"}, {"id": "S007", "u": "太陽①", "lv": "標準", "r": 62, "f": "知識", "q": "百葉箱の説明として正しいものはどれですか。", "c": ["白くぬられ、風通しのよいよろい戸になっていて、とびらは北向きである", "黒くぬられ、太陽の熱を吸収しやすくなっている", "とびらは南向きで、日光が中に入るようになっている", "コンクリートの上に置かれている"], "e": "百葉箱は、日光の熱をはね返す白色で、風通しのよいよろい戸です。とびらを開けたとき日光が入らないよう北向きで、しばふの上に置きます。"}, {"id": "S008", "u": "太陽①", "lv": "応用", "r": 50, "f": "知識", "q": "百葉箱の中の温度計は、地面からどのくらいの高さにありますか。", "c": ["1.2〜1.5mぐらい", "10cmぐらい", "3mぐらい", "地面にじかに置く"], "e": "気温は、地面から1.2〜1.5mぐらいの高さで、風通しのよい日かげではかります。"}, {"id": "S009", "u": "太陽①", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "晴れた日に、太陽の高さ・地面の温度・気温を1日中はかりました。最も高くなる時刻の順として正しいものはどれですか。", "c": ["太陽の高さ(12時ごろ)→地面の温度(13時ごろ)→気温(14時ごろ)", "気温→地面の温度→太陽の高さ", "地面の温度→太陽の高さ→気温", "3つとも12時ごろに同時に最も高くなる"], "e": "太陽が地面をあたため、あたためられた地面が空気をあたためるので、最高になる時刻は太陽の高さ→地温→気温の順におくれます。"}, {"id": "S010", "u": "太陽①", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "気温が高くなると見られる現象としてふさわしくないものはどれですか。", "c": ["カエデの紅葉", "サクラの開花", "コオロギの初鳴き", "ホタルの初見"], "e": "カエデの紅葉は、気温が低くなると見られる現象です。"}, {"id": "S011", "u": "太陽①", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "サクラの開花日を結んだ線(桜前線)は、南の地域から北の地域へ進みます。この理由として正しいものはどれですか。", "c": ["南の地域ほど早く暖かくなるから", "北の地域ほど早く暖かくなるから", "北の地域ほど日の出が早いから", "南の地域ほど雨が多いから"], "e": "サクラは暖かくなると咲くので、早く暖かくなる南から順に開花します。"}, {"id": "S012", "u": "太陽①", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "同じ緯度でも、桜前線は内陸部で南側に大きく曲がっています。その理由として最もふさわしいものはどれですか。", "c": ["内陸部は山が多く標高が高いため気温が低く、開花がおそいから", "内陸部は海に近く暖かいから", "内陸部は日の出がおそいから", "内陸部にはサクラの木が少ないから"], "e": "標高が高い山地は気温が低いので、同じ緯度の海ぞいより開花がおそくなります。"}, {"id": "S013", "u": "太陽①", "lv": "応用", "r": 44, "f": "2文の正誤", "q": "次の2つの文の正誤の組み合わせとして正しいものはどれですか。\nI くもりの日は、晴れの日より1日の気温の変化が小さい。\nII 晴れの日の気温は、ふつう正午に最も高くなる。", "c": ["I 正しい・II 誤り", "I 正しい・II 正しい", "I 誤り・II 正しい", "I 誤り・II 誤り"], "e": "くもりの日は日光が雲にさえぎられ、気温の変化が小さくなります。晴れの日の最高気温はふつう午後2時ごろです。"}, {"id": "S014", "u": "太陽①", "lv": "標準", "r": 60, "f": "知識", "q": "全国の約1300か所で、雨量・気温・風などを自動で観測する気象庁のしくみを何といいますか。", "c": ["アメダス", "百葉箱", "気象衛星ひまわり", "レーダー"], "e": "アメダス(地域気象観測システム)は、全国の観測所で雨量や気温などを自動で観測しています。"}, {"id": "S015", "u": "太陽①", "lv": "標準", "r": 58, "f": "知識", "q": "スギナのからだの一部で、春に子孫を残すためにのばす部分を何といいますか。", "c": ["ツクシ", "ワラビ", "ゼンマイ", "つぼみ"], "e": "ツクシはスギナが子孫を残すためにのばす部分で、胞子をとばします。"}, {"id": "H001", "u": "星①", "lv": "基礎", "r": 88, "f": "知識", "q": "北の空で、1年中ほぼ同じ位置に見える星を何といいますか。", "c": ["北極星", "シリウス", "ベガ", "アンタレス"], "e": "北極星はほぼ真北にあり、見える位置がほとんど変わりません。方角を知る目印になります。"}, {"id": "H002", "u": "星①", "lv": "基礎", "r": 82, "f": "知識", "q": "北極星をふくむ星座はどれですか。", "c": ["こぐま座", "おおぐま座", "カシオペヤ座", "オリオン座"], "e": "北極星は、こぐま座のしっぽの先にある2等星です。"}, {"id": "H003", "u": "星①", "lv": "基礎", "r": 80, "f": "知識", "q": "北斗七星は、何という星座の一部ですか。", "c": ["おおぐま座", "こぐま座", "カシオペヤ座", "はくちょう座"], "e": "北斗七星は、おおぐま座のしっぽの部分にある7つの星の集まりです。"}, {"id": "H004", "u": "星①", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "北斗七星を使って北極星を探すとき、ひしゃくの先の2つの星の間かくの約何倍の距離をのばしますか。", "c": ["約5倍", "約2倍", "約10倍", "約20倍"], "e": "北斗七星のひしゃくの先の2つの星の間かくを、約5倍のばした所に北極星があります。カシオペヤ座を使う方法でも約5倍です。"}, {"id": "H005", "u": "星①", "lv": "標準", "r": 64, "f": "知識", "q": "北の空の星は、北極星を中心にどちら回りに動いて見えますか。", "c": ["反時計回り", "時計回り", "東から西へ一直線", "動かない"], "e": "北の空の星は、北極星を中心に反時計回りに動いて見えます。地球が自転しているためにおこる見かけの動きです。"}, {"id": "H006", "u": "星①", "lv": "応用", "r": 50, "f": "計算", "q": "北の空の星は、1時間に約何度動いて見えますか。", "c": ["約15度", "約1度", "約30度", "約90度"], "e": "1日(24時間)で約360度動くので、360÷24=15で、1時間に約15度です。"}, {"id": "H007", "u": "星①", "lv": "応用", "r": 48, "f": "計算", "q": "毎日同じ時刻に北の空を観測すると、星は1か月に約何度動いて見えますか。", "c": ["約30度", "約1度", "約15度", "約90度"], "e": "1年(12か月)で約360度動くので、360÷12=30で、1か月に約30度です。地球が公転しているためにおこる見かけの動きです。"}, {"id": "H008", "u": "星①", "lv": "応用", "r": 46, "f": "計算", "q": "ある日の午後8時に北斗七星を観測しました。同じ日に、北斗七星が北極星を中心に反時計回りに90度動いて見えるのは何時ごろですか。", "c": ["午前2時ごろ", "午後11時ごろ", "午前0時ごろ", "午前8時ごろ"], "e": "1時間に15度動くので、90÷15=6時間後です。午後8時の6時間後は午前2時です。"}, {"id": "H009", "u": "星①", "lv": "過去問型", "r": 36, "f": "計算", "q": "5月上旬の午後8時に見えた北斗七星と同じ位置に、3か月後の8月上旬に北斗七星が見えるのは何時ごろですか。", "c": ["午後2時ごろ", "午後8時ごろ", "午前2時ごろ", "午後11時ごろ"], "e": "同じ時刻なら3か月で反時計回りに90度ずれます。これを時刻でもどすには、1時間15度なので90÷15=6時間前、つまり午後2時ごろです(実際は明るくて見えません)。"}, {"id": "H010", "u": "星①", "lv": "基礎", "r": 84, "f": "知識", "q": "太陽のように、自ら光を出している星を何といいますか。", "c": ["恒星", "惑星", "衛星", "すい星"], "e": "自ら光を出す星を恒星といいます。地球のように恒星のまわりを回る星が惑星、月のように惑星のまわりを回る星が衛星です。"}, {"id": "H011", "u": "星①", "lv": "標準", "r": 60, "f": "知識", "q": "月のように、惑星のまわりを公転している星を何といいますか。", "c": ["衛星", "恒星", "惑星", "一等星"], "e": "月は地球(惑星)のまわりを回る衛星です。"}, {"id": "H012", "u": "星①", "lv": "標準", "r": 62, "f": "計算", "q": "1等星の明るさは、6等星の明るさの何倍ですか。", "c": ["100倍", "6倍", "10倍", "2.5倍"], "e": "1等星は6等星のちょうど100倍の明るさです。1等級ちがうと約2.5倍ちがいます。"}, {"id": "H013", "u": "星①", "lv": "標準", "r": 58, "f": "知識", "q": "冬の大三角をつくる星の組み合わせとして正しいものはどれですか。", "c": ["シリウス・プロキオン・ベテルギウス", "ベガ・アルタイル・デネブ", "シリウス・ベガ・アンタレス", "リゲル・デネブ・アルタイル"], "e": "冬の大三角は、おおいぬ座のシリウス、こいぬ座のプロキオン、オリオン座のベテルギウスがつくります。"}, {"id": "H014", "u": "星①", "lv": "標準", "r": 58, "f": "知識", "q": "夏の大三角をつくる星と星座の組み合わせとして正しいものはどれですか。", "c": ["ベガ(こと座)・アルタイル(わし座)・デネブ(はくちょう座)", "ベガ(わし座)・アルタイル(こと座)・デネブ(はくちょう座)", "ベガ(こと座)・アルタイル(はくちょう座)・デネブ(わし座)", "シリウス(こと座)・アルタイル(わし座)・デネブ(はくちょう座)"], "e": "こと座のベガ(おりひめ星)、わし座のアルタイル(ひこ星)、はくちょう座のデネブが夏の大三角です。"}, {"id": "H015", "u": "星①", "lv": "応用", "r": 48, "f": "知識", "q": "赤い色に見える1等星の組み合わせとして正しいものはどれですか。", "c": ["ベテルギウスとアンタレス", "リゲルとシリウス", "ベガとデネブ", "スピカとレグルス"], "e": "恒星の色は表面温度で決まり、赤い星は温度が低い(約3000℃)星です。ベテルギウス(オリオン座)とアンタレス(さそり座)が代表です。"}, {"id": "H016", "u": "星①", "lv": "応用", "r": 46, "f": "知識", "q": "恒星の色と表面温度の関係として正しいものはどれですか。", "c": ["青白い星ほど温度が高く、赤い星ほど温度が低い", "赤い星ほど温度が高く、青白い星ほど温度が低い", "色と温度は関係ない", "黄色い星が最も温度が高い"], "e": "青白→白→黄→だいだい→赤の順に表面温度が低くなります。太陽や北極星は黄色(約6000℃)です。"}, {"id": "H017", "u": "星①", "lv": "標準", "r": 60, "f": "知識", "q": "星座早見で、東と西の向きが地図と反対になっているのはなぜですか。", "c": ["頭の上にかざして、空を見上げて使うから", "北半球で使うから", "星が東から西へ動くから", "印刷のまちがい"], "e": "星座早見は見たい方角を手前にして頭上にかざして使います。下から見上げるので、地図と東西が反対になります。"}, {"id": "H018", "u": "星①", "lv": "応用", "r": 50, "f": "知識", "q": "腕をのばしてにぎりこぶしを作ると、1つ分はおよそ何度の高さにあたりますか。", "c": ["約10度", "約1度", "約30度", "約45度"], "e": "うでをのばしたにぎりこぶし1つ分は約10度です。星の高さのおおよそをはかるのに使います。"}, {"id": "H019", "u": "星①", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "天体観測をするときの注意として、ふさわしくないものはどれですか。", "c": ["月が明るい満月の夜を選ぶ", "街の明かりが少ない場所を選ぶ", "方位磁針で方角を確かめる", "懐中電灯には赤いセロハンをはる"], "e": "満月の明るい夜は、月の光で暗い星が見えにくくなります。懐中電灯に赤いセロハンをはると、目が暗さになれたままでいられます。"}, {"id": "H020", "u": "星①", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "ハワイ島のマウナケア山(高さ約4200m)の山頂は、天体観測に向いています。その理由として最もふさわしいものはどれですか。", "c": ["標高が高く空気がうすく、ほこりや水蒸気が少ないうえ、まわりに街の明かりがないから", "標高が高く、星までの距離が近くなるから", "太陽に近く、明るいから", "赤道に近く、夜がないから"], "e": "空気がうすく、ちりや水蒸気が少ないので、星の光が空気にさまたげられにくくなります。"}, {"id": "H021", "u": "星①", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ハッブル宇宙望遠鏡のように、宇宙から星を観測するよい点として最もふさわしいものはどれですか。", "c": ["空気がないので、天候に左右されず、光が空気にさまたげられないこと", "星までの距離が半分になること", "昼でも太陽の光がないこと", "重力がないので星が止まって見えること"], "e": "宇宙には空気がないため、雲などの天候に関係なく、地上では観測できない暗い星まで観測できます。"}, {"id": "H022", "u": "星①", "lv": "応用", "r": 44, "f": "しくみ・理由", "q": "冬の夜、強い風がふいていると星がきらきらとまたたいて見えます。この理由として最もふさわしいものはどれですか。", "c": ["温度などがちがう空気が次々に流れ、星の光の曲がり方が変わり続けるから", "星が実際に明るくなったり暗くなったりするから", "冬は星が地球に近づくから", "風で星が動くから"], "e": "性質のちがう空気の境目で光が曲がり、その空気が風で次々入れかわるので、星がまたたいて見えます。"}, {"id": "H023", "u": "星①", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "あお向けに寝転んで、頭を北に向けて真上を見上げました。このとき、右手側はどの方角ですか。", "c": ["西", "東", "南", "北"], "e": "頭を北に向けてあお向けになると、顔は空を向いているので、右手側が西、左手側が東になります。星座早見で東西が逆になるのと同じ理由です。"}, {"id": "R001", "u": "天体総合(暦)", "lv": "標準", "r": 62, "f": "計算", "q": "ある日の日の出が6時23分、日の入りが16時31分でした。この日の昼の長さはどれですか。", "c": ["10時間8分", "10時間54分", "9時間8分", "11時間8分"], "e": "昼の長さ=日の入り−日の出です。16時31分−6時23分=10時間8分です。"}, {"id": "R002", "u": "天体総合(暦)", "lv": "応用", "r": 50, "f": "計算", "q": "ある日の日の出が6時23分、日の入りが16時31分でした。この日の太陽の南中時刻はどれですか。", "c": ["11時27分", "11時4分", "12時0分", "11時31分"], "e": "南中時刻=日の出+昼の長さ÷2です。10時間8分÷2=5時間4分なので、6時23分+5時間4分=11時27分です。"}, {"id": "R003", "u": "天体総合(暦)", "lv": "応用", "r": 48, "f": "計算", "q": "ある日の日の出が5時37分、日の入りが17時57分でした。この日の南中時刻はどれですか。", "c": ["11時47分", "12時10分", "11時57分", "12時17分"], "e": "昼の長さは17時57分−5時37分=12時間20分です。その半分の6時間10分を日の出に足して、5時37分+6時間10分=11時47分です。"}, {"id": "R004", "u": "天体総合(暦)", "lv": "標準", "r": 60, "f": "知識", "q": "日本の時刻の基準となる、兵庫県明石市を通る経線は東経何度ですか。", "c": ["東経135度", "東経140度", "東経130度", "東経0度"], "e": "東経135度(日本標準時子午線)で太陽が南中するときを、日本では正午としています。"}, {"id": "R005", "u": "天体総合(暦)", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "明石市(東経135度)より東にある東京で、太陽の南中時刻は正午と比べてどうなりますか。", "c": ["正午より早くなる", "正午よりおそくなる", "いつも正午ちょうど", "季節によって東京の方が必ずおそい"], "e": "太陽は東からのぼるので、東にある地点ほど日の出も南中も早くなります。東京の南中時刻は、正午より20分ほど早くなります(季節によって少し変わります)。"}, {"id": "R006", "u": "天体総合(暦)", "lv": "基礎", "r": 84, "f": "知識", "q": "月の満ち欠けの周期は約何日ですか。", "c": ["約29.5日", "約7日", "約15日", "約365日"], "e": "新月から次の新月まで、平均して約29.5日かかります。"}, {"id": "R007", "u": "天体総合(暦)", "lv": "基礎", "r": 80, "f": "知識", "q": "新月を0として、新月から何日たったかを表したものを何といいますか。", "c": ["月齢", "旧暦", "年齢", "暦日"], "e": "月齢は新月を0として数えた日数です。月齢約7で上弦の月、約15で満月、約22で下弦の月になります。"}, {"id": "R008", "u": "天体総合(暦)", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "図の月のうち、上弦の月はどれですか。", "c": ["A", "B", "C", "D"], "e": "上弦の月は右側(西側)半分が光る半月です。夕方に南の空に見え、真夜中に西にしずみます。", "mo": [["A", "上弦"], ["B", "下弦"], ["C", "三日月"], ["D", "二十七日"]]}, {"id": "R009", "u": "天体総合(暦)", "lv": "標準", "r": 64, "f": "知識", "q": "月が満ち欠けをするのはなぜですか。", "c": ["月が地球のまわりを公転し、地球から見て太陽に照らされている部分の見え方が変わるから", "月が自分で光る強さを変えているから", "地球のかげが月にうつるから", "月の形そのものが変わるから"], "e": "月は自ら光らず、太陽の光を反射しています。月が地球のまわりを回ると、光っている部分の見え方が変わります。"}, {"id": "R010", "u": "天体総合(暦)", "lv": "標準", "r": 58, "f": "知識", "q": "月はどちら側から満ちて、どちら側から欠けていきますか。", "c": ["右(西)側から満ちて、右(西)側から欠ける", "左(東)側から満ちて、左(東)側から欠ける", "右側から満ちて、左側から欠ける", "左側から満ちて、右側から欠ける"], "e": "月は右(西)側から光る部分が増え、満月のあとは右(西)側から欠けていきます。"}, {"id": "R011", "u": "天体総合(暦)", "lv": "応用", "r": 50, "f": "知識", "q": "満月が南の空で最も高くなるのは何時ごろですか。", "c": ["午前0時ごろ(真夜中)", "正午ごろ", "午後6時ごろ", "午前6時ごろ"], "e": "満月は太陽と反対側にあるので、夕方(18時ごろ)に東からのぼり、真夜中(0時ごろ)に南中し、明け方(6時ごろ)に西にしずみます。"}, {"id": "R012", "u": "天体総合(暦)", "lv": "応用", "r": 48, "f": "知識", "q": "上弦の月が南中するのは何時ごろですか。", "c": ["午後6時ごろ", "午前0時ごろ", "正午ごろ", "午前6時ごろ"], "e": "上弦の月は正午ごろ東からのぼり、午後6時ごろ南中し、午前0時ごろ西にしずみます。"}, {"id": "R013", "u": "天体総合(暦)", "lv": "応用", "r": 46, "f": "知識", "q": "下弦の月が見えるのはいつごろの、どの方角の空ですか。", "c": ["明け方、南の空", "夕方、南の空", "夕方、西の空", "真夜中、西の空"], "e": "下弦の月は真夜中に東からのぼり、明け方(6時ごろ)に南中して、正午ごろ西にしずみます。"}, {"id": "R014", "u": "天体総合(暦)", "lv": "標準", "r": 60, "f": "知識", "q": "三日月が見えるのは、いつごろのどの方角の空ですか。", "c": ["夕方、西(南西)の低い空", "明け方、東の空", "真夜中、南の高い空", "正午ごろ、南の空"], "e": "三日月は夕方に西の低い空に見え、日の入りから2〜3時間ほどでしずみます。"}, {"id": "R015", "u": "天体総合(暦)", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ある日の暦では、月の出が午前8時38分でした。それなのに、朝から月は空に見えませんでした。その理由として最もふさわしいものはどれですか。", "c": ["月が太陽に近い方向にあり、太陽の光の方が明るく、光っている部分もほとんど地球に向いていないから", "月の出の時刻が暦とずれていたから", "地球のかげに月が入っていたから", "月がその日は光を出していなかったから"], "e": "新月に近い月は太陽とほぼ同じ方向にあり、昼間の明るい空では見えません。"}, {"id": "R016", "u": "天体総合(暦)", "lv": "応用", "r": 46, "f": "知識", "q": "月の出の時刻は、1日たつとおよそどうなりますか。", "c": ["約50分おそくなる", "約50分早くなる", "毎日同じ", "約2時間おそくなる"], "e": "月は1日に約12度、地球のまわりを東へ動くので、月の出は毎日約50分ずつおそくなります。"}, {"id": "R017", "u": "天体総合(暦)", "lv": "標準", "r": 62, "f": "知識", "q": "地球の自転の向きとして正しいものはどれですか。", "c": ["北極側から見て反時計回り(西から東)", "北極側から見て時計回り(東から西)", "南から北", "向きは日によって変わる"], "e": "地球は北極側から見て反時計回りに自転しています。そのため、太陽や星は東から西へ動いて見えます。"}, {"id": "R018", "u": "天体総合(暦)", "lv": "基礎", "r": 80, "f": "知識", "q": "1年で昼が最も長い日を何といいますか。", "c": ["夏至", "冬至", "春分", "秋分"], "e": "夏至(6月22日ごろ)は昼が最も長く、冬至(12月22日ごろ)は昼が最も短い日です。"}, {"id": "R019", "u": "天体総合(暦)", "lv": "標準", "r": 58, "f": "知識", "q": "4年に1度、1年を366日にする年を何といいますか。また、それはなぜですか。", "c": ["うるう年で、地球の公転周期が約365日と6時間だから", "うるう年で、月の満ち欠けが約29.5日だから", "旧暦で、地球の自転が24時間だから", "うるう年で、太陽の大きさが変わるから"], "e": "地球は約365日と6時間で公転するので、6時間×4年=24時間分を4年に1度調整します。"}, {"id": "R020", "u": "天体総合(暦)", "lv": "応用", "r": 48, "f": "知識", "q": "月と太陽が地球から同じくらいの大きさに見えるのはなぜですか。", "c": ["太陽は月の約400倍大きいが、約400倍遠くにあるから", "太陽と月は同じ大きさだから", "月の方が太陽より大きいから", "太陽は月よりずっと近いから"], "e": "太陽の直径は月の約400倍ですが、地球からの距離も約400倍なので、同じくらいの大きさに見えます。"}, {"id": "R021", "u": "天体総合(暦)", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "昔の暦(旧暦)は月の満ち欠けをもとにしていました。この暦だけで12か月を1年とすると、困ることとして最もふさわしいものはどれですか。", "c": ["1年が約354日になり、季節とのずれがだんだん大きくなる", "毎月の日付と月の形が合わなくなる", "1年が400日以上になる", "曜日がなくなる"], "e": "29.5×12=約354日で、実際の1年(約365日)より約11日短くなります。そのため、うるう月を入れて調整していました。"}, {"id": "R022", "u": "天体総合(暦)", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "海水面が最も大きく上下する「大潮」になるのは、月の形がどのときですか。", "c": ["新月と満月のとき", "上弦と下弦の月のとき", "三日月のとき", "月の形とは関係ない"], "e": "新月や満月のときは太陽・地球・月が一直線にならび、月と太陽の引力が強め合うので大潮になります。"}, {"id": "R023", "u": "天体総合(暦)", "lv": "応用", "r": 44, "f": "図の読み取り", "q": "図の月を、新月の次から満ち欠けの順に並べたとき、正しいものはどれですか。", "c": ["C→A→D→B", "A→C→D→B", "C→D→A→B", "B→D→A→C"], "e": "三日月(C)→上弦の月(A)→満月(D)→下弦の月(B)の順です。", "mo": [["A", "上弦"], ["B", "下弦"], ["C", "三日月"], ["D", "満月"]]}, {"id": "R024", "u": "天体総合(暦)", "lv": "標準", "r": 60, "f": "知識", "q": "日本で、昼の長さと夜の長さがほぼ同じになる日はどれですか。", "c": ["春分と秋分", "夏至と冬至", "元日", "立春と立秋"], "e": "春分(3月21日ごろ)と秋分(9月23日ごろ)は、太陽が真東からのぼり真西にしずみ、昼と夜の長さがほぼ同じになります。"}, {"id": "R025", "u": "天体総合(暦)", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "季節によって夜に見える星座が変わるのはなぜですか。", "c": ["地球が太陽のまわりを公転しているから", "地球が自転しているから", "星座が季節ごとに動くから", "月が地球のまわりを回っているから"], "e": "地球が公転すると、夜に向いている方向(太陽と反対側)が変わるので、見える星座が変わります。"}, {"id": "N001", "u": "燃焼と酸素", "lv": "基礎", "r": 86, "f": "知識", "q": "ろうそくのしんにマッチの火を近づけたとき、ろうはどのように変化して燃えますか。", "c": ["固体→液体→気体になって燃える", "固体のまま燃える", "液体のまま燃える", "気体→液体→固体になって燃える"], "e": "ろうの固体が熱でとけて液体になり、しんを上がって、さらに熱で気体になってから燃えます。燃えているのはろうの気体です。"}, {"id": "N002", "u": "燃焼と酸素", "lv": "基礎", "r": 84, "f": "知識", "q": "ろうそくの炎で、最も明るい部分はどこですか。", "c": ["内炎", "外炎", "炎心", "どこも同じ"], "e": "内炎では、ろうの気体が熱で分解してできたすす(炭素のつぶ)が熱せられて、明るくかがやきます。"}, {"id": "N003", "u": "燃焼と酸素", "lv": "基礎", "r": 82, "f": "知識", "q": "ろうそくの炎で、最も温度が高い部分はどこですか。", "c": ["外炎", "内炎", "炎心", "しんのすぐ上"], "e": "外炎は空気(酸素)と十分にふれ合い、完全燃焼しているので、最も温度が高く(約1400℃)なります。"}, {"id": "N004", "u": "燃焼と酸素", "lv": "標準", "r": 64, "f": "知識", "q": "炎心の説明として正しいものはどれですか。", "c": ["温度が低く暗い部分で、これから燃えるろうの気体がある", "最も明るい部分で、すすがかがやいている", "最も温度が高く、完全燃焼している", "空気だけがある部分"], "e": "炎心は炎の最も内側で、温度が低く(約300℃)暗くなっています。"}, {"id": "N005", "u": "燃焼と酸素", "lv": "標準", "r": 62, "f": "知識", "q": "ろうそくの炎の内炎と炎心に細いガラス管を入れると、管の先からけむりが出てきます。正しい組み合わせはどれですか。", "c": ["内炎からは黒いけむり(すす)、炎心からは白いけむり(ろうの液体や固体)", "内炎からは白いけむり、炎心からは黒いけむり", "どちらからも黒いけむり", "どちらからもけむりは出ない"], "e": "内炎にはすす、炎心にはまだ燃えていないろうの気体があり、管の中で冷えて白いけむり(ろうの液体や固体のつぶ)になります。外炎に入れてもけむりは出ません。"}, {"id": "N006", "u": "燃焼と酸素", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "ぬらしたわりばしを、ろうそくの炎の中ほど(炎心・内炎・外炎のすべてを横切る高さ)に水平に入れました。こげ方として正しいものはどれですか。", "c": ["外炎にふれた2か所がこげ、まん中はこげない", "まん中だけがこげる", "全体が同じようにこげる", "まったくこげない"], "e": "最も温度が高いのは外炎なので、わりばしは外炎にふれた部分だけがこげます。"}, {"id": "N007", "u": "燃焼と酸素", "lv": "標準", "r": 58, "f": "しくみ・理由", "q": "燃えているろうそくのまわりでは、空気はどのように流れていますか。", "c": ["あたためられた空気が上へのぼり、下から冷たい空気が流れこむ", "上から冷たい空気が下りてくる", "空気はまったく動かない", "横からだけ空気が流れる"], "e": "炎であたためられた空気は軽くなって上へのぼり、下から新しい空気が流れこみます。そのため炎は縦長の形になります。"}, {"id": "N008", "u": "燃焼と酸素", "lv": "基礎", "r": 80, "f": "知識", "q": "物が燃えるための3つの条件として、ふさわしくないものはどれですか。", "c": ["まわりが明るいこと", "燃える物があること", "酸素が十分にあること", "発火点以上の温度であること"], "e": "燃焼には「燃える物」「酸素」「発火点以上の温度」の3つがそろうことが必要です。どれか1つでも欠けると火は消えます。"}, {"id": "N009", "u": "燃焼と酸素", "lv": "標準", "r": 62, "f": "知識", "q": "燃焼とはどのような現象ですか。", "c": ["物が熱と光を出しながら、激しく酸素と結びつく現象", "物が水に溶ける現象", "物が冷えて固まる現象", "物が二酸化炭素と結びつく現象"], "e": "燃焼は、熱と光を出しながら激しく酸素と結びつく現象です。"}, {"id": "N010", "u": "燃焼と酸素", "lv": "応用", "r": 50, "f": "しくみ・理由", "q": "ろうそくの火を息で吹き消しました。主にどの条件がなくなったためですか。", "c": ["燃える物(ろうの気体)がなくなったため", "酸素がなくなったため", "温度が発火点以上になったため", "まわりの空気が増えたため"], "e": "息を吹きかけると、燃えているろうの気体が吹き飛ばされ、燃える物がなくなるので火が消えます。"}, {"id": "N011", "u": "燃焼と酸素", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "燃えているろうそくの炎にゆっくり金網をかぶせると、金網より上の炎が消えました。主にどの条件がなくなったためですか。", "c": ["金網に熱をうばわれ、温度が発火点より低くなったため", "燃える物がなくなったため", "酸素がなくなったため", "金網が酸素を出したため"], "e": "金属の金網は熱をよく伝えるので炎の熱をうばいます。温度が発火点より下がって、上の炎が消えます。"}, {"id": "N012", "u": "燃焼と酸素", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "燃えているろうそくのしんをピンセットで強くつまむと火が消えました。その理由として正しいものはどれですか。", "c": ["ろうの液体がしんを上がれなくなり、燃える物がなくなったため", "ピンセットが酸素を吸いとったため", "ピンセットで温度が上がったため", "しんが長くなったため"], "e": "しんをつまむと、とけたろうがしんを上がれず、ろうの気体ができなくなります。"}, {"id": "N013", "u": "燃焼と酸素", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "燃えているアルコールランプの火の消し方として、正しいものはどれですか。", "c": ["ふたを横からかぶせて消す", "息で吹き消す", "水をかけて消す", "ふたをせずに燃えつきるまで待つ"], "e": "アルコールランプはふたをして、酸素が不足するようにして消します。吹き消すのはきけんです。"}, {"id": "N014", "u": "燃焼と酸素", "lv": "標準", "r": 58, "f": "知識", "q": "アルコールランプを使うときの正しい準備はどれですか。", "c": ["アルコールは8分目くらい入れ、しんは5mmくらい出す", "アルコールはいっぱいまで入れ、しんは2cm出す", "アルコールは半分以下にし、しんは出さない", "アルコールは2分目、しんは1cm出す"], "e": "アルコールは容器の8分目くらいまで入れ、しんは5mmくらい出します。火をつけたアルコールランプからほかのランプへ火を移してはいけません。"}, {"id": "N015", "u": "燃焼と酸素", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "アルコールランプの炎が、ろうそくの炎より暗いのはなぜですか。", "c": ["アルコールはすす(炭素のつぶ)ができにくいから", "アルコールは燃えるときに水が出るから", "アルコールの炎は温度が高すぎるから", "アルコールランプには炎心がないから"], "e": "ろうそくの内炎が明るいのは、すすが熱せられてかがやくからです。アルコールはろうより炭素が少なく、すすができにくいので暗い炎になります。"}, {"id": "N016", "u": "燃焼と酸素", "lv": "応用", "r": 50, "f": "しくみ・理由", "q": "アルコールランプは、マッチの火をしんに近づけるとすぐに火がつきます。ろうそくより火がつきやすい理由として正しいものはどれですか。", "c": ["アルコールはとても気体になりやすいから", "アルコールは固体だから", "アルコールの発火点がとても高いから", "しんがろうそくより太いから"], "e": "ろうそくは固体のろうをとかし、さらに気体にする時間がかかります。アルコールは液体で、すぐに気体になるので、すぐに火がつきます。"}, {"id": "N017", "u": "燃焼と酸素", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "ろうそくの火を吹き消した直後に出る白いけむりにマッチの火を近づけると、ろうそくに再び火がつきました。このことから分かることはどれですか。", "c": ["白いけむりにはろうの気体(燃える物)がふくまれている", "白いけむりは水蒸気である", "白いけむりは酸素でできている", "白いけむりは二酸化炭素である"], "e": "白いけむりにはろうの気体やつぶがふくまれていて、それに火がつき、しんまで火がもどります。"}, {"id": "N018", "u": "燃焼と酸素", "lv": "基礎", "r": 84, "f": "知識", "q": "空気中に最も多くふくまれる気体と、2番目に多い気体の組み合わせとして正しいものはどれですか。", "c": ["窒素(約78%)と酸素(約21%)", "酸素(約78%)と窒素(約21%)", "窒素(約78%)と二酸化炭素(約21%)", "二酸化炭素(約78%)と酸素(約21%)"], "e": "空気の約5分の4が窒素、約5分の1が酸素です。二酸化炭素は約0.04%しかありません。"}, {"id": "N019", "u": "燃焼と酸素", "lv": "標準", "r": 60, "f": "知識", "q": "酸素の性質として正しいものの組み合わせはどれですか。", "c": ["無色・無臭で、水に溶けにくく、空気よりわずかに重い", "無色・無臭で、水に溶けやすく、空気より軽い", "黄緑色で、においがあり、水に溶けやすい", "無色・無臭で、自分自身がよく燃える"], "e": "酸素は無色・無臭、空気の約1.1倍の重さで、水に溶けにくい気体です。"}, {"id": "N020", "u": "燃焼と酸素", "lv": "標準", "r": 62, "f": "知識", "q": "酸素には物が燃えるのを助ける性質があります。この性質を何といいますか。また、酸素自体は燃えますか。", "c": ["助燃性といい、酸素自体は燃えない", "助燃性といい、酸素自体もよく燃える", "可燃性といい、酸素自体は燃えない", "可燃性といい、酸素自体もよく燃える"], "e": "物が燃えるのを助ける性質を助燃性といいます。酸素自体は燃えません。"}, {"id": "N021", "u": "燃焼と酸素", "lv": "標準", "r": 60, "f": "知識", "q": "酸素を集めた集気びんに、火のついたろうそく・線香・木炭を入れました。正しいものはどれですか。", "c": ["ろうそくは大きく明るい炎をあげ、線香は炎をあげ、木炭は明るく輝いて燃える", "どれもすぐに火が消える", "ろうそくだけが燃え、線香と木炭は消える", "どれも空気中と変わらない燃え方をする"], "e": "酸素中では、空気中より激しく燃えます。"}, {"id": "N022", "u": "燃焼と酸素", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "窒素だけを満たした集気びんに火のついたろうそくを入れると、どうなりますか。", "c": ["すぐに火が消える", "空気中より激しく燃える", "空気中と同じように燃える", "窒素が燃えて大きな炎になる"], "e": "窒素には物を燃やすはたらきがないので、酸素がない窒素中では火はすぐに消えます。"}, {"id": "N023", "u": "燃焼と酸素", "lv": "標準", "r": 58, "f": "知識", "q": "空気中の酸素は、主にどのようなはたらきでつくられてきましたか。", "c": ["植物の光合成", "動物の呼吸", "物が燃えること", "火山のふん火"], "e": "酸素は植物の光合成でつくられます。地球にはもともと酸素がほとんどありませんでしたが、光合成をする生き物があらわれて増えました。"}, {"id": "N024", "u": "燃焼と酸素", "lv": "応用", "r": 48, "f": "知識", "q": "空気やはく息の中に、ある気体がどれだけふくまれているかを調べる道具を何といいますか。", "c": ["気体検知管", "メスシリンダー", "上皿てんびん", "けんび鏡"], "e": "気体検知管で酸素用のものを使うと、空気中の酸素は約21%と読み取れます。はく息では酸素が減り、約17%ほどになります。"}, {"id": "N025", "u": "燃焼と酸素", "lv": "応用", "r": 50, "f": "図の読み取り", "q": "太さが同じで長さのちがうつつを3本用意し、それぞれに同じろうそくを入れて火をつけ、ふたをしました。火が消える順として正しいものはどれですか。", "c": ["短いつつ→中くらいのつつ→長いつつの順に消える", "長いつつ→中くらいのつつ→短いつつの順に消える", "3本とも同時に消える", "3本とも消えない"], "e": "つつが長いほど中の空気(酸素)が多いので、長く燃えます。"}, {"id": "N026", "u": "燃焼と酸素", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "燃えているろうそくに上下があいた長いつつをかぶせると、火が消えました。つつを使ったまま燃え続けさせる方法として、ふさわしくないものはどれですか。", "c": ["つつの上にふたをする", "つつの下の方に穴をあける", "つつの下にわりばしをしいて、すき間をつくる", "つつの上の口に仕切り板を入れる"], "e": "空気の入口と出口ができれば、下から新しい空気が入り、上からあたためられた空気が出ていく流れができて燃え続けます。ふたをすると空気が入れかわりません。"}, {"id": "N027", "u": "燃焼と酸素", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "ろうそくの炎を大きくする方法として、最もふさわしいものはどれですか。", "c": ["ろうそくの太さはそのままで、しんだけを太くする", "しんの太さはそのままで、ろうそくを太くする", "ろうそくをけずり、しんを長く出す", "ろうそくを冷やしておく"], "e": "しんが太いほど、とけたろうをたくさん吸い上げ、ろうの気体が多くできるので炎が大きくなります。"}, {"id": "N028", "u": "燃焼と酸素", "lv": "過去問型", "r": 34, "f": "しくみ・理由", "q": "両はしからしんを出したろうそくの真ん中にくぎをさし、水平につり合わせました。右のしんだけに火をつけると、左側が下がりました。その理由として正しいものはどれですか。", "c": ["右側のろうがとけて落ち、右側が軽くなったから", "右側のろうが熱で重くなったから", "炎が右側を上におし上げたから", "左側のろうが冷えて重くなったから"], "e": "火をつけた側はろうがとけて垂れ落ちるので軽くなり、反対側が下がります。両方に火をつけると、下がった側のろうが多くとけて軽くなるので、上がったり下がったりをくり返します。"}, {"id": "N029", "u": "燃焼と酸素", "lv": "標準", "r": 62, "f": "知識", "q": "「ツバメが低く飛ぶと雨」といわれる理由として正しいものはどれですか。", "c": ["雨が近いと湿気が多く、ツバメのえさの小さな虫が低く飛ぶから", "雨が近いとツバメが寒くて飛べなくなるから", "雨が近いと風が強くなるから", "雨の日はツバメが巣にもどるから"], "e": "雨が近いと湿気で虫のはねが重くなり、虫が低く飛びます。それを食べるツバメも低く飛びます。ツバメは春に南から来て、秋に南へ帰る夏鳥です。"}, {"id": "N030", "u": "燃焼と酸素", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "夏鳥ではない鳥はどれですか。", "c": ["スズメ", "ツバメ", "カッコウ", "オオルリ"], "e": "スズメは1年中同じ地域でくらす留鳥です。カッコウはほかの鳥の巣に卵を産む「托卵」で知られる夏鳥です。"}, {"id": "N031", "u": "燃焼と酸素", "lv": "応用", "r": 48, "f": "知識", "q": "国際宇宙ステーション(ISS)の説明として正しいものはどれですか。", "c": ["地上約400kmの上空を、約90分で地球を一周している", "地上約38万kmの上空を、約1日で一周している", "地上約40kmの上空で、止まっている", "月のまわりを約27日で一周している"], "e": "ISSは地上約400km上空の有人実験施設で、約90分で地球を一周します。日本の実験棟「きぼう」があります。"}, {"id": "N032", "u": "燃焼と酸素", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "アブラナ科の野菜で、主に地下の茎を食べるものはどれですか。", "c": ["ワサビ", "ブロッコリー", "ハクサイ", "ナノハナ"], "e": "ワサビは地下の茎(根茎)をすりおろして食べます。ブロッコリーはつぼみや茎、ハクサイは葉を食べます。"}, {"id": "C001", "u": "二酸化炭素", "lv": "基礎", "r": 86, "f": "知識", "q": "ろうそくが燃えたあとの集気びんに石灰水を入れてふると、どうなりますか。", "c": ["白くにごる", "青くなる", "赤くなる", "変化しない"], "e": "石灰水は二酸化炭素と反応すると白くにごります。ろうそくが燃えて二酸化炭素ができたことが分かります。"}, {"id": "C002", "u": "二酸化炭素", "lv": "基礎", "r": 82, "f": "知識", "q": "ろうそくを燃やしたあとの集気びんの内側がくもりました。何ができたことが分かりますか。", "c": ["水(水蒸気)", "二酸化炭素", "酸素", "窒素"], "e": "ろうにふくまれる水素が酸素と結びついて水蒸気ができ、ガラスにふれて冷えて水滴になります。"}, {"id": "C003", "u": "二酸化炭素", "lv": "標準", "r": 62, "f": "知識", "q": "水にふれると青色から赤色に変わり、水があることを確かめるのに使う紙はどれですか。", "c": ["塩化コバルト紙", "リトマス紙", "ろ紙", "BTB液をしみこませた紙"], "e": "塩化コバルト紙は水をふくむと青色から赤色に変わります。"}, {"id": "C004", "u": "二酸化炭素", "lv": "標準", "r": 64, "f": "知識", "q": "ろうの気体は熱で分解されて何と何になり、それぞれ酸素と結びついて何ができますか。", "c": ["炭素→二酸化炭素、水素→水(水蒸気)", "炭素→水、水素→二酸化炭素", "窒素→二酸化炭素、水素→水", "炭素→酸素、水素→窒素"], "e": "ろうには炭素と水素がふくまれています。炭素と酸素が結びつくと二酸化炭素、水素と酸素が結びつくと水ができます。"}, {"id": "C005", "u": "二酸化炭素", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "集気びんの中でろうそくを燃やし、火が消えたあとの気体を調べました。燃やす前と比べた変化として正しいものはどれですか。", "c": ["酸素は約21%から約16%に減り、二酸化炭素は約0.04%から約5%に増えた", "酸素はすべてなくなり、二酸化炭素が約21%になった", "窒素が減って二酸化炭素が増えた", "酸素も二酸化炭素も変わらなかった"], "e": "火が消えても酸素は約16%残っています。窒素は約78%のまま変わりません。"}, {"id": "C006", "u": "二酸化炭素", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "集気びんの中でろうそくの火が消えたあとも、酸素は約16%残っていました。このことから分かることとして正しいものはどれですか。", "c": ["ろうそくが燃え続けるには、ある程度以上の酸素の割合が必要である", "酸素がすべてなくならないと火は消えない", "酸素は燃焼に関係しない", "二酸化炭素が増えなければ火は消えない"], "e": "酸素が少しでもあれば燃えるわけではなく、酸素の割合が一定より少なくなると火は消えます。"}, {"id": "C007", "u": "二酸化炭素", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "火が消えた理由について「二酸化炭素が増えたから」「酸素が減ったから」の2つの仮説を考えました。集気びんに「酸素1/5・二酸化炭素4/5」を入れるとろうそくはよく燃え、「酸素1/10・窒素9/10」では火がすぐ消えました。正しい考えはどれですか。", "c": ["酸素が減ったことが原因で、二酸化炭素が増えたことは原因ではない", "二酸化炭素が増えたことが原因で、酸素は関係ない", "どちらも原因である", "どちらも原因ではない"], "e": "二酸化炭素が多くても酸素が1/5あれば燃えたので、二酸化炭素は火を消す原因ではありません。酸素が1/10に減ると消えたので、酸素の減少が原因です。"}, {"id": "C008", "u": "二酸化炭素", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "二酸化炭素だけを入れた集気びんにろうそくを入れると、火がすぐ消えました。この実験だけでは「二酸化炭素が増えたから消えた」とはいえません。その理由はどれですか。", "c": ["酸素がない状態でもあるので、酸素がないから消えた可能性もあるから", "二酸化炭素は燃えるから", "集気びんにふたをしていないから", "ろうそくが短いから"], "e": "二酸化炭素だけのびんには酸素もありません。原因を1つにしぼるには、ほかの条件をそろえて比べる必要があります。"}, {"id": "C009", "u": "二酸化炭素", "lv": "基礎", "r": 84, "f": "知識", "q": "木炭を燃やすと、どのように燃えますか。", "c": ["炎をあげずに赤く光って燃える", "大きな炎をあげて燃える", "青い炎をあげて燃える", "光らずにとける"], "e": "木炭は固体のまま燃えるので、炎をあげずに赤く光って燃えます。"}, {"id": "C010", "u": "二酸化炭素", "lv": "標準", "r": 62, "f": "知識", "q": "木炭を燃やしたとき、できる物として正しいものはどれですか。", "c": ["二酸化炭素はできるが、水(水蒸気)はできない", "水はできるが、二酸化炭素はできない", "二酸化炭素も水もできる", "何もできない"], "e": "木炭はほぼ炭素だけでできていて、水素をふくまないので水はできません。"}, {"id": "C011", "u": "二酸化炭素", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "燃やしたあとに石灰水を白くにごらせないものはどれですか。", "c": ["スチールウール(鉄)", "紙", "アルコール", "砂糖"], "e": "炭素をふくむ物が燃えると二酸化炭素ができます。鉄は炭素をふくまないので二酸化炭素はできません。"}, {"id": "C012", "u": "二酸化炭素", "lv": "応用", "r": 50, "f": "知識", "q": "スチールウールを燃やしたあとの重さは、燃やす前と比べてどうなりますか。", "c": ["重くなる", "軽くなる", "変わらない", "なくなる"], "e": "鉄が酸素と結びついて酸化鉄(鉄の黒さび)ができ、結びついた酸素の分だけ重くなります。"}, {"id": "C013", "u": "二酸化炭素", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "木炭を燃やすと、燃えたあとに残る物は燃やす前より軽くなります。その理由として正しいものはどれですか。", "c": ["木炭の炭素が酸素と結びついて気体の二酸化炭素になり、空気中に出ていくから", "木炭の中の水がすべて蒸発するから", "木炭が酸素と結びついて固体になるから", "燃やすと重さが必ず減るから"], "e": "できた物が気体なら出ていくので軽くなり、固体ならその場に残るので重くなります。"}, {"id": "C014", "u": "二酸化炭素", "lv": "過去問型", "r": 38, "f": "まちがい探し", "q": "燃焼さじにのせて燃やしたとき、燃やしたあとの方が軽くなるものの組み合わせとして正しいものはどれですか。", "c": ["紙・砂糖・アルコール", "鉄・紙・砂糖", "食塩・鉄・紙", "食塩・砂糖・アルコール"], "e": "炭素や水素をふくむ物は二酸化炭素や水になって出ていくので軽くなります。鉄は重くなり、食塩は燃えません。"}, {"id": "C015", "u": "二酸化炭素", "lv": "標準", "r": 62, "f": "知識", "q": "二酸化炭素の性質として正しいものの組み合わせはどれですか。", "c": ["無色・無臭で、空気の約1.5倍の重さ、水に溶けやすい", "無色・無臭で、空気より軽く、水に溶けにくい", "黄色で、においがあり、水に溶けにくい", "無色・無臭で、物が燃えるのを助ける"], "e": "二酸化炭素は空気より重く、酸素や窒素と比べて水に溶けやすい気体です。燃えたり、燃えるのを助けたりするはたらきはありません。"}, {"id": "C016", "u": "二酸化炭素", "lv": "標準", "r": 60, "f": "知識", "q": "二酸化炭素の固体を何といいますか。また、温めるとどうなりますか。", "c": ["ドライアイスといい、液体にならずに直接気体になる", "ドライアイスといい、とけて液体になる", "氷といい、とけて水になる", "石灰といい、白い粉になる"], "e": "ドライアイスは固体から直接気体に変化します(昇華)。"}, {"id": "C017", "u": "二酸化炭素", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "水の入った容器にドライアイスを入れると、白いけむりが出てきました。この白いけむりの正体はどれですか。", "c": ["冷やされた水蒸気が小さな水のつぶになったもの", "二酸化炭素の気体", "ドライアイスの粉", "酸素の気体"], "e": "二酸化炭素は無色透明で見えません。ドライアイスで冷やされた空気中の水蒸気が、小さな水や氷のつぶになって白く見えます。"}, {"id": "C018", "u": "二酸化炭素", "lv": "標準", "r": 58, "f": "知識", "q": "二酸化炭素が溶けている水溶液を何といいますか。", "c": ["炭酸水", "石灰水", "食塩水", "アンモニア水"], "e": "炭酸水を温めたりふったりすると、溶けていた二酸化炭素が出てきます。"}, {"id": "C019", "u": "二酸化炭素", "lv": "応用", "r": 50, "f": "しくみ・理由", "q": "水を入れたペットボトルに二酸化炭素を入れてよくふると、ペットボトルがへこみました。その理由はどれですか。", "c": ["二酸化炭素が水に溶けて、中の気体が減ったから", "二酸化炭素が燃えたから", "二酸化炭素が軽くて上に逃げたから", "水が二酸化炭素に変わったから"], "e": "二酸化炭素は水に溶けやすいので、中の気体が減ってまわりの空気におされてへこみます。酸素ではほとんどへこみません。"}, {"id": "C020", "u": "二酸化炭素", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "高さのちがう火のついたろうそくを立てたビーカーに、二酸化炭素を静かに流しこむと、短いろうそくから順に火が消えました。分かることの組み合わせはどれですか。", "c": ["空気より重く、物を燃やすはたらきがない", "空気より軽く、物を燃やすはたらきがない", "空気より重く、物が燃えるのを助ける", "空気より軽く、物が燃えるのを助ける"], "e": "二酸化炭素は空気より重いので下からたまり、火を消していきます。"}, {"id": "C021", "u": "二酸化炭素", "lv": "標準", "r": 60, "f": "知識", "q": "空気中の二酸化炭素の割合として最も近いものはどれですか。", "c": ["約0.04%", "約4%", "約21%", "約78%"], "e": "二酸化炭素は空気中に約0.04%(約2500分の1)しかありませんが、年々増え続けています。"}, {"id": "C022", "u": "二酸化炭素", "lv": "標準", "r": 62, "f": "知識", "q": "二酸化炭素のように、地面から宇宙へ逃げようとする熱をよく吸収する気体を何といいますか。", "c": ["温室効果ガス", "助燃性ガス", "可燃性ガス", "温暖ガス"], "e": "温室効果ガスが増えると熱が逃げにくくなり、地球温暖化の原因になると考えられています。"}, {"id": "C023", "u": "二酸化炭素", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "大気中の二酸化炭素が増えている原因として、ふさわしくないものはどれですか。", "c": ["植物を植えて森を増やすこと", "石油や石炭の大量消費", "天然ガスの大量消費", "森林伐採"], "e": "植物は光合成で二酸化炭素を吸収します。森林を切ったり化石燃料を燃やしたりすると二酸化炭素が増えます。"}, {"id": "C024", "u": "二酸化炭素", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "大気中の二酸化炭素濃度のグラフは、ギザギザしながら上がっています。1年の中で、二酸化炭素が減るのはいつごろですか。", "c": ["夏", "冬", "1年中同じ", "真夜中だけ"], "e": "夏は植物の光合成がさかんになり、二酸化炭素がよく吸収されるので減ります。冬は増えます。"}, {"id": "C025", "u": "二酸化炭素", "lv": "応用", "r": 46, "f": "知識", "q": "地球温暖化が進むと起こると予想されていることとして正しいものはどれですか。", "c": ["南極やグリーンランドの氷がとけたり海水がぼう張したりして、海水面が上がる", "海水面が下がる", "空気中の酸素がなくなる", "地球の公転が速くなる"], "e": "陸上の氷がとけたり、あたたまった海水がぼう張したりすることで海水面が上がると考えられています。"}, {"id": "C026", "u": "二酸化炭素", "lv": "標準", "r": 58, "f": "知識", "q": "酸素と二酸化炭素の、植物とのかかわりとして正しいものはどれですか。", "c": ["二酸化炭素は光合成に使われ、酸素は光合成でつくられる", "酸素は光合成に使われ、二酸化炭素は光合成でつくられる", "どちらも光合成とは関係ない", "どちらも光合成でつくられる"], "e": "植物は二酸化炭素を使って光合成をし、酸素を出します。呼吸では酸素を使って二酸化炭素を出します。"}, {"id": "C027", "u": "二酸化炭素", "lv": "応用", "r": 50, "f": "しくみ・理由", "q": "炭酸水から短い時間でたくさんの二酸化炭素を取り出す方法として、最もふさわしいものはどれですか。", "c": ["炭酸水をふったり温めたりする", "炭酸水を冷やす", "炭酸水に食塩を入れて静かに置く", "炭酸水にふたをして暗い所に置く"], "e": "気体は温度が高いほど水に溶けにくくなるので、温めたりふったりすると出てきやすくなります。"}, {"id": "C028", "u": "二酸化炭素", "lv": "過去問型", "r": 36, "f": "計算", "q": "空気(窒素4/5・酸素1/5)の入った集気びんでろうそくを燃やすと、酸素が3/20に減って二酸化炭素が3/100になったところで火が消えました。これを参考に、ろうそくが燃えるのはどれですか。", "c": ["窒素7/10・酸素1/5・二酸化炭素1/10", "窒素9/10・酸素1/10", "窒素4/5・酸素1/10・二酸化炭素1/10", "窒素3/5・酸素1/10・二酸化炭素3/10"], "e": "火が消えたときの酸素は3/20(15%)なので、酸素がそれより多ければ燃えます。1/5(20%)なら燃え、1/10(10%)では燃えません。二酸化炭素の量は関係ありません。"}, {"id": "C029", "u": "二酸化炭素", "lv": "過去問型", "r": 34, "f": "しくみ・理由", "q": "鉄くぎは酸素中でも燃えにくいのに、同じ鉄のスチールウールは酸素中で激しく燃えます。その理由として正しいものはどれですか。", "c": ["スチールウールは細い糸状で、酸素とふれ合う部分が多いから", "スチールウールは鉄ではないから", "スチールウールには炭素が多いから", "鉄くぎの方が発火点が低いから"], "e": "細かくすると酸素とふれ合う面積が大きくなり、熱も伝わりにくいので、温度が上がりやすく燃えやすくなります。"}, {"id": "C030", "u": "二酸化炭素", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "天ぷら油から炎が出たとき、水をかけてはいけない理由として正しいものはどれですか。", "c": ["水は油より重くて底にしずみ、高温で一気に水蒸気になって体積がふくらみ、燃えた油を飛び散らせるから", "水が燃えて炎が大きくなるから", "水が油に溶けて燃えやすくなるから", "水が酸素を出すから"], "e": "水は水蒸気になると体積が約1600〜1700倍になります。その勢いで燃えた油が飛び散り、火事が広がるおそれがあります。"}, {"id": "C031", "u": "二酸化炭素", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "火事の消火に、窒素より二酸化炭素を使う利点として正しいものはどれですか。", "c": ["空気より重いので下にたまり、燃えている物をおおって酸素とふれにくくできるから", "空気より軽いので上の炎まで届くから", "二酸化炭素は燃えるから", "二酸化炭素は物が燃えるのを助けるから"], "e": "窒素は空気とほぼ同じ重さですが、二酸化炭素は約1.5倍重いので、下の方の火をおおうことができます。ただし人体に有害なので注意が必要です。"}, {"id": "C032", "u": "二酸化炭素", "lv": "標準", "r": 58, "f": "知識", "q": "冬鳥の説明として正しいものはどれですか。", "c": ["秋に北の地域から日本に来て冬をこし、春に北へ帰る", "春に南から来て、秋に南へ帰る", "1年中同じ地域でくらす", "夏だけ山にのぼる"], "e": "マガン・マガモ・オオハクチョウ・ナベヅル・ツグミなどは冬鳥です。"}, {"id": "C033", "u": "二酸化炭素", "lv": "応用", "r": 48, "f": "知識", "q": "アサガオとトウモロコシの子葉の枚数の組み合わせとして正しいものはどれですか。", "c": ["アサガオ2枚、トウモロコシ1枚", "アサガオ1枚、トウモロコシ2枚", "どちらも2枚", "どちらも1枚"], "e": "イネやトウモロコシは子葉が1枚で、葉脈が平行です。アサガオやヘチマは子葉が2枚です。"}, {"id": "C034", "u": "二酸化炭素", "lv": "標準", "r": 58, "f": "知識", "q": "金星の大気の主成分と、表面の温度の特ちょうとして正しいものはどれですか。", "c": ["主成分は二酸化炭素で、温室効果により平均400℃以上ある", "主成分は酸素で、平均0℃くらい", "主成分は窒素で、水星より低い", "大気がなく、昼と夜の温度差が大きい"], "e": "金星は水星より太陽から遠いのに、二酸化炭素による温室効果で水星より高温です。"}, {"id": "G001", "u": "気体の発生", "lv": "基礎", "r": 86, "f": "知識", "q": "酸素を発生させるときに使う薬品の組み合わせとして正しいものはどれですか。", "c": ["うすい過酸化水素水(オキシドール)と二酸化マンガン", "うすい塩酸と石灰石", "うすい塩酸と二酸化マンガン", "オキシドールと石灰石"], "e": "過酸化水素水が二酸化マンガンのはたらきで水と酸素に分解されます。"}, {"id": "G002", "u": "気体の発生", "lv": "基礎", "r": 86, "f": "知識", "q": "二酸化炭素を発生させるときに使う薬品の組み合わせとして正しいものはどれですか。", "c": ["うすい塩酸と石灰石", "オキシドールと二酸化マンガン", "うすい塩酸と二酸化マンガン", "オキシドールと石灰石"], "e": "石灰石にふくまれる炭酸カルシウムと塩酸が反応して二酸化炭素が発生します。"}, {"id": "G003", "u": "気体の発生", "lv": "標準", "r": 62, "f": "知識", "q": "酸素の発生で、二酸化マンガンのように、ほかの物質が変化するのを助け、自分自身は変化しない物質を何といいますか。", "c": ["触媒", "溶媒", "燃料", "中和剤"], "e": "二酸化マンガンは触媒なので、反応が終わったあとも量は変わりません。"}, {"id": "G004", "u": "気体の発生", "lv": "標準", "r": 64, "f": "しくみ・理由", "q": "オキシドールと二酸化マンガンで酸素を発生させていたら、泡が出なくなりました。再び酸素を発生させるには何を加えればよいですか。", "c": ["オキシドールだけでよい", "二酸化マンガンだけでよい", "オキシドールと二酸化マンガンの両方が必要", "水を加える"], "e": "二酸化マンガンは触媒で変化しないので残っています。なくなったのは分解された過酸化水素水の方です。"}, {"id": "G005", "u": "気体の発生", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "石灰石とうすい塩酸で二酸化炭素を発生させていたら、泡が出なくなりました。石灰石を加えると再び泡が出て、しばらくしてまた止まり、今度は塩酸を加えると泡が出ました。分かることはどれですか。", "c": ["石灰石と塩酸はどちらも反応して減るので、足りなくなった方を加えると再び発生する", "石灰石は触媒なので変化しない", "塩酸は触媒なので変化しない", "どちらを加えても二度と発生しない"], "e": "酸素の発生の二酸化マンガンとちがい、二酸化炭素の発生では石灰石も塩酸も両方変化します。"}, {"id": "G006", "u": "気体の発生", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "酸素を発生させる実験で、二酸化マンガンのかわりに使えないものはどれですか。", "c": ["卵の殻", "生のジャガイモ", "生のレバー", "生のジャガイモをすりおろしたもの"], "e": "生のジャガイモや生のレバーにはカタラーゼという、分解を助けるはたらきのあるものがふくまれています。卵の殻は石灰石のかわりに使います。"}, {"id": "G007", "u": "気体の発生", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "二酸化炭素を発生させる実験で、石灰石のかわりに使えないものはどれですか。", "c": ["生のレバー", "卵の殻", "貝殻", "チョーク"], "e": "炭酸カルシウムをふくむもの(卵の殻・貝殻・チョーク・大理石)は石灰石のかわりになります。"}, {"id": "G008", "u": "気体の発生", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "二酸化炭素を発生させる実験で、塩酸のかわりに使えるものの組み合わせとして正しいものはどれですか。", "c": ["食酢とレモン汁", "食塩水と砂糖水", "紅茶と食塩水", "オキシドールと砂糖水"], "e": "すっぱい性質(酸性)のある食酢やレモン汁は、塩酸のかわりに使えます。"}, {"id": "G009", "u": "気体の発生", "lv": "応用", "r": 50, "f": "まちがい探し", "q": "卵の殻に加えたとき、二酸化炭素が発生しないものはどれですか。", "c": ["食塩水", "うすい塩酸", "食酢", "レモン汁"], "e": "炭酸カルシウムと反応するのは酸性のものです。食塩水や牛乳、湯では発生しません。"}, {"id": "G010", "u": "気体の発生", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "オキシドールで、大きく切ったニンジンを入れたものより、刻んだニンジンを入れたものの方がさかんに泡が出ました。その理由として正しいものはどれですか。", "c": ["細かくすると液体とふれる表面積が大きくなるから", "細かくするとニンジンの量が増えるから", "細かくするとオキシドールが濃くなるから", "細かくするとニンジンが温かくなるから"], "e": "固体を細かくくだくと、液体とふれる面が増えて、気体がさかんに発生します。"}, {"id": "G011", "u": "気体の発生", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "酸素をいきおいよく発生させる方法として正しいものの組み合わせはどれですか。", "c": ["二酸化マンガンを粉末にし、オキシドールを濃いものにする", "二酸化マンガンを大きい固まりにし、オキシドールをうすくする", "二酸化マンガンを粉末にし、オキシドールをうすくする", "二酸化マンガンを大きい固まりにし、オキシドールを濃くする"], "e": "表面積を大きくしたり、液体を濃くしたりすると、いきおいよく発生します。たくさん発生させるには、オキシドールの量を増やします。"}, {"id": "G012", "u": "気体の発生", "lv": "標準", "r": 62, "f": "知識", "q": "気体の発生装置で、液体の薬品を注ぐ量を調節するために使う器具はどれですか。", "c": ["コック付きろうと", "三角フラスコ", "集気びん", "水そう"], "e": "コックを開け閉めして液体の量を調節し、反応を止めたり始めたりできます。"}, {"id": "G013", "u": "気体の発生", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "三角フラスコに入れる2本の管の長さとして正しいものはどれですか。", "c": ["液体を注ぐ管は底の近くまで長く、気体の出口の管は短くする", "液体を注ぐ管は短く、気体の出口の管は底まで長くする", "2本とも底まで長くする", "2本とも短くする"], "e": "出口の管が長く液の中に入っていると、液体がおし出されてしまいます。出口の管は短くします。"}, {"id": "G014", "u": "気体の発生", "lv": "標準", "r": 60, "f": "知識", "q": "水に溶けにくい気体を集める方法を何といいますか。", "c": ["水上置換法", "下方置換法", "上方置換法", "ろ過"], "e": "酸素や窒素は水上置換法で集めます。"}, {"id": "G015", "u": "気体の発生", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "水上置換法の長所として、ふさわしくないものはどれですか。", "c": ["集めた気体の重さをはかれる", "純粋な気体を集めやすい", "集めた気体の量が目で見て分かる", "空気がまざりにくい"], "e": "水上置換法は、空気とまざりにくく純粋な気体を集められ、集まった量も目で見て分かります。"}, {"id": "G016", "u": "気体の発生", "lv": "標準", "r": 60, "f": "知識", "q": "水に溶けやすく、空気より重い気体を集める方法はどれですか。", "c": ["下方置換法", "上方置換法", "水上置換法", "どの方法でも集められない"], "e": "塩化水素は下方置換法で集めます。ガラス管は集気びんの底までとどく長さにします。"}, {"id": "G017", "u": "気体の発生", "lv": "標準", "r": 58, "f": "知識", "q": "水に溶けやすく、空気より軽い気体を集める方法はどれですか。", "c": ["上方置換法", "下方置換法", "水上置換法", "どの方法でも集められない"], "e": "アンモニアは上方置換法で集めます。"}, {"id": "G018", "u": "気体の発生", "lv": "応用", "r": 46, "f": "まちがい探し", "q": "気体とその集め方の組み合わせとして、まちがっているものはどれですか。", "c": ["アンモニア ― 下方置換法", "酸素 ― 水上置換法", "窒素 ― 水上置換法", "塩化水素 ― 下方置換法"], "e": "アンモニアは水に非常によく溶け、空気より軽いので上方置換法で集めます。"}, {"id": "G019", "u": "気体の発生", "lv": "応用", "r": 48, "f": "知識", "q": "二酸化炭素を集める方法として正しいものはどれですか。", "c": ["水上置換法と下方置換法のどちらでも集められる", "上方置換法でしか集められない", "水上置換法でしか集められない", "下方置換法でしか集められない"], "e": "二酸化炭素は水に溶けますが溶ける量はそれほど多くないので、水上置換法でも集められます。空気より重いので下方置換法でも集められます。"}, {"id": "G020", "u": "気体の発生", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "水上置換法で気体を集めるとき、最初に出てくる気体を捨てるのはなぜですか。", "c": ["三角フラスコなどに入っていた空気が出てくるから", "最初の気体は毒だから", "最初の気体は水蒸気だから", "最初の気体は軽すぎるから"], "e": "初めは装置の中にあった空気がおし出されてくるので、集めずに捨てます。"}, {"id": "G021", "u": "気体の発生", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "酸素と二酸化炭素をそれぞれ2本の集気びんに分けて集めました(1本目は最初に出た気体)。4本の中身を調べると、2本は空気と区別できませんでした。その2本はどれですか。", "c": ["酸素の1本目と二酸化炭素の1本目", "酸素の2本目と二酸化炭素の2本目", "酸素の1本目と2本目", "二酸化炭素の1本目と2本目"], "e": "最初の集気びんには、初めに装置に入っていた空気が集まっているので、空気とほとんど区別できません。"}, {"id": "G022", "u": "気体の発生", "lv": "標準", "r": 60, "f": "知識", "q": "オキシドール(うすい過酸化水素水)に二酸化マンガンを加えたとき、酸素のほかにできるものはどれですか。", "c": ["水", "二酸化炭素", "塩酸", "石灰水"], "e": "過酸化水素水は、酸素と水に分解されます。"}, {"id": "G023", "u": "気体の発生", "lv": "基礎", "r": 80, "f": "知識", "q": "卵の殻や貝殻、石灰石などに多くふくまれる物質はどれですか。", "c": ["炭酸カルシウム", "二酸化マンガン", "塩化水素", "過酸化水素"], "e": "炭酸カルシウムは酸性の液体と反応して二酸化炭素を出します。"}, {"id": "G024", "u": "気体の発生", "lv": "応用", "r": 48, "f": "知識", "q": "塩酸とはどのような水溶液ですか。", "c": ["塩化水素という気体が水に溶けた水溶液", "二酸化炭素が水に溶けた水溶液", "酸素が水に溶けた水溶液", "食塩が水に溶けた水溶液"], "e": "濃い塩酸は危険なので、実験では水でうすめて使います。"}, {"id": "G025", "u": "気体の発生", "lv": "標準", "r": 62, "f": "知識", "q": "次のうち、酸素の泡が出るものはどれですか。", "c": ["傷口にオキシドールをつける", "湯に入浴剤を入れる", "コップにサイダーを注ぐ", "水にドライアイスを入れる"], "e": "ほかは二酸化炭素の泡です。酸素系漂白剤に湯を加えたときの泡も酸素です。"}, {"id": "G026", "u": "気体の発生", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "炭酸飲料をあたためると、さかんに泡が出てきます。その理由はどれですか。", "c": ["二酸化炭素は水温が低いほどよく溶け、あたためると溶けきれなくなるから", "あたためると水が二酸化炭素に変わるから", "あたためると酸素が発生するから", "二酸化炭素は水温が高いほどよく溶けるから"], "e": "気体は水温が低いほど水によく溶けます。"}, {"id": "G027", "u": "気体の発生", "lv": "応用", "r": 48, "f": "知識", "q": "ふくらし粉(ベーキングパウダー)でホットケーキがふくらむのはなぜですか。", "c": ["ふくまれる重そうを加熱すると二酸化炭素が発生し、生地にすき間ができるから", "加熱すると酸素が発生するから", "加熱すると水蒸気だけが出るから", "砂糖がとけて泡になるから"], "e": "発泡入浴剤も、重そうが分解されて二酸化炭素の泡が出ます。"}, {"id": "G028", "u": "気体の発生", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "食酢にからのついた卵を入れると、卵の表面に泡がつき、ときどき卵が回転しました。その理由として正しいものはどれですか。", "c": ["卵の下で発生した二酸化炭素の泡が殻にひっかかり、上がろうとする力で卵が回るから", "卵の中から酸素が出てくるから", "食酢が卵をおすから", "卵が生きているから"], "e": "数日おくと殻はとけ、うすいまくだけの大きな卵になります。"}, {"id": "G029", "u": "気体の発生", "lv": "過去問型", "r": 36, "f": "計算", "q": "オキシドール20mLに二酸化マンガンを入れると酸素が80mL発生しました。同じこさのオキシドール50mLに、同じ量の二酸化マンガンを入れると、酸素は何mL発生しますか。", "c": ["200mL", "80mL", "160mL", "320mL"], "e": "酸素の量はオキシドールの量に比例します。80×50/20=200mLです。二酸化マンガンを増やしても、発生する量は変わりません(速さが変わるだけです)。"}, {"id": "G030", "u": "気体の発生", "lv": "過去問型", "r": 34, "f": "しくみ・理由", "q": "空気・酸素・二酸化炭素・窒素のどれかが入った集気びんA〜Dに、火のついたろうそくと石灰水で調べました。Aは火がすぐ消え石灰水は変化なし、Bはしばらくして火が消え変化なし、Cは激しく燃えて変化なし、Dは火がすぐ消え白くにごりました。Aは何ですか。", "c": ["窒素", "空気", "酸素", "二酸化炭素"], "e": "Bは空気、Cは酸素、Dは二酸化炭素です。火がすぐ消えて石灰水が変化しないAは窒素です。"}, {"id": "G031", "u": "気体の発生", "lv": "標準", "r": 58, "f": "知識", "q": "タケノコは何科の植物の、どの部分を食べていますか。", "c": ["イネ科のタケの若い茎", "マメ科のタケの根", "イネ科のタケの花", "ユリ科のタケの葉"], "e": "タケはイネ科です。旬は春で、4〜5月ごろに掘ります。"}, {"id": "G032", "u": "気体の発生", "lv": "応用", "r": 48, "f": "知識", "q": "カタクリの球根にふくまれ、片栗粉の原料とされてきたものは何ですか。また、今の片栗粉の主な原料は何ですか。", "c": ["でんぷんで、今の主な原料はジャガイモ", "油で、今の主な原料は大豆", "でんぷんで、今の主な原料は小麦", "糖分で、今の主な原料はサトウキビ"], "e": "スギナ・ワラビ・ゼンマイは胞子でふえるシダの仲間、カタクリはユリ科の植物です。"}, {"id": "G033", "u": "気体の発生", "lv": "標準", "r": 58, "f": "知識", "q": "ふたご座の1等星の名前と色の組み合わせとして正しいものはどれですか。", "c": ["ポルックスで、だいだい色", "カストルで、青白色", "ベテルギウスで、赤色", "シリウスで、白色"], "e": "ふたご座は黄道12星座の1つで、だいだい色の1等星ポルックスと、2等星カストルがあります。"}, {"id": "G034", "u": "気体の発生", "lv": "標準", "r": 60, "f": "知識", "q": "ひな祭りや結婚式などで、縁起物として食べられる二枚貝はどれですか。", "c": ["ハマグリ", "シジミ", "アサリ", "マガキ"], "e": "シジミは淡水と海水がまざる河口付近や汽水湖に、アサリやハマグリは浅い海にすみます。"}, {"id": "P001", "u": "発芽と呼吸", "lv": "基礎", "r": 88, "f": "知識", "q": "種子の発芽に必要な3つの条件の組み合わせとして正しいものはどれですか。", "c": ["水・空気(酸素)・適当な温度", "水・光・肥料", "空気・光・土", "水・肥料・適当な温度"], "e": "これを発芽の3条件といいます。光や肥料、土は発芽には必要ありません。"}, {"id": "P002", "u": "発芽と呼吸", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "窒素4/5と酸素1/5を入れた袋のインゲンマメは発芽し、窒素だけを入れた袋のインゲンマメは発芽しませんでした(水・温度は同じ)。分かることはどれですか。", "c": ["発芽には酸素が必要である", "発芽には窒素が必要である", "発芽には光が必要である", "発芽には二酸化炭素が必要である"], "e": "ちがう条件は酸素の有無だけなので、発芽には酸素(空気)が必要だと分かります。"}, {"id": "P003", "u": "発芽と呼吸", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "ダイズの種子を水と次の気体の入った袋に入れました。発芽するものをすべて選んだ組み合わせはどれですか。\nア 窒素だけ イ 酸素だけ ウ 二酸化炭素1/2と窒素1/2 エ 二酸化炭素1/2と酸素1/2", "c": ["イとエ", "アとウ", "イだけ", "ア・イ・ウ・エすべて"], "e": "酸素が入っている袋だけで発芽します。二酸化炭素が多くても、酸素があれば発芽します。"}, {"id": "P004", "u": "発芽と呼吸", "lv": "基礎", "r": 84, "f": "知識", "q": "呼吸のしくみを表したものとして正しいものはどれですか。", "c": ["養分+酸素 → 二酸化炭素+水(活動のエネルギーが生まれる)", "養分+二酸化炭素 → 酸素+水", "酸素+水 → 養分+二酸化炭素", "二酸化炭素+水 → 養分+酸素"], "e": "呼吸では養分と酸素を使って、二酸化炭素と水ができ、活動のためのエネルギーが生み出されます。"}, {"id": "P005", "u": "発芽と呼吸", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "呼吸について、まちがっているものはどれですか。", "c": ["呼吸をしているのは動物だけで、植物は呼吸をしない", "呼吸によって養分が使われる", "呼吸によってエネルギーが生み出される", "呼吸によって二酸化炭素ができる"], "e": "植物も動物も呼吸をしています。発芽している種子はさかんに呼吸をします。"}, {"id": "P006", "u": "発芽と呼吸", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "発芽しているインゲンマメをビニール袋に入れてしばらく置きました。袋の中の気体の変化として正しいものはどれですか。", "c": ["酸素は約21%から約16%に減り、二酸化炭素は約0.04%から約3%に増えた", "酸素が増え、二酸化炭素が減った", "酸素も二酸化炭素も増えた", "窒素が減って酸素が増えた"], "e": "種子の呼吸で酸素が使われ、二酸化炭素が出されたことが分かります。袋の気体を石灰水に通すと白くにごります。"}, {"id": "P007", "u": "発芽と呼吸", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "空気だけを入れた袋Aと、空気と発芽しているインゲンマメを入れた袋Bをしばらく置き、気体を石灰水に通しました。白くにごるのはどちらですか。また、袋Aを用意したのはなぜですか。", "c": ["Bで、空気だけでは石灰水がにごらないことを確かめて比べるため", "Aで、インゲンマメがなくても二酸化炭素が増えるため", "Bで、袋の大きさを比べるため", "AとBの両方で、どちらも呼吸をしているため"], "e": "比べるための袋Aがあると、二酸化炭素が増えたのはインゲンマメのはたらきだと分かります(対照実験)。"}, {"id": "P008", "u": "発芽と呼吸", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "魔法びんに水と発芽しているダイズを入れて温度計をさすと、温度が上がりました。魔法びんを使う理由として正しいものはどれですか。", "c": ["発生した熱がにげにくくするため", "光が入らないようにするため", "中の水が減らないようにするため", "空気が入らないようにして呼吸を止めるため"], "e": "種子の呼吸でエネルギーが生まれるとき、熱も発生します。熱をにがしにくい魔法びんを使うと、温度の上がり方が分かりやすくなります。"}, {"id": "P009", "u": "発芽と呼吸", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "魔法びんで発芽しているダイズの温度が上がる実験を、より正しく行うにはどうすればよいですか。", "c": ["ゆでて呼吸しないようにしたダイズを入れた魔法びんも用意し、温度を比べる", "ダイズの数を毎回変える", "温度計を2本さす", "魔法びんのかわりに金属のコップを使う"], "e": "呼吸していない種子と比べると、温度が上がったのは種子の呼吸のためだと確かめられます。"}, {"id": "P010", "u": "発芽と呼吸", "lv": "基礎", "r": 84, "f": "知識", "q": "でんぷんがあるかどうかを調べる薬品と、でんぷんがあるときの色の変化の組み合わせとして正しいものはどれですか。", "c": ["ヨウ素液で、茶かっ色から青紫色に変わる", "石灰水で、白くにごる", "ヨウ素液で、青紫色から茶かっ色に変わる", "BTB液で、黄色に変わる"], "e": "この反応をヨウ素でんぷん反応といいます。ヨウ素液は、ヨウ素をふくむ消毒液やうがい薬を水でうすめても作れます。"}, {"id": "P011", "u": "発芽と呼吸", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "発芽前のインゲンマメの子葉にヨウ素液をかけると濃い青紫色に、発芽してしばらくたった子葉ではうすい青紫色になりました。分かることはどれですか。", "c": ["子葉にたくわえられたでんぷんが発芽や成長に使われた", "発芽するときにでんぷんがつくられた", "ヨウ素液がうすくなった", "子葉に水がたまった"], "e": "子葉のでんぷんは、発芽やその後しばらくの成長に使われるので減っていきます。"}, {"id": "P012", "u": "発芽と呼吸", "lv": "基礎", "r": 80, "f": "知識", "q": "種子が発芽して植物のからだになる部分を何といいますか。", "c": ["胚", "胚乳", "種皮", "子房"], "e": "胚は、幼芽・胚軸・幼根・子葉からできています。"}, {"id": "P013", "u": "発芽と呼吸", "lv": "標準", "r": 62, "f": "知識", "q": "種子の部分とそのはたらきの組み合わせとして、まちがっているものはどれですか。", "c": ["幼根 ― 発芽して葉や茎になる", "種皮 ― 主に乾燥から種子の内部を守る", "幼芽 ― 発芽して葉や茎になる", "胚軸 ― 発芽して茎になる"], "e": "幼根は発芽して根になる部分です。"}, {"id": "P014", "u": "発芽と呼吸", "lv": "標準", "r": 60, "f": "知識", "q": "インゲンマメの種子で、発芽のための養分をたくわえている部分はどこですか。", "c": ["子葉", "胚乳", "幼芽", "種皮"], "e": "インゲンマメには胚乳がなく、子葉に養分をたくわえています。"}, {"id": "P015", "u": "発芽と呼吸", "lv": "標準", "r": 60, "f": "知識", "q": "カキの種子で、発芽のための養分をたくわえている部分はどこですか。", "c": ["胚乳", "子葉", "幼根", "種皮"], "e": "カキの種子では、養分は胚乳にたくわえられています。カキの子葉はうすく、胚乳の中にあります。"}, {"id": "P016", "u": "発芽と呼吸", "lv": "応用", "r": 50, "f": "まちがい探し", "q": "胚乳をもつ有胚乳種子の組み合わせとして正しいものはどれですか。", "c": ["カキ・イネ・トウモロコシ", "インゲンマメ・アサガオ・ヒマワリ", "カキ・アサガオ・ダイズ", "イネ・インゲンマメ・アブラナ"], "e": "インゲンマメ・アサガオ・ヒマワリ・アブラナ・ダイズなどは、胚乳をもたない無胚乳種子です。"}, {"id": "P017", "u": "発芽と呼吸", "lv": "応用", "r": 48, "f": "知識", "q": "種子にたくわえられている主な養分の組み合わせとして正しいものはどれですか。", "c": ["インゲンマメはでんぷん、ダイズはたんぱく質、ゴマは脂肪", "インゲンマメは脂肪、ダイズはでんぷん、ゴマはたんぱく質", "インゲンマメはたんぱく質、ダイズは脂肪、ゴマはでんぷん", "どれもでんぷんだけ"], "e": "ダイズは「畑の肉」とよばれるほどたんぱく質が多く、ゴマやヒマワリの種子は脂肪が多いので油がとれます。"}, {"id": "P018", "u": "発芽と呼吸", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "インゲンマメの種子の子葉の一部を切り取ってから植えました。切っていないものと比べてどうなりますか。", "c": ["育ちが悪くなる", "よく育つ", "違いはない", "発芽しなくなる"], "e": "子葉には発芽や成長のための養分がたくわえられているので、子葉が少ないと育ちが悪くなります。"}, {"id": "P019", "u": "発芽と呼吸", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "インゲンマメが発芽して本葉が出たあと、子葉はどうなっていきますか。", "c": ["しぼんでいき、やがて落ちる", "どんどん大きくなる", "根になる", "花になる"], "e": "子葉の養分が使われてしまうので、子葉はしぼんでいきます。"}, {"id": "P020", "u": "発芽と呼吸", "lv": "応用", "r": 46, "f": "まちがい探し", "q": "種子を植えたとき、子葉が地上に出ずに地中に残るものはどれですか。", "c": ["エンドウ", "インゲンマメ", "アサガオ", "ヒマワリ"], "e": "エンドウの子葉は地中に残ります。エンドウの未熟な種子はグリーンピースとして食べます。"}, {"id": "P021", "u": "発芽と呼吸", "lv": "標準", "r": 58, "f": "しくみ・理由", "q": "インゲンマメを日当たりのよい所と暗い所(段ボールをかぶせる)で育てました。暗い所の様子として正しいものはどれですか。", "c": ["発芽はするが、黄色っぽくひょろ長く育ち、やがて枯れてしまう", "発芽しない", "日当たりのよい所より濃い緑色で太く育つ", "日当たりのよい所と同じように育つ"], "e": "発芽に光は必要ないので発芽はします。しかし光がないと葉で養分をつくれず、種子の養分がなくなると枯れてしまいます。"}, {"id": "P022", "u": "発芽と呼吸", "lv": "過去問型", "r": 36, "f": "図の読み取り", "q": "ジャガイモの種いもを植え、芽が出た日から全体(種いも・芽・茎・葉・根)の重さをはかると、はじめは軽くなり、9日目ごろから重くなっていきました。その理由として正しいものはどれですか。", "c": ["はじめは種いもの養分が呼吸や成長に使われて減るが、葉が出ると光を利用して養分をつくれるようになるから", "はじめは水を吸わないが、あとから水を吸うから", "はじめは根がのび、あとから芽がのびるから", "はじめは養分をつくり、あとから使うから"], "e": "はじめは芽や根が重くなる分より種いもが軽くなる分が大きく、葉が出ると、つくる養分が呼吸で使う養分より多くなります。"}, {"id": "P023", "u": "発芽と呼吸", "lv": "標準", "r": 62, "f": "知識", "q": "ジャガイモといもの部分の説明として正しいものはどれですか。", "c": ["ナス科で、いもは地下の茎(地下茎)がふくらんだもの", "ヒルガオ科で、いもは根がふくらんだもの", "ナス科で、いもは根がふくらんだもの", "ヒルガオ科で、いもは地下の茎がふくらんだもの"], "e": "サツマイモはヒルガオ科で、いもは根がふくらんだものです。サツマイモの花はアサガオに似ています。"}, {"id": "P024", "u": "発芽と呼吸", "lv": "応用", "r": 48, "f": "知識", "q": "ジャガイモの種いもを植えるときの切り方として正しいものはどれですか。", "c": ["くぼみ(芽)が2〜3個ずつになるように切り分ける", "くぼみがない部分だけを使う", "できるだけ小さくきざむ", "くぼみが1つの部分にまとまるように切る"], "e": "こうすると、芽もこみすぎず、養分も不足しません。ジャガイモの芽はくぼみから出て、根は芽のつけ根から出ます。"}, {"id": "P025", "u": "発芽と呼吸", "lv": "過去問型", "r": 36, "f": "知識", "q": "サツマイモを水につけておくと芽や根が出てきます。主に芽と根が出てくる所として正しいものはどれですか。", "c": ["芽は茎側に近い方、根は根側に近い方", "芽は根側に近い方、根は茎側に近い方", "芽も根もまん中から", "芽は水の中、根は水の外"], "e": "サツマイモはいものつき方も芽や根の出方もジャガイモとちがいます。サツマイモはのびた芽を切り取って、なえとして植えます。"}, {"id": "P026", "u": "発芽と呼吸", "lv": "標準", "r": 60, "f": "知識", "q": "昆虫や魚が酸素を取り入れるつくりの組み合わせとして正しいものはどれですか。", "c": ["昆虫は気門から気管、魚はえら", "昆虫は肺、魚はえら", "昆虫はえら、魚は肺", "昆虫は気門から気管、魚は肺"], "e": "魚は水を口から吸いこみ、えらで水に溶けている酸素を取りこみます。ヒトは肺の肺胞で酸素を取りこみます。"}, {"id": "P027", "u": "発芽と呼吸", "lv": "標準", "r": 58, "f": "知識", "q": "マメ科の植物の根についている根粒菌のはたらきとして正しいものはどれですか。", "c": ["植物の肥料分をつくる", "根をかたくする", "虫を追いはらう", "水をためる"], "e": "このため、田植え前の田んぼにレンゲソウの種をまき、肥料(緑肥)にすることがあります。"}, {"id": "P028", "u": "発芽と呼吸", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "マメ科の植物ではないものはどれですか。", "c": ["アブラナ", "フジ", "カラスノエンドウ", "シロツメクサ"], "e": "シロツメクサはクローバーともよばれ、ヨーロッパ原産の外来種です。フジはつる植物で、5月ごろ紫色の花をさかせます。"}, {"id": "P029", "u": "発芽と呼吸", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "さなぎになってから成虫になる昆虫の組み合わせとして正しいものはどれですか。", "c": ["ホタルとナナホシテントウ", "カマキリとトノサマバッタ", "コオロギとホタル", "カマキリとナナホシテントウ"], "e": "カマキリ・バッタ・コオロギはさなぎにならずに成虫になります。ホタルの幼虫は水中でカワニナを、ナナホシテントウの幼虫はアブラムシを食べます。"}, {"id": "P030", "u": "発芽と呼吸", "lv": "標準", "r": 60, "f": "知識", "q": "潮干狩りでとれるアサリが最もおいしい旬とされるのはいつですか。", "c": ["産卵前", "産卵した直後", "冬の間ずっと", "夏の終わり"], "e": "アサリは春と秋に産卵し、産卵前に最も太っておいしくなります。"}, {"id": "P031", "u": "発芽と呼吸", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "オキシドール20mLに少量の二酸化マンガンを入れ、酸素の発生が止まりました。このあと、オキシドールを追加した場合と、二酸化マンガンを追加した場合の結果として正しいものはどれですか。", "c": ["オキシドールを追加すると酸素が出るが、二酸化マンガンを追加しても出ない", "二酸化マンガンを追加すると出るが、オキシドールを追加しても出ない", "どちらを追加しても酸素が出る", "どちらを追加しても酸素は出ない"], "e": "二酸化マンガンは触媒で、反応のあとも残っています。なくなったのはオキシドールの方です。"}, {"id": "L001", "u": "光合成", "lv": "基礎", "r": 86, "f": "知識", "q": "光合成のしくみを表したものとして正しいものはどれですか。", "c": ["二酸化炭素+水 →(光エネルギー)→ でんぷん+酸素", "でんぷん+酸素 → 二酸化炭素+水", "酸素+水 → でんぷん+二酸化炭素", "二酸化炭素+でんぷん → 水+酸素"], "e": "光合成は呼吸と反対の向きです。二酸化炭素は気孔から、水は根から取り入れ、できた酸素は気孔から出します。"}, {"id": "L002", "u": "光合成", "lv": "基礎", "r": 84, "f": "知識", "q": "光合成が行われる、葉の細胞の中にある緑色のつぶを何といいますか。", "c": ["葉緑体", "気孔", "孔辺細胞", "胚"], "e": "葉緑体には葉緑素という緑色の色素がふくまれています。"}, {"id": "L003", "u": "光合成", "lv": "標準", "r": 62, "f": "知識", "q": "植物の成長の5条件の組み合わせとして正しいものはどれですか。", "c": ["水・空気・適当な温度・光・肥料", "水・空気・適当な温度・土・肥料", "水・光・肥料・土・二酸化炭素", "空気・光・土・水・酸素"], "e": "発芽の3条件(水・空気・適温)に、光と肥料を加えたものです。土は必要ありません。"}, {"id": "L004", "u": "光合成", "lv": "標準", "r": 62, "f": "知識", "q": "肥料の3要素の組み合わせとして正しいものはどれですか。", "c": ["窒素・リン酸・カリウム", "酸素・二酸化炭素・水", "窒素・酸素・でんぷん", "リン酸・カルシウム・鉄"], "e": "自然界では、死がいやふんを微生物などの分解者が分解して肥料がつくられ、植物は根から吸収します。"},
