っています。"}, {"id": "U010", "u": "地層", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ある場所で、下からねん土の層→小石と砂の混ざった層の順に積もっていました。この間に、海の深さはどう変わったと考えられますか。", "c": ["浅くなった", "深くなった", "変わらなかった", "陸地になってから海にもどった"], "e": "ねん土は河口から遠い深い海、小石は河口に近い浅い海に積もります。上の層ほど新しいので、だんだん浅くなったと分かります。"}, {"id": "U011", "u": "地層", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "同じ場所で、下から小石→砂→泥の順に地層が積もっていました。この間に、その場所はどう変わったと考えられますか。", "c": ["海が深くなった(または河口から遠くなった)", "海が浅くなった", "陸地になった", "変化はなかった"], "e": "積もるつぶがだんだん小さくなっているので、河口から遠い深い海になったと考えられます。地球の温暖化で海面が上がったときなどに起こります。"}, {"id": "U012", "u": "地層", "lv": "標準", "r": 60, "f": "知識", "q": "地球の温暖化が進むと海面はどうなり、寒冷化が進むとどうなりますか。", "c": ["温暖化で上がり、寒冷化で下がる", "温暖化で下がり、寒冷化で上がる", "どちらでも上がる", "どちらでも変わらない"], "e": "寒冷化すると陸上の氷が増えて海水が減るため、海面が下がります。"}, {"id": "U013", "u": "地層", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "がけの地層に、地下水がしみ出していました。地下水がしみ出しているのは、主にどの層の上ですか。", "c": ["ねん土の層", "砂の層", "小石の層", "黒土の層"], "e": "ねん土の層はつぶが細かく、水を通しにくいので、その上に地下水がたまります。"}, {"id": "U014", "u": "地層", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "地層の中に、丸みを帯びた小石が多く見られました。その理由として正しいものはどれですか。", "c": ["川の水に運ばれる間に、ぶつかり合って角がけずられたから", "もとから丸い石だったから", "火山から噴き出したから", "海の中で大きくなったから"], "e": "流水のはたらきを受けたつぶは丸みを帯びます。"}, {"id": "U015", "u": "地層", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "白・黒・透明のキラキラ光る角ばったつぶでできた層がありました。このつぶが、ほかの層の小石のように丸みを帯びていないのはなぜですか。", "c": ["火山灰が降り積もったもので、流水のはたらきを受けていないから", "水の中で固まったから", "つぶが大きすぎるから", "化石がふくまれているから"], "e": "火山灰の層があると、その時代に近くで火山の噴火があったことが分かります。"}, {"id": "U016", "u": "地層", "lv": "標準", "r": 58, "f": "知識", "q": "地層の中の水を地下水といいます。地下水の温度の特ちょうとして正しいものはどれですか。", "c": ["ふつう15℃前後で、1年中ほとんど変化しない", "夏は高く、冬は低い", "1年中0℃くらい", "1年中40℃くらい"], "e": "地層のすき間からわき出したものを「わき水」といいます。"}, {"id": "O001", "u": "化石", "lv": "基礎", "r": 84, "f": "知識", "q": "大昔の生き物の死がいや生活の跡が、長い年月をかけて石のようになったものを何といいますか。", "c": ["化石", "地層", "火山灰", "鉱物"], "e": "化石は、地層ができた時代や環境を知る手がかりになります。"}, {"id": "O002", "u": "化石", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "化石にふくまれないものはどれですか。", "c": ["波のあと", "サメの歯", "カニの巣穴", "コハクに閉じこめられたハエ"], "e": "化石は生き物の体や生活の跡です。足跡・巣穴・ふんも化石になり、氷の中のマンモスの毛のように石になっていないものも化石とよばれます。"}, {"id": "O003", "u": "化石", "lv": "基礎", "r": 82, "f": "知識", "q": "地層が堆積したときの環境を知る手がかりとなる化石を何といいますか。", "c": ["示相化石", "示準化石", "生きている化石", "生痕化石"], "e": "ある決まった環境でしか生きられず、同じ種類の生き物が今も生きているものが向いています。"}, {"id": "O004", "u": "化石", "lv": "基礎", "r": 82, "f": "知識", "q": "地層ができた時代(地質時代)を知る手がかりとなる化石を何といいますか。", "c": ["示準化石", "示相化石", "生きている化石", "生痕化石"], "e": "生存期間が短く、世界中に広く分布し、数が多いものが向いています。"}, {"id": "O005", "u": "化石", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "示相化石と、それが示す環境の組み合わせとして、まちがっているものはどれですか。", "c": ["シジミ ― あたたかくきれいな浅い海", "サンゴ ― あたたかくきれいな浅い海", "アサリ・ハマグリ・カキ ― 浅い海", "ホタテガイ ― 水深10〜70mの比較的寒冷な海"], "e": "シジミは、海水と淡水が混ざる河口付近や湖にすんでいます。"}, {"id": "O006", "u": "化石", "lv": "標準", "r": 62, "f": "知識", "q": "地層からシジミの化石が見つかりました。その地層が堆積した当時の環境はどれですか。", "c": ["海水と淡水が混ざる河口付近や湖", "あたたかくきれいな浅い海", "深い海の底", "寒い山の上"], "e": "シジミは示相化石です。"}, {"id": "O007", "u": "化石", "lv": "標準", "r": 60, "f": "知識", "q": "示相化石に適している生き物の条件として正しいものはどれですか。", "c": ["ある決まった環境でしか生きられず、同じ種類が今も生きている", "生存期間が短く、世界中に広く分布する", "数が少なく、見つかりにくい", "どんな環境でも生きられる"], "e": "生存期間が短く世界中に分布するのは示準化石の条件です。"}, {"id": "O008", "u": "化石", "lv": "応用", "r": 50, "f": "まちがい探し", "q": "示準化石と地質時代の組み合わせとして正しいものはどれですか。", "c": ["古生代=サンヨウチュウ・フズリナ、中生代=アンモナイト・キョウリュウ、新生代=マンモス・ナウマンゾウ", "古生代=アンモナイト・キョウリュウ、中生代=サンヨウチュウ・フズリナ", "古生代=マンモス、中生代=サンヨウチュウ、新生代=キョウリュウ", "どれも同じ時代"], "e": "古生代は約5億4000万年前〜2億5000万年前、中生代は約6600万年前まで、新生代はそれ以降です。"}, {"id": "O009", "u": "化石", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "中生代の示準化石の組み合わせとして正しいものはどれですか。", "c": ["アンモナイト・キョウリュウ", "サンヨウチュウ・フズリナ", "マンモス・ナウマンゾウ", "サンゴ・シジミ"], "e": "始祖鳥も中生代の化石です。"}, {"id": "O010", "u": "化石", "lv": "標準", "r": 58, "f": "知識", "q": "サンヨウチュウの化石が見つかった地層は、どの時代にできたものですか。", "c": ["古生代", "中生代", "新生代", "現代"], "e": "サンヨウチュウやフズリナ、ウミユリは古生代の示準化石です。"}, {"id": "O011", "u": "化石", "lv": "応用", "r": 48, "f": "知識", "q": "大昔から今まで、ほとんど姿を変えずに生き続けている生き物を何といいますか。また、その例はどれですか。", "c": ["生きている化石で、シーラカンス・カブトガニ・イチョウなど", "示準化石で、アンモナイト", "示相化石で、サンゴ", "生痕化石で、足跡"], "e": "メタセコイア(アケボノスギ)は化石でしか知られていませんでしたが、1945年に中国で生きているものが見つかりました。"}, {"id": "O012", "u": "化石", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "キョウリュウが約6600万年前に絶滅した原因の説として、最もふさわしいものはどれですか。", "c": ["巨大な隕石の衝突で、砂ぼこりなどが太陽の光をさえぎり、植物が育たず食べ物がなくなったから", "氷河で地球全体が水没したから", "人間が狩りをしたから", "火星から生き物が来たから"], "e": "からだの小さい哺乳類は、少ない食べ物でも生きのびられたと考えられています。"}, {"id": "O013", "u": "化石", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "キョウリュウの足跡化石が見つかった地層から、同時に見つかる可能性があるものはどれですか。", "c": ["アンモナイトの化石とシダ植物の化石", "マンモスの牙の化石", "石器", "サンヨウチュウとマンモスの化石"], "e": "キョウリュウは中生代の生き物です。石器やマンモスは新生代です。"}, {"id": "O014", "u": "化石", "lv": "過去問型", "r": 36, "f": "図の読み取り", "q": "キョウリュウの足跡化石の間かくが、進むにつれてだんだん広くなっていました。分かることはどれですか。", "c": ["少しずつ歩く速さが速くなった", "少しずつ歩く速さが遅くなった", "一定の速さで歩いていた", "止まっていた"], "e": "歩はばが大きくなると、速く動いていると考えられます。"}, {"id": "O015", "u": "化石", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "二本足で歩くキョウリュウの足跡化石は、ほとんどが足跡だけ並んでいます。このことから、しっぽを地面に引きずる復元図の何がまちがっていると分かりますか。", "c": ["しっぽを地面に引きずっていないこと(引きずった跡がないから)", "足が4本あること", "頭が大きすぎること", "歩く向きが逆なこと"], "e": "しっぽを引きずっていれば、足跡の間に跡が残るはずです。"}, {"id": "O016", "u": "化石", "lv": "標準", "r": 58, "f": "知識", "q": "台風が通り過ぎたあとに晴れて気温が上がることを何といいますか。", "c": ["台風一過", "二百十日", "白露", "小春日和"], "e": "二百十日は立春から210日目(9月1日ごろ)で、台風で農作物が被害を受けやすい時期です。"}, {"id": "O017", "u": "化石", "lv": "標準", "r": 58, "f": "知識", "q": "太陽系の惑星で、1番目と2番目に大きな惑星の組み合わせとして正しいものはどれですか。", "c": ["1番目は木星、2番目は土星", "1番目は土星、2番目は木星", "1番目は地球、2番目は火星", "1番目は海王星、2番目は天王星"], "e": "土星には氷などでできた大きな輪があり、大気のある巨大な衛星タイタンをもっています。"}, {"id": "O018", "u": "化石", "lv": "標準", "r": 58, "f": "知識", "q": "シイタケについて正しいものはどれですか。", "c": ["キノコの仲間で胞子でふえ、死がいやふんから養分を得る分解者", "植物の仲間で種子でふえる", "光合成をする生産者", "動物の仲間で卵を産む"], "e": "マツタケはアカマツの周辺に生え、人工栽培ができないため高価です。"}, {"id": "O019", "u": "化石", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "イモリとヤモリの分類の組み合わせとして正しいものはどれですか。", "c": ["イモリは両生類、ヤモリはは虫類", "イモリはは虫類、ヤモリは両生類", "どちらも両生類", "どちらもは虫類"], "e": "は虫類はからだがうろこでおおわれ、肺呼吸をします。イモリは皮膚にうろこがありません。"}, {"id": "O020", "u": "化石", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "ウリ科の植物の組み合わせとして正しいものはどれですか。", "c": ["ユウガオ・ツルレイシ", "アサガオ・ツルレイシ", "トウモロコシ・ユウガオ", "アサガオ・トウモロコシ"], "e": "ウリ科の植物は単性花(お花とめ花)を咲かせます。ヘチマ・ヒョウタンもウリ科です。"}, {"id": "W2001", "u": "流水のはたらき", "lv": "基礎", "r": 86, "f": "知識", "q": "流れる水のはたらきのうち、土砂をけずるはたらきを何といいますか。", "c": ["侵食作用", "運搬作用", "堆積作用", "風化作用"], "e": "土砂を運ぶはたらきは運搬作用、積もらせるはたらきは堆積作用です。"}, {"id": "W2002", "u": "流水のはたらき", "lv": "基礎", "r": 84, "f": "知識", "q": "流水の3つのはたらきのうち、水の流れが速いときに大きくなるものの組み合わせはどれですか。", "c": ["侵食作用と運搬作用", "運搬作用と堆積作用", "侵食作用と堆積作用", "堆積作用だけ"], "e": "流れが速いとけずって運ぶはたらきが大きく、遅いと積もらせるはたらきが大きくなります。"}, {"id": "W2003", "u": "流水のはたらき", "lv": "標準", "r": 62, "f": "知識", "q": "運搬作用が大きくなる条件の組み合わせとして正しいものはどれですか。", "c": ["流れが速く、水の量が多いとき", "流れが遅く、水の量が少ないとき", "流れが速く、水の量が少ないとき", "流れが遅く、水の量が多いとき"], "e": "大雨のあとは水の量が増えて流れも速くなり、侵食・運搬のはたらきが大きくなります。"}, {"id": "W2004", "u": "流水のはたらき", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "川がまっすぐ流れているところで、流れが最も速いのはどこですか。", "c": ["川の中央", "右岸のきわ", "左岸のきわ", "どこも同じ"], "e": "中央ほど流れが速く深くなり、川岸に近いほど遅く浅くなります。"}, {"id": "W2005", "u": "流水のはたらき", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "川が曲がって流れているところで、流れが速いのはどちら側ですか。また、その側の川岸はどうなっていますか。", "c": ["外側で、侵食されてがけになっている", "内側で、侵食されてがけになっている", "外側で、土砂が積もって川原になっている", "内側で、土砂が積もって川原になっている"], "e": "内側は流れが遅く、土砂が積もって川原になります。"}, {"id": "W2006", "u": "流水のはたらき", "lv": "応用", "r": 50, "f": "図の読み取り", "q": "川が曲がって流れているところの断面を下流側から見ました。川底の様子として正しいものはどれですか。", "c": ["外側が深く、大きな石が多い。内側は浅く、小さな石が多い", "内側が深く、大きな石が多い", "外側が浅く、小さな石が多い", "どこも同じ深さ"], "e": "流れが速い外側ほど侵食され、小さい石は流されて大きい石が残ります。"}, {"id": "W2007", "u": "流水のはたらき", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "まっすぐ流れている川の断面を下流側から見ました。川底の様子として正しいものはどれですか。", "c": ["中央が深く、中央に大きな石が多い", "両岸が深く、中央が浅い", "中央が浅く、中央に小さな石が多い", "右岸だけが深い"], "e": "流れの速い中央ほど深く、大きな石が残ります。"}, {"id": "W2008", "u": "流水のはたらき", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "坂に水を流し続けると、曲がって流れているところの曲がり方はどうなっていきますか。", "c": ["曲がり方は大きくなっていく", "曲がり方は小さくなっていく", "曲がり方は変わらない", "まっすぐになる"], "e": "外側は侵食され、内側には堆積するので、蛇行はしだいに大きくなります。"}, {"id": "W2009", "u": "流水のはたらき", "lv": "応用", "r": 46, "f": "図の読み取り", "q": "坂に水を流したあと上から見ると、流された土が積もっていた場所はどこですか。", "c": ["曲がって流れている所の内側と、かたむきがゆるやかになった所や水がたまっている所", "曲がって流れている所の外側", "かたむきが急な所", "どこにも積もらない"], "e": "流れが遅くなるところで堆積作用が大きくなります。"}, {"id": "W2010", "u": "流水のはたらき", "lv": "基礎", "r": 84, "f": "知識", "q": "川の上流で、侵食作用によってできる深い谷を何といいますか。", "c": ["V字谷", "扇状地", "三角州", "三日月湖"], "e": "上流は川底のかたむきが大きく流れが速いので、川底が深く侵食されます。"}, {"id": "W2011", "u": "流水のはたらき", "lv": "標準", "r": 62, "f": "知識", "q": "扇状地ができる場所と、主なはたらきの組み合わせとして正しいものはどれですか。", "c": ["川が山地から平地に出る所で、堆積作用", "川が海に出る河口で、侵食作用", "川の上流の山の中で、侵食作用", "川が山地から平地に出る所で、侵食作用"], "e": "かたむきが急にゆるやかになり、流れが急に遅くなって、運びきれなくなった小石や砂が扇の形に積もります。"}, {"id": "W2012", "u": "流水のはたらき", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "扇状地で土砂がたまりやすい理由として正しいものはどれですか。", "c": ["流れが急にゆるやかになって運搬作用が小さくなり、堆積作用が大きくなるから", "流れが急に速くなって侵食作用が大きくなるから", "海水が流れこむから", "雨が多いから"], "e": "扇状地の川は土砂がたまりやすいので、天井川になりやすいといわれます。"}, {"id": "W2013", "u": "流水のはたらき", "lv": "標準", "r": 62, "f": "知識", "q": "扇状地と三角州の土地の利用の組み合わせとして正しいものはどれですか。", "c": ["扇状地は水はけがよく果樹園、三角州は水はけが悪く水田", "扇状地は水はけが悪く水田、三角州は水はけがよく果樹園", "どちらも水田", "どちらも果樹園"], "e": "扇状地には小石や砂など大きめのつぶ、三角州には細かい砂や泥が積もるためです。"}, {"id": "W2014", "u": "流水のはたらき", "lv": "標準", "r": 60, "f": "知識", "q": "河口で、細かい砂や泥が堆積してできる三角形の平らな土地を何といいますか。", "c": ["三角州", "扇状地", "V字谷", "中州"], "e": "河口では流れが非常に遅くなり、細かい砂や泥まで堆積します。"}, {"id": "W2015", "u": "流水のはたらき", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "主に堆積作用によってできる地形の組み合わせとして正しいものはどれですか。", "c": ["扇状地・三角州", "V字谷・扇状地", "V字谷・三角州", "V字谷だけ"], "e": "V字谷は侵食作用によってできます。"}, {"id": "W2016", "u": "流水のはたらき", "lv": "応用", "r": 48, "f": "知識", "q": "三日月湖はどのようにしてできますか。", "c": ["蛇行した川が洪水であふれてまっすぐ流れ、取り残された部分が湖になる", "火山の噴火口に水がたまる", "海の一部が砂でせき止められる", "氷河がけずった所に水がたまる"], "e": "蛇行は中流から下流で見られ、外側は侵食、内側は堆積が進むため曲がりが大きくなります。"}, {"id": "W2017", "u": "流水のはたらき", "lv": "標準", "r": 58, "f": "知識", "q": "川の上流と下流をくらべたとき、上流の特ちょうとして正しいものはどれですか。", "c": ["かたむきが大きく、川はばがせまく、流れが速く、石は大きく角ばっている", "かたむきが小さく、川はばが広く、流れが遅い", "石は小さく丸みを帯びている", "水の量が多い"], "e": "下流はかたむきが小さく、川はばが広く、流れが遅く、水の量が多く、石は小さく丸みを帯びています。"}, {"id": "W2018", "u": "流水のはたらき", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "下流の川原の石が、上流の石より小さく丸みを帯びているのはなぜですか。", "c": ["流される間に石どうしや川底・川岸にぶつかって角がとれ、けずられたから", "下流の水があたたかいから", "下流で石が新しくできるから", "上流の石がとけたから"], "e": "大きな石は大水のときなどに少しずつ下流へ運ばれます。"}, {"id": "W2019", "u": "流水のはたらき", "lv": "過去問型", "r": 36, "f": "図の読み取り", "q": "川の3地点で石を100個ずつ集めると、①は40〜60mmと20〜40mmが多く、②は80mm以上が多く、③は20mm未満が多くなりました。上流・中流・下流の組み合わせとして正しいものはどれですか。", "c": ["①中流、②上流、③下流", "①上流、②中流、③下流", "①下流、②上流、③中流", "①中流、②下流、③上流"], "e": "上流ほど大きな石、下流ほど小さな石が多くなります。"}, {"id": "W2020", "u": "流水のはたらき", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "川原の石を調べるとき、目立った石ばかりを集めないためにする方法はどれですか。", "c": ["1m四方のわくや、流れにそってはったひもにふれている石を集める", "大きな石だけを集める", "きれいな石だけを集める", "手でつかめる石だけを集める"], "e": "かたよりなく集めると、その場所の石の様子を正しく調べられます。"}, {"id": "W2021", "u": "流水のはたらき", "lv": "応用", "r": 46, "f": "しくみ・理由", "q": "川原の石がうろこのように同じ向きに並んでいました。このことから分かることはどれですか。", "c": ["石の並び方から、水が流れる向き(上流側)を推測できる", "石の数を数えられる", "石の重さが分かる", "川の深さが分かる"], "e": "流れの力が大きいと石は転がり、小さいと安定した向きで止まるため、規則正しく並びます。"}, {"id": "W2022", "u": "流水のはたらき", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "大雨のときに川の水位が最も高くなる時刻が、降水量が最も多い時刻より半日以上おそくなるのはなぜですか。", "c": ["川の上流の広い範囲に降った雨が集まって、下流に流れてくるまで時間がかかるから", "雨がすぐに蒸発するから", "雨が地下にしみこまないから", "雨は下流から先に降るから"], "e": "下流では、自分の地域で雨がやんでも水位が上がることがあるので注意が必要です。"}, {"id": "W2023", "u": "流水のはたらき", "lv": "標準", "r": 62, "f": "知識", "q": "大雨のときの洪水や土砂災害などの被害が予想される範囲を示した地図を何といいますか。", "c": ["ハザードマップ", "等高線図", "天気図", "星座早見"], "e": "自治体のウェブサイトなどで公開されているので、ふだんから確認しておくことが大切です。"}, {"id": "W2024", "u": "流水のはたらき", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "川の曲がった部分の外側に、護岸ブロックや堤防が作られることが多いのはなぜですか。", "c": ["外側は流れが速く、侵食作用が大きいから", "外側は流れが遅く、土砂がたまるから", "外側は水が少ないから", "外側は景色がよいから"], "e": "大雨のときは流水のはたらきが大きくなるため、それに備えています。"}, {"id": "W2025", "u": "流水のはたらき", "lv": "標準", "r": 60, "f": "知識", "q": "固い岩石が、気温の変化や水がこおることなどで、もろくなるはたらきを何といいますか。", "c": ["風化作用", "侵食作用", "運搬作用", "堆積作用"], "e": "水がこおると体積が約1.1倍になるため、割れ目に入った水がこおると割れ目が大きくなります。"}, {"id": "W2026", "u": "流水のはたらき", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "日本の川が世界の大きな川とくらべて大雨で洪水を起こしやすいのはなぜですか。", "c": ["かたむきが大きく長さが短いので、大雨が降ると短時間で増水するから", "日本は雨がほとんど降らないから", "日本の川は流れがとても遅いから", "日本の川は長さが長いから"], "e": "日本でとれるミネラルウォーターに軟水が多いのも、海に流れるまでの時間が短いためです。"}, {"id": "W2027", "u": "流水のはたらき", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "セミについて正しいものはどれですか。", "c": ["鳴くのはオスだけで、「カナカナ」はヒグラシ、「シャーシャー」はクマゼミ", "鳴くのはメスだけ", "「カナカナ」はクマゼミ", "「シャーシャー」はミンミンゼミ"], "e": "クマゼミは日本最大のセミです。"}, {"id": "W2028", "u": "流水のはたらき", "lv": "標準", "r": 58, "f": "知識", "q": "打ち水や緑のカーテンで気温が下がるのはなぜですか。", "c": ["水が蒸発するときにまわりの熱をうばうから", "水が熱を出すから", "葉が熱を吸いこんでためるから", "風がふかなくなるから"], "e": "植物の葉からも水が蒸発しています。"}, {"id": "W2029", "u": "流水のはたらき", "lv": "標準", "r": 58, "f": "知識", "q": "アサガオ・ヘチマ・ヒマワリなど夏に花を咲かせる植物は、いつ種子を植えますか。", "c": ["春", "夏", "秋", "冬"], "e": "カブトムシの幼虫は腐葉土を食べて育ちます。"}, {"id": "T2001", "u": "水の三態", "lv": "基礎", "r": 86, "f": "知識", "q": "水の固体・液体・気体の3つの状態をまとめて何といいますか。", "c": ["水の三態", "水の循環", "水の状態変化点", "水の三原則"], "e": "水は温度によって、氷(固体)・水(液体)・水蒸気(気体)と姿を変えます。"}, {"id": "T2002", "u": "水の三態", "lv": "基礎", "r": 84, "f": "知識", "q": "液体の水が氷になるとき、体積と重さはどうなりますか。", "c": ["体積は約1.1倍に大きくなり、重さは変わらない", "体積も重さも大きくなる", "体積は小さくなり、重さは変わらない", "体積は変わらず、重さが軽くなる"], "e": "氷がとけて水になると、体積は約11分の10になります。"}, {"id": "T2003", "u": "水の三態", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "氷が水に浮くのはなぜですか。", "c": ["同じ体積で比べると、氷のほうが水より軽いから", "氷の中に空気が入っているから", "氷のほうが水より重いから", "氷は水をはじくから"], "e": "水が氷になると重さは変わらず体積が大きくなるので、同じ体積あたりの重さは軽くなります。"}, {"id": "T2004", "u": "水の三態", "lv": "基礎", "r": 84, "f": "知識", "q": "水が水蒸気になると、体積はおよそ何倍になりますか。", "c": ["約1700倍", "約1.1倍", "約17倍", "約10倍"], "e": "水蒸気が水にもどると、体積は約1700分の1になります。"}, {"id": "T2005", "u": "水の三態", "lv": "基礎", "r": 82, "f": "知識", "q": "ふつうの水が氷になる温度(凝固点)と、ふっとうする温度(ふっ点)の組み合わせとして正しいものはどれですか。", "c": ["凝固点は0℃、ふっ点は100℃", "凝固点は4℃、ふっ点は100℃", "凝固点は0℃、ふっ点は80℃", "凝固点は−10℃、ふっ点は120℃"], "e": "氷がとける温度(融点)も0℃です。"}, {"id": "T2006", "u": "水の三態", "lv": "標準", "r": 62, "f": "知識", "q": "物質の状態変化の名前の組み合わせとして正しいものはどれですか。", "c": ["固体→液体は融解、液体→気体は気化、気体→液体は凝縮(液化)、液体→固体は凝固", "固体→液体は凝固、液体→固体は融解", "液体→気体は凝縮、気体→液体は気化", "固体→液体は溶解"], "e": "固体と気体の間で直接変化することを昇華といいます。"}, {"id": "T2007", "u": "水の三態", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "昇華の例として正しいものはどれですか。", "c": ["ドライアイスが小さくなって二酸化炭素になる", "氷がとけて水になる", "水がふっとうして水蒸気になる", "コップの外側に水滴がつく"], "e": "冬の朝の霜(しも)は、空気中の水蒸気が急に冷やされて直接氷になったもので、これも昇華です。"}, {"id": "T2008", "u": "水の三態", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "水の表面からだけ水蒸気になることを蒸発、水の内部からも水蒸気になることをふっとうといいます。正しいものはどれですか。", "c": ["蒸発は温度に関係なく起こり、ふっとうはふつう100℃で起こる", "蒸発は100℃でだけ起こる", "ふっとうは何℃でも起こる", "どちらも0℃で起こる"], "e": "洗たく物が乾くのは蒸発のはたらきです。"}, {"id": "T2009", "u": "水の三態", "lv": "応用", "r": 50, "f": "図の読み取り", "q": "−30℃の氷を一定の火力で加熱し、温度をはかり続けました。グラフの形として正しいものはどれですか。", "c": ["上がる→0℃で平らになる→上がる→100℃で平らになる", "一定の割合でずっと上がり続ける", "0℃までは上がり、そのあと下がる", "100℃まで平らで、そのあと上がる"], "e": "温度が変わらない部分では、加えた熱が状態変化だけに使われています。"}, {"id": "T2010", "u": "水の三態", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "氷を加熱していると、0℃でしばらく温度が上がらない時間がありました。その理由として正しいものはどれですか。", "c": ["加えた熱が、氷を水に変えることだけに使われているから", "火が弱くなったから", "とけた水が冷たいから", "氷が熱を出しているから"], "e": "氷がすべてとけ終わるまで0℃のままで、とけ終わると再び温度が上がります。"}, {"id": "T2011", "u": "水の三態", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "氷を加熱して、0℃のまま温度が変わらない間、容器の中はどうなっていますか。", "c": ["氷と水が混ざっている", "氷だけ", "水だけ", "水と水蒸気が混ざっている"], "e": "100℃で温度が変わらない間は、水と水蒸気が混ざっています。"}, {"id": "T2012", "u": "水の三態", "lv": "過去問型", "r": 36, "f": "図の読み取り", "q": "ある量の氷を加熱したところ、0℃のままの時間が6分、100℃に達するまでの時間が18分でした。同じ火力で、氷の量を3分の1にすると、0℃のままの時間は何分になりますか。", "c": ["2分", "6分", "3分", "18分"], "e": "とかすのに必要な熱は氷の量に比例するので、6÷3=2分です。量が少ないほど、温度変化もはやくなります。"}, {"id": "T2013", "u": "水の三態", "lv": "過去問型", "r": 36, "f": "図の読み取り", "q": "同じ火力で、加熱する氷の量を半分にしました。時間と温度のグラフはどう変わりますか。", "c": ["温度が平らになる時間が短くなり、100℃に達するのがはやくなる", "平らになる温度が50℃になる", "グラフはまったく変わらない", "100℃に達するのがおそくなる"], "e": "量が変わっても、平らになる温度(0℃・100℃)は変わりません。"}, {"id": "T2014", "u": "水の三態", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "水を加熱していると、ふっとうする前に、容器の内側に小さな泡がつきました。この泡は何ですか。", "c": ["水にとけていた空気", "水蒸気", "二酸化炭素", "酸素だけ"], "e": "気体は水温が上がると水にとけにくくなるので、空気が出てきます。"}, {"id": "T2015", "u": "水の三態", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "水がふっとうしているとき、水の中から出てくる大きな泡は何ですか。", "c": ["水蒸気", "空気", "酸素", "水素"], "e": "ふっとうは水の内部からも水蒸気になる変化です。"}, {"id": "T2016", "u": "水の三態", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "フラスコの水がふっとうしているとき、ガラス管の口のすぐ上は透明で、少しはなれた所に白い湯気が見えました。それぞれの状態の組み合わせとして正しいものはどれですか。", "c": ["口のすぐ上は気体(水蒸気)、白い湯気は液体(小さな水のつぶ)", "口のすぐ上は液体、湯気は気体", "どちらも気体", "どちらも固体"], "e": "水蒸気は目に見えません。空気で冷やされて小さな水のつぶになると、白く見えます。"}, {"id": "T2017", "u": "水の三態", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ふっとうしている水の温度は、加熱を続けても100℃より上がりません。なぜですか。", "c": ["加えた熱が、水を水蒸気に変えることだけに使われるから", "火が水に届かなくなるから", "水がなくなったから", "温度計がこわれるから"], "e": "水がすべて水蒸気になるまでは、温度は100℃のままです。"}, {"id": "T2018", "u": "水の三態", "lv": "標準", "r": 60, "f": "知識", "q": "水を加熱するとき、急にふっとうしないように入れるものは何ですか。", "c": ["ふっとう石", "温度計", "食塩", "ガラス棒"], "e": "ふっとう石は素焼きのかけらなどで、小さな穴が多くあいています。"}, {"id": "T2019", "u": "水の三態", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "一度使ったふっとう石をそのまま再び使うと、急にふっとうしてしまうことがあります。その理由として正しいものはどれですか。", "c": ["穴の中に入っていた空気が出ていき、冷えると穴が水で満たされてしまうから", "ふっとう石がとけて小さくなったから", "ふっとう石が重くなったから", "ふっとう石に食塩がついたから"], "e": "再び使うには、よく乾かして穴に空気が入った状態にもどす必要があります。"}, {"id": "T2020", "u": "水の三態", "lv": "応用", "r": 46, "f": "まちがい探し", "q": "ふっとう石の代わりとして使えるものはどれですか。", "c": ["植木ばちのような素焼きのかけら", "ビニールシートのかけら", "ペットボトルのかけら", "試験管のかけら"], "e": "表面に小さな穴がたくさんあいているものが使えます。"}, {"id": "T2021", "u": "水の三態", "lv": "基礎", "r": 82, "f": "知識", "q": "氷に何を混ぜると、温度を0℃より低い−20℃くらいまで下げることができますか。", "c": ["食塩", "砂糖", "砂", "水"], "e": "これを寒剤といいます。試験管の水を冷やして、こおらせる実験に使います。"}, {"id": "T2022", "u": "水の三態", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "氷と食塩を混ぜたもので、試験管の水を冷やしました。温度が0℃のまま変わらない間、試験管の中はどうなっていますか。", "c": ["水と氷が混ざっている", "水だけ", "氷だけ", "水蒸気だけ"], "e": "水がすべて氷になると、0℃よりさらに温度が下がります。"}, {"id": "T2023", "u": "水の三態", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "氷水を入れたコップの外側に水滴がつくのはなぜですか。", "c": ["空気中の水蒸気が、冷たいコップで冷やされて水になったから", "コップの中の水がしみ出したから", "氷がとけて外にあふれたから", "コップのガラスから水が出たから"], "e": "冷たい氷水に近い部分ほど冷えるので、水滴が多くつきます。"}, {"id": "T2024", "u": "水の三態", "lv": "過去問型", "r": 36, "f": "図の読み取り", "q": "コップに水と氷を入れておくと、外側に水滴がつきました。水滴が最も多くつく部分はどこですか。", "c": ["中の水面より下の部分", "コップのふちの近く", "コップの外側全体に同じようにつく", "コップの底の裏側だけ"], "e": "冷たい水にふれている部分ほど冷えるので、水滴が多くつきます。"}, {"id": "T2025", "u": "水の三態", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "水に浮かべた氷がすべてとけたとき、水面の高さは氷を入れた直後と比べてどうなっていますか。", "c": ["変わらない", "高くなる", "低くなる", "半分になる"], "e": "浮いている氷は、自分の重さと同じ重さの水をおしのけています。とけるとちょうどその分の水になるので、水面は変わりません。"}, {"id": "T2026", "u": "水の三態", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "冷たい水を入れた水そうに、熱湯を少し入れてふってからふたをしたアルミ缶を入れると、缶がつぶれました。その理由として正しいものはどれですか。", "c": ["缶の中の水蒸気が冷やされて水になり、体積が非常に小さくなったから", "缶の中の空気が増えたから", "水そうの水が缶の中に入ったから", "缶がとけたから"], "e": "缶の中の気体が減ると、まわりの空気におされてつぶれます。"}, {"id": "T2027", "u": "水の三態", "lv": "過去問型", "r": 38, "f": "しくみ・理由", "q": "ふたをしたままのスチール缶を直接火にかけてはいけない理由として正しいものはどれですか。", "c": ["中の水が水蒸気になって体積が非常に大きくなり、缶が破裂するおそれがあるから", "缶がすぐにとけるから", "缶の中の水が凍るから", "缶の色が変わるから"], "e": "水が水蒸気になると体積は約1700倍になります。"}, {"id": "T2028", "u": "水の三態", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "水が氷になるときの体積の変化を利用している、または関係している例として、ふさわしくないものはどれですか。", "c": ["やかんの湯がふっとうする", "冬に水道管がこおって破れることがある", "岩の割れ目にしみこんだ水がこおると、割れ目が広がる", "ペットボトルの水をこおらせると、ふくらむ"], "e": "やかんの湯のふっとうは、水が水蒸気になる変化です。"}, {"id": "T2029", "u": "水の三態", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "打ち水をしたり、汗をかいたりすると涼しくなるのはなぜですか。", "c": ["水が蒸発するときに、まわりから熱(気化熱)をうばうから", "水が熱を出すから", "水が空気を冷たくするから", "水が氷になるから"], "e": "汗をかけないイヌが舌を出して呼吸するのも、気化熱を利用しています。"}, {"id": "T2030", "u": "水の三態", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ドライアイスを水の中に入れると、泡と白いけむりのようなものが出てきます。白いけむりのように見えるものとして正しいものの組み合わせはどれですか。", "c": ["小さな氷のつぶと小さな水滴", "二酸化炭素と空気", "水蒸気と二酸化炭素", "酸素と窒素"], "e": "二酸化炭素も水蒸気も目に見えません。冷やされてできた小さな水や氷のつぶが白く見えます。"}, {"id": "T2031", "u": "水の三態", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ドライアイスをケーキの箱に入れないことがある理由の1つとして、二酸化炭素の性質から考えられるものはどれですか。", "c": ["二酸化炭素が生クリームの水分にとけて、酸っぱい味になってしまうから", "二酸化炭素が甘い味を出すから", "二酸化炭素が燃えるから", "二酸化炭素が空気より軽いから"], "e": "二酸化炭素が水にとけた炭酸水は弱い酸性です。"}, {"id": "T2032", "u": "水の三態", "lv": "標準", "r": 58, "f": "知識", "q": "空気中の水蒸気が冷やされて、ものの表面に水滴となってつくことを何といいますか。", "c": ["結露", "蒸発", "融解", "昇華"], "e": "冬に窓ガラスの内側がくもるのも結露です。"}, {"id": "T2033", "u": "水の三態", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "南極の氷(陸の上の氷床)と北極の氷(海に浮かぶ氷)のうち、とけると海水面を上昇させるのはどちらですか。", "c": ["南極の氷", "北極の氷", "どちらも上昇させる", "どちらも上昇させない"], "e": "北極の氷は海に浮いているので、とけても水面は変わりません。南極の氷は大陸の上にあるので、とけて海に流れこむと水の量が増えます。海水自体が膨張することも海面上昇の原因です。"}, {"id": "T2034", "u": "水の三態", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "天ぷらをあげると油がパチパチとはねるのはなぜですか。", "c": ["具材や衣の水分が高温の油で水蒸気になり、体積が約1700倍に膨張するから", "油が水に変わるから", "油がこおるから", "衣が燃えるから"], "e": "火山の噴火も、マグマにふくまれる水分が水蒸気になって膨張することで勢いよく吹き出します。火山ガスの主成分は水蒸気です。"}, {"id": "T2035", "u": "水の三態", "lv": "応用", "r": 48, "f": "知識", "q": "約2000年以上前に発明された「ヘロンの蒸気機関」は、何の力を利用していますか。", "c": ["水が水蒸気になって体積が大きく増える力", "水がこおって体積が増える力", "磁石の力", "電気の力"], "e": "やかんのふたがカタカタ動くのも、水蒸気の体積が大きくなる力によるものです。"}, {"id": "T2036", "u": "水の三態", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "ドライアイスの上に金属のスプーンをのせると、「ジジジ」と音がしました。その理由として最もふさわしいものはどれですか。", "c": ["スプーンの熱でドライアイスが気体になり、スプーンをおし上げては落ちるのをくり返すから", "ドライアイスがとけて水になるから", "スプーンがこおって割れるから", "ドライアイスが燃えているから"], "e": "金属は熱を伝えやすいので、空気の熱がスプーンに伝わってドライアイスを気体にします。"}, {"id": "T2037", "u": "水の三態", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "ガリレオ温度計(ガラス球の中の空気の体積変化を使う)では、気温が下がると液面はどうなりますか。", "c": ["上がる(空気が収縮するから)", "下がる", "変わらない", "ガラス球がこわれる"], "e": "空気は水より温度による体積の変化が大きいので、空気の体積変化を利用しています。"}, {"id": "R026", "u": "天体総合(暦)", "lv": "標準", "r": 58, "f": "知識", "q": "やぎ座について正しいものはどれですか。", "c": ["黄道12星座の1つで、2等星以上の明るい星がなく見つけにくい", "冬の大三角をつくる星座", "北極星をふくむ星座", "1等星が2つある"], "e": "9月下旬の午後8時ごろに南中します。"}, {"id": "Z041", "u": "生き物のふえ方", "lv": "標準", "r": 58, "f": "知識", "q": "タツノオトシゴの子育てとして正しいものはどれですか。", "c": ["メスがオスのお腹の育児のうに卵を産み、オスが卵を育てる", "メスが卵を口の中で育てる", "卵を水草に産みつけて放っておく", "子を胎内で育てて産む哺乳類である"], "e": "ナンヨウマンタはお腹の中で卵をかえしてから子を産みます(卵胎生)。マンボウは2〜3億個の卵を産むといわれます。"}, {"id": "Z042", "u": "生き物のふえ方", "lv": "標準", "r": 58, "f": "知識", "q": "秋に北の海から南下してくるカツオを何といいますか。", "c": ["戻り鰹", "初鰹", "寒鰹", "上り鰹"], "e": "春に北上するのは「上り鰹(初鰹)」で、戻り鰹は脂がのっています。"}, {"id": "Z043", "u": "生き物のふえ方", "lv": "標準", "r": 58, "f": "知識", "q": "秋雨前線ができるときのようすとして正しいものはどれですか。", "c": ["あたたかく湿った小笠原気団が弱まり、梅雨前線と同じ停滞前線ができる", "冷たい北西の季節風がふく", "台風が日本列島を横切る", "寒冷前線が通過する"], "e": "台風と重なると大きな被害が出ることがあります。"}, {"id": "H2001", "u": "熱の伝わり方", "lv": "基礎", "r": 86, "f": "知識", "q": "熱は、どちらからどちらへ移動しますか。", "c": ["温度の高い方から低い方へ", "温度の低い方から高い方へ", "重い方から軽い方へ", "上から下へ必ず移動する"], "e": "冬に金属の手すりをさわると冷たく感じるのは、手から手すりへ熱が移動するからです。"}, {"id": "H2002", "u": "熱の伝わり方", "lv": "基礎", "r": 84, "f": "知識", "q": "物の中を、熱が温度の高い所から低い所へ順に伝わっていく伝わり方を何といいますか。", "c": ["伝導", "対流", "放射", "蒸発"], "e": "熱いスープの入った器を持つと熱く感じるのも伝導です。"}, {"id": "H2003", "u": "熱の伝わり方", "lv": "標準", "r": 62, "f": "まちがい探し", "q": "熱を伝えやすい順に並べたものとして正しいものはどれですか。", "c": ["銅→アルミニウム→鉄→ガラス→空気", "鉄→銅→ガラス→空気", "ガラス→鉄→銅→空気", "空気→ガラス→鉄→銅"], "e": "金属は熱を伝えやすく、ガラス・木・プラスチック・水・空気は伝えにくい物です。"}, {"id": "H2004", "u": "熱の伝わり方", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "サーモシールをはった金属板の1つの角を熱しました。色の変わり方として正しいものはどれですか。", "c": ["熱した点を中心に、円が広がるように変わっていく", "板の上の方から先に変わる", "熱した点から遠い所から変わる", "板全体が同時に変わる"], "e": "伝導では、熱した所に近い所から順に伝わります。"}, {"id": "H2005", "u": "熱の伝わり方", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "金属の棒の左はしを熱し、同じ間かくでろうをのせました。ろうがとける順として正しいものはどれですか。", "c": ["熱した所に近いろうから順にとける", "遠いろうから順にとける", "全部同時にとける", "まん中から先にとける"], "e": "棒をかたむけても、熱した所からの距離が同じなら同時にとけます。"}, {"id": "H2006", "u": "熱の伝わり方", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "鉄の棒の途中に竹のつつをはさんで熱すると、竹の先のろうはなかなかとけませんでした。分かることはどれですか。", "c": ["竹は鉄より熱を伝えにくい", "竹は鉄より熱を伝えやすい", "竹は熱で燃えやすい", "ろうは竹にくっつかない"], "e": "やかんの取っ手やドライバーの柄に木やプラスチックを使うのも、熱を伝えにくい性質を利用しています。"}, {"id": "H2007", "u": "熱の伝わり方", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "熱を伝えにくい性質を利用しているものとして、ふさわしくないものはどれですか。", "c": ["フライパンの底を鉄にする", "なべの取っ手をプラスチックにする", "鍋つかみを布で作る", "保温のため発泡スチロールの箱に入れる"], "e": "フライパンの底は、熱をよく伝えて料理をあたためるため金属でできています。"}, {"id": "H2008", "u": "熱の伝わり方", "lv": "基礎", "r": 84, "f": "知識", "q": "水や空気が、あたためられた部分が動いて流れをつくりながら全体に熱が伝わる伝わり方を何といいますか。", "c": ["対流", "伝導", "放射", "融解"], "e": "水の動きは、おがくずやサーモインクを入れておくと見やすくなります。"}, {"id": "H2009", "u": "熱の伝わり方", "lv": "標準", "r": 62, "f": "しくみ・理由", "q": "水をあたためると、あたためられた部分が上へ動くのはなぜですか。", "c": ["膨張して、同じ体積で比べるとまわりの水より軽くなるから", "収縮して重くなるから", "膨張して重くなるから", "収縮して軽くなるから"], "e": "冷やされた水は収縮して重くなり、下へ動きます。"}, {"id": "H2010", "u": "熱の伝わり方", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "ビーカーの底のまん中をアルコールランプで熱しました。水の動きとして正しいものはどれですか。", "c": ["まん中を上へ上がり、水面でわかれて両側を下りてくる", "両側を上がり、まん中を下りてくる", "水は動かない", "底にそって横に流れるだけ"], "e": "あたためた所の水が上がり、そこへまわりの水が流れこみます。"}, {"id": "H2011", "u": "熱の伝わり方", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "ビーカーの底の右はしを熱しました。水の動きとして正しいものはどれですか。", "c": ["右側を上がって水面を左へ流れ、左側を下りて底を右へもどる", "左側を上がって右側を下りる", "まん中を上がる", "底から動かない"], "e": "熱した所の真上を水が上がります。"}, {"id": "H2012", "u": "熱の伝わり方", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "試験管に水を入れ、A:水面近くを熱した場合と、B:底を熱した場合を比べました。正しいものはどれですか。", "c": ["Aでは上の方だけが先にわき立ち下は冷たいまま。Bは全体が早くあたたまる", "Aの方が全体が早くあたたまる", "どちらも同じ", "Bでは下の方だけが熱くなる"], "e": "あたためられた水は上へ動くので、下を熱すると対流が起こって全体があたたまります。"}, {"id": "H2013", "u": "熱の伝わり方", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "試験管の底に氷を石でしずめ、水面近くを熱すると、上の水がふっとうしても氷はなかなかとけませんでした。その理由として正しいものはどれですか。", "c": ["あたためられた水は上にたまり、水は熱を伝えにくいので下まで熱が届かないから", "石が熱を吸いとったから", "氷は100℃でないととけないから", "試験管が熱を伝えないから"], "e": "氷を浮かべて底を熱すると、対流で早くとけます。"}, {"id": "H2014", "u": "熱の伝わり方", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "水に氷を浮かべてしばらく置きました。水の動きとして正しいものはどれですか。", "c": ["氷の下で冷やされた水が下へ動き、まわりの水が上がってくる", "氷の下の水が上へ動く", "水はまったく動かない", "水面にそって氷から遠ざかるだけ"], "e": "冷やされた水は重くなって下へしずみます。"}, {"id": "H2015", "u": "熱の伝わり方", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "同じフラスコに20℃の水と80℃の水を同じ体積だけ入れて重さを比べました。正しいものはどれですか。", "c": ["80℃の水の方が軽い", "80℃の水の方が重い", "同じ重さ", "80℃の水の方が2倍重い"], "e": "あたためられた水は膨張するので、同じ体積で比べると軽くなります。"}, {"id": "H2016", "u": "熱の伝わり方", "lv": "標準", "r": 62, "f": "知識", "q": "部屋をあたためるストーブと、冷やすエアコン(冷房)の置き方として正しいものはどれですか。", "c": ["ストーブは低い所、冷房は高い所", "ストーブは高い所、冷房は低い所", "どちらも高い所", "どちらも低い所"], "e": "あたたかい空気は上へ、冷たい空気は下へ動くので、対流で部屋全体の温度が変わります。"}, {"id": "H2017", "u": "熱の伝わり方", "lv": "基礎", "r": 82, "f": "知識", "q": "熱が物を通らずに、光とともに直接伝わる伝わり方を何といいますか。", "c": ["放射", "伝導", "対流", "凝縮"], "e": "太陽の熱は何もない宇宙空間を通って、放射で地球に届きます。"}, {"id": "H2018", "u": "熱の伝わり方", "lv": "標準", "r": 62, "f": "知識", "q": "放射による熱について正しいものはどれですか。", "c": ["黒いものによく吸収され、白いものや鏡には反射されやすい", "白いものによく吸収される", "鏡によく吸収される", "どの色でも同じように吸収される"], "e": "虫めがねで日光を集めると、白い紙より黒い紙の方が早くこげます。"}, {"id": "H2019", "u": "熱の伝わり方", "lv": "標準", "r": 58, "f": "しくみ・理由", "q": "たき火に当たると、顔や手はあたたかいのに背中は寒いのはなぜですか。", "c": ["放射の熱は、光が当たらない所には届かないから", "背中の方が空気が多いから", "背中は皮ふが厚いから", "たき火の熱は対流で上にしか動かないから"], "e": "電気ストーブの奥の金属の板は、熱を反射してストーブの前をあたためるためについています。"}, {"id": "H2020", "u": "熱の伝わり方", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "次のうち、放射の熱と最も関係が深いものはどれですか。", "c": ["夏は白っぽい服、冬は黒っぽい服を着る", "なべの取っ手を木で作る", "暖房器具を床の近くに置く", "お風呂をかき混ぜる"], "e": "黒っぽい服は日光の熱を吸収し、白っぽい服は反射します。"}, {"id": "H2021", "u": "熱の伝わり方", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "伝導・対流・放射の組み合わせとして正しいものはどれですか。\nA 熱いお茶を入れた湯のみが熱い\nB お風呂の上だけ熱く下がぬるい\nC 晴れた日の砂浜が熱い", "c": ["A伝導・B対流・C放射", "A対流・B伝導・C放射", "A放射・B対流・C伝導", "A伝導・B放射・C対流"], "e": "お風呂の上だけ熱いのは、あたためられた水が上へ動くからです。"}, {"id": "H2022", "u": "熱の伝わり方", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "くもりの日の夜より、晴れた日の夜の方が気温が下がりやすいのはなぜですか。", "c": ["雲がないと、地面の熱が放射で宇宙へにげやすいから", "晴れた夜は風が強いから", "晴れた夜は月が熱をうばうから", "雲が熱をつくるから"], "e": "雲が毛布のように熱がにげるのを防ぐので、くもりの夜は冷えにくくなります。"}, {"id": "H2023", "u": "熱の伝わり方", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "寒さを防ぐ工夫と熱の伝わり方の組み合わせとして、まちがっているものはどれですか。", "c": ["日なたぼっこをする ― 伝導", "湯たんぽを布団に入れる ― 伝導", "暖房を床近くに置く ― 対流", "黒っぽい服を着る ― 放射"], "e": "日なたぼっこは太陽の放射の熱を利用しています。"}, {"id": "H2024", "u": "熱の伝わり方", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "ダウンジャケットや二重窓があたたかい理由として正しいものはどれですか。", "c": ["羽毛や窓の間にある空気が熱を伝えにくいから", "羽毛が熱をつくるから", "空気が熱を伝えやすいから", "ガラスが熱を吸収するから"], "e": "空気はとても熱を伝えにくい物です。"}, {"id": "H2025", "u": "熱の伝わり方", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "密閉した容器の中に砂と水を入れ、上からライトで照らしました。しばらくすると温度が高くなるのはどちらで、そのとき線香のけむりはどう動きますか。", "c": ["砂の方が高くなり、砂の上でけむりが上がって水の上で下がる", "水の方が高くなり、水の上でけむりが上がる", "どちらも同じで、けむりは動かない", "砂の方が高くなり、砂の上でけむりが下がる"], "e": "砂は水よりあたたまりやすく、砂の上の空気が膨張して上がります。"}, {"id": "H2026", "u": "熱の伝わり方", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "砂と水をライトで照らしたあと、ライトを消してしばらく置きました。温度が早く下がるのはどちらで、けむりはどう動きますか。", "c": ["砂の方が早く下がり、水の上でけむりが上がって砂の上で下がる", "水の方が早く下がり、けむりは動かない", "砂の方が早く下がり、砂の上でけむりが上がる", "水の方が早く下がり、水の上でけむりが下がる"], "e": "砂はあたたまりやすく冷めやすいので、こんどは水の方が温度が高くなります。"}, {"id": "H2027", "u": "熱の伝わり方", "lv": "標準", "r": 62, "f": "知識", "q": "よく晴れた日の昼間に、海岸付近で海から陸へふく風を何といいますか。", "c": ["海風", "陸風", "季節風", "偏西風"], "e": "昼は陸の方があたたまりやすく、陸上の空気が上がり、そこへ海上の空気が流れこみます。"}, {"id": "H2028", "u": "熱の伝わり方", "lv": "応用", "r": 50, "f": "しくみ・理由", "q": "よく晴れた日の夜に、陸から海へ風がふく理由として正しいものはどれですか。", "c": ["陸の方が冷えやすく、海上の空気の方があたたかくて上がるので、陸から空気が流れこむから", "陸の方があたたまりやすいから", "海の方が冷えやすいから", "月が海の空気を引っぱるから"], "e": "夜にふく陸から海への風を陸風といいます。"}, {"id": "H2029", "u": "熱の伝わり方", "lv": "応用", "r": 48, "f": "知識", "q": "海岸付近で、朝や夕方に風がほとんどふかなくなることを何といいますか。また、その理由はどれですか。", "c": ["なぎで、海と陸の温度差がほとんどなくなるから", "なぎで、気温が最も高くなるから", "季節風で、温度差が大きくなるから", "台風で、気圧が下がるから"], "e": "なぎは朝と夕方の1日2回起こります(朝なぎ・夕なぎ)。"}, {"id": "H2030", "u": "熱の伝わり方", "lv": "標準", "r": 60, "f": "知識", "q": "日本の夏の季節風について正しいものはどれですか。", "c": ["太平洋から大陸に向かって、南東の風がふく", "大陸から太平洋に向かって、北西の風がふく", "太平洋から大陸に向かって、北西の風がふく", "大陸から太平洋に向かって、南東の風がふく"], "e": "夏は大陸の方があたたまりやすいので、大陸上の空気が上がり、海洋から空気が流れこみます。"}, {"id": "H2031", "u": "熱の伝わり方", "lv": "応用", "r": 48, "f": "知識", "q": "日本の冬の季節風について正しいものはどれですか。", "c": ["大陸から太平洋に向かって、北西の風がふく", "太平洋から大陸に向かって、南東の風がふく", "大陸から太平洋に向かって、南東の風がふく", "太平洋から大陸に向かって、北西の風がふく"], "e": "冬は大陸の方が冷えやすく、海洋上の空気があたたかくて上がるので、大陸から冷たい空気が流れこみます。"}, {"id": "H2032", "u": "熱の伝わり方", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "冬に季節風がふいているとき、海洋上と大陸上の空気で温度が高いのはどちらですか。", "c": ["海洋上の空気", "大陸上の空気", "どちらも同じ", "時刻によって必ず入れかわる"], "e": "海(水)は冷えにくいので、冬は海洋上の空気の方があたたかくなります。"}, {"id": "H2033", "u": "熱の伝わり方", "lv": "過去問型", "r": 36, "f": "図の読み取り", "q": "海岸近くのある場所で、気温が最も高くなるのは午後2時ごろ、海水の温度は1日中ほとんど変わりませんでした。昼に海風がふき始めるのはいつごろだと考えられますか。", "c": ["気温が海水の温度より高くなったとき", "気温が最も低くなったとき", "気温と海水の温度が同じになったとき", "真夜中"], "e": "陸上の空気の方があたたかくなると、海から陸へ風がふきます。気温と海水の温度が同じになるときが、なぎです。"}, {"id": "H2034", "u": "熱の伝わり方", "lv": "標準", "r": 58, "f": "知識", "q": "打ち水や緑のカーテンですずしくなるのは、どのしくみを利用していますか。", "c": ["水が蒸発するときにまわりから熱をうばうこと(気化熱)", "水が氷になるときに熱を出すこと", "空気が熱を伝えやすいこと", "葉が熱をつくること"], "e": "植物の葉からも、蒸散で水が蒸発しています。"}, {"id": "H2035", "u": "熱の伝わり方", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "秋の七草ではないものはどれですか。", "c": ["ナズナ", "オミナエシ", "ススキ", "フジバカマ"], "e": "秋の七草はオミナエシ・ススキ・キキョウ・ナデシコ・フジバカマ・クズ・ハギです。ナズナは春の七草です。"}, {"id": "H2036", "u": "熱の伝わり方", "lv": "標準", "r": 60, "f": "知識", "q": "冬鳥のマガンやナベヅルについて正しいものはどれですか。", "c": ["秋に北から日本に来て冬をこし、ナベヅルは主に鹿児島県出水市で越冬する", "春に南から来る夏鳥", "1年中日本でくらす留鳥", "日本では見られない"], "e": "マガモ・オオハクチョウ・ツグミも冬鳥です。"}, {"id": "H2037", "u": "熱の伝わり方", "lv": "標準", "r": 58, "f": "知識", "q": "カエデの仲間の種子と、マツの種子の共通点として正しいものはどれですか。", "c": ["どちらもはねがついていて、風で運ばれる", "どちらも動物に食べられて運ばれる", "どちらもはじけて飛ぶ", "どちらも水に流されて運ばれる"], "e": "イロハモミジなどの種子は回転しながらゆっくり落ちます。"}, {"id": "H2038", "u": "熱の伝わり方", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "哺乳類ではないものはどれですか。", "c": ["サメ", "クジラ", "シャチ", "イルカ"], "e": "クジラ・シャチ・イルカは海にすむ哺乳類です。サメやタツノオトシゴは魚類です。"}, {"id": "P2001", "u": "光の性質", "lv": "基礎", "r": 84, "f": "知識", "q": "虫めがねに使われている、まん中が厚くなったレンズを何といいますか。", "c": ["凸レンズ", "凹レンズ", "平面鏡", "プリズム"], "e": "平行に進む光は凸レンズで屈折して1点に集まります。この点を焦点といいます。"}, {"id": "P2002", "u": "光の性質", "lv": "標準", "r": 62, "f": "知識", "q": "凸レンズの中心から焦点までの長さを何といいますか。また、レンズが厚いほどその長さはどうなりますか。", "c": ["焦点距離で、レンズが厚いほど短くなる", "焦点距離で、レンズが厚いほど長くなる", "屈折距離で、厚さに関係ない", "焦点距離で、レンズがうすいほど短くなる"], "e": "厚いレンズほど光を大きく曲げるので、焦点がレンズに近くなります。"}, {"id": "P2003", "u": "光の性質", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "日光を凸レンズに当て、うしろにスクリーンを置きます。焦点の前と後ろで、焦点から同じ距離の所にスクリーンを置くと、光の円の大きさはどうなりますか。", "c": ["同じ大きさになる", "焦点より前の方が大きい", "焦点より後ろの方が大きい", "どちらも点になる"], "e": "光は焦点で1点に集まったあと、同じように広がっていきます。"}, {"id": "P2004", "u": "光の性質", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "小さい虫めがねと大きい虫めがねで日光を集めて紙をこがすとき、早くこげるのはどちらですか。", "c": ["大きい虫めがね", "小さい虫めがね", "どちらも同じ", "こげない"], "e": "大きいレンズほど多くの光(熱)を集められます。"}, {"id": "P2005", "u": "光の性質", "lv": "標準", "r": 62, "f": "知識", "q": "同じ虫めがねで白い紙と黒い紙に日光を集めると、早くこげるのはどちらですか。", "c": ["黒い紙", "白い紙", "どちらも同じ", "どちらもこげない"], "e": "黒いものは光をよく吸収し、白いものは反射します。"}, {"id": "P2006", "u": "光の性質", "lv": "応用", "r": 48, "f": "知識", "q": "プリズムで日光を分けたとき、屈折の度合いが小さい順に並べたものとして正しいものはどれですか。", "c": ["赤・橙・黄・緑・青・藍・紫", "紫・藍・青・緑・黄・橙・赤", "赤・黄・橙・緑・紫・藍・青", "青・緑・黄・赤・橙・藍・紫"], "e": "虹もこの順に色が並んで見えます。"}, {"id": "P2007", "u": "光の性質", "lv": "応用", "r": 46, "f": "知識", "q": "赤外線と紫外線について正しいものはどれですか。", "c": ["赤外線は熱をよく伝え、紫外線の多くは大気の上層のオゾン層で吸収される", "紫外線は熱をよく伝え、赤外線はオゾン層で吸収される", "どちらも目に見える光", "どちらも地上には届かない"], "e": "こたつやストーブには赤外線が利用されています。"}, {"id": "R027", "u": "天体総合(暦)", "lv": "標準", "r": 60, "f": "知識", "q": "月食が起こるときの月の形と、月の全体が地球の影に入る月食の名前の組み合わせとして正しいものはどれですか。", "c": ["満月のときで、皆既月食", "新月のときで、皆既月食", "満月のときで、皆既日食", "新月のときで、部分月食"], "e": "月食は太陽・地球・月の順に一直線に並ぶときに起こるので、満月のときです。"}, {"id": "K016", "u": "昆虫①", "lv": "標準", "r": 58, "f": "知識", "q": "秋に鳴く虫とその鳴き声の組み合わせとして正しいものはどれですか。", "c": ["スズムシ ― リーンリーン、マツムシ ― チンチロリン", "スズムシ ― チンチロリン、マツムシ ― リーンリーン", "エンマコオロギ ― ジー", "ケラ ― コロコロリー"], "e": "エンマコオロギはコロコロリー、ケラはジーと鳴きます。"}, {"id": "K017", "u": "昆虫①", "lv": "標準", "r": 58, "f": "知識", "q": "エンマコオロギなど、秋に鳴く虫で鳴くのはどれですか。", "c": ["オスのみ", "メスのみ", "オスとメスの両方", "鳴かない"], "e": "セミも鳴くのはオスだけです。"}, {"id": "Z044", "u": "生き物のふえ方", "lv": "標準", "r": 58, "f": "まちがい探し", "q": "動物などにくっついて種子が運ばれる植物の組み合わせとして正しいものはどれですか。", "c": ["アメリカセンダングサ・オナモミ", "カタバミ・ホウセンカ", "タンポポ・ススキ", "カタバミ・オナモミ"], "e": "カタバミやホウセンカは、実がはじけて種子が飛び散ります。"}, {"id": "Z045", "u": "生き物のふえ方", "lv": "標準", "r": 58, "f": "知識", "q": "カントウタンポポの花粉と種子を運ぶものの組み合わせとして正しいものはどれですか。", "c": ["花粉は虫、種子は風", "花粉は風、種子は虫", "どちらも風", "どちらも鳥"], "e": "種子(正確には果実)には綿毛がついていて、風で運ばれます。"}, {"id": "Z046", "u": "生き物のふえ方", "lv": "応用", "r": 48, "f": "知識", "q": "クリについて正しいものはどれですか。", "c": ["落葉樹で、発芽のための養分を子葉にたくわえ、その部分を食べている", "常緑樹で、胚乳を食べている", "落葉樹で、花びらを食べている", "常緑樹で、根を食べている"], "e": "クリはブナ科で、雑木林でよく見られます。ススキはイネ科で、種子は風で運ばれます。"}, {"id": "P2008", "u": "光の性質", "lv": "基礎", "r": 84, "f": "知識", "q": "光の三原色の組み合わせとして正しいものはどれですか。", "c": ["赤色・緑色・青色", "赤色・黄色・青色", "水色・黄色・赤紫色", "赤色・緑色・黄色"], "e": "色の三原色(絵の具など)は、水色・黄色・赤紫色です。"}, {"id": "P2009", "u": "光の性質", "lv": "標準", "r": 62, "f": "知識", "q": "光の三原色をすべて同じ量ずつ混ぜると何色になりますか。また、色の三原色の絵の具をすべて混ぜると何色になりますか。", "c": ["光は白色、絵の具は黒色", "光は黒色、絵の具は白色", "どちらも白色", "どちらも黒色"], "e": "光は混ぜるほど明るく、絵の具は混ぜるほど暗くなります。"}, {"id": "P2010", "u": "光の性質", "lv": "標準", "r": 62, "f": "知識", "q": "赤色の光と緑色の光を重ねると、何色の光になりますか。", "c": ["黄色", "水色", "赤紫色", "白色"], "e": "緑+青=水色、赤+青=赤紫色、赤+緑+青=白色です。"}, {"id": "P2011", "u": "光の性質", "lv": "標準", "r": 60, "f": "知識", "q": "緑色の光と青色の光を重ねると、何色の光になりますか。", "c": ["水色", "黄色", "赤紫色", "黒色"], "e": "光の三原色のうち2色を重ねると、黄色・水色・赤紫色のどれかになります。"}, {"id": "P2012", "u": "光の性質", "lv": "応用", "r": 48, "f": "知識", "q": "水色・黄色・赤紫色の3つの光を重ねると、何色の光になりますか。", "c": ["白色", "黒色", "緑色", "赤色"], "e": "水色(緑+青)・黄色(赤+緑)・赤紫色(赤+青)には赤・緑・青がすべてふくまれるので、白色になります。"}, {"id": "P2013", "u": "光の性質", "lv": "標準", "r": 62, "f": "知識", "q": "白色の光を当てたトマトが赤色に見えるのはなぜですか。", "c": ["赤色の光だけを反射し、ほかの色の光は吸収するから", "赤色の光だけを吸収するから", "すべての色の光を反射するから", "トマトが自分で赤い光を出しているから"], "e": "すべての色の光を反射すると白色に、すべて吸収すると黒色に見えます。"}, {"id": "P2014", "u": "光の性質", "lv": "標準", "r": 60, "f": "まちがい探し", "q": "光源から出た光が直接目に届いて見えるものはどれですか。", "c": ["夜空の星座の恒星", "満月", "教科書の白い紙", "黒板の文字"], "e": "恒星は自ら光を出しています。月は太陽の光を反射して光って見えます。"}, {"id": "P2015", "u": "光の性質", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "白い紙に赤色のペンで書いた文字を、赤色の透明な下じきごしに見ると、文字が見えなくなりました。その理由はどれですか。", "c": ["赤色の下じきは赤色の光だけを通すので、白い部分も赤い文字も同じ赤色に見えるから", "赤色の下じきがすべての光を吸収するから", "文字の赤色が下じきに吸いとられるから", "白い紙が赤い光を出すから"], "e": "緑色のペンで書いた文字は、緑の光が下じきを通れないので黒く見えます。"}, {"id": "P2016", "u": "光の性質", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "緑色のペンで書いた文字を、赤色の透明な下じきごしに見ると、文字は何色に見えますか。", "c": ["黒色", "緑色", "赤色", "黄色"], "e": "緑の文字は緑の光しか反射せず、その光は赤い下じきを通れないので、目に届く光がなく黒く見えます。"}, {"id": "P2017", "u": "光の性質", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "暗い部屋で、白いボールに赤色の光だけを当てました。ボール・光の当たったかべ・かべにできた影は、それぞれ何色に見えますか。", "c": ["ボールは赤色、かべは赤色、影は黒色", "ボールは白色、かべは赤色、影は黒色", "ボールは赤色、かべは白色、影は赤色", "すべて赤色"], "e": "白いものは当たった光をそのまま反射します。影には光が届かないので黒く見えます。"}, {"id": "P2018", "u": "光の性質", "lv": "過去問型", "r": 36, "f": "図の読み取り", "q": "暗い部屋で、白いかべの前のボールに、左から青色の光、右から緑色の光を当てました。左から当てた青色の光でできた影には、何色の光が当たっていますか。", "c": ["緑色(影は緑色に見える)", "青色", "水色", "黒色"], "e": "青色の光をボールがさえぎってできた影にも、右からの緑色の光は届くので、影は緑色に見えます。両方の光が当たるかべは水色に見えます。"}, {"id": "P2019", "u": "光の性質", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "白い光で黄色に見える車に、赤色・緑色・青色のスポットライトを当てたところ、すべて赤色の光に変えると車は何色に見えますか。", "c": ["赤色", "黄色", "黒色", "緑色"], "e": "黄色に見える車は赤と緑の光を反射します。赤い光だけを当てると、赤い光を反射して赤く見えます。青い光だけなら、反射できないので黒く見えます。"}, {"id": "P2020", "u": "光の性質", "lv": "標準", "r": 62, "f": "知識", "q": "光がガラスや水にななめに入るときに、折れ曲がって進むことを何といいますか。", "c": ["屈折", "反射", "散乱", "吸収"], "e": "水を入れたコップのストローが折れ曲がって見えるのも屈折のためです。"}, {"id": "P2021", "u": "光の性質", "lv": "標準", "r": 60, "f": "図の読み取り", "q": "プリズムで日光を分けたとき、最も大きく曲がる(屈折しやすい)のは何色の光ですか。", "c": ["紫色", "赤色", "黄色", "緑色"], "e": "赤・橙・黄・緑・青・藍・紫の順に、屈折の度合いが大きくなります。"}, {"id": "P2022", "u": "光の性質", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "プリズムで日光の色が分かれるのはなぜですか。", "c": ["光の色によって屈折する度合いがちがうから", "プリズムが色をつけるから", "光が反射するたびに色が変わるから", "日光が熱で変化するから"], "e": "虹は、空気中の水てきがプリズムのようなはたらきをしてできます。"}, {"id": "P2023", "u": "光の性質", "lv": "標準", "r": 58, "f": "しくみ・理由", "q": "空が青く見えたり、夕焼けが赤く見えたりするのはなぜですか。", "c": ["青い光は空気中で散らばりやすく、赤い光は散らばりにくいから", "空が青い色をしているから", "太陽の光が青いから", "海の色が空にうつるから"], "e": "夕方は光が空気中を長く通るため、青い光は散らばって届かず、赤い光が目に届きます。皆既月食で月が赤く見えるのも同じしくみです。"}, {"id": "P2024", "u": "光の性質", "lv": "標準", "r": 62, "f": "知識", "q": "日光のように平行に進む光線と、豆電球のように広がって進む光線をそれぞれ何といいますか。", "c": ["平行光線と拡散光線", "拡散光線と平行光線", "直進光線と屈折光線", "反射光線と散乱光線"], "e": "太陽は球形で光を広げて出していますが、とても遠いので、地球には平行光線として届きます。"}, {"id": "P2025", "u": "光の性質", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "太陽の光と街灯の光でできる影の説明として、正しいものの組み合わせはどれですか。", "c": ["太陽の影は少し移動しても長さが変わらず、街灯の影は街灯から遠ざかると長くなる", "太陽の影は少し移動すると長くなり、街灯の影は変わらない", "どちらも少し移動すると長くなる", "どちらも長さは変わらない"], "e": "太陽は平行光線、街灯は拡散光線だからです。"}, {"id": "P2026", "u": "光の性質", "lv": "標準", "r": 60, "f": "しくみ・理由", "q": "太陽高度が高いときの方が、地面があたたまりやすいのはなぜですか。", "c": ["同じ面積あたりで受け取る光(熱)の量が多いから", "太陽が地面に近づくから", "空気が少なくなるから", "光の色が変わるから"], "e": "板に日光を当てるときは、光に対して板を垂直(90°)に近くかたむけると最もあたたまりやすくなります。"}, {"id": "P2027", "u": "光の性質", "lv": "標準", "r": 62, "f": "知識", "q": "目に見えない光のうち、熱をよく伝える光と、日焼けの原因になる光の組み合わせはどれですか。", "c": ["熱を伝えるのは赤外線、日焼けの原因は紫外線", "熱を伝えるのは紫外線、日焼けの原因は赤外線", "どちらも可視光線", "どちらも赤外線"], "e": "太陽の紫外線の多くは、大気の上層のオゾン層で吸収されます。紫外線は殺菌灯にも使われ、体内でビタミンDをつくるはたらきもあります。"}, {"id": "P2028", "u": "光の性質", "lv": "応用", "r": 48, "f": "知識", "q": "光が真空中を進む速さとして最も近いものはどれですか。", "c": ["1秒間に約30万km", "1秒間に約3000m", "1秒間に約3000km", "1秒間に約30億km"], "e": "1秒間に地球のまわり(約4万km)を約7周半進む速さです。太陽の光が地球に届くまで約500秒かかります。"}, {"id": "P2029", "u": "光の性質", "lv": "過去問型", "r": 36, "f": "計算", "q": "地球1周を約4万kmとすると、光(1秒間に約30万km)は1秒間に地球を約何周しますか。", "c": ["約7.5周", "約75周", "約0.75周", "約3周"], "e": "30万÷4万=7.5です。"}, {"id": "P2030", "u": "光の性質", "lv": "標準", "r": 58, "f": "知識", "q": "星までの距離を表す「1光年」とはどのような距離ですか。", "c": ["光が1年間に進む距離(およそ10兆km)", "光が1日に進む距離", "地球が1年間に公転する距離", "太陽から地球までの距離"], "e": "光の速さを初めて地上で測ることに成功したのは、19世紀のフランスのフィゾーです。"}, {"id": "P2031", "u": "光の性質", "lv": "標準", "r": 62, "f": "図の読み取り", "q": "とつレンズに日光を当て、焦点より手前と、焦点より後ろの同じ距離の所に紙を置きました。紙にうつる明るい部分の大きさはどうなりますか。", "c": ["同じ大きさの円になる", "手前の方が大きい", "後ろの方が大きい", "どちらも点になる"], "e": "焦点の所では光が1点に集まり、最も明るく熱くなります。"}, {"id": "P2032", "u": "光の性質", "lv": "応用", "r": 48, "f": "しくみ・理由", "q": "同じ厚さで大きさのちがう虫めがねで日光を集めると、大きい虫めがねの方が早く紙がこげます。その理由はどれですか。", "c": ["大きいレンズの方が、たくさんの光を集められるから", "大きいレンズの方が焦点距離が長いから", "大きいレンズの方が光が赤くなるから", "大きいレンズの方が紙に近いから"], "e": "レンズの大きさが同じなら、厚いレンズほど焦点距離は短くなりますが、集まる光の量は同じです。"}, {"id": "P2033", "u": "光の性質", "lv": "過去問型", "r": 36, "f": "しくみ・理由", "q": "魔法びん(保温ポット)で、内側の表面に銀メッキがしてあるのは、どの熱の伝わり方を防ぐためですか。", "c": ["放射", "伝導", "対流", "蒸発"], "e": "二重ガラスの間を真空にして伝導と対流を防ぎ、銀メッキで放射を防いでいます。せんにはプラスチックなど伝導しにくい物が使われています。"}, {"id": "P2034", "u": "光の性質", "lv": "応用", "r": 48, "f": "まちがい探し", "q": "放射と関係の深いものを選んだ組み合わせとして正しいものはどれですか。\nア 雪に灰をかけると、雪がとけやすくなる。\nイ 地温をはかるときは、直射日光が当たらないように温度計におおいをする。\nウ ドライヤーであたたかい風を送ると髪がかわきやすい。\nエ 手と手をこするとあたたかくなる。", "c": ["アとイ", "ウとエ", "アとウ", "イとエ"], "e": "黒っぽい灰は日光の熱をよく吸収するので、雪がとけやすくなります。"}, {"id": "P2035", "u": "光の性質", "lv": "応用", "r": 48, "f": "図の読み取り", "q": "同じ明るさのライトを、黒色の紙に1個、白色の紙に2個、赤色の紙に2個当てました。最も温度が低くなるものはどれですか。", "c": ["白色の紙(ライト2個 を通りぬけさせるから"], "e": "光は、さえぎる物がなければまっすぐ進み(直進)、光がさえぎられると影ができます。"}, {"id": "P2044", "u": "光の性質", "lv": "標準", "r": 58, "f": "知識", "q": "プリズムで分けたとき、赤色の外側にある目に見えない光と、紫色の外側にある目に見えない光の組み合わせはどれですか。", "c": ["赤色の外側は赤外線、紫色の外側は紫外線", "赤色の外側は紫外線、紫色の外側は赤外線", "どちらも可視光線", "どちらもX線"], "e": "目に見える光を可視光線といいます。"}];

function ckt(t){
  const bulb=(x,y)=>`<line x1="${x-12}" y1="${y}" x2="${x+12}" y2="${y}" class="bg"/><circle cx="${x}" cy="${y}" r="11" class="bl"/><path d="M${x-7} ${y-7}L${x+7} ${y+7}M${x+7} ${y-7}L${x-7} ${y+7}" class="w"/>`;
  const cell=(x,y)=>`<line x1="${x-9}" y1="${y}" x2="${x+9}" y2="${y}" class="bg"/><line x1="${x-5}" y1="${y-14}" x2="${x-5}" y2="${y+14}" class="w"/><line x1="${x+5}" y1="${y-7}" x2="${x+5}" y2="${y+7}" class="w th"/><text x="${x-12}" y="${y-16}" class="ax">+</text>`;
  let s=`<rect x="40" y="40" width="160" height="80" class="w" fill="none"/>`;
  if(t==='l2s')s+=bulb(90,40)+bulb(150,40);
  else if(t==='l2p')s+=`<path d="M70 40V0H170V40" class="w" fill="none"/>`+bulb(120,40)+bulb(120,0);
  else s+=bulb(120,40);
  if(t==='b2s')s+=cell(100,120)+cell(140,120);
  else if(t==='b2p')s+=`<path d="M70 120V146H170V120" class="w" fill="none"/>`+cell(120,120)+cell(120,146);
  else s+=cell(120,120);
  return `<svg viewBox="0 -18 240 182" class="ckt" role="img" aria-label="回路の図">${s}</svg>`;
}
function moon(p,label){
  const c=30,r=22,k={三日月:.55,二十七日:.55}[p];
  let lit='';
  if(p==='満月')lit=`<circle cx="${c}" cy="${c}" r="${r}" class="lit"/>`;
  else if(p==='上弦')lit=`<path d="M${c} ${c-r}A${r} ${r} 0 0 1 ${c} ${c+r}Z" class="lit"/>`;
  else if(p==='下弦')lit=`<path d="M${c} ${c-r}A${r} ${r} 0 0 0 ${c} ${c+r}Z" class="lit"/>`;
  else if(p==='三日月')lit=`<path d="M${c} ${c-r}A${r} ${r} 0 0 1 ${c} ${c+r}A${r*k} ${r} 0 0 0 ${c} ${c-r}Z" class="lit"/>`;
  else if(p==='二十七日')lit=`<path d="M${c} ${c-r}A${r} ${r} 0 0 0 ${c} ${c+r}A${r*k} ${r} 0 0 1 ${c} ${c-r}Z" class="lit"/>`;
  return `<figure class="mo"><svg viewBox="0 0 60 60" role="img" aria-label="月の形"><circle cx="${c}" cy="${c}" r="${r}" class="dark"/>${lit}<circle cx="${c}" cy="${c}" r="${r}" class="rim"/></svg><figcaption>${esc(label)}</figcaption></figure>`;
}

const LEVELS=['基礎','標準','応用','過去問型'];
const RANGE={'基礎':[75,92],'標準':[55,72],'応用':[40,55],'過去問型':[25,45]};

// 学習記録と追加問題:この端末のブラウザに保存し、Claude上ではアカウントにも保存
const KEY='rika4-drill-v1';
let store={rec:{},extra:[],updated:0};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');
  if(v){store=v.rec?{rec:v.rec,extra:v.extra||[],updated:v.updated||0}:{rec:v,extra:[],updated:0}}}catch(e){}
let docRef=null,saving=false,again=false,timer=null;
function save(){
  store.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
  if(docRef){clearTimeout(timer);timer=setTimeout(flush,1500)}
}
async function flush(){
  if(!docRef)return;if(saving){again=true;return}
  saving=true;
  try{await docRef.set({rec:store.rec,extra:store.extra,skip:store.skip,updated:store.updated})}
  catch(e){if(e&&e.code!=='unavailable')docRef=null}
  saving=false;if(again){again=false;flush()}
}
store.extra.forEach(fixUnit);if(!store.skip)store.skip={};
const allQ=()=>Q.concat(store.extra);
function R(id){return store.rec[id]||(store.rec[id]={n:0,ok:0,miss:0,streak:0,last:0})}

const skipped=q=>!!store.skip[q.id];
const inReview=q=>{const x=store.rec[q.id];return !skipped(q)&&x&&x.miss>0&&x.streak<2};
const unseen=q=>!store.rec[q.id]||!store.rec[q.id].n;
const priority=q=>{const x=store.rec[q.id]||{miss:1,streak:0};return q.r*(1+0.25*Math.min(x.miss-1,4))+(x.streak===1?-15:0)};
const reviewList=()=>allQ().filter(inReview).sort((a,b)=>priority(b)-priority(a));

function rateLabel(r){return r>=70?'ほぼ全員が正解':r>=55?'合格者は正解する':r>=40?'差がつく問題':'難問'}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let S={view:'home',units:new Set(UNITS.filter(u=>!NOT_YET.includes(u))),levels:new Set(LEVELS),forms:new Set(FORMS),count:10,set:[],i:0,picked:null,order:[],score:0,wrong:[],mode:'normal',confirmReset:false,
  ai:false,gen:{busy:false,msg:''},genUnit:'auto',confirmDel:false};
const app=document.getElementById('app');
const poolNow=()=>allQ().filter(q=>!skipped(q)&&S.units.has(q.u)&&S.levels.has(q.lv)&&S.forms.has(q.f||'知識'));

function buildSet(mode){
  if(mode==='review') return reviewList().slice(0,S.count);
  const pool=mode==='fig'?allQ().filter(q=>!skipped(q)&&isFig(q)):mode==='calc'?allQ().filter(q=>!skipped(q)&&q.f==='計算'):poolNow();
  const rv=pool.filter(inReview).sort((a,b)=>priority(b)-priority(a)).slice(0,Math.ceil(S.count*0.4));
  const others=pool.filter(q=>!rv.includes(q));
  // まだ解いていない問題を先に使う
  const rest=shuffle(others.filter(unseen)).concat(shuffle(others.filter(q=>!unseen(q)))).slice(0,S.count-rv.length);
  return shuffle(rv.concat(rest));
}
function start(mode){
  S.mode=mode;S.set=buildSet(mode);if(!S.set.length)return;
  S.i=0;S.score=0;S.wrong=[];S.view='quiz';S.autoDone=false;newQ();render();window.scrollTo(0,0);
}
function newQ(){S.picked=null;S.confirmDel=false;S.order=shuffle([0,1,2,3]);S.wasReview=inReview(S.set[S.i])}
function answer(k){
  if(S.picked!==null)return;
  const q=S.set[S.i];S.picked=k;const ok=S.order[k]===q.a;const x=R(q.id);
  x.n++;x.last=Date.now();
  if(ok){x.ok++;x.streak=x.miss>0?x.streak+1:2;S.score++}else{x.miss++;x.streak=0;S.wrong.push(q)}
  save();render();
  const nb=document.getElementById('next');if(nb)nb.focus({preventScroll:true});
}
function next(){
  if(S.i<S.set.length-1){S.i++;newQ();render()}
  else{S.view='result';render();autoGenerate()}
  window.scrollTo(0,0);
}
function skipCurrent(){
  const q=S.set[S.i];store.skip[q.id]=Date.now();save();
  S.set.splice(S.i,1);
  if(!S.set.length){S.view=S.score||S.wrong.length?'result':'home';render();return}
  if(S.i>=S.set.length){S.view='result';render();return}
  newQ();render();
}
function deleteCurrent(){
  const q=S.set[S.i];
  store.extra=store.extra.filter(x=>x.id!==q.id);delete store.rec[q.id];save();
  S.set.splice(S.i,1);
  if(!S.set.length){S.view='home';render();return}
  if(S.i>=S.set.length){S.view='result';render();return}
  newQ();render();
}

// ---- AIで問題をつくる ----
let sampleFn=null;
function weakestUnit(){
  const units=[...S.units];if(!units.length)return UNITS[0];
  return units.map(u=>{
    const qs=allQ().filter(q=>q.u===u&&S.levels.has(q.lv));
    const left=qs.filter(unseen).length;
    let n=0,ok=0;qs.forEach(q=>{const x=store.rec[q.id];if(x){n+=x.n;ok+=x.ok}});
    const gap=n?(ok/n*100)-qs.reduce((s,q)=>s+q.r,0)/Math.max(qs.length,1):0;
    return{u,score:left*10+gap-(SAPIX.focus.includes(u)?40:0)};
  }).sort((a,b)=>a.score-b.score)[0].u;
}
function buildPrompt(unit,levels,n){
  const existing=allQ().filter(q=>q.u===unit).map(q=>'・'+q.q).slice(-90).join('\n');
  const lvText=levels.map(l=>`${l}(予測正答率${RANGE[l][0]}〜${RANGE[l][1]}%)`).join('、');
  return `あなたは難関中学受験塾の理科講師です。小学4年生向けに、単元「${unit}」の4択問題を${n}問作ってください。

条件:
- 難易度は次から選び、まんべんなく混ぜる:${lvText}。「過去問型」は難関中学の入試でよく問われる形式(理由を問う、組み合わせ、資料の読み取りの文章化など)のオリジナル問題。
- 小4の塾カリキュラムで習う範囲。事実は教科書・塾テキストで定番の、確実に正しいものだけを使う。実験の結果や数値は教科書・塾テキストで定番のものだけを使う。図がないと答えられない問題は作らない。
- 正解は1つだけ。誤りの選択肢3つは、まぎらわしいが明らかに誤りのもの。
- 小4が読める表記(むずかしい漢字はひらがな)。問題文は1〜2文。解説は1〜2文で、覚え方や関連知識を入れる。
- 次の内容はまだ習っていないので、似た内容も出さない:
${allQ().filter(skipped).slice(-30).map(q=>'・'+q.q).join('\n')||'(なし)'}
- 問われ方を混ぜる:「ふさわしくないもの」を選ぶ問題、2つの文(I・II)の正誤の組み合わせ、時刻や角度の計算、しくみや理由を選ぶ問題。2つの文の正誤では、誤りの文は一部の語句(直列⇔並列、東⇔西、時計回り⇔反時計回りなど)だけを入れかえる。
- 次の既存の問題と同じ内容は出さない:
${existing}

出力はJSON配列のみ。形式:
[{"lv":"標準","r":62,"q":"問題文","correct":"正解の選択肢","wrong":["誤答1","誤答2","誤答3"],"e":"解説"}]
lvは「基礎」「標準」「応用」「過去問型」のどれか。rは難関校志望の小4生の予測正答率(整数)。`;
}
function addGenerated(arr,unit){
  if(!Array.isArray(arr))return 0;
  const seen=new Set(allQ().map(q=>q.q.replace(/\s/g,'')));
  let k=0;
  arr.forEach((g,i)=>{
    if(!g||typeof g.q!=='string'||typeof g.correct!=='string'||!Array.isArray(g.wrong))return;
    const wrong=g.wrong.filter(w=>typeof w==='string'&&w.trim()&&w!==g.correct).slice(0,3);
    if(wrong.length<3||new Set(wrong).size<3)return;
    const lv=LEVELS.includes(g.lv)?g.lv:'標準';
    const key=g.q.replace(/\s/g,'');if(seen.has(key))return;seen.add(key);
    let r=Math.round(+g.r);if(!(r>0))r=Math.round((RANGE[lv][0]+RANGE[lv][1])/2);
    r=Math.max(RANGE[lv][0],Math.min(RANGE[lv][1],r));
    store.extra.push({id:'ai'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5),u:unit,lv,r,
      q:g.q.trim(),c:[g.correct.trim(),...wrong.map(w=>w.trim())],e:typeof g.e==='string'?g.e.trim():'',a:0,ai:1,t:Date.now()});
    k++;
  });
  if(store.extra.length>800)store.extra=store.extra.slice(-800);
  if(k)save();
  return k;
}
async function generate(unit,auto){
  if(!sampleFn||S.gen.busy)return;
  const levels=S.levels.size?[...S.levels]:LEVELS;
  S.gen={busy:true,msg:`${auto?'問題が少なくなったので、':''}「${unit}」の新しい問題を作っています。30秒〜1分ほどかかります。`};render();
  try{
    const arr=await sampleFn.json(buildPrompt(unit,levels,8),{modelTier:'default',cache:false});
    const k=addGenerated(arr,unit);
    S.gen={busy:false,msg:k?`「${unit}」に新しい問題を${k}問追加しました。次のスタートから出題されます。`:'問題をうまく作れませんでした。もう一度ためしてください。'};
  }catch(e){
    const c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){S.ai=false;S.gen={busy:false,msg:''}}
    else if(c==='rate_limited')S.gen={busy:false,msg:'いまは問題を作れません。しばらく時間をおいてからためしてください。'};
    else if(c==='session_expired')S.gen={busy:false,msg:'Claudeにもう一度ログインしてから、ためしてください。'};
    else S.gen={busy:false,msg:'問題をうまく作れませんでした。もう一度ためしてください。'};
  }
  render();
}
function autoGenerate(){
  // 問題を解き終えたとき、まだ解いていない問題が少なければ自動で追加
  if(!S.ai||S.mode!=='normal'||S.autoDone)return;
  S.autoDone=true;
  if(poolNow().filter(unseen).length<Math.max(S.count,10))generate(weakestUnit(),true);
}

function unitRows(){

    const qs=allQ().filter(q=>q.u===u);let n=0,ok=0;
    qs.forEach(q=>{const x=store.rec[q.id];if(x){n+=x.n;ok+=x.ok}});
    const exp=Math.round(qs.reduce((s,q)=>s+q.r,0)/qs.length);

}

    <h2>この問題集について</h2>
    <p class="note" style="margin:0">「過去問型」は難関中学の入試によく出るテーマをもとにしたオリジナル問題で、実際の入試問題そのものではありません。予測正答率は難関校志望の小4生を想定した目安です。学習記録はこのブラウザに保存され、この端末のブラウザのデータを消すと、記録も消えます。</p>
    <div class="row">${S.confirmReset?`<div class="confirm">学習記録をすべて消しますか?(追加した問題は残ります)<button class="btn alt" data-act="reset-yes">消す</button><button class="btn ghost" data-act="reset-no">やめる</button></div>`:`<button class="btn ghost" data-act="reset" style="flex:0 0 auto">学習記録をリセット</button>`}</div>
  </section>`;
}

function quiz(){
  const q=S.set[S.i];const done=S.picked!==null;const ok=done&&S.order[S.picked]===q.a;
  return `
  <section class="card">
    <div class="qhead"><span class="prog">${S.mode==='review'?'復習 ':''}${S.i+1} / ${S.set.length}問</span><button class="btn ghost" data-act="home" style="padding:6px 12px;font-size:14px">やめる</button></div>
    <div class="pbar"><i style="width:${(S.i+(done?1:0))/S.set.length*100}%"></i></div>
    <div class="meta"><span class="lv lv-${q.lv}">${q.lv}</span><span>${q.u}</span>${q.f&&q.f!=='知識'?`<span class="ftag">${q.f}</span>`:''}${q.ai?'<span class="ai-tag">AI作成</span>':''}${S.wasReview?'<span class="review-tag">復習</span>':''}</div>
    <div class="rate">予測正答率 <b>${q.r}%</b><div class="track"><div class="fill" style="width:${q.r}%"></div></div><span>${rateLabel(q.r)}</span></div>
    <div class="qtext">${qhtml(q.q)}</div>${uzhtml(q)}${tbl(q)}
    <div class="choices">${S.order.map((ci,k)=>{
      let cls='';if(done){if(ci===q.a)cls='ok';else if(k===S.picked)cls='ng'}
      return `<button class="choice ${cls}" data-pick="${k}" ${done?'disabled':''}><span class="k">${'アイウエ'[k]}</span><span>${esc(q.c[ci])}</span></button>`}).join('')}</div>
    ${done?'':`<div class="skiprow"><button class="btn ghost small" data-act="skip">まだ習っていない</button><span class="note">この問題をとばして、出題しないようにします</span></div>`}
    ${done?`<div class="fb ${ok?'ok':'ng'}">
      <div class="mark">${ok?'○ 正解':'× ざんねん'}</div>
      ${ok?'':`<p><b>正解:${esc(q.c[q.a])}</b></p>`}
      <p>${esc(q.e)}</p>
      ${!ok&&q.r>=55?`<div class="alert">合格する人の多くが正解する問題です。復習リストの上位に入れました。</div>`:''}
      ${ok&&S.wasReview?`<p class="note">${R(q.id).streak>=2?'2回連続正解。復習リストから外しました。':'あと1回正解で復習リストから外れます。'}</p>`:''}
      <div class="row"><button class="btn" id="next" data-act="next">${S.i<S.set.length-1?'次の問題へ':'結果を見る'}</button></div>
      ${q.ai?(S.confirmDel?`<div class="confirm" style="margin-top:10px">この問題を削除しますか?<button class="btn alt" data-act="del-yes">削除する</button><button class="btn ghost" data-act="del-no">やめる</button></div>`
        :`<p class="note"><button class="linkbtn" data-act="del">内容がおかしいので、この問題を削除する</button></p>`):''}
    </div>`:''}
  </section>`;
}

function result(){
  const pct=Math.round(S.score/S.set.length*100);
  const exp=Math.round(S.set.reduce((s,q)=>s+q.r,0)/S.set.length);
  return `
  <section class="card">
    <h2>結果</h2>
    <div class="big">${S.score}<small> / ${S.set.length}問</small></div>
    <p>正答率 <b>${pct}%</b>(この問題セットの予測正答率 ${exp}%)。${pct>=exp?'合格ラインを上回っています。':'予測を下回りました。まちがえた問題を復習しよう。'}</p>
    ${genStatus()}
    <div class="row"><button class="btn alt" data-act="review" ${reviewList().length?'':'disabled'}>すぐ復習する</button><button class="btn" data-act="again">続けて解く</button><button class="btn ghost" data-act="home">ホームへ</button></div>
  </section>
  ${S.wrong.length?`<section class="card"><h2>まちがえた問題</h2><div class="list">${S.wrong.map(itemHtml).join('')}</div></section>`:''}`;
}
function itemHtml(q){
  const x=store.rec[q.id]||{miss:0,streak:0};
  return `<div class="item"><div class="m"><span class="lv lv-${q.lv}">${q.lv}</span><span>${q.u}</span>${q.ai?'<span class="ai-tag">AI作成</span>':''}<span>予測正答率 ${q.r}%</span><span>ミス ${x.miss}回</span>${q.r>=55?'<span class="pri">落とせない</span>':''}</div>
  <div class="q">${qhtml(q.q)}</div>${uzhtml(q)}${tbl(q)}<div class="a">正解:${esc(q.c[q.a])}</div><div class="note" style="margin-top:4px">${esc(q.e)}</div></div>`;
}
function list(){
  const rl=reviewList();
  return `<section class="card">
    <div class="qhead"><h2 style="margin:0">復習リスト(${rl.length}問)</h2><button class="btn ghost" data-act="home" style="padding:6px 12px;font-size:14px">ホームへ</button></div>
    <p class="note">優先度の高い順。予測正答率が高く、ミスが多い問題ほど上に来ます。</p>
    ${rl.length?`<div class="list">${rl.map(itemHtml).join('')}</div><div class="row"><button class="btn alt" data-act="review">この順で復習する</button></div>`:'<p class="empty">復習待ちの問題はありません。</p>'}
  </section>`;
}

function skips(){
  const qs=allQ().filter(skipped);
  const by=UNITS.map(u=>[u,qs.filter(q=>q.u===u)]).filter(x=>x[1].length);
  return `<section class="card">
    <div class="qhead"><h2 style="margin:0">まだ習っていない問題(${qs.length}問)</h2><button class="btn ghost" data-act="home" style="padding:6px 12px;font-size:14px">ホームへ</button></div>
    <p class="note">授業で習ったら「習った」を押すと、また出題されるようになります。</p>
    ${qs.length?by.map(([u,l])=>`<h3>${u}(${l.length}問)<button class="linkbtn" data-unskipunit="${u}" style="margin-left:10px">この単元をすべて戻す</button></h3><div class="list">${l.map(q=>`<div class="item"><div class="m"><span class="lv lv-${q.lv}">${q.lv}</span><span>予測正答率 ${q.r}%</span></div><div class="q">${esc(q.q)}</div><div class="row" style="margin-top:6px"><button class="btn ghost small" data-unskip="${q.id}" style="flex:0 0 auto">習った</button></div></div>`).join('')}</div>`).join(''):'<p class="empty">ありません。</p>'}
  </section>`;
}
function render(){
  app.innerHTML=S.view==='home'?home():S.view==='quiz'?quiz():S.view==='result'?result():S.view==='skips'?skips():list();
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.unit){const u=b.dataset.unit;S.units.has(u)?S.units.delete(u):S.units.add(u);render();return}
  if(b.dataset.level){const l=b.dataset.level;S.levels.has(l)?S.levels.delete(l):S.levels.add(l);render();return}
  if(b.dataset.form){const f=b.dataset.form;S.forms.has(f)?S.forms.delete(f):S.forms.add(f);render();return}
  if(b.dataset.count){S.count=+b.dataset.count;render();return}
  if(b.dataset.gen){S.genUnit=b.dataset.gen;render();return}
  if(b.dataset.pick!==undefined){answer(+b.dataset.pick);return}
  if(b.dataset.unskip){delete store.skip[b.dataset.unskip];save();render();return}
  if(b.dataset.unskipunit){allQ().filter(q=>q.u===b.dataset.unskipunit).forEach(q=>delete store.skip[q.id]);save();render();return}
  const a=b.dataset.act;
  if(a==='start')start('normal');
  else if(a==='review')start('review');
  else if(a==='fig')start('fig');
  else if(a==='calc')start('calc');
  else if(a==='again')start(S.mode==='fig'||S.mode==='calc'?S.mode:'normal');
  else if(a==='focus'){S.units=new Set(SAPIX.focus);S.levels=new Set(LEVELS);S.forms=new Set(FORMS);start('normal')}
  else if(a==='focusform'){S.units=new Set(UNITS);S.levels=new Set(LEVELS);S.forms=new Set(FORMS.filter(f=>f!=='知識'));start('normal')}
  else if(a==='next')next();
  else if(a==='gen')generate(S.genUnit==='auto'?weakestUnit():S.genUnit,false);
  else if(a==='skip')skipCurrent();
  else if(a==='skips'){S.view='skips';render();window.scrollTo(0,0)}
  else if(a==='del'){S.confirmDel=true;render()}
  else if(a==='del-no'){S.confirmDel=false;render()}
  else if(a==='del-yes')deleteCurrent();
  else if(a==='list'){S.view='list';render();window.scrollTo(0,0)}
  else if(a==='home'){S.view='home';render();window.scrollTo(0,0)}
  else if(a==='reset'){S.confirmReset=true;render()}
  else if(a==='reset-no'){S.confirmReset=false;render()}
  else if(a==='reset-yes'){store.rec={};save();S.confirmReset=false;render()}
});
render();

// Claude上で開いたとき:AIの問題作成とアカウントへの保存を有効にする
(async()=>{
  if(!window.claude||!claude.use)return;
  try{sampleFn=await claude.use('sample');if(sampleFn){S.ai=true;render()}}catch(e){}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/rika');
    const snap=await ref.get();
    docRef=ref;
    const v=snap.exists?snap.data():null;
    if(v&&(v.updated||0)>(store.updated||0)){
      store={rec:v.rec||{},extra:Array.isArray(v.extra)?v.extra.map(fixUnit):[],skip:v.skip||{},updated:v.updated};
      try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
      if(S.view!=='quiz')render();
    }else if(store.updated){flush()}
  }catch(e){docRef=null}
})();
</script>
