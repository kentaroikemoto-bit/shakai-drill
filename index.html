{"id":"C089","u":"世界の中の日本","lv":"標準","r":65,"f":"2文の正誤","q":"日本のすがたについて、次の2つの文の正誤を答えなさい。\nI 日本の面積は約38万km²で、世界の国の中で60番目くらいである。\nII 日本の人口は約1億2400万人で、世界で3番目くらいである。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"日本の人口は世界で10番目くらい(12位)。面積のわりに人口が多いので、人口密度が高い。"},
{"id":"C090","u":"世界の中の日本","lv":"基礎","r":82,"f":"知識","q":"日本の北の端にある島はどれか。","c":["択捉島","国後島","南鳥島","与那国島"],"e":"北端=択捉島(北海道)、東端=南鳥島(東京都)、南端=沖ノ鳥島(東京都)、西端=与那国島(沖縄県)。"},
{"id":"C091","u":"世界の中の日本","lv":"標準","r":60,"f":"まちがい探し","q":"日本の東西南北の端の島について、まちがっているものはどれか。","c":["西の端の与那国島は東京都に属する。","南の端の沖ノ鳥島は東京都に属する。","東の端の南鳥島は東京都に属する。","北の端の択捉島は北海道に属する。"],"e":"与那国島は沖縄県に属する。東京都に属するのは東端の南鳥島と南端の沖ノ鳥島の2つ。"},
{"id":"C092","u":"世界の中の日本","lv":"標準","r":66,"f":"知識","q":"オーストラリアの首都はどれか。","c":["キャンベラ","シドニー","メルボルン","ウェリントン"],"e":"オーストラリアの首都はキャンベラ。最大の都市シドニーと取りちがえやすい。南半球なので季節が日本と逆になる。"},
{"id":"C093","u":"世界の中の日本","lv":"標準","r":62,"f":"まちがい探し","q":"国と首都の組み合わせとして、まちがっているものはどれか。","c":["アメリカ合衆国-ニューヨーク","カナダ-オタワ","ブラジル-ブラジリア","サウジアラビア-リヤド"],"e":"アメリカ合衆国の首都はワシントンD.C.。ニューヨークは最大の都市で、自由の女神像がある。"},
{"id":"C094","u":"世界の中の日本","lv":"基礎","r":82,"f":"知識","q":"日本が石油(原油)を多く輸入している国として、最もふさわしいものはどれか。","c":["サウジアラビア","オーストラリア","アメリカ合衆国","インドネシア"],"e":"石油はサウジアラビアやアラブ首長国連邦など西アジアの国から多く輸入している。サウジアラビアは国土の大部分が砂漠で、首都はリヤド。"},
{"id":"C095","u":"世界の中の日本","lv":"標準","r":66,"f":"2文の正誤","q":"日本の輸入について、次の2つの文の正誤を答えなさい。\nI オーストラリアからは、石炭や鉄鉱石を多く輸入している。\nII カナダからは、バナナを多く輸入している。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"バナナはフィリピンから多く輸入している。カナダからは木材などを輸入している。"},
{"id":"C096","u":"世界の中の日本","lv":"基礎","r":80,"f":"知識","q":"日本はアジアの中のどの地域にふくまれるか。","c":["東アジア","東南アジア","南アジア","西アジア"],"e":"日本・中国・韓国などは東アジア。タイやフィリピンは東南アジア、インドは南アジア、サウジアラビアは西アジア。"},
{"id":"C097","u":"世界の中の日本","lv":"基礎","r":76,"f":"まちがい探し","q":"日本のすがたについて説明した文として、まちがっているものはどれか。","c":["日本の国土は、南北に約1000kmの長さがある。","日本は、ユーラシア大陸の東にある島国である。","日本は、約1万4千の島々からなる。","日本は、国土面積のわりに人口が多い。"],"e":"日本の国土は南北に約3000kmもあるため、北と南で気候が大きくちがう。"},
{"id":"C098","u":"世界の中の日本","lv":"標準","r":62,"f":"まちがい探し","q":"国の特色について説明した文として、まちがっているものはどれか。","c":["インドは、世界で最も面積が広い国である。","ブラジルは、コーヒー豆の生産が世界一で、日系人が多い。","フランスは、日本へワインなどを輸出している。","大韓民国は、朝鮮半島の南にある日本に近い国である。"],"e":"インドは世界で最も人口が多い国。世界で最も面積が広いのはロシア連邦。"},
{"id":"C099","u":"世界の中の日本","lv":"標準","r":55,"f":"記述のことば","q":"日本最南端の沖ノ鳥島では、島の周りをコンクリートで固める工事が行われました。その目的を書くとき、必ず入れたいことばの組み合わせはどれか。","c":["波・けずられる・島がなくなるのを防ぐ","台風・風・家を守る","地震・ゆれ・島をじょうぶにする","観光客・港・船をとめる"],"e":"沖ノ鳥島は小さな島で、波にけずられて島がなくなるのを防ぐためにコンクリートで固めた。"},
{"id":"C100","u":"世界の中の日本","lv":"標準","r":62,"f":"記述のことば","q":"「日本の人口密度が高い理由」を書くとき、必ず入れたいことばの組み合わせはどれか。","c":["国土面積・わりに・人口が多い","国土面積・広い・人口が多い","人口・へっている・高齢者","島国・海に囲まれる・人口が少ない"],"e":"人口密度は人口を面積で割ったもの。日本は国土面積のわりに人口が多いので人口密度が高い。"},
{"id":"D001","u":"北海道・東北","lv":"基礎","r":82,"f":"知識","q":"石狩平野では、昔は栄養分の少ない土地が広がっていました。米作りができるように、よそから良い土を運び入れて土地を改良した方法を何といいますか。","c":["客土","輪作","干拓","暗渠排水"],"e":"よそから良い土を運び入れるのが客土(石狩平野の泥炭地)。暗渠排水は越後平野の湿田を乾田にした工夫、輪作は十勝平野の畑作の工夫と区別しよう。"},
{"id":"D002","u":"北海道・東北","lv":"標準","r":50,"f":"2文の正誤","q":"根釧台地について、次の2つの文の正誤を選びなさい。\nI 夏に寒流の千島海流(親潮)の影響で濃霧が発生し、気温が上がりにくいため、酪農がさかんである。\nII 根釧台地の夏の濃霧は、北西の季節風がふくことによって起こる。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい。濃霧の原因は千島海流(親潮)と夏の南東の季節風で、北西の季節風は冬の風なのでIIはまちがい。"},
{"id":"D003","u":"北海道・東北","lv":"標準","r":62,"f":"知識","q":"十勝平野では、広い畑を区切ってちがう作物を植え、毎年作物を植える場所を入れかえています(輪作)。その主な目的はどれですか。","c":["同じ作物を作り続けて起こる連作障害をふせぎ、土の栄養分を保つため","1年に2回ちがう作物をしゅうかくする二毛作を行うため","冬の寒さや雪から作物を守るため","大型の機械を使わずに作業できるようにするため"],"e":"同じ畑で同じ作物を作り続ける連作は、栄養分がかたよったり病気が出たりする(連作障害)。てんさい・じゃがいも・小麦・牧草などを入れかえる輪作でふせぐ。二毛作とはちがう。"},
{"id":"D004","u":"北海道・東北","lv":"標準","r":60,"f":"まちがい探し","q":"北海道の産物と主な産地の組み合わせとして、まちがっているものはどれですか。","c":["さとうの原料のさとうきび ― 十勝平野","さとうの原料のてんさい ― 十勝平野","牛乳・乳製品 ― 根釧台地","ほたて貝の養殖 ― サロマ湖"],"e":"北海道のさとうの原料は寒さに強いてんさい。さとうきびはあたたかい沖縄県や鹿児島県の南の島で作られる。"},
{"id":"D005","u":"北海道・東北","lv":"標準","r":62,"f":"資料の読み取り","q":"表のAとBは、札幌市と釧路市の夏の平均気温です。釧路市にあたるものと、夏の気温が低い理由の組み合わせとして正しいものはどれですか。","c":["表のB ― 千島海流(親潮)の影響で濃霧が発生するから","表のB ― オホーツク海の流氷がおしよせるから","表のA ― 日本海流(黒潮)の影響を受けるから","表のA ― 梅雨や台風の影響を受けにくいから"],"e":"気温が低いBが釧路市。太平洋側の釧路は千島海流(親潮)の影響で夏に濃霧が出て気温が上がりにくい。流氷は冬から春のオホーツク海ぞいの話。","tb":[["","7月の平均気温","8月の平均気温"],["A","21.1℃","22.3℃"],["B","16.1℃","18.2℃"]]},
{"id":"D006","u":"北海道・東北","lv":"基礎","r":85,"f":"知識","q":"北海道でいちばん長く、流域に三日月湖が多く見られ、下流の平野が米どころになっている川はどれですか。","c":["石狩川","十勝川","北上川","最上川"],"e":"石狩川(アイヌ語でイシカラペッ=曲がりくねった川)の下流が石狩平野。北上川・最上川は東北地方の川。"},
{"id":"D007","u":"北海道・東北","lv":"標準","r":64,"f":"知識","q":"三日月湖はどのようにしてできた湖ですか。","c":["曲がりくねった川の流れが洪水などで変わり、取り残された部分に水が残ってできた","火山の噴火でできた大きなくぼ地に水がたまってできた","地盤のずれ(断層)でできたくぼ地に水がたまってできた","もともと海だったところが砂州などで切りはなされてできた"],"e":"三日月湖は川の曲がった部分が取り残されたもので、石狩川の流域に多い。火山のくぼ地=カルデラ湖、断層=断層湖、海が切りはなされた=海跡湖。"},
{"id":"D008","u":"北海道・東北","lv":"標準","r":58,"f":"まちがい探し","q":"北海道の湖とその特徴の組み合わせとして、まちがっているものはどれですか。","c":["サロマ湖 ― 日本でいちばん面積が大きい湖","摩周湖 ― 日本一透明度が高い湖","阿寒湖 ― 特別天然記念物のマリモが生息する","サロマ湖 ― ほたて貝の養殖がさかん"],"e":"サロマ湖は日本で3番目に大きい湖(1位は琵琶湖、2位は霞ヶ浦)。ほたて貝の養殖で知られる。"},
{"id":"D009","u":"北海道・東北","lv":"基礎","r":80,"f":"知識","q":"東北地方の十和田湖や田沢湖は、どのようにしてできた湖ですか。","c":["カルデラ湖","断層湖","海跡湖","三日月湖"],"e":"十和田湖・田沢湖は火山の噴火でできたくぼ地(カルデラ)に水がたまったカルデラ湖。断層湖は琵琶湖・諏訪湖、海跡湖はサロマ湖・浜名湖・霞ヶ浦。"},
{"id":"D010","u":"北海道・東北","lv":"基礎","r":80,"f":"知識","q":"北方領土のうち、日本でいちばん北にある島はどれですか。","c":["択捉島","国後島","色丹島","歯舞群島"],"e":"日本の最北端は択捉島。北方領土は択捉島・国後島・色丹島・歯舞群島で、現在ロシアが占領している。"},
{"id":"D011","u":"北海道・東北","lv":"標準","r":55,"f":"知識","q":"東北地方の太平洋側で夏にふく冷たくしめった風「やませ」は、どの方角へ向かってふいていきますか。","c":["南西","北東","北西","南東"],"e":"やませは北東から「ふいてくる」風なので、「ふいていく」先は反対の南西。問題文が「ふいてくる」か「ふいていく」かを必ず確かめよう。"},
{"id":"D012","u":"北海道・東北","lv":"基礎","r":84,"f":"知識","q":"八郎潟で行われた、浅い湖の水をぬいて干し上げ、陸地をつくることを何といいますか。","c":["干拓","うめ立て","客土","開拓"],"e":"水をぬいて干し上げるのが干拓。土を運び入れて陸地をつくるのがうめ立て(東京湾など)。「干」の字=干し上げる、と覚えよう。"},
{"id":"D013","u":"北海道・東北","lv":"応用","r":50,"f":"まちがい探し","q":"八郎潟干拓地について説明した文として、まちがっているものはどれですか。","c":["土を運び入れてつくったため、土地は周りの水面より高くなっている","もとは日本で2番目に大きな湖だった","秋田県にあり、干拓地には大潟村がつくられた","広い水田で大型機械を使った大規模な米作りが行われている"],"e":"干拓地は水をぬいてつくるので、土地は周りの水面より低い。水面より高いのは土を運び入れたうめ立て地。"},
{"id":"D014","u":"北海道・東北","lv":"標準","r":65,"f":"知識","q":"三陸海岸の南部に見られるリアス海岸が、漁港や養殖に向いている理由として正しいものはどれですか。","c":["入り江が多く波がおだやかで、海岸近くから海が深いから","遠浅の砂浜が長く続き、船を引き上げやすいから","暖流の日本海流(黒潮)が入り江の奥まで流れこむから","海岸ぞいに広い平地があり、大きな港町をつくりやすいから"],"e":"リアス海岸は山地がしずんでできたのこぎりの歯のような海岸。入り江は波がおだやかで深いので漁港・わかめやかきの養殖に向く。反対に平地は少ない。"},
{"id":"D015","u":"北海道・東北","lv":"標準","r":56,"f":"まちがい探し","q":"リアス海岸について説明した文として、まちがっているものはどれですか。","c":["入り江は奥に行くほど広くなるので、津波の波は低くなりやすい","陸地のおくまで海が入りこんでいるため、陸上の交通が不便である","三陸海岸のほか、若狭湾や志摩半島などにも見られる","地盤がしずみこんだり、海面が上がったりしてできた"],"e":"入り江は奥に行くほどせまくなるので、津波の波がおし上げられて高くなる。2011年の東日本大震災では30mをこえた所もある。"},
{"id":"D016","u":"北海道・東北","lv":"基礎","r":80,"f":"知識","q":"長い竹のさおにたくさんのちょうちんをつるし、さおは稲の穂、ちょうちんは米俵を表すといわれる東北地方の夏祭りはどれですか。","c":["秋田竿燈まつり","青森ねぶた祭","仙台七夕まつり","山形花笠まつり"],"e":"竿燈=さおの明かり、と覚える。ねぶた祭は明かりをともした大きな人形、七夕まつりは大きな七夕かざり、花笠まつりは紅花をあしらった笠。"},
{"id":"D017","u":"北海道・東北","lv":"標準","r":66,"f":"まちがい探し","q":"東北三大祭りにふくまれないものはどれですか。","c":["山形花笠まつり","青森ねぶた祭","秋田竿燈まつり","仙台七夕まつり"],"e":"東北三大祭りは青森ねぶた祭・秋田竿燈まつり・仙台七夕まつり。山形花笠まつりを加えると東北四大祭りになる。"},
{"id":"D018","u":"北海道・東北","lv":"標準","r":63,"f":"知識","q":"山形盆地や福島盆地で、さくらんぼやももなどの果物作りがさかんな理由として正しいものはどれですか。","c":["昼と夜の気温差が大きく、降水量が少ないから","暖流の影響で冬でもあたたかいから","降水量が多く、昼と夜の気温差が小さいから","海に近く、しめった季節風がふきこむから"],"e":"盆地は周りを山に囲まれ、海流やしめった季節風の影響を受けにくい。昼夜の気温差が大きいと果物があまくなり、雨が少ないので雨に弱い果物も作れる。"},
{"id":"D019","u":"北海道・東北","lv":"標準","r":58,"f":"資料の読み取り","q":"表は米の生産量が多い道県(2025年産)です。表から読み取れることとして正しいものはどれですか。","c":["上位5道県のうち、3県が東北地方の県である","北海道の生産量は新潟県より多い","上位5道県のうち、東北地方の県は2県だけである","秋田県の生産量は北海道より多い"],"e":"秋田県・福島県・山形県の3県が東北地方。1位は新潟県、2位が北海道。東北地方は全国の米の約4分の1(28%)を生産する「日本の穀倉地帯」。","tb":[["道県","生産量"],["新潟県","63.8万t"],["北海道","57.8万t"],["秋田県","51.4万t"],["福島県","38.8万t"],["山形県","38.1万t"]]},
{"id":"D020","u":"北海道・東北","lv":"応用","r":48,"f":"記述のことば","q":"北海道の中で石狩平野の米作りがさかんな理由を説明するとき、必ず入れたい言葉の組み合わせはどれですか。","c":["日本海に面する・千島海流の影響を受けにくい・夏に気温が上がる","千島海流・夏に濃霧・気温が上がらない","広い土地・大型の機械・輪作","北西の季節風・雪どけ水・水力発電"],"e":"石狩平野は日本海側にあり、太平洋側を流れる千島海流(親潮)の影響を受けにくく、夏に気温が上がる。濃霧で気温が上がらないのは根釧台地の説明。"},
{"id":"D021","u":"北海道・東北","lv":"応用","r":45,"f":"記述のことば","q":"1993年の冷害で、東北地方の日本海側の被害が太平洋側より小さかった理由を説明するとき、必ず入れたい言葉の組み合わせはどれですか。","c":["やませ・奥羽山脈・さえぎられる","やませ・千島海流・冷たくしめった風","北西の季節風・雪・フェーン現象","品種改良・ササニシキ・寒さに強い"],"e":"太平洋側にふくやませが、東北地方の中央を南北に連なる奥羽山脈にさえぎられ、日本海側にはとどきにくい。「なぜ日本海側はちがうのか」の決め手は奥羽山脈。"},
{"id":"D022","u":"北海道・東北","lv":"標準","r":55,"f":"記述のことば","q":"根釧台地で米作りではなく酪農がさかんな理由を説明するとき、必ず入れたい言葉の組み合わせはどれですか。","c":["千島海流・夏に濃霧・作物が育ちにくい","広い土地・大型の機械・輪作","北西の季節風・冬の大雪・水はけが良い","日本海流・あたたかい・牧草"],"e":"千島海流(親潮)の影響で夏に濃霧が発生し、気温が上がらず作物が育ちにくいため、牧草を育てて乳用牛を飼う酪農が行われている。"},
{"id":"D023","u":"北海道・東北","lv":"標準","r":60,"f":"知識","q":"福島県にあり、冬に白鳥がやって来ることで知られる湖を漢字で正しく書いたものはどれですか。","c":["猪苗代湖","稲苗代湖","猪苗台湖","猪名代湖"],"e":"猪苗代湖(いなわしろこ)は日本で4番目に面積が広い湖で、すぐ近くに磐梯山がある。「猪」=いのしし、「代」=しろ。"},
{"id":"D024","u":"北海道・東北","lv":"標準","r":62,"f":"知識","q":"おおみそかの夜に「なまはげ」の行事が行われる、秋田県の半島を漢字で正しく書いたものはどれですか。","c":["男鹿半島","牡鹿半島","雄鹿半島","男賀半島"],"e":"なまはげは秋田県の男鹿(おが)半島。牡鹿(おしか)半島は宮城県の半島なので取りちがえに注意。"},
{"id":"D025","u":"北海道・東北","lv":"標準","r":60,"f":"資料の読み取り","q":"表は、日本全国の平均と北海道の、農家1けんあたりの田畑や牧場の面積と乳用牛の数です。表から読み取れることとして正しいものはどれですか。","c":["北海道の田畑や牧場の面積は、全国平均の約10倍である","北海道の田畑や牧場の面積は、全国平均の約5倍である","北海道の乳用牛の数は、全国平均の約10倍である","北海道の乳用牛の数は、全国平均より少ない"],"e":"34÷3.6はおよそ9.4なので約10倍。乳用牛は164頭と114頭で全国平均より多いが10倍ではない。広い土地を生かした大規模な農業が北海道の特色。","tb":[["","田畑や牧場の面積","乳用牛の数"],["全国平均","約3.6ha","約114頭"],["北海道","約34ha","約164頭"]]},
{"id":"D026","u":"北海道・東北","lv":"標準","r":58,"f":"2文の正誤","q":"東北地方の世界遺産について、次の2つの文の正誤を選びなさい。\nI 白神山地は、何千年も昔からのぶなの原生林が残り、世界自然遺産に登録されている。\nII 平泉の中尊寺などは、豊かな自然が評価されて世界自然遺産に登録されている。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"白神山地は世界自然遺産で正しい。平泉は日本独自の仏教文化が評価された世界文化遺産なのでIIはまちがい。"},
{"id":"D027","u":"北海道・東北","lv":"標準","r":55,"f":"2文の正誤","q":"東北地方の川について、次の2つの文の正誤を選びなさい。\nI 北上川は、北上高地と奥羽山脈の間を流れ、盛岡市を通って太平洋に注ぐ。\nII 最上川は、日本三大急流の1つで、仙台平野を流れて太平洋に注ぐ。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい。最上川は山形県を流れ、庄内平野から日本海に注ぐのでIIはまちがい。仙台平野を流れるのは北上川と阿武隈川。"},
{"id":"D028","u":"北海道・東北","lv":"応用","r":45,"f":"2文の正誤","q":"フェーン現象について、次の2つの文の正誤を選びなさい。\nI 夏に太平洋側からの風が奥羽山脈をこえてふき下ろすと、日本海側の地域では気温が下がる。\nII 1933年には、山形市で40.8℃という当時の日本最高気温が記録された。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"フェーン現象は山をこえてふき下ろすかわいた高温の風なので、日本海側では気温が「上がる」。Iはまちがい、IIは正しい。"},
{"id":"D029","u":"北海道・東北","lv":"標準","r":55,"f":"資料の読み取り","q":"表は東北地方の4県の面積・人口・人口密度です(2024年)。岩手県にあたるものはどれですか。","c":["表のC","表のA","表のB","表のD"],"e":"岩手県は北海道に次いで面積が全国2位で、人口密度がとても低い。Aは人口が最も多い宮城県、Bは面積3位の福島県、Dは秋田県。","tb":[["","面積","人口","人口密度"],["A","7282km²","225万人","309人/km²"],["B","13784km²","174万人","126人/km²"],["C","15275km²","115万人","75人/km²"],["D","11638km²","90万人","77人/km²"]]},
{"id":"D030","u":"北海道・東北","lv":"標準","r":55,"f":"2文の正誤","q":"東北地方の気候について、次の2つの文の正誤を選びなさい。\nI 日本海側の地域は、冬に北西の季節風の影響で雪が多く降る。\nII 日本海に面した秋田市は、太平洋側の仙台市より冬の降水量が少ない。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい。秋田市は冬の北西の季節風で雪が多いので、冬の降水量は仙台市より「多い」。IIはまちがい。"},
{"id":"D031","u":"関東・中部","lv":"基礎","r":84,"f":"知識","q":"流域面積が日本一で、関東地方の人々のくらしを支えてきた利根川は、昔から何というよび名で親しまれてきましたか。","c":["坂東太郎","筑紫次郎","四国三郎","越後太郎"],"e":"利根川=坂東太郎(坂東は関東の昔のよび名)。筑紫次郎は九州の筑後川、四国三郎は吉野川。"},
{"id":"D032","u":"関東・中部","lv":"標準","r":56,"f":"まちがい探し","q":"利根川について説明した文として、まちがっているものはどれですか。","c":["長さも流域面積も、どちらも日本一の川である","下流には水郷地帯とよばれる低湿地が広がり、早場米が作られている","千葉県の野田市や銚子市のしょうゆづくりに、船での輸送が役立った","上流のダムの水は、水力発電や生活用水・工業用水・農業用水に使われる"],"e":"利根川は流域面積は日本一だが、長さは信濃川に次いで2位。長さ日本一=信濃川、流域面積日本一=利根川と分けて覚えよう。"},
{"id":"D033","u":"関東・中部","lv":"標準","r":62,"f":"知識","q":"関東地方の台地をおおう「関東ローム層」とは、どのような地層ですか。","c":["火山灰などが積もってできた赤土の地層","川が運んできた土砂が扇形に積もった地層","海の砂や貝がらが積もってできた地層","かれた植物が積もってできた泥炭の地層"],"e":"関東ローム層は浅間山・富士山・箱根山などの火山灰が積もった赤土。赤っぽい色は鉄分のさび。水持ちが悪く水田に向かない。"},
{"id":"D034","u":"関東・中部","lv":"標準","r":55,"f":"まちがい探し","q":"関東ローム層をつくる火山灰を降らせた火山として、ふさわしくないものはどれですか。","c":["羊蹄山","浅間山","富士山","箱根山"],"e":"羊蹄山は北海道の火山(蝦夷富士)。関東地方の周りにある浅間山・富士山・箱根山などの火山灰が関東ローム層をつくった。"},
{"id":"D035","u":"関東・中部","lv":"標準","r":55,"f":"2文の正誤","q":"武蔵野について、次の2つの文の正誤を選びなさい。\nI 地下水が手に入りにくく、水持ちの悪い土におおわれているため、水田には向いていない。\nII 大消費地の東京から遠いため、こんにゃくいもなど加工してから出荷する作物が多く作られている。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい。武蔵野は東京に近く、ねぎやほうれんそうなどの近郊農業がさかんなのでIIはまちがい。加工して出荷する作物は、東京から比較的遠い群馬県(こんにゃくいも)や栃木県(かんぴょう)。"},
{"id":"D036","u":"関東・中部","lv":"標準","r":66,"f":"知識","q":"武蔵野や下総台地で行われている、大都市の近くで大都市向けに野菜などを作って出荷する農業を何といいますか。","c":["近郊農業","おそ作り(高冷地農業)","早作り(促成栽培)","酪農"],"e":"大都市に近いので新鮮なうちに運べ、輸送費もおさえられる。おそ作りは野辺山原や嬬恋村、早作りは高知平野や宮崎平野。"},
{"id":"D037","u":"関東・中部","lv":"標準","r":58,"f":"知識","q":"群馬県などで見られる屋敷森は、冬の冷たいからっ風から家を守るための林です。家のどちら側に多くつくられていますか。","c":["北側と西側","南側と東側","北側と東側","南側と西側"],"e":"からっ風は冬に北西からふく。北西の風をふせぐため、家の北側と西側に木を植える。"},
{"id":"D038","u":"関東・中部","lv":"応用","r":48,"f":"2文の正誤","q":"からっ風について、次の2つの文の正誤を選びなさい。\nI からっ風は、日本海側に雪を降らせたあとに山地をこえてふき下ろすため、冷たくかわいている。\nII からっ風は、夏に南東の方角からふく季節風である。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい。からっ風は冬に北西からふく季節風なのでIIはまちがい。夏の南東の季節風は太平洋側に雨を降らせる風。"},
{"id":"D039","u":"関東・中部","lv":"標準","r":60,"f":"まちがい探し","q":"都心部などで人口が集まりすぎる「過密」によって起こる問題として、ふさわしくないものはどれですか。","c":["子どもがへって学校が閉校になり、バスの路線も廃止される","交通渋滞や通勤電車の混雑が起こる","住宅地が不足し、土地のねだんが高くなる","ごみの処理や空気・水のよごれが問題になる"],"e":"学校の閉校やバス路線の廃止は、人口が大きくへる「過疎」の地域の問題。過密と過疎を取りちがえないようにしよう。"},
{"id":"D040","u":"関東・中部","lv":"標準","r":58,"f":"知識","q":"ドーナツ化現象の説明として正しいものはどれですか。","c":["大都市の中心部で人口がへり(ふえなくなり)、周りの地域で人口がふえる","大都市の周りの地域で人口がへり、中心部で人口がふえる","土地のねだんが下がった中心部に、再び人口がもどってくる","地方の農村や山村で、人口が大きくへる"],"e":"中心部の人口がへり周りがふえるのでドーナツの形に見える。中心部にもどるのは都心回帰現象、農山村で人口がへるのは過疎。"},
{"id":"D041","u":"関東・中部","lv":"標準","r":56,"f":"資料の読み取り","q":"表は関東地方の5都県の面積・人口・人口密度です(2024年)。表から読み取れることとして正しいものはどれですか。","c":["東京都の人口密度は、千葉県の5倍以上である","神奈川県の人口密度は、東京都の3分の2以上である","千葉県の人口密度は、群馬県の5倍以上である","埼玉県の人口密度は、千葉県の2倍以上である"],"e":"6445÷1212はおよそ5.3で5倍以上。3817は6445の3分の2(約4297)より小さく、1212は297の約4.1倍、1931は1212の約1.6倍。","tb":[["都県","面積","人口","人口密度"],["東京都","2200km²","1418万人","6445人/km²"],["神奈川県","2417km²","923万人","3817人/km²"],["埼玉県","3798km²","733万人","1931人/km²"],["千葉県","5156km²","625万人","1212人/km²"],["群馬県","6362km²","189万人","297人/km²"]]},
{"id":"D042","u":"関東・中部","lv":"標準","r":62,"f":"知識","q":"群馬県・栃木県・埼玉県など関東地方の内陸部の産業は、どのように変わってきましたか。","c":["桑畑が広がり養蚕業や製糸業がさかんだったが、高速道路などの発達とともに機械工業がさかんになった","機械工業がさかんだったが、交通の発達とともに養蚕業や製糸業がさかんになった","石炭をほる炭鉱が栄えたが、閉山したあとはメロン作りがさかんになった","うめ立て地の工場が栄えたが、今はテーマパークなどに変わった"],"e":"内陸部は昔、桑の葉で蚕を育てて生糸をつくっていた(富岡製糸場など)。今は高速道路や新幹線にそって機械工場がならぶ。石炭からメロンは北海道の夕張市。"},
{"id":"D043","u":"関東・中部","lv":"応用","r":45,"f":"記述のことば","q":"関東地方の内陸部に機械工場がたくさんつくられるようになった理由を説明するとき、必ず入れたい言葉の組み合わせはどれですか。","c":["高速道路・交通が便利・広い土地が手に入りやすい","桑畑・まゆ・生糸","からっ風・屋敷森・内陸","過密・ベッドタウン・ドーナツ化現象"],"e":"高速道路や新幹線が開通して交通が便利になったことと、過密な海ぞいとくらべて内陸部では広い土地が手に入りやすかったことの2点が決め手。"},
{"id":"D044","u":"関東・中部","lv":"応用","r":46,"f":"2文の正誤","q":"うめ立て地と干拓地について、次の2つの文の正誤を選びなさい。\nI うめ立て地は、ふつう周りの水面より土地が高い。\nII 干拓地は、ふつう周りの水面より土地が高い。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"土などを運び入れるうめ立て地は水面より高い。水をぬいて干し上げる干拓地は水面より低いので、IIはまちがい。東京湾=うめ立て、八郎潟=干拓。"},
{"id":"D045","u":"関東・中部","lv":"基礎","r":76,"f":"知識","q":"茨城県にあり、日本で2番目に面積が広い湖を漢字で正しく書いたものはどれですか。","c":["霞ヶ浦","霧ヶ浦","霞ヶ湖","霞ヶ裏"],"e":"霞ヶ浦(かすみがうら)。もともと海だったところが切りはなされた海跡湖で、南の利根川下流は水郷地帯とよばれる。"},
{"id":"D046","u":"関東・中部","lv":"標準","r":58,"f":"知識","q":"浅間山のふもとにある群馬県の嬬恋村で、夏のすずしい気候を生かして行われている農業はどれですか。","c":["キャベツのおそ作り(高冷地農業)","キャベツの早作り(促成栽培)","電照菊の栽培","茶の栽培"],"e":"嬬恋村は標高が高く夏でもすずしいので、ほかの産地がつくれない夏にキャベツを出荷するおそ作り(高冷地農業)を行う。早作りはあたたかい地域で時期を早める方法。"},
{"id":"D047","u":"関東・中部","lv":"過去問型","r":30,"f":"資料の読み取り","q":"表は、札幌市・東京・新潟市・嬬恋村のいずれかの1月と8月の平均気温です。嬬恋村にあたるものはどれですか。","c":["表のC","表のA","表のB","表のD"],"e":"嬬恋村は標高が高いので、冬は札幌より寒く、夏も札幌よりすずしい(Cが冬も夏もいちばん低い)。Aは札幌、Bは東京、Dは新潟。","tb":[["","1月の平均気温","8月の平均気温"],["A","-3.2℃","22.3℃"],["B","5.4℃","26.9℃"],["C","-4.5℃","19.6℃"],["D","2.8℃","26.6℃"]]},
{"id":"D048","u":"関東・中部","lv":"標準","r":55,"f":"資料の読み取り","q":"表は中部地方の4県の面積・人口・人口密度です(2024年)。表から読み取れることとして正しいものはどれですか。","c":["愛知県の人口は、ほかの3県の人口を合わせたよりも多い","面積がいちばん広い長野県は、人口密度もいちばん高い","新潟県の人口密度は、岐阜県より高い","岐阜県の面積は、愛知県の3倍以上である"],"e":"199+210+192=601万人で、愛知県の746万人より少ない。長野県は人口密度がいちばん低く、新潟県(167)は岐阜県(180)より低い。岐阜県は愛知県の約2倍。","tb":[["県","面積","人口","人口密度"],["長野県","13562km²","199万人","147人/km²"],["新潟県","12584km²","210万人","167人/km²"],["岐阜県","10621km²","192万人","180人/km²"],["愛知県","5173km²","746万人","1442人/km²"]]},
{"id":"D049","u":"関東・中部","lv":"応用","r":42,"f":"2文の正誤","q":"中部地方の農業について、次の2つの文の正誤を選びなさい。\nI 野辺山原では、夏でもすずしい気候を生かして、ほかの地域より早い時期に野菜を出荷する早作り(促成栽培)が行われている。\nII 渥美半島の電照菊は、夜に電球の明かりを当てて開花をおくらせ、冬や春に出荷されている。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"野辺山原は標高が高く、ほかの地域より「おそい」時期にレタスやはくさいを作るおそ作り(高冷地農業)なのでIはまちがい。IIは正しい。"},
{"id":"D050","u":"関東・中部","lv":"応用","r":48,"f":"知識","q":"渥美半島で電照菊を育てるとき、夜の間に温室の中を電球で照らすのは何のためですか。","c":["秋にさく菊の開花をおくらせ、冬や春に出荷するため","秋にさく菊の開花を早め、夏に出荷するため","夜に虫が菊に近づかないようにするため","電球の熱で温室をあたため、寒さから菊を守るため"],"e":"菊は日が短くなるとさく性質があるので、明かりで夜を短くして開花を「おくらせる」。出荷の少ない冬や春に高いねだんで売れる。"},
{"id":"D051","u":"関東・中部","lv":"標準","r":63,"f":"知識","q":"静岡県の牧ノ原で茶の栽培がさかんな理由として正しいものはどれですか。","c":["日本海流(黒潮)の影響であたたかく、日当たりと水はけの良い台地だから","扇状地で水はけが良く、昼と夜の気温差が大きいから","大きな川の下流の低地で、水が豊かだから","寒流の影響で夏でもすずしいから"],"e":"牧ノ原は大井川の下流にある台地。黒潮によるあたたかい気候と、日当たり・水はけの良い台地が茶に合う。扇状地+昼夜の気温差は甲府盆地の果物。"},
{"id":"D052","u":"関東・中部","lv":"標準","r":56,"f":"まちがい探し","q":"甲府盆地について説明した文として、まちがっているものはどれですか。","c":["扇状地は水はけが悪いため、一面に水田が広がっている","山梨県にあり、ぶどうとももの生産量はどちらも日本一である","川が運んできた土砂が扇形に積もった扇状地が見られる","扇状地には、かつて桑畑が多く見られた"],"e":"扇状地は砂や小石が多く水はけが「良い」ので、水田より果樹園に向いている。"},
{"id":"D053","u":"関東・中部","lv":"応用","r":50,"f":"まちがい探し","q":"輪中について説明した文として、まちがっているものはどれですか。","c":["ふだん生活する建物を水屋、洪水のときのひなん用の建物を母屋という","木曽川・長良川・揖斐川の下流にある、川の水面より低い土地が多い地域である","まちや村の周りを堤防で囲んで、洪水をふせいでいる","土地の低いところは水田に、高いところに石垣を組んで家を建てている"],"e":"ふだん生活するのが母屋、ひなん用で一番高い所に建てるのが水屋。名前が逆になっている。"},
{"id":"D054","u":"関東・中部","lv":"標準","r":62,"f":"知識","q":"越後平野でつくられた大河津分水路は、どのような目的でつくられましたか。","c":["信濃川の流れを2つに分けて、洪水をふせぐため","いくつかの川の流れを1つにまとめて、船で運びやすくするため","多摩川の水を引いて、大都市の飲み水にするため","川の水をせき止めて、水力発電を行うため"],"e":"大河津分水路は信濃川の水の一部を日本海へ流す人工の水路で、明治から昭和にかけての大工事で完成した。多摩川の水を引いたのは江戸の玉川上水。"},
{"id":"D055","u":"関東・中部","lv":"標準","r":55,"f":"2文の正誤","q":"越後平野について、次の2つの文の正誤を選びなさい。\nI 昔は水はけの悪い湿田が多かったが、暗渠排水などによって乾田に改良された。\nII 乾田とは、しゅうかくした後も水をぬくことができない水田のことである。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい。乾田はしゅうかくの後に水をぬいてかわかすことのできる水田なのでIIはまちがい。乾田になって機械が使えるようになり、しゅうかく量もふえた。"},
{"id":"D056","u":"関東・中部","lv":"基礎","r":82,"f":"知識","q":"富山県と岐阜県の県境近くに見られる合掌造りの家は、屋根のかたむきが急になっています。その理由として正しいものはどれですか。","c":["雪が積もりにくくするため","強い台風の風に飛ばされないようにするため","夏の強い日差しをさえぎるため","雨水をためて飲み水にするため"],"e":"合掌造りはとても雪の深い地域の家で、急な屋根で雪を落とす。白川郷(岐阜県)・五箇山(富山県)の集落は世界文化遺産。"},
{"id":"D057","u":"関東・中部","lv":"応用","r":45,"f":"記述のことば","q":"若狭湾の沿岸に原子力発電所が多くつくられた理由を説明するとき、必ず入れたい言葉の組み合わせはどれですか。","c":["海ぞい・冷やすための大量の水・人口が少ない","リアス海岸・波がおだやか・養殖","関西地方・電気・二酸化炭素を出さない","日本海・北西の季節風・雪が多い"],"e":"原子力発電は高い熱を冷やす大量の水が必要なので海ぞいに、事故のときの被害を考えて人口の少ない所(リアス海岸で交通が不便だった)につくられた。"},
{"id":"D058","u":"関東・中部","lv":"標準","r":55,"f":"資料の読み取り","q":"表は日本の発電量にしめる発電方法別の割合の変化です。若狭湾の沿岸に多い発電所の発電方法にあたるものはどれですか。","c":["表のC","表のA","表のB","表のD"],"e":"若狭湾に多いのは原子力発電所。1960年度にはなく1990年度に増え、2023年度に大きくへったCが原子力。Aは水力、Bは火力、Dは新エネルギー。","tb":[["","1960年度","1990年度","2023年度"],["A","50.6%","11.2%","9.1%"],["B","49.4%","65.0%","77.4%"],["C","―","23.6%","8.7%"],["D","―","0.2%","4.8%"]]},
{"id":"D059","u":"関東・中部","lv":"標準","r":60,"f":"知識","q":"新潟県糸魚川市と静岡県静岡市を結ぶ線を西のふちとし、日本列島を東日本と西日本に分ける、本州中央部の大きな地質の溝を何といいますか。","c":["フォッサマグナ","日本アルプス","中央高地","リアス海岸"],"e":"フォッサマグナはラテン語で「大きな溝」。ドイツの学者ナウマンが発見した。"},
{"id":"D060","u":"関東・中部","lv":"標準","r":58,"f":"まちがい探し","q":"日本アルプスについて説明した文として、まちがっているものはどれですか。","c":["木曽山脈は南アルプスとよばれる","飛驒山脈は北アルプスとよばれる","赤石山脈は南アルプスとよばれる","イギリス人のゴーランドが、ヨーロッパのアルプス山脈にちなんで名づけたといわれる"],"e":"北から飛驒山脈=北アルプス、木曽山脈=中央アルプス、赤石山脈=南アルプス。3000m級の山が連なり「日本の屋根」とよばれる。"},
{"id":"D061","u":"関東・中部","lv":"標準","r":60,"f":"まちがい探し","q":"佐渡島について説明した文として、まちがっているものはどれですか。","c":["太平洋側でいちばん大きな島である","新潟県にふくまれる島である","江戸時代に多くの金がほり出された金山が、世界文化遺産に登録されている","特別天然記念物のトキの保護センターがある"],"e":"佐渡島は日本海側でいちばん大きな島。近くを流れる暖流の対馬海流の影響で、緯度のわりに温暖。"},
{"id":"D062","u":"関東・中部","lv":"応用","r":50,"f":"知識","q":"長野県の諏訪湖と、静岡県の浜名湖のでき方の組み合わせとして正しいものはどれですか。","c":["諏訪湖=断層湖、浜名湖=海跡湖","諏訪湖=カルデラ湖、浜名湖=海跡湖","諏訪湖=海跡湖、浜名湖=断層湖","諏訪湖=断層湖、浜名湖=カルデラ湖"],"e":"諏訪湖は琵琶湖と同じく断層でできたくぼ地の断層湖。浜名湖はサロマ湖・霞ヶ浦と同じく海が切りはなされた海跡湖で、地震で湖岸がくずれ今は海とつながっている。"},
{"id":"D063","u":"関東・中部","lv":"応用","r":45,"f":"資料の読み取り","q":"表のA~Cは、富山市・長野市・静岡県の海ぞいの都市のいずれかの、1月と7月の降水量です。正しい組み合わせはどれですか。","c":["A富山市・B長野市・C静岡県の海ぞいの都市","A長野市・B富山市・C静岡県の海ぞいの都市","A静岡県の海ぞいの都市・B長野市・C富山市","A富山市・B静岡県の海ぞいの都市・C長野市"],"e":"冬の降水量が多いAは北西の季節風で雪が降る北陸の富山市。一年中少ないBは中央高地の長野市。夏に多いCは南東の季節風の影響を受ける東海地方。","tb":[["","1月の降水量","7月の降水量"],["A","259.0mm","245.6mm"],["B","39.8mm","131.3mm"],["C","59.2mm","209.3mm"]]},
{"id":"D064","u":"関東・中部","lv":"標準","r":52,"f":"記述のことば","q":"甲府盆地で果物作りがさかんな理由を説明するとき、必ず入れたい言葉の組み合わせはどれですか。","c":["扇状地・水はけが良い・昼と夜の気温差が大きい","日本海流・あたたかい・日当たりの良い台地","標高が高い・夏でもすずしい・おそ作り","雪どけ水・湿田・暗渠排水"],"e":"川が運んだ土砂でできた扇状地は水はけが良く、海から遠い盆地は昼夜の気温差が大きいので、ぶどうやももがあまく育つ。"},
{"id":"D065","u":"関東・中部","lv":"標準","r":60,"f":"知識","q":"電照菊やメロンの栽培で知られる愛知県の半島を漢字で正しく書いたものはどれですか。","c":["渥美半島","温美半島","渥見半島","握美半島"],"e":"渥美(あつみ)半島。となりの知多半島と合わせて伊勢湾・三河湾を囲む。黒潮の影響で冬もあたたかい。"},
{"id":"E001","u":"近畿・中国・四国","lv":"基礎","r":88,"f":"知識","q":"滋賀県のほぼ中央にあり、京阪神の約1500万人の生活を支えることから「近畿の水がめ」とよばれる湖はどれ?","c":["琵琶湖","宍道湖","霞ケ浦","浜名湖"],"e":"琵琶湖は日本最大の湖で、県の面積の約6分の1をしめます。宍道湖はしじみで有名な島根県の湖なので区別しましょう。"},
{"id":"E002","u":"近畿・中国・四国","lv":"標準","r":62,"f":"知識","q":"かつて琵琶湖では水がよごれて赤潮やアオコが発生しました。このとき滋賀県が行った対策として正しいものはどれ?","c":["リンをふくむ合成洗剤の使用を禁止した","湖の水をぬいて干拓し、水田に変えた","湖の周りに防砂林を植えて砂が入るのを防いだ","工場の排水を流すための運河を淀川までほった"],"e":"家庭の洗剤などにふくまれるリンが栄養となってプランクトンがふえる(富栄養化)ため、リンをふくむ合成洗剤を禁止しました。赤潮の原因は「よごれた水で増えたプランクトン」とセットで覚えます。"},
{"id":"E003","u":"近畿・中国・四国","lv":"標準","r":58,"f":"2文の正誤","q":"大阪湾の海ぞいについて、次の2つの文の正誤を選びなさい。\nI 関西国際空港は、騒音などの公害をさけるため、大阪湾をうめ立てて海の上につくられた。\nII 神戸港のポートアイランドと六甲アイランドは、海の水をぬいてかわかす干拓によってつくられた人工島である。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"神戸の人工島は土を運び入れる「うめ立て」でつくられました。水をぬいてつくるのは「干拓」で、児島湾や有明海が代表です。"},
{"id":"E004","u":"近畿・中国・四国","lv":"応用","r":50,"f":"記述のことば","q":"神戸市が神戸港の近くに大きな人工島をつくった理由を書くとき、必ず入れたい言葉の組み合わせはどれ?","c":["背後に六甲山地・平地がせまい・住宅地の不足","騒音・振動・公害をさける","天下の台所・商人・蔵屋敷","平地がせまい・工場用地・赤潮を防ぐ"],"e":"神戸市はすぐ背後に六甲山地があって平地が少なく、住宅地不足をおぎなうためにポートアイランドと六甲アイランドをつくりました。「騒音・公害をさける」は関西国際空港の理由です。"},
{"id":"E005","u":"近畿・中国・四国","lv":"標準","r":65,"f":"知識","q":"江戸時代の大阪が「天下の台所」とよばれた理由として正しいものはどれ?","c":["淀川や運河による水上交通が発達し、全国から米や特産物が船で集まったから","1000年以上も都が置かれ、天皇や貴族がたくさんくらしていたから","日本標準時子午線が通り、全国の時刻の基準になっていたから","大阪湾をうめ立てて、大きな工場がたくさんつくられたから"],"e":"全国の米や特産物が船で運ばれて蔵屋敷に集まり、商人たちが売買したので「天下の台所」とよばれました。「千年の古都」は京都市です。"},
{"id":"E006","u":"近畿・中国・四国","lv":"過去問型","r":40,"f":"まちがい探し","q":"近畿地方の府県や都市についての説明のうち、まちがっているものはどれ?","c":["大阪市は盆地にある政令指定都市で、「千年の古都」とよばれる","京都市は、京都盆地にある政令指定都市である","兵庫県は、北は日本海、南は瀬戸内海に面している","堺市も政令指定都市で、世界遺産の大仙古墳がある"],"e":"盆地にある政令指定都市で「千年の古都」なのは京都市です。大阪市は大阪平野にあり「天下の台所」とよばれました。2つの海に面する兵庫県(神戸市)もセットで覚えましょう。"},
{"id":"E007","u":"近畿・中国・四国","lv":"基礎","r":82,"f":"知識","q":"日本の時刻の基準となる東経135度の日本標準時子午線が通る、兵庫県の市はどれ?","c":["明石市","姫路市","豊岡市","尼崎市"],"e":"日本標準時子午線(東経135度)は兵庫県の明石市などを通ります。姫路市は世界遺産の姫路城(白鷺城)がある市で、豊岡市・尼崎市も135度の線からははずれています。"},
{"id":"E008","u":"近畿・中国・四国","lv":"応用","r":48,"f":"資料の読み取り","q":"経度が15度ちがうと、太陽が真南に来る時刻は約1時間ちがいます。根室市(約東経145度)と長崎市(約東経130度)では、太陽が真南に来る時刻はどうなる?","c":["約1時間ちがい、根室市のほうが早い","約1時間ちがい、長崎市のほうが早い","約2時間ちがい、根室市のほうが早い","約15分ちがい、根室市のほうが早い"],"e":"145-130=15度なので約1時間の差です。太陽は東からのぼるので、東にある根室市のほうが先に真南に来ます。"},
{"id":"E009","u":"近畿・中国・四国","lv":"標準","r":60,"f":"知識","q":"紀伊山地で古くから人の手で育てられてきた「人工の美林」の組み合わせとして正しいものはどれ?","c":["吉野すぎ・尾鷲ひのき","秋田すぎ・木曽ひのき","天竜すぎ・青森ひば","吉野すぎ・木曽ひのき"],"e":"紀伊山地の人工の美林は吉野すぎと尾鷲ひのき(天竜すぎを加えて人工の三大美林)。秋田すぎ・木曽ひのき・青森ひばは「天然の三大美林」です。"},
{"id":"E010","u":"近畿・中国・四国","lv":"標準","r":68,"f":"資料の読み取り","q":"表は、尾鷲市・大阪市・鳥取市・那覇市の気温と降水量をまとめたものです。紀伊山地の南側にあり、日本でも特に降水量が多い尾鷲市はどれ?","c":["表のC","表のA","表のB","表のD"],"e":"尾鷲市は南東のしめった季節風が紀伊山地にぶつかるため、年降水量が約3850mmととても多くなります。Aは冬の降水量が多い鳥取市、Bは瀬戸内に面し降水量の少ない大阪市、Dは冬もあたたかい那覇市です。","tb":[["","1月の気温","1月の降水量","年降水量"],["A","約4℃","約200mm","約1930mm"],["B","約6℃","約50mm","約1340mm"],["C","約6℃","約100mm","約3850mm"],["D","約17℃","約100mm","約2160mm"]]},
{"id":"E011","u":"近畿・中国・四国","lv":"標準","r":66,"f":"知識","q":"日本海流(黒潮)の影響であたたかく、紀の川や有田川ぞいの日当たりのよい斜面でみかんやかきが作られ、うめの栽培もさかんな県はどれ?","c":["和歌山県","愛媛県","三重県","奈良県"],"e":"紀の川・有田川は和歌山県の川です。愛媛県もみかんの産地ですが、こちらは佐田岬半島や宇和海ぞいの段々畑なので、川の名前で区別しましょう。"},
{"id":"E012","u":"近畿・中国・四国","lv":"標準","r":60,"f":"2文の正誤","q":"志摩半島の真珠の養殖について、次の2つの文の正誤を選びなさい。\nI 英虞湾の周辺は出入りの少ない砂浜海岸が続き、波がおだやかなので真珠の養殖がさかんである。\nII 真珠をつくるアコヤ貝は、水温20℃前後のあたたかい海でよく育つ。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"英虞湾は複雑に入り組んだリアス海岸で、波がおだやかです。近くを暖流の日本海流(黒潮)が流れ、あたたかいこともアコヤ貝に合っています。"},
{"id":"E013","u":"近畿・中国・四国","lv":"応用","r":50,"f":"まちがい探し","q":"捕鯨についての説明のうち、まちがっているものはどれ?","c":["現在は、捕鯨に反対する国よりも、捕鯨を伝統とする国のほうが多い","日本式の捕鯨は、紀伊半島の和歌山県太地で本格的に始まったといわれる","鯨を食べる習慣のないアメリカなどでは、鯨の油を燃料に使うために捕鯨をしていた","1980年代に、商業捕鯨を禁止するルールがつくられた"],"e":"現在は捕鯨に反対する国のほうが多数です。日本は鯨の数に悪い影響が出ない範囲で商業捕鯨を続ける立場をとっています。"},
{"id":"E014","u":"近畿・中国・四国","lv":"標準","r":70,"f":"知識","q":"2階建ての瀬戸大橋(上を自動車、下を鉄道が通る)がある児島・坂出ルートが結んでいる県の組み合わせはどれ?","c":["岡山県と香川県","広島県と愛媛県","兵庫県と徳島県","岡山県と徳島県"],"e":"児島(岡山県倉敷市)と坂出(香川県)を結ぶのが瀬戸大橋です。広島県と愛媛県は尾道・今治ルート、兵庫県と徳島県は神戸・鳴門ルートです。"},
{"id":"E015","u":"近畿・中国・四国","lv":"標準","r":62,"f":"まちがい探し","q":"本州四国連絡橋の3つのルートについての説明のうち、まちがっているものはどれ?","c":["尾道・今治ルートは、広島県と香川県を結んでいる","神戸・鳴門ルートは、明石海峡大橋・淡路島・大鳴門橋を通る","児島・坂出ルートは「瀬戸大橋」とよばれ、鉄道も通る","瀬戸内しまなみ海道は、自動車だけでなく徒歩や自転車でも通れる"],"e":"尾道・今治ルート(瀬戸内しまなみ海道)は広島県と愛媛県を結びます。香川県と結ぶのは岡山県からの瀬戸大橋です。ルート名の地名(尾道=広島、今治=愛媛)で覚えましょう。"},
{"id":"E016","u":"近畿・中国・四国","lv":"応用","r":48,"f":"2文の正誤","q":"本州四国連絡橋ができたあとの問題について、次の2つの文の正誤を選びなさい。\nI 通行料金が高いので、地元の人たちにとっては毎日の生活に使いにくい面がある。\nII 瀬戸内しまなみ海道の開通後に船の便がへらされ、橋が通っていない島に住む人のくらしがかえって不便になった。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"どちらも正しい問題点です。橋の建設に大きな費用がかかったため料金が高く、また船の便がへったことで、橋を利用できない島の人は以前より不便になりました。"},
{"id":"E017","u":"近畿・中国・四国","lv":"応用","r":52,"f":"記述のことば","q":"瀬戸内地方が一年を通して降水量が少ない理由を書くとき、必ず入れたい言葉の組み合わせはどれ?","c":["中国山地と四国山地・しめった季節風・さえぎられる","日本海流(黒潮)・暖流・冬でもあたたかい","中国山地・北西の季節風・冬に雪が降る","瀬戸内海・海上交通・船の通り道"],"e":"冬の北西の季節風は中国山地に、夏の南東の季節風は四国山地にさえぎられるので、瀬戸内地方は一年中雨が少なくなります。片方の山地だけでは「一年を通して」の説明になりません。"},
{"id":"E018","u":"近畿・中国・四国","lv":"応用","r":50,"f":"記述のことば","q":"讃岐平野に昔からたくさんのため池がつくられてきた理由を書くとき、必ず入れたい言葉の組み合わせはどれ?","c":["降水量が少ない・大きな川がない・干害","降水量が少ない・干害・香川用水","北西の季節風・雪・水不足","大きな川がない・洪水・水をためる"],"e":"雨が少ないうえに大きな川もないため、日照りで作物がかれる干害が起きやすかったのが理由です。香川用水はあとから(1978年)つくられた解決策で、ため池の理由ではありません。"},
{"id":"E019","u":"近畿・中国・四国","lv":"標準","r":64,"f":"知識","q":"水不足になやむ香川県に水を送るため、1978年に完成した香川用水は、となりの徳島県を流れる何という川から水を引いている?","c":["吉野川","四万十川","仁淀川","紀の川"],"e":"「四国三郎」とよばれる吉野川から水を引いています。四万十川は「日本最後の清流」、紀の川は和歌山県の川(上流に吉野すぎ)なので混同しないように。"},
{"id":"E020","u":"近畿・中国・四国","lv":"基礎","r":80,"f":"知識","q":"香川県にふくまれる島で、あたたかくかんそうした瀬戸内の気候を生かしてオリーブの栽培がさかんな島はどれ?","c":["小豆島","淡路島","厳島(宮島)","隠岐諸島"],"e":"小豆島は瀬戸内海で2番目に大きい島で、100年以上前からオリーブが作られています。淡路島は兵庫県の島で、たまねぎが有名です。"},
{"id":"E021","u":"近畿・中国・四国","lv":"標準","r":66,"f":"知識","q":"瀬戸内海に面した地域で、雨が少なく晴れる日が多い気候を生かして、50年ほど前までさかんだったものはどれ?","c":["塩田での塩づくり","砂丘でのらっきょう作り","ビニールハウスでの夏野菜の早作り","クリークを使った米作り"],"e":"塩田は日光で海水の水分を蒸発させるので、雨が少ない瀬戸内が適していて、全国の90%以上の塩を生産したこともあります。跡地は工場や住宅地に利用されています。"},
{"id":"E022","u":"近畿・中国・四国","lv":"標準","r":60,"f":"まちがい探し","q":"瀬戸内海の赤潮についての説明のうち、まちがっているものはどれ?","c":["赤潮が発生すると、水中の酸素がふえすぎて魚や貝が死んでしまう","工場や家庭から流れ出たよごれた水が原因になる","プランクトンが異常にふえて、海が赤茶色になる","1960〜70年代には、養殖場の魚が大量に死ぬ被害が出た"],"e":"赤潮が発生すると水中の酸素が「足りなく」なるため、魚介類が死んでしまいます。「ふえる」のはプランクトンです。"},
{"id":"E023","u":"近畿・中国・四国","lv":"標準","r":68,"f":"知識","q":"高知平野で、冬でもあたたかい気候を生かしてビニールハウスでなすやピーマンを作る野菜作りを何という?","c":["早作り(促成栽培)","おそ作り(高冷地農業)","近郊農業","二期作"],"e":"旬より早く出荷する早作り(促成栽培)です。おそ作り(高冷地農業)は、夏でもすずしい高原で旬よりおそく出荷する野菜作りなので反対です。"},
{"id":"E024","u":"近畿・中国・四国","lv":"応用","r":48,"f":"まちがい探し","q":"高知平野についての説明のうち、まちがっているものはどれ?","c":["南東の季節風が四国山地にさえぎられるので、夏の降水量が少ない","近くを流れる日本海流(黒潮)の影響で、冬でもあたたかい","昔は、1年に2回同じ土地で米を作る二期作が行われていた","ほかの地域でとれない時期に出荷するので、高いねだんで売ることができる"],"e":"高知平野は太平洋側にあり、南東の季節風が四国山地にぶつかる手前なので夏の降水量は多く、台風の被害も受けやすい地域です。山地にさえぎられて雨が少ないのは、山地の北側の瀬戸内地方です。"},
{"id":"E025","u":"近畿・中国・四国","lv":"標準","r":62,"f":"知識","q":"愛媛県の佐田岬半島から宇和海にかけての段々畑で、みかんがよく育つ理由として正しいものはどれ?","c":["空からの日光に加え、海に反射した日光も当たり、日当たりが良いから","山の北側の斜面にあり、夏の強い日ざしをさけられるから","標高が高くすずしいので、おそ作りができるから","まわりを高い山にかこまれ、季節風がまったく当たらないから"],"e":"海に面した斜面の段々畑は、直接の日光と海からの反射光の両方が当たります。日光であたためられた石垣が、みかんの木を寒さから守る役目もしています。"},
{"id":"E026","u":"近畿・中国・四国","lv":"過去問型","r":35,"f":"資料の読み取り","q":"表は、岡山市・鳥取市・高知市・那覇市の日照時間と年降水量をまとめたものです。瀬戸内海に面し、一年を通して雨が少なく、冬も晴れの日が多い岡山市はどれ?","c":["表のB","表のA","表のC","表のD"],"e":"岡山市は1月の日照時間が多く、年降水量がいちばん少ないB。Aは冬に雪や雨で日照時間が少ない鳥取市、Cは晴れの日は多いが雨も多い高知市、Dは冬にくもりが多い那覇市です。日照時間だけでなく降水量も合わせて判断します。","tb":[["","1月の日照時間","年間の日照時間","年降水量"],["A","約80時間","約1700時間","約1930mm"],["B","約150時間","約2030時間","約1140mm"],["C","約190時間","約2160時間","約2670mm"],["D","約90時間","約1730時間","約2160mm"]]},
{"id":"E027","u":"近畿・中国・四国","lv":"標準","r":70,"f":"資料の読み取り","q":"表は、鳥取市・岡山市・高知市・札幌市の気温と降水量をまとめたものです。北西の季節風の影響で冬の降水量が多い鳥取市はどれ?","c":["表のD","表のA","表のB","表のC"],"e":"1月の降水量がいちばん多いDが鳥取市です。Aは冬の気温がマイナスの札幌市、Bは1月の降水量が最も少ない岡山市、Cは年降水量が多い高知市です。","tb":[["","1月の気温","1月の降水量","年降水量"],["A","約-3℃","約110mm","約1150mm"],["B","約5℃","約35mm","約1140mm"],["C","約7℃","約60mm","約2670mm"],["D","約4℃","約200mm","約1930mm"]]},
{"id":"E028","u":"近畿・中国・四国","lv":"応用","r":52,"f":"2文の正誤","q":"鳥取砂丘について、次の2つの文の正誤を選びなさい。\nI 川が運んだ砂が海流で運ばれ、冬の南東の季節風による強い波で海岸に打ち上げられてできた。\nII 砂丘の周辺では、スプリンクラーで水をまき、防砂林で砂が飛ぶのを防いで、らっきょうなどを作っている。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"日本海側に冬ふくのは北西の季節風です。川・海流・季節風の3つの力で砂丘ができました。"},
{"id":"E029","u":"近畿・中国・四国","lv":"標準","r":70,"f":"知識","q":"山陰地方や南四国の山間部で、若い人が都市へ移り住んで人口が大きくへり、お店や病院、バスの便がへるなどの問題が起こることを何という?","c":["過疎","過密","高齢化","ドーナツ化現象"],"e":"人口が大きくへって問題が起こるのが過疎、大都市に人が集まりすぎるのが過密です。過疎の地域では高齢化も同時に進みます。"},
{"id":"E030","u":"近畿・中国・四国","lv":"応用","r":45,"f":"2文の正誤","q":"岡山県の児島湾について、次の2つの文の正誤を選びなさい。\nI 児島湾では、浅い海に土を運び入れるうめ立てによって、400年ほど前から土地が広げられてきた。\nII 干拓地は水面よりも土地が高いので、住宅地や工業用地に使われることが多い。","c":["Iも IIもまちがっている","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい"],"e":"児島湾は水をぬいてかわかす「干拓」で土地を広げ、米作地帯になりました。干拓地は水面より土地が低いので水田に、うめ立て地は水面より高いので住宅地・工業用地に使われます。"},
{"id":"E031","u":"近畿・中国・四国","lv":"標準","r":68,"f":"知識","q":"山口県にある、石灰岩でできたカルスト地形の台地で、地下に秋芳洞という大きな鍾乳洞があるところはどれ?","c":["秋吉台","笠野原","根釧台地","武蔵野台地"],"e":"秋吉台はさんご礁が石灰岩になってできたカルスト地形の台地です。笠野原は鹿児島県のシラス台地なので区別しましょう。"},
{"id":"E032","u":"近畿・中国・四国","lv":"基礎","r":82,"f":"知識","q":"日本三景の1つ宮島(厳島)がある広島湾で、おだやかな海にいかだをうかべて養殖がさかんに行われているものはどれ?","c":["かき","真珠","のり","しじみ"],"e":"広島湾はかきの養殖で有名です。真珠は志摩半島の英虞湾、のりは有明海、しじみは宍道湖が代表です。"},
{"id":"E033","u":"近畿・中国・四国","lv":"応用","r":52,"f":"記述のことば","q":"広島市の原爆ドームが「負の遺産」として世界遺産に登録され、保存されている理由を書くとき、必ず入れたい言葉の組み合わせはどれ?","c":["戦争の悲惨さ・人類のあやまち・未来に伝え二度とくり返さない","原子爆弾・広島市・中国地方最大の都市","日本三景・厳島神社・美しい景色","戦争の悲惨さ・古い建物・観光客をふやす"],"e":"「負」はマイナスの意味で、人類が起こした悲惨なできごとを未来に伝え、二度とくり返さないために保存されています。ポーランドのアウシュビッツ強制収容所も負の遺産です。"},
{"id":"E034","u":"近畿・中国・四国","lv":"標準","r":60,"f":"資料の読み取り","q":"表は、四国地方の4県の面積・人口・人口密度(2024年)です。面積は4県で最も大きいのに人口は最も少なく、過疎が進む南四国の高知県はどれ?","c":["表のC","表のA","表のB","表のD"],"e":"高知県は面積7102km²で最大、人口66万人で最少、人口密度も92人/km²で最も低いCです。Bは面積が日本一小さく人口密度が高い香川県です。","tb":[["","面積","人口","人口密度"],["A","4147km²","69万人","165人/km²"],["B","1877km²","92万人","489人/km²"],["C","7102km²","66万人","92人/km²"],["D","5676km²","128万人","225人/km²"]]},
{"id":"E035","u":"近畿・中国・四国","lv":"標準","r":64,"f":"まちがい探し","q":"中国・四国地方の県についての説明のうち、まちがっているものはどれ?","c":["高知県は、日本でいちばん人口が少ない県である","香川県は、日本でいちばん面積が小さい都道府県である","徳島県は、兵庫県の淡路島と大鳴門橋で結ばれている","島根県には、縁結びの神さまとして知られる出雲大社がある"],"e":"人口がいちばん少ないのは鳥取県(約53万人)、2番目は島根県です。高知県は3番目なので、山陰と南四国に人口の少ない県が多いと覚えましょう。"},
{"id":"E036","u":"九州・沖縄","lv":"基礎","r":85,"f":"知識","q":"筑後川の下流に広がる筑紫平野で、網の目のようにつくられ、米作りや交通に利用されてきた水路を何という?","c":["クリーク","輪中","ため池","用水路(香川用水)"],"e":"筑紫平野のクリークは水をたくわえたり、よぶんな水をすてたり、小ぶねでの交通に使われたりしてきました。輪中は木曽三川の下流で堤防に囲まれた集落です。"},
{"id":"E037","u":"九州・沖縄","lv":"標準","r":60,"f":"まちがい探し","q":"筑紫平野についての説明のうち、まちがっているものはどれ?","c":["筑後川は「四国三郎」とよばれ、筑紫平野を通って有明海に注ぐ","クリークは、水をたくわえたり、よぶんな水をすてたりする","昔はクリークに小ぶねをうかべて、交通に利用していた","夏は稲、冬は麦という二毛作が行われてきた"],"e":"筑後川は「筑紫次郎」です。「四国三郎」は吉野川、「坂東太郎」は利根川です。"},
{"id":"E038","u":"九州・沖縄","lv":"標準","r":58,"f":"資料の読み取り","q":"表は、ある2つの地域の田んぼの1年の使い方です。表のBのような農業の名前と、それが行われてきた平野の組み合わせとして正しいものはどれ?","c":["二毛作・筑紫平野","二期作・筑紫平野","二毛作・高知平野","二期作・高知平野"],"e":"Bは稲のあとに麦というちがう作物を作るので二毛作で、筑紫平野が代表です。Aは同じ稲を2回作る二期作で、昔の高知平野で行われていました。","tb":[["","春〜夏","夏〜秋","秋〜春"],["A","4月田植え→7月稲かり","8月田植え→11月稲かり","(休む)"],["B","5月麦かり→6月田植え","10月稲かり","11月麦まき→麦を育てる"]]},
{"id":"E039","u":"九州・沖縄","lv":"過去問型","r":40,"f":"知識","q":"熊本県の説明として正しいものはどれ?","c":["八代平野では、夏に稲、冬にいぐさを作る二毛作が行われている","県の大部分がシラス台地におおわれ、さつまいもの生産量が日本一である","温泉の源泉数が日本一で、地熱発電がさかんである","日本でもっとも島の数が多く、その数は1000をこえる"],"e":"熊本県は八代平野の稲といぐさの二毛作、阿蘇山のカルデラが特徴です。シラス台地・さつまいもは鹿児島県、源泉数日本一・地熱発電は大分県、島の数日本一は長崎県です。"},
{"id":"E040","u":"九州・沖縄","lv":"基礎","r":76,"f":"知識","q":"熊本県が日本で作られるほぼ100%を生産している作物と、その使い道の組み合わせとして正しいものはどれ?","c":["いぐさで、たたみ表の原料になる","いぐさで、たたみべりの原料になる","こうぞで、和紙の原料になる","てんさいで、さとうの原料になる"],"e":"八代平野で裏作として作られるいぐさは、たたみの表面(たたみ表)の原料です。てんさいは北海道で作られるさとうの原料です。"},
{"id":"E041","u":"九州・沖縄","lv":"標準","r":60,"f":"2文の正誤","q":"シラス台地について、次の2つの文の正誤を選びなさい。\nI シラス台地は火山灰などが積もってできた台地で、水もちが良い。\nII シラス台地は栄養分が少ないので、ぶたや牛のふんを畑の肥料にして役立ててきた。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"シラス台地は水もちが悪く、水田にはむいていません。そのため、さつまいもや茶の栽培、畜産業がさかんになりました。"},
{"id":"E042","u":"九州・沖縄","lv":"応用","r":50,"f":"記述のことば","q":"鹿児島県のシラス台地で、米作りよりもさつまいも作りや畜産がさかんな理由を書くとき、必ず入れたい言葉の組み合わせはどれ?","c":["火山灰が積もった台地・水もちが悪い・水田にむかない","火山灰が積もった台地・水はけが悪い・水がたまりすぎる","台風が多い・稲がたおれる・根を深くはる","北西の季節風・雪・冬に農業ができない"],"e":"シラス(白っぽい火山灰など)の台地は水がしみこみやすく水もちが悪いので、大量の水が必要な水田にむきません。「水はけが悪い」は反対の意味なので注意。"},
{"id":"E043","u":"九州・沖縄","lv":"標準","r":62,"f":"知識","q":"大隅半島にあるシラス台地で、昔は深さ80mにもなる井戸の水を牛や馬の力でくみ上げていたが、ダムやスプリンクラーが整えられ九州を代表する畑作地帯になったところはどれ?","c":["笠野原","秋吉台","牧ノ原","根釧台地"],"e":"笠野原は水が得にくいシラス台地で、水道・ダム・農業用水路の整備によって畑作地帯になりました。秋吉台は山口県のカルスト台地です。"},
{"id":"E044","u":"九州・沖縄","lv":"標準","r":66,"f":"まちがい探し","q":"鹿児島県についての説明のうち、まちがっているものはどれ?","c":["県庁所在都市の鹿児島市は、九州地方でいちばん人口が多い","種子島・屋久島・奄美大島も鹿児島県にふくまれる","鹿児島湾には、活発な火山の桜島がある","ぶたや肉用牛などを育てる畜産業がさかんである"],"e":"九州地方で人口がいちばん多い都市は福岡市で、福岡県に九州の人口の3分の1以上が集まっています。"},
{"id":"E045","u":"九州・沖縄","lv":"基礎","r":82,"f":"知識","q":"阿蘇山のように、火山の噴火によってできた大きなくぼ地で、内部に水田や牧場が広がり、人もくらしている地形を何という?","c":["カルデラ","カルスト地形","扇状地","三角州"],"e":"阿蘇山は世界有数のカルデラをもち、その中に約4万人がくらしています。カルスト地形は石灰岩でできた秋吉台のような地形です。"},
{"id":"E046","u":"九州・沖縄","lv":"標準","r":58,"f":"2文の正誤","q":"宮崎平野の農業について、次の2つの文の正誤を選びなさい。\nI 宮崎平野は、近くを流れる日本海流(黒潮)の影響で冬でもあたたかい。\nII 宮崎平野では、ビニールハウスを使ってピーマンなどの夏野菜を旬よりおそく出荷する、おそ作り(高冷地農業)がさかんである。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"宮崎平野は冬の間に夏野菜を作って旬より早く出荷する早作り(促成栽培)です。おそ作り(高冷地農業)は長野県の野辺山原など、夏にすずしい高原で行われます。"},
{"id":"E047","u":"九州・沖縄","lv":"標準","r":62,"f":"資料の読み取り","q":"表は、福岡市・那覇市・宮崎市・岡山市の気温と降水量です。日本海流(黒潮)の影響で冬でもわりあいあたたかく、梅雨や台風の時期に雨が多い宮崎市はどれ?","c":["表のC","表のA","表のB","表のD"],"e":"宮崎市は年降水量がいちばん多いCです。Bは1月でも約17℃の亜熱帯性の気候の那覇市、Dは降水量が少ない瀬戸内の岡山市、Aは福岡市です。","tb":[["","1月の気温","8月の気温","年降水量"],["A","約7℃","約28℃","約1690mm"],["B","約17℃","約29℃","約2160mm"],["C","約8℃","約28℃","約2630mm"],["D","約5℃","約29℃","約1140mm"]]},
{"id":"E048","u":"九州・沖縄","lv":"標準","r":60,"f":"まちがい探し","q":"沖縄県でさとうきび作りがさかんな理由として、ふさわしくないものはどれ?","c":["水田をつくれる広い平地が多く、川の水も得やすいから","さとうきびは根を深くはるので、台風の強い風でもたおれにくいから","さとうきびは、日照りによる水不足に強いから","さとうきびは熱帯性の植物で、亜熱帯性の気候に合っているから"],"e":"沖縄県は小さな島が多く広い平地が少ないうえ、大きな川がないので水不足になりやすく、米作りにはむきません。そこで台風にも日照りにも強いさとうきびが作られてきました。"},
{"id":"E049","u":"九州・沖縄","lv":"標準","r":66,"f":"知識","q":"台風の被害を受けやすい沖縄県で、昔から見られる家づくりの工夫として正しいものはどれ?","c":["家の周りを石垣で囲み、屋根を低くして、かわらをしっくいで固める","屋根を急な角度にして、つもった雪が落ちやすいようにする","家の周りを堤防で囲み、ひなん用の水屋をつくる","屋根を高くして風通しをよくし、かわらは固定しないでおく"],"e":"強い風から家を守るため、石垣・低い屋根・しっくいで固めたかわらが昔の沖縄の家の特徴です。現在はコンクリートの家が多くなっています。水屋は輪中の工夫です。"},
{"id":"E050","u":"九州・沖縄","lv":"応用","r":50,"f":"記述のことば","q":"沖縄県は年降水量が約2000mmで全国平均より多いのに、昔から水不足になやまされ、屋根にタンクを置く家もあります。その理由を書くとき、必ず入れたい言葉の組み合わせはどれ?","c":["大きな川がない・雨水がすぐに海へ流れ出る","降水量が少ない・晴れの日が多い・干害","台風が多い・強い雨・屋根のタンク","水もちが悪い・シラス・地下水が深い"],"e":"雨は多くても、大きな川がなく雨水がすぐ海に流れ出てしまうため、水をたくわえにくいのです。「降水量が少ない」は讃岐平野(瀬戸内)の理由です。"},
{"id":"E051","u":"九州・沖縄","lv":"基礎","r":84,"f":"知識","q":"1543年にポルトガル人によって日本に初めて鉄砲が伝えられ、現在は宇宙センターがつくられてロケットの打ち上げが行われている島はどれ?","c":["種子島","屋久島","対馬","奄美大島"],"e":"種子島は鉄砲伝来の島で、当時の火縄銃は「種子島」ともよばれました。すぎの原始林で世界自然遺産なのは屋久島です。"},
{"id":"E052","u":"九州・沖縄","lv":"応用","r":50,"f":"2文の正誤","q":"種子島に宇宙センターがつくられた理由について、次の2つの文の正誤を選びなさい。\nI ロケットは赤道に近いところほど速い速度で打ち上げられるので、燃料のせつやくにもなる。\nII 周りに障害物や住宅が少ないことも、理由の1つである。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"赤道に近いほど地球の回転の速度が速いため、ロケットを打ち上げやすくなります。周りに障害物や住宅が少ないことも大切な条件です。"},
{"id":"E053","u":"九州・沖縄","lv":"標準","r":70,"f":"知識","q":"鹿児島湾にある活発な火山で、周りに火山灰を降らせ、110年ほど前の噴火で流れ出た溶岩によって大隅半島と陸続きになったものはどれ?","c":["桜島","雲仙岳","開聞岳","阿蘇山"],"e":"桜島はもともと島でしたが、1914年の噴火で大隅半島とつながりました。開聞岳は「薩摩富士」、雲仙岳は長崎県の島原半島にある火山です。"},
{"id":"E054","u":"九州・沖縄","lv":"応用","r":45,"f":"2文の正誤","q":"九州・沖縄地方の世界遺産について、次の2つの文の正誤を選びなさい。\nI 屋久島は、何千年も昔からのすぎの原始林が広がり、世界自然遺産に登録されている。\nII 沖縄島の首里城跡は琉球王国時代の城跡として世界文化遺産に登録されていて、2000円札にえがかれた守礼門もふくまれている。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"首里城跡などは世界文化遺産ですが、守礼門は世界文化遺産にふくまれていません。小さな部分の誤りを見のがさないようにしましょう。"},
{"id":"E055","u":"九州・沖縄","lv":"標準","r":62,"f":"まちがい探し","q":"有明海についての説明のうち、まちがっているものはどれ?","c":["海が深いので、土を運び入れるうめ立てによって土地が広げられてきた","遠浅で、潮の満ち干の差が大きい","のりの養殖がさかんである","干潟には、ムツゴロウという魚がすんでいる"],"e":"有明海は遠浅で潮の満ち干の差が大きいため、古くから水をぬく「干拓」で土地がつくられてきました。干拓=有明海・児島湾・八郎潟、うめ立て=大阪湾・東京湾と覚えましょう。"},
{"id":"E056","u":"九州・沖縄","lv":"標準","r":64,"f":"資料の読み取り","q":"表は、九州・沖縄地方の4県の面積・人口・人口密度(2024年)です。4県の中で面積がいちばん小さいのに、人口密度は2番目に高い沖縄県はどれ?","c":["表のD","表のA","表のB","表のC"],"e":"面積2282km²で最も小さく、人口密度643人/km²が2番目のDが沖縄県です。人口も人口密度も最大のAは福岡県、面積が最大のCは鹿児島県です。","tb":[["","面積","人口","人口密度"],["A","4988km²","509万人","1021人/km²"],["B","7409km²","170万人","229人/km²"],["C","9186km²","153万人","167人/km²"],["D","2282km²","147万人","643人/km²"]]},
{"id":"E057","u":"九州・沖縄","lv":"標準","r":58,"f":"知識","q":"九州地方にある3つの政令指定都市の組み合わせとして正しいものはどれ?","c":["福岡市・北九州市・熊本市","福岡市・北九州市・鹿児島市","福岡市・長崎市・熊本市","福岡市・北九州市・那覇市"],"e":"福岡県には福岡市と北九州市の2つの政令指定都市があり、熊本市は最も南にある政令指定都市です。"},
{"id":"E058","u":"九州・沖縄","lv":"標準","r":66,"f":"知識","q":"特別天然記念物のイリオモテヤマネコがすむ、沖縄県の島はどれ?","c":["西表島","奄美大島","屋久島","沖縄島"],"e":"西表島は奄美大島・徳之島・沖縄島北部とともに世界自然遺産です。アマミノクロウサギは奄美大島(鹿児島県)、ヤンバルクイナは沖縄島にすんでいます。"},
{"id":"E059","u":"九州・沖縄","lv":"標準","r":62,"f":"まちがい探し","q":"九州地方の県についての説明のうち、まちがっているものはどれ?","c":["佐賀県は、日本でもっとも島の数が多い県である","長崎市は、広島市に続いて原子爆弾の被害を受けた都市である","大分県は温泉の源泉数が日本一で、地熱発電がさかんである","福岡県は、関門海峡をはさんで山口県と向かい合っている"],"e":"島の数が日本一(1479)なのは長崎県です。佐賀県は伊万里・有田焼などの陶磁器づくりで有名です。"},
{"id":"E060","u":"九州・沖縄","lv":"応用","r":42,"f":"資料の読み取り","q":"経度が1度ちがうと、太陽が真南に来る時刻は約4分ちがいます。東経135度の明石市で太陽が真南に来て正午のとき、那覇市(約東経128度)で太陽が真南に来るのはおよそ何時ごろ?","c":["午後0時30分ごろ","午前11時30分ごろ","午後1時ごろ","午前11時ごろ"],"e":"135-128=7度、7×4=28分なので約30分の差です。那覇市は明石市より西にあるので、太陽が真南に来るのは約30分おそい午後0時30分ごろになります。"},

{"id":"G001","u":"国土と気候","lv":"基礎","r":82,"f":"知識","q":"1月の平均気温が約−3℃、8月が約22℃、年降水量が約1150mmで、梅雨がほとんどない都市はどこですか。","c":["札幌","釧路","秋田","松本"],"e":"札幌の決め手は「1月が氷点下(約−3℃)・年約1150mm・梅雨なし」。釧路は8月が約18℃とさらにすずしく、秋田は1月約0℃で冬の降水が多く、松本は1月0℃前後で8月約25℃。","kion":true},
{"id":"G002","u":"九州・沖縄","lv":"基礎","r":85,"f":"知識","q":"那覇の1月の平均気温にもっとも近いものはどれですか。","c":["約17℃","約9℃","約5℃","約0℃"],"e":"那覇は1月でも約17℃で、冬でも東京の春(4〜5月)なみの暖かさ。約9℃は鹿児島、約5℃は東京の1月の目安。","kion":true},
{"id":"G003","u":"関東・中部","lv":"標準","r":66,"f":"知識","q":"冬の降水量が多く、年降水量が約2400mm、1月の平均気温が約4℃の都市はどこですか。","c":["金沢","新潟","高知","仙台"],"e":"金沢の決め手は「冬に多い+年約2400mm」。同じ日本海側の新潟は年約1850mm、高知は年約2700mmだが夏から秋に多く、仙台は太平洋側で冬は乾燥し年約1300mm。","kion":true},
{"id":"G004","u":"国土と気候","lv":"標準","r":62,"f":"知識","q":"東京で、降水量が多くなる時期の組み合わせとしてもっともふさわしいものはどれですか。","c":["6月(梅雨)と9〜10月(台風・秋雨)","12月と1月(北西の季節風)","7月と8月だけ(夕立)","1年中ほぼ同じ量"],"e":"東京は1月約5℃・8月約27℃・年約1600mm。太平洋側なので冬は晴れて乾燥し、梅雨と台風・秋雨の時期に雨が多い。","kion":true},
{"id":"G005","u":"近畿・中国・四国","lv":"基礎","r":80,"f":"知識","q":"三重県の尾鷲の年降水量にもっとも近いものはどれですか。","c":["約4000mm","約2400mm","約1600mm","約1150mm"],"e":"尾鷲は年約4000mm(1991〜2020年平年値で約3970mm)で日本有数の多雨地。紀伊山地に南東の湿った風がぶつかるため。約2400mmは金沢・鹿児島、約1600mmは東京、約1150mmは札幌・高松の目安。","kion":true},
{"id":"G006","u":"北海道・東北","lv":"標準","r":64,"f":"知識","q":"釧路の8月の平均気温にもっとも近いものはどれですか。","c":["約18℃","約22℃","約25℃","約27℃"],"e":"釧路は8月でも約18℃と夏がとてもすずしい(千島海流(親潮)による濃霧のため)。約22℃は札幌、約25℃は秋田、約27℃は東京の8月の目安。","kion":true},
{"id":"G007","u":"近畿・中国・四国","lv":"標準","r":63,"f":"知識","q":"1年を通して降水量が少なく、年降水量が約1150mm、1月でも平均気温が約6℃ある都市はどこですか。","c":["高松","鳥取","高知","松本"],"e":"高松は瀬戸内の気候で、夏も冬も季節風が山地にさえぎられ1年中雨が少ない(年約1150mm)。松本も雨は少ないが1月は0℃前後と寒い。鳥取は冬、高知は夏に雨が多い。","kion":true},
{"id":"G008","u":"関東・中部","lv":"標準","r":60,"f":"知識","q":"年降水量が約1050mmと少なく、1月の平均気温が0℃前後、8月が約25℃の都市はどこですか。","c":["松本","高松","札幌","金沢"],"e":"松本は中央高地の気候で、まわりを山にかこまれ1年中雨が少なく(年約1050mm)、冬は0℃前後と寒い。高松は雨の量は近いが1月約6℃、札幌は1月約−3℃で8月約22℃。","kion":true},
{"id":"G009","u":"関東・中部","lv":"応用","r":50,"f":"知識","q":"長野県の標高約1000mの高原にあり、8月の平均気温が約21℃、1月が約−3℃で、夏の避暑地として知られる町はどこですか。","c":["軽井沢","松本","長野","新潟"],"e":"軽井沢は標高が高いので、同じ長野県の松本(8月約25℃・1月0℃前後)より夏は約4℃、冬は約3℃低い。8月約21℃は北海道の旭川(約21℃)なみのすずしさ。","kion":true},
{"id":"G010","u":"九州・沖縄","lv":"基礎","r":76,"f":"知識","q":"鹿児島の年降水量にもっとも近いものはどれですか。","c":["約2400mm","約1150mm","約1600mm","約4000mm"],"e":"鹿児島は年約2400mmで、梅雨と台風の時期に雨が多い。1月も約9℃と暖かい。約1150mmは瀬戸内(高松・岡山)、約1600mmは東京、約4000mmは尾鷲。","kion":true},
{"id":"G011","u":"近畿・中国・四国","lv":"標準","r":68,"f":"知識","q":"高知で降水量が多くなる季節としてもっともふさわしいものはどれですか。","c":["夏から秋(梅雨・台風)","冬(北西の季節風)","1年中少ない","春だけ"],"e":"高知は年約2700mmと多く、南東の季節風や梅雨・台風の雨が四国山地にぶつかる夏から秋に多い。冬に多いのは金沢などの日本海側、1年中少ないのは高松などの瀬戸内。","kion":true},
{"id":"G012","u":"国土と気候","lv":"応用","r":48,"f":"知識","q":"松本・金沢・東京を、1月の平均気温が低い(寒い)順にならべたものはどれですか。","c":["松本→金沢→東京","金沢→松本→東京","松本→東京→金沢","東京→金沢→松本"],"e":"1月の目安は松本0℃前後、金沢約4℃、東京約5℃。金沢は雪が多いが、気温は内陸の松本より高い。「雪が多い=いちばん寒い」ではない。","kion":true},

{"id":"G014","u":"北海道・東北","lv":"標準","r":58,"f":"知識","q":"北海道の札幌・釧路・旭川のうち、8月の平均気温がいちばん低い都市はどこですか。","c":["釧路","札幌","旭川","3つともほぼ同じ"],"e":"8月の目安は釧路約18℃、旭川約21℃、札幌約22℃。釧路は濃霧で日ざしがさえぎられ夏がすずしい。旭川は盆地で冬はとても寒いが、夏は意外に気温が上がる。","kion":true},
{"id":"G015","u":"北海道・東北","lv":"標準","r":57,"f":"知識","q":"盆地にある旭川の1月の平均気温にもっとも近いものはどれですか。","c":["約−7℃","約−3℃","約0℃","約4℃"],"e":"旭川は内陸の盆地なので冬の冷えこみが強く、1月約−7℃と札幌(約−3℃)よりずっと寒い。約0℃は秋田や松本、約4℃は金沢の1月の目安。","kion":true},
{"id":"G016","u":"北海道・東北","lv":"標準","r":60,"f":"知識","q":"太平洋側にあって冬は晴れて乾燥し、1月の平均気温が約2℃、年降水量が約1300mmの東北地方の都市はどこですか。","c":["仙台","秋田","新潟","金沢"],"e":"仙台は太平洋側なので冬の降水が少なく、年約1300mm。秋田(年約1750mm)・新潟・金沢は日本海側で、北西の季節風により冬の降水(雪)が多い。","kion":true},
{"id":"G017","u":"北海道・東北","lv":"応用","r":47,"f":"知識","q":"ほぼ同じ緯度にある秋田と岩手県の宮古。8月の平均気温が低いのはどちらで、その理由は何ですか。","c":["宮古。夏に冷たいやませがふくから","秋田。夏に冷たいやませがふくから","宮古。冬に雪が多く、地面が冷えるから","秋田。北西の季節風が夏もふくから"],"e":"宮古は太平洋側で、北東からふくやませのため8月約22℃とすずしい。秋田は日本海側で8月約25℃。やませは「北東からふいてくる」冷たくしめった風。","kion":true},
{"id":"G018","u":"北海道・東北","lv":"応用","r":45,"f":"知識","q":"釧路の8月の平均気温が、札幌より4℃ほど低い理由としてもっともふさわしいものはどれですか。","c":["夏の南東の季節風が千島海流(親潮)の上で冷やされ、濃霧が発生するから","夏の南東の季節風が日本海流(黒潮)の上で冷やされ、濃霧が発生するから","夏も北西の季節風がふき、日本海で雪雲ができるから","標高約1000mの高原にあるから"],"e":"釧路は8月約18℃。しめった南東の季節風が冷たい千島海流(親潮)の上を通ると冷やされて濃霧になり、日ざしをさえぎる。日本海流(黒潮)は暖流なので冷やさない。","kion":true},
{"id":"G019","u":"近畿・中国・四国","lv":"標準","r":58,"f":"知識","q":"同じ中国地方の鳥取と岡山。冬(12〜2月)の降水量が多いのはどちらで、その理由は何ですか。","c":["鳥取。北西の季節風が日本海で水分をふくみ、中国山地にぶつかるから","鳥取。南東の季節風が中国山地にぶつかるから","岡山。南東の季節風が四国山地にぶつかるから","岡山。北西の季節風が中国山地をこえて雪をふらせるから"],"e":"鳥取は日本海側で冬に雪が多く年約1900mm。岡山は瀬戸内で1年中雨が少なく年約1150mm。冬の季節風は「北西」、ぶつかる山は中国山地。","kion":true},
{"id":"G020","u":"関東・中部","lv":"標準","r":56,"f":"知識","q":"名古屋の気候の説明としてもっともふさわしいものはどれですか。","c":["1月約5℃・8月約28℃・年約1600mmで、夏に雨が多い","1月約4℃・8月約27℃・年約2400mmで、冬に雨が多い","1月約6℃・8月約29℃・年約1150mmで、1年中雨が少ない","1月0℃前後・8月約25℃・年約1050mmで、1年中雨が少ない"],"e":"名古屋は太平洋側の気候で、東京(1月約5℃・年約1600mm)によく似ているが、8月は約28℃と東京より少し暑い。2つめは金沢、3つめは高松、4つめは松本。","kion":true},
{"id":"G021","u":"九州・沖縄","lv":"基礎","r":78,"f":"知識","q":"1月の平均気温が約17℃、年降水量が約2200mmで、梅雨の5〜6月と台風の8〜9月に雨が多い都市はどこですか。","c":["那覇","鹿児島","福岡","高知"],"e":"那覇の決め手は1月約17℃。鹿児島は1月約9℃、福岡は約7℃、高知は約7℃で、冬の気温がまったくちがう。","kion":true},
{"id":"G022","u":"九州・沖縄","lv":"標準","r":58,"f":"知識","q":"福岡と鹿児島をくらべた説明として正しいものはどれですか。","c":["鹿児島のほうが年降水量が多く、1月の平均気温も高い","福岡のほうが年降水量が多く、1月の平均気温も高い","鹿児島のほうが年降水量は多いが、1月の平均気温は低い","2つとも年降水量は約1150mmで、瀬戸内とほぼ同じ"],"e":"目安は鹿児島が年約2400mm・1月約9℃、福岡が年約1700mm・1月約7℃。南にある鹿児島のほうが暖かく雨も多い。","kion":true},
{"id":"G023","u":"国土と気候","lv":"標準","r":62,"f":"まちがい探し","q":"都市とその気候の特徴の組み合わせとして、まちがっているものはどれですか。","c":["高松 ― 冬に北西の季節風で雪が多く降る","金沢 ― 冬の降水量が多く、年約2400mm","那覇 ― 1月でも平均気温が約17℃","松本 ― 年約1050mmと雨が少なく、1月は0℃前後"],"e":"高松は瀬戸内の気候で、冬の北西の季節風は中国山地にさえぎられるため、冬も雨や雪が少なく1月約6℃。冬に雪が多いのは金沢などの日本海側。","kion":true},
{"id":"G024","u":"北海道・東北","lv":"標準","r":60,"f":"まちがい探し","q":"札幌の気候の説明として、まちがっているものはどれですか。","c":["6〜7月は梅雨で、降水量がいちばん多くなる","1月の平均気温は約−3℃","8月の平均気温は約22℃","年降水量は約1150mm"],"e":"北海道には梅雨がほとんどないのが大きな特徴。札幌は冬の雪と秋の雨がやや多い。決め手は「1月約−3℃・8月約22℃・年約1150mm・梅雨なし」。","kion":true},
{"id":"G025","u":"近畿・中国・四国","lv":"標準","r":61,"f":"まちがい探し","q":"尾鷲の気候の説明として、まちがっているものはどれですか。","c":["冬の北西の季節風によって、冬に降水量がいちばん多くなる","年降水量は約4000mmで、日本有数の多さである","南東からのしめった風が紀伊山地にぶつかって雨が多い","三重県の太平洋側にある"],"e":"尾鷲は太平洋側なので、雨が多いのは梅雨・台風の夏から秋。冬に多いのは日本海側の特徴。年約4000mmは「日本一レベル」と覚える。","kion":true},
{"id":"G026","u":"関東・中部","lv":"応用","r":50,"f":"まちがい探し","q":"日本海側の都市の気候の説明として、まちがっているものはどれですか。","c":["金沢の8月の平均気温は、東京より10℃ほど低い","新潟の1月の平均気温は約3℃","金沢の年降水量は約2400mm","秋田は冬に雪が多い"],"e":"金沢の8月は約27℃で東京(約27℃)とほぼ同じ。日本海側は「冬に降水が多い」のが特徴で、夏の気温は太平洋側とあまり変わらない。","kion":true},
{"id":"G027","u":"近畿・中国・四国","lv":"標準","r":63,"f":"まちがい探し","q":"岡山・高松など瀬戸内の都市の気候の説明として、まちがっているものはどれですか。","c":["年降水量は2000mmをこえる","年降水量は約1150mmと少ない","1月でも平均気温は5℃前後ある","夏も冬も季節風が山地にさえぎられる"],"e":"瀬戸内は中国山地と四国山地にはさまれ、1年中雨が少ない(岡山・高松とも年約1150mm)。2000mmをこえるのは高知・鹿児島・金沢など。","kion":true},
{"id":"G028","u":"九州・沖縄","lv":"標準","r":64,"f":"まちがい探し","q":"那覇の気候の説明として、まちがっているものはどれですか。","c":["1月の平均気温は約9℃で、鹿児島とほぼ同じ","年降水量は約2200mm","梅雨の5〜6月と、台風の8〜9月に雨が多い","8月の平均気温は約29℃"],"e":"那覇の1月は約17℃で、鹿児島(約9℃)より8℃も高い。南西諸島の気候は「冬でも暖かい」のが決め手。","kion":true},
{"id":"G029","u":"国土と気候","lv":"応用","r":52,"f":"まちがい探し","q":"都市と数字の組み合わせとして、まちがっているものはどれですか。","c":["釧路 ― 8月の平均気温 約25℃","東京 ― 1月の平均気温 約5℃","高知 ― 年降水量 約2700mm","旭川 ― 1月の平均気温 約−7℃"],"e":"釧路の8月は約18℃で、日本の主な都市の中でもとくに夏がすずしい。約25℃は秋田や松本の8月の目安。","kion":true},
{"id":"G030","u":"関東・中部","lv":"標準","r":58,"f":"まちがい探し","q":"松本(中央高地の気候)の説明として、まちがっているものはどれですか。","c":["梅雨がほとんどなく、8月の平均気温は約18℃","年降水量は約1050mmと少ない","1月の平均気温は0℃前後","夏と冬の気温の差が大きい"],"e":"梅雨がなく8月約18℃なのは北海道(とくに釧路)の特徴。松本は8月約25℃、1月0℃前後で、気温差は約25℃と大きい。","kion":true},
{"id":"G031","u":"国土と気候","lv":"標準","r":57,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI 松本は1年中雨が少なく、1月の平均気温は0℃前後である。\nII 高松は、冬に北西の季節風によって雪が多く降る。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい(松本は年約1050mm・1月0℃前後)。IIは誤り。高松は北西の季節風が中国山地にさえぎられ、冬も降水が少ない(年約1150mm)。","kion":true},
{"id":"G032","u":"北海道・東北","lv":"応用","r":48,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI 宮古では、夏にやませがふくと気温が上がる。\nII 仙台は太平洋側にあり、冬は晴れて乾燥した日が多い。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"Iは誤り。やませは冷たくしめった風で、ふくと気温が「下がり」、冷害の原因になる。IIは正しい(仙台は年約1300mm、冬の降水は少ない)。","kion":true},
{"id":"G033","u":"近畿・中国・四国","lv":"標準","r":60,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI 高知の年降水量は約2700mmで、夏から秋に多い。\nII 尾鷲の年降水量は約4000mmで、日本有数の多さである。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"どちらも正しい。高知は梅雨・台風の雨が四国山地に、尾鷲は南東の風が紀伊山地にぶつかって雨が多い。太平洋側の多雨地は「夏から秋に多い」。","kion":true},
{"id":"G034","u":"国土と気候","lv":"標準","r":60,"f":"資料の読み取り","q":"次の数字にあてはまる都市の組み合わせとして正しいものはどれですか。\nA 1月約17℃・年約2200mm\nB 1月約5℃・年約1600mm\nC 1月約−3℃・年約1150mm","c":["A那覇 B東京 C札幌","A鹿児島 B東京 C札幌","A那覇 B高松 C札幌","A那覇 B東京 C松本"],"e":"1月約17℃は那覇だけ(鹿児島は約9℃)。年約1600mmは東京(高松は約1150mm)。1月約−3℃は札幌(松本は0℃前後)。","kion":true},
{"id":"G035","u":"国土と気候","lv":"応用","r":46,"f":"資料の読み取り","q":"8月と1月の平均気温の差がいちばん大きい都市はどれですか。それぞれの都市の8月と1月の気温の目安から考えなさい。","c":["旭川","那覇","東京","釧路"],"e":"目安で計算すると、旭川は約21℃−(約−7℃)=約28℃、釧路は約18℃−(約−5℃)=約23℃、東京は約27℃−約5℃=約22℃、那覇は約29℃−約17℃=約12℃。内陸の盆地は気温差が大きい。","kion":true},
{"id":"H001","u":"野菜・果物","lv":"基礎","r":90,"f":"知識","q":"りんごの生産量が全国1位(全体の6割ほど)の県はどこですか。","c":["青森県","長野県","山形県","和歌山県"],"e":"りんごは北のすずしい気候に合い、本州のいちばん北の青森県が約61%で1位です。長野県は2位なので取りちがえに注意。"},
{"id":"H002","u":"野菜・果物","lv":"基礎","r":78,"f":"知識","q":"みかんの生産量が全国1位の県はどこですか。","c":["和歌山県","愛媛県","静岡県","熊本県"],"e":"みかんは南のあたたかい気候に合い、1位は和歌山県(約25%)、2位静岡県、3位愛媛県です。「愛媛=みかん」の印象で愛媛を選ばないように。"},
{"id":"H003","u":"野菜・果物","lv":"基礎","r":85,"f":"知識","q":"山梨県の甲府盆地で、生産量が日本一の果物の組み合わせはどれですか。","c":["ぶどう・もも","りんご・さくらんぼ","みかん・いよかん","日本なし・かき"],"e":"甲府盆地は扇状地が広がる内陸の盆地で、ぶどうとももが日本一です。さくらんぼは山形盆地、いよかんは愛媛県です。"},
{"id":"H004","u":"野菜・果物","lv":"基礎","r":86,"f":"知識","q":"さくらんぼ(おうとう)の生産量で、全国の約4分の3をしめる県はどこですか。","c":["山形県","青森県","山梨県","福島県"],"e":"さくらんぼは山形県が約75%で、山形盆地の降水量が少なくすずしい気候をいかして作られます。"},
{"id":"H005","u":"野菜・果物","lv":"標準","r":64,"f":"知識","q":"扇状地のうち、砂や小石が多くて水はけが良く、果樹園に利用される部分を何といいますか。","c":["扇央","扇頂","扇端","三角州"],"e":"扇央は川の水が地下にしみこむので水田に向かず果樹園になります。扇頂は大きな石が多くほとんど利用されず、扇端は水がわき出して水田や住宅地になります。"},
{"id":"H006","u":"野菜・果物","lv":"標準","r":60,"f":"知識","q":"扇状地のうち、地下を流れてきた水がわき出すため、水田や住宅地に利用される部分を何といいますか。","c":["扇端","扇央","扇頂","自然堤防"],"e":"扇央でしみこんだ水が、扇状地のはしの扇端でわき出します。水が得やすいので水田や住宅地が集まります。"},
{"id":"H007","u":"野菜・果物","lv":"標準","r":68,"f":"知識","q":"果物作りで、大きくなる前に実の一部をつみとる「摘果」を行うのは何のためですか。","c":["1つ1つの実を大きく育てるため","実の数をふやして収穫量を多くするため","実を早く熟させて出荷を早めるため","実が鳥に食べられないようにするため"],"e":"実の数をへらすことで、残った実に養分が集まり、1つ1つが大きく育ちます。実の数をふやすのとは逆です。"},
{"id":"H008","u":"野菜・果物","lv":"標準","r":62,"f":"知識","q":"愛媛県の段々畑で使われている「モノラック」とは何ですか。","c":["収穫したみかんや肥料などを運ぶモノレール","霜を防ぐために畑に風を送る扇風機","斜面の畑に水をまくスプリンクラー","実に袋をかけるための機械"],"e":"モノラックは急な斜面の段々畑で、みかんや肥料を運ぶためのモノレールです。霜を防ぐ扇風機は茶畑の防霜ファンです。"},
{"id":"H009","u":"野菜・果物","lv":"標準","r":52,"f":"知識","q":"日本なしの生産量(2024年)で全国1位の県はどこですか。","c":["千葉県","鳥取県","山梨県","青森県"],"e":"日本なしは千葉県(約12%)が1位で、茨城・福島・栃木と関東・東北南部が上位です。「二十世紀なし=鳥取」のイメージで鳥取を選ばないように。"},
{"id":"H010","u":"野菜・果物","lv":"標準","r":64,"f":"知識","q":"南半球にあって日本と季節が逆のため、日本で旬ではない時期にぶどうやさくらんぼを日本へ送ってくる国はどこですか。","c":["チリ","フィリピン","中国","アメリカ"],"e":"チリは南半球の国なので季節が日本と逆です。フィリピンはバナナ、アメリカはオレンジの輸入が多い国です。"},
{"id":"H011","u":"野菜・果物","lv":"標準","r":62,"f":"知識","q":"果物の輸入先(2024年)で、全体の約2割をしめて第1位の国はどこですか。","c":["フィリピン","中国","アメリカ","ニュージーランド"],"e":"1位はフィリピン(約19%)で、おもにバナナです。中国とアメリカは約15%ずつで2・3位です。"},
{"id":"H012","u":"野菜・果物","lv":"標準","r":60,"f":"知識","q":"青森県の津軽平野でりんご畑が広がる、日当たりの良いなだらかな斜面は、何という山のすそ野ですか。","c":["岩木山","大山","岩手山","鳥海山"],"e":"津軽平野のりんご畑は岩木山のすそ野に広がります。大山(鳥取県)のすそ野は日本なしの産地です。"},
{"id":"H013","u":"野菜・果物","lv":"標準","r":62,"f":"まちがい探し","q":"内陸の盆地でぶどうやももがよく育つ理由として、ふさわしくないものはどれですか。","c":["季節風の影響を強く受けて、雨が多いから","まわりを山に囲まれ、降水量が少ないから","昼と夜の気温差が大きいから","水はけの良い扇状地が広がっているから"],"e":"盆地はまわりの山が季節風をさえぎるので、季節風の影響を受けにくく降水量が少ないのが特ちょうです。「受けやすい・雨が多い」は逆です。"},
{"id":"H014","u":"野菜・果物","lv":"標準","r":66,"f":"まちがい探し","q":"愛媛県の段々畑のみかんを育てる「3つの太陽」として、ふさわしくないものはどれですか。","c":["夜に畑を照らす電灯の光","空から直接当たる日光","海面に反射した光","昼の熱をたくわえ、光も反射する段々畑の石垣"],"e":"3つの太陽は、空からの直射日光・海面の反射光・石垣(昼の熱を吸収して夜も畑をあたためる)です。電灯は電照菊の話と混ぜないように。"},
{"id":"H015","u":"野菜・果物","lv":"応用","r":50,"f":"まちがい探し","q":"扇状地の説明として、まちがっているものはどれですか。","c":["扇頂は水はけが良いので、果樹園として最も多く利用される","扇央は砂や小石が多く、川の水が地下にしみこむ","扇端では、地下を流れてきた水がわき出す","扇頂には大きな石がごろごろしている"],"e":"扇頂は大きな石が多く、ほとんど利用されません。果樹園になるのは扇央です。扇頂・扇央・扇端の順番と利用を区別しましょう。"},
{"id":"H016","u":"野菜・果物","lv":"標準","r":64,"f":"まちがい探し","q":"果物の説明として、まちがっているものはどれですか。","c":["りんごはあたたかい地域で作られ、「ふじ」「つがる」などの品種がある","ぶどうは水はけの良い土地を好み、ワインの原料にもなる","日本なしは、雨が少ないほうがよく育つ","みかんは5月ごろ花がさき、秋から冬に実がなる"],"e":"りんごはすずしい地域で作られる果物です。「ふじ」「つがる」はりんごの品種名として正しいので、まちがいは「あたたかい」の部分です。"},
{"id":"H017","u":"野菜・果物","lv":"基礎","r":76,"f":"まちがい探し","q":"日本ではあまり作られず、輸入にたよっている果物として、ふさわしくないものはどれですか。","c":["かき","バナナ","パイナップル","オレンジ"],"e":"かきは日本で多く作られる果物で、生産量はぶどうと同じくらいです。バナナ・パイナップル・オレンジ・キウイフルーツは輸入が多い果物です。"},
{"id":"H018","u":"野菜・果物","lv":"標準","r":60,"f":"まちがい探し","q":"日本の果物の生産・消費・輸入について、まちがっているものはどれですか。","c":["果物の自給率は70%をこえている","果物の消費量は1960年代から大きくふえた","果物の国内生産量はへってきている","果物の輸入量は1970年ごろよりふえている"],"e":"果物の自給率は30%台で、輸入にたよる割合が大きいです。70%台なのは野菜の自給率です。"},
{"id":"H019","u":"野菜・果物","lv":"標準","r":62,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI 長野盆地では、りんごのほか、ぶどうやももも作られている。\nII 和歌山県では、紀の川や有田川ぞいの斜面でみかんが多く作られている。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"IもIIも正しい文です。長野盆地は信濃川中流の盆地でりんご・ぶどう・ももなど、和歌山県は川ぞいの斜面でみかんを作ります。"},
{"id":"H020","u":"野菜・果物","lv":"標準","r":58,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI 扇央は水はけが良いので、水田として利用されることが多い。\nII 扇端は地下の水がわき出すので、水田や住宅地として利用される。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"Iは「水田」がまちがいで、扇央は水がしみこむため果樹園に利用されます。IIは正しい文です。"},
{"id":"H021","u":"野菜・果物","lv":"応用","r":48,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI 甲府盆地は、戦前は果樹園よりも、養蚕のための桑畑のほうが多かった。\nII ももの生産量は、山梨県についで長野県が2位である。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい文です。IIは、ももの2位は福島県(約27%)なのでまちがいです。長野県が2位なのはりんごとぶどうです。"},
{"id":"H022","u":"野菜・果物","lv":"標準","r":56,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI 盆地はまわりを山に囲まれているので、季節風の影響を受けやすい。\nII 盆地は昼と夜の気温差が小さいので、ぶどうやももがあまく育つ。","c":["Iも IIもまちがっている","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい"],"e":"Iは「受けやすい」ではなく「受けにくい」、IIは「小さい」ではなく「大きい」が正しく、どちらもまちがいです。"},
{"id":"H023","u":"野菜・果物","lv":"標準","r":58,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI 南半球の国は日本と季節が逆なので、日本で旬でない時期にも果物を輸入できる。\nII アメリカからは、おもにバナナが輸入されている。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい文です。IIは、アメリカからはおもにオレンジで、バナナはフィリピンからが多いのでまちがいです。"},
{"id":"H024","u":"野菜・果物","lv":"応用","r":52,"f":"資料の読み取り","q":"表は、ある2つの果物X・Yの生産量の多い県と割合(2024年)です。表から読み取れることとして正しいものはどれですか。","c":["Xは1位の県だけで全体の半分以上をしめている","Yは上位3県を合わせると全体の60%をこえる","Xの2位の県の割合は、Yの2位の県の割合より低い","Yは1位の県だけで全体の3分の1以上をしめている"],"e":"Xはりんご(青森61%)、Yはみかんです。Yの上位3県は25+16+14=55%、Xの2位18%はYの2位16%より高く、Yの1位25%は3分の1(約33%)より少ないです。","tb":[["","1位","2位","3位"],["X","青森 61%","長野 18%","岩手 6%"],["Y","和歌山 25%","静岡 16%","愛媛 14%"]]},
{"id":"H025","u":"野菜・果物","lv":"標準","r":66,"f":"資料の読み取り","q":"表は主な果物の生産量(2024年)です。りんごの生産量は、ももの生産量の約何倍ですか。","c":["約5倍","約3倍","約2倍","約8倍"],"e":"りんご56.0万t÷もも11.0万t=約5.1なので約5倍です。表の数を正しく読み、わり算で比べましょう。","tb":[["果物","生産量(万t)"],["みかん","60.9"],["りんご","56.0"],["日本なし","17.3"],["かき","16.7"],["ぶどう","16.5"],["もも","11.0"]]},
{"id":"H026","u":"野菜・果物","lv":"応用","r":50,"f":"資料の読み取り","q":"表は、ある果物の生産量の多い県と割合(2024年)です。この果物は何ですか。","c":["もも","ぶどう","さくらんぼ","りんご"],"e":"山梨県が1位で、福島県が2位(27%)に入っているのがももの特ちょうです。ぶどうなら山梨の次は長野(20%)、さくらんぼなら山形が約75%です。","tb":[["順位","県","割合"],["1位","山梨","29%"],["2位","福島","27%"],["3位","長野","10%"]]},
{"id":"H027","u":"野菜・果物","lv":"応用","r":48,"f":"資料の読み取り","q":"表は日本の果物の輸入先(2024年)です。表から読み取れることとして正しいものはどれですか。","c":["上位4か国を合わせると、全体の半分以上になる","フィリピンからの輸入は、全体の4分の1以上をしめる","中国とアメリカを合わせると、全体の40%をこえる","表の中に南半球の国はふくまれていない"],"e":"19+15+15+9=58%なので半分以上です。フィリピンは19%で4分の1(25%)未満、中国とアメリカで30%、ニュージーランドは南半球の国です。","tb":[["国","割合"],["フィリピン","19%"],["中国","15%"],["アメリカ","15%"],["ニュージーランド","9%"]]},
{"id":"H028","u":"野菜・果物","lv":"応用","r":50,"f":"記述のことば","q":"愛媛県の宇和海沿岸がみかん作りに適している理由を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["海に面した日当たりの良い斜面・海面の反射光・石垣の熱","扇状地・水はけが良い・昼と夜の気温差","すずしい気候・山のすそ野・なだらかな斜面","平らな土地・大型機械・広い畑"],"e":"宇和海沿岸は海に面した山の斜面の段々畑で、直射日光・海面の反射光・石垣の熱の「3つの太陽」がみかんを育てます。扇状地や昼夜の気温差は甲府盆地の説明です。"},
{"id":"H029","u":"野菜・果物","lv":"標準","r":58,"f":"記述のことば","q":"果物作りで摘果をする理由を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["実の数をへらす・残った実に養分が集まる・1つ1つを大きく育てる","実の数をへらす・作業を楽にする・早く出荷する","実をつみとる・病気を防ぐ・農薬をへらす","実をつみとる・ジュースに加工する・売り上げをふやす"],"e":"摘果の目的は1つ1つの実を大きく育てることです。実の数をへらすと養分が残った実に集まる、という理由までつなげて書きます。"},
{"id":"H030","u":"野菜・果物","lv":"応用","r":48,"f":"記述のことば","q":"扇状地の扇央が水田ではなく果樹園に利用される理由を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["砂や小石が多い・水はけが良い・川の水が地下にしみこむ","大きな石が多い・平らでない・利用されない","地下の水がわき出す・水が得やすい・住宅地","昼と夜の気温差が大きい・季節風・降水量が少ない"],"e":"扇央は砂や小石が多く水がしみこむため、水をためる水田には向かず、水はけの良さをいかして果樹園になります。わき出す水は扇端、大きな石は扇頂の説明です。"},
{"id":"H031","u":"麦・豆・工芸作物","lv":"基礎","r":80,"f":"知識","q":"てんさい(さとうだいこん)は、植物のどの部分からさとうを作りますか。","c":["根","くき","葉","実"],"e":"てんさいは根、さとうきびはくきからさとうを作ります。「てんさい=だいこん=根」と覚えましょう。"},
{"id":"H032","u":"麦・豆・工芸作物","lv":"標準","r":70,"f":"知識","q":"さとうきびは、植物のどの部分からさとうを作りますか。","c":["くき","根","葉","実"],"e":"さとうきびは、竹のようにのびたくきをしぼってさとうを作ります。根から作るのはすずしい北海道のてんさいです。"},
{"id":"H033","u":"麦・豆・工芸作物","lv":"標準","r":66,"f":"知識","q":"熊本県で、米作が終わった水田を利用していぐさが作られている平野はどこですか。","c":["八代平野","筑紫平野","十勝平野","宮崎平野"],"e":"いぐさは熊本県の八代平野で、水田の裏作(二毛作)として作られ、熊本県がほぼ100%をしめます。"},
{"id":"H034","u":"麦・豆・工芸作物","lv":"基礎","r":78,"f":"知識","q":"こんにゃくいもの生産がとくにさかんな県はどこですか。","c":["群馬県","静岡県","鹿児島県","北海道"],"e":"こんにゃくいもは内陸部で作られ、群馬県が中心です。静岡県と鹿児島県は茶の産地です。"},
{"id":"H035","u":"麦・豆・工芸作物","lv":"応用","r":48,"f":"知識","q":"こんにゃくの原料になるこんにゃくいもは、植物のどの部分ですか。","c":["地中にできる球のようなくき","地中にできる根","地中にできる実","葉のつけね"],"e":"こんにゃくいもは「いも」とよばれますが、地中にできる球のようなくきです。根を使うてんさいと区別しましょう。"},
{"id":"H036","u":"麦・豆・工芸作物","lv":"標準","r":64,"f":"知識","q":"同じ茶の葉から作られるお茶のうち、完全に発酵させて作るものはどれですか。","c":["紅茶","ウーロン茶","緑茶","麦茶"],"e":"緑茶=発酵させない、ウーロン茶=途中まで発酵、紅茶=完全に発酵、です。麦茶は茶の葉から作るものではありません。"},
{"id":"H037","u":"麦・豆・工芸作物","lv":"標準","r":62,"f":"知識","q":"かんしょ(さつまいも)の生産量(2024年)が全国1位の県はどこですか。","c":["鹿児島県","茨城県","千葉県","北海道"],"e":"さつまいもは鹿児島県(約30%)が1位で、シラス台地の笠野原などで作られます。茨城県(約28%)がわずかの差で2位です。北海道が1位なのはじゃがいもです。"},
{"id":"H038","u":"麦・豆・工芸作物","lv":"標準","r":58,"f":"知識","q":"「狭山茶」の産地で、ほかの茶の産地より北にあり、気温が低いため葉が厚くうま味がある茶を作っている県はどこですか。","c":["埼玉県","静岡県","京都府","三重県"],"e":"狭山茶は埼玉県の狭山丘陵で作られます。宇治茶は京都府、牧ノ原は静岡県です。"},
{"id":"H039","u":"麦・豆・工芸作物","lv":"標準","r":64,"f":"知識","q":"高級茶の宇治茶で知られる京都府宇治市にあり、10円玉にえがかれている建物はどれですか。","c":["平等院鳳凰堂","金閣","法隆寺","東大寺大仏殿"],"e":"宇治市には平等院鳳凰堂があり、10円玉の表にえがかれています。宇治では宇治川の霧が霜を防ぐのに役立ちます。"},
{"id":"H040","u":"麦・豆・工芸作物","lv":"基礎","r":80,"f":"知識","q":"静岡県の牧ノ原の茶畑に立っている「防霜ファン」の役目はどれですか。","c":["霜が茶の新芽につくのを防ぐ","害虫を追いはらう","茶の葉をかわかして発酵させる","夏の強い日ざしから葉を守る"],"e":"防霜ファンは風を送って霜が茶の葉につくのを防ぎます。名前の「防霜=霜を防ぐ」から覚えましょう。"},
{"id":"H041","u":"麦・豆・工芸作物","lv":"応用","r":50,"f":"知識","q":"今から約1200年前、中国から日本に茶を伝えたとされる僧はだれですか。","c":["最澄","栄西","行基","聖徳太子"],"e":"最初に茶を伝えたのは最澄(はじめは薬として)。その後、栄西が中国(宋)から茶の種を持ち帰り、飲む習慣が広まりました。"},
{"id":"H042","u":"麦・豆・工芸作物","lv":"標準","r":62,"f":"知識","q":"十勝平野で、夏に濃霧を発生させて日光をさえぎり、冷害の原因となる冷たい海流は何ですか。","c":["千島海流(親潮)","日本海流(黒潮)","対馬海流","リマン海流"],"e":"冷たい千島海流(親潮)の上で濃霧が発生し、夏でも気温が上がりにくくなります。日本海流(黒潮)はあたたかい海流です。"},
{"id":"H043","u":"麦・豆・工芸作物","lv":"標準","r":68,"f":"まちがい探し","q":"工芸作物と、それから作られる製品の組み合わせとして、まちがっているものはどれですか。","c":["いぐさ―さとう","てんさい―さとう","茶―紅茶","こんにゃくいも―こんにゃく"],"e":"いぐさはくきを使ってたたみ表を作ります。さとうになるのは、てんさい(根)とさとうきび(くき)です。"},
{"id":"H044","u":"麦・豆・工芸作物","lv":"基礎","r":78,"f":"まちがい探し","q":"大豆から作られるものとして、ふさわしくないものはどれですか。","c":["かんぴょう","とうふ","しょうゆ","みそ"],"e":"とうふ・しょうゆ・みそは大豆が原料です。かんぴょうは、ゆうがおという植物の実をうすくむいてかわかしたもので、大豆からは作りません。"},
{"id":"H045","u":"麦・豆・工芸作物","lv":"基礎","r":82,"f":"まちがい探し","q":"作物と主な産地の組み合わせとして、まちがっているものはどれですか。","c":["さとうきび―北海道","てんさい―北海道","いぐさ―熊本県","こんにゃくいも―群馬県"],"e":"さとうきびは一年中あたたかい沖縄県(約60%)と鹿児島県で作られます。北海道はすずしい気候に合うてんさいです。"},
{"id":"H046","u":"麦・豆・工芸作物","lv":"標準","r":60,"f":"まちがい探し","q":"日本の小麦の自給率が低い理由として、ふさわしくないものはどれですか。","c":["日本は雨が少なく、小麦が育ちにくいから","アメリカやカナダでは広い畑で大型機械を使い、大量に安く作れるから","安い輸入品がふえたから","小麦は雨の少ない気候に適した作物だから"],"e":"小麦は雨の少ない気候に適した作物で、日本は雨が多いため質の良い小麦を育てるのがむずかしいのです。「雨が少ない」は逆です。"},
{"id":"H047","u":"麦・豆・工芸作物","lv":"標準","r":62,"f":"まちがい探し","q":"十勝平野の農業の説明として、まちがっているものはどれですか。","c":["農家1戸あたりの耕地面積は、全国平均とほぼ同じである","大型機械を使い、少ない人手で大量に収穫している","火山灰土におおわれた、やせた土地が広がっていた","1880年ごろ、本州から来たわずか28人の開拓から始まった"],"e":"北海道の農家1戸あたりの耕地面積は約34.5haで、全国平均約3.7haの10倍近くあります。"},
{"id":"H048","u":"麦・豆・工芸作物","lv":"応用","r":50,"f":"まちがい探し","q":"茶の産地についての説明として、まちがっているものはどれですか。","c":["狭山茶は、ほかの産地より南にあってあたたかいので、葉がうすくやわらかい","宇治茶の産地では、宇治川の霧が霜を防ぐ","茶の生産量は、鹿児島県と静岡県で全体の7割ほどをしめる","茶の生産量が世界一の国は中国である"],"e":"狭山茶は埼玉県で、ほかの産地より北にあり気温が低いため葉が厚くなり、うま味があります。「南・うすい」は逆です。"},
{"id":"H049","u":"麦・豆・工芸作物","lv":"基礎","r":76,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI てんさいはすずしい気候に合い、北海道の十勝平野などで作られる。\nII さとうきびは一年中あたたかい気候に合い、沖縄県と鹿児島県で作られる。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"IもIIも正しい文です。てんさい=すずしい北海道、さとうきび=あたたかい沖縄・鹿児島、と北と南で対になっています。"},
{"id":"H050","u":"麦・豆・工芸作物","lv":"標準","r":58,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI いぐさは、米作が終わった水田を利用して、二毛作の表作として作られる。\nII 茶は、温暖で雨が多く、水はけの良い土地に適している。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"Iは「表作」ではなく「裏作」が正しいのでまちがいです。米が表作、いぐさが裏作です。IIは正しい文です。"},
{"id":"H051","u":"麦・豆・工芸作物","lv":"標準","r":62,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI 緑茶は発酵させずに作り、紅茶は完全に発酵させて作る。\nII ウーロン茶は、緑茶や紅茶とはちがう植物の葉から作る。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい文です。ウーロン茶は途中まで発酵させたもので、緑茶・紅茶と同じ茶の葉から作るのでIIはまちがいです。"},
{"id":"H052","u":"麦・豆・工芸作物","lv":"応用","r":44,"f":"2文の正誤","q":"次の2つの文の正誤を答えなさい。\nI 十勝平野では、年ごとに同じ作物を植える連作をして、輪作障害をふせいでいる。\nII 大豆の生産量は、北海道についで福岡県が多い。","c":["Iも IIもまちがっている","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい"],"e":"Iは逆で、年ごとに作物を変える「輪作」で「連作障害」をふせいでいます。IIの大豆の2位は宮城県で、福岡県が2位なのは小麦です。どちらもまちがいです。"},
{"id":"H053","u":"麦・豆・工芸作物","lv":"応用","r":50,"f":"資料の読み取り","q":"表は日本の主な食料の自給率(2024年度)です。表から読み取れることとして正しいものはどれですか。","c":["米の自給率は、大豆の自給率の10倍以上である","果実の自給率は、小麦の自給率の3倍以上である","自給率が50%未満のものは2つである","野菜の自給率は、肉類の自給率の2倍以上である"],"e":"97÷7=約14なので米は大豆の10倍以上です。果実36%は小麦16%の約2.3倍、50%未満は果実・小麦・大豆の3つ、野菜78%は肉類53%の2倍未満です。","tb":[["品目","自給率"],["米","97%"],["野菜","78%"],["肉類","53%"],["果実","36%"],["小麦","16%"],["大豆","7%"]]},
{"id":"H054","u":"麦・豆・工芸作物","lv":"標準","r":62,"f":"資料の読み取り","q":"表は、いくつかの工芸作物の生産量の多い都道府県と割合です。表のBにあてはまる作物はどれですか。","c":["さとうきび","茶","てんさい","いぐさ"],"e":"沖縄県と鹿児島県の2県だけで100%になるBはさとうきびです。Aは茶(鹿児島・静岡)、Cはてんさい(北海道)、Dはいぐさ(熊本)です。","tb":[["","1位","2位","3位"],["A","鹿児島 37%","静岡 35%","三重 7%"],["B","沖縄 60%","鹿児島 40%","―"],["C","北海道 100%","―","―"],["D","熊本 100%","―","―"]]},
{"id":"H055","u":"麦・豆・工芸作物","lv":"応用","r":46,"f":"資料の読み取り","q":"表は、小麦と大豆の生産量の多い道県と割合です。表のYにあてはまる作物はどれですか。","c":["大豆","小麦","ばれいしょ(じゃがいも)","てんさい"],"e":"どちらも北海道が1位ですが、Yは2位以下が宮城・秋田と東北なので大豆です。Xは福岡・佐賀と九州北部が続く小麦(北海道65%)です。","tb":[["","1位","2位","3位"],["X","北海道 65%","福岡 6%","佐賀 4%"],["Y","北海道 53%","宮城 8%","秋田 5%"]]},
{"id":"H056","u":"麦・豆・工芸作物","lv":"標準","r":64,"f":"資料の読み取り","q":"表は、農家1戸あたりの耕地面積です。北海道は全国平均の約何倍ですか。","c":["約9倍","約3倍","約5倍","約20倍"],"e":"34.5÷3.7=約9.3なので約9倍(10倍近く)です。北海道では大型機械を使った大規模な農業が行われています。","tb":[["","農家1戸あたりの耕地面積"],["北海道","約34.5ha"],["全国平均","約3.7ha"]]},
{"id":"H057","u":"麦・豆・工芸作物","lv":"応用","r":50,"f":"資料の読み取り","q":"表は、日本の小麦と大豆の輸入先と割合(2024年)です。表から読み取れることとして正しいものはどれですか。","c":["大豆は、アメリカ1か国だけで輸入の半分以上をしめる","小麦は、オーストラリアからの輸入が最も多い","大豆の輸入先にカナダは入っていない","小麦は、アメリカとカナダを合わせても輸入の半分に満たない"],"e":"大豆はアメリカが65%で半分以上です。小麦はアメリカとカナダが39%ずつ(合わせて78%)で、オーストラリアは22%。大豆の3位はカナダ(15%)です。","tb":[["","1位","2位","3位"],["小麦","アメリカ 39%","カナダ 39%","オーストラリア 22%"],["大豆","アメリカ 65%","ブラジル 19%","カナダ 15%"]]},
{"id":"H058","u":"麦・豆・工芸作物","lv":"応用","r":50,"f":"記述のことば","q":"十勝平野の畑が、区画ごとにちがう色に見える理由を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["年ごとに植える作物を変える・輪作・連作障害をふせぐ","同じ作物を植えつづける・連作・収穫量をふやす","大型機械・広い畑・少ない人手","火山灰土・やせた土地・肥料をまく"],"e":"畑の色がちがうのは、年ごとに作物を変える輪作をしているからで、その目的は連作障害をふせぐことです。大型機械や火山灰土は十勝平野の特ちょうですが、色のちがいの理由にはなりません。"},
{"id":"H059","u":"麦・豆・工芸作物","lv":"応用","r":46,"f":"記述のことば","q":"日本の小麦の自給率が低い理由を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["国土の広い国・大型機械で大量に安く作る・安い輸入品がふえた","日本は雨が少ない・小麦が育たない・輸入にたよる","北海道・十勝平野・生産量の65%","パン・うどん・粉にして使う"],"e":"アメリカやカナダなど国土の広い国では大型機械で大量に安く作れるため、安い輸入品がふえました。日本は雨が多く小麦作りに向かないので「雨が少ない」は逆です。"},
{"id":"H060","u":"麦・豆・工芸作物","lv":"標準","r":56,"f":"記述のことば","q":"静岡県の牧ノ原が茶の栽培に適している理由を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["日本海流(黒潮)・あたたかい・水はけの良い台地","千島海流(親潮)・すずしい・水はけの良い台地","日本海流(黒潮)・あたたかい・水分の多い水田","宇治川の霧・霜を防ぐ・昼夜の気温差"],"e":"牧ノ原は日本海流(黒潮)の影響であたたかく、水はけの良い台地なので茶作りに適しています。水分の多い土地はいぐさ、宇治川の霧は宇治茶の説明です。"},
{"id":"I001","u":"水産業・畜産","lv":"基礎","r":88,"f":"知識","q":"乳用牛を飼育して生乳をしぼり、牛乳やバター・チーズなどの乳製品をつくる畜産業を何といいますか。","c":["酪農","養豚","養鶏","輪作"],"e":"乳用牛を飼って牛乳や乳製品をつくるのが酪農です。「酪」は乳からつくる食品という意味で、肉牛を育てることとは区別します。"},
{"id":"I002","u":"水産業・畜産","lv":"標準","r":62,"f":"知識","q":"日本で食べられている肉類の量を、多い順にならべたものはどれですか。","c":["ぶた肉→とり肉→牛肉","とり肉→ぶた肉→牛肉","牛肉→ぶた肉→とり肉","ぶた肉→牛肉→とり肉"],"e":"いちばん多いのはぶた肉で、次がとり肉、いちばん少ないのが牛肉です。とり肉は近年ぶた肉に近づいていますが、まだぶた肉が1位です。"},
{"id":"I003","u":"水産業・畜産","lv":"標準","r":60,"f":"知識","q":"現在の日本は、肉類全体のおよそどれくらいを外国からの輸入にたよっていますか。","c":["約半分","約1割","約4分の3","ほとんどすべて"],"e":"肉類の自給率は53%で、半分近くを輸入にたよっています。約4分の3を輸入にたよっているのは家畜の飼料(えさ)なので、取りちがえないこと。"},
{"id":"I004","u":"水産業・畜産","lv":"標準","r":60,"f":"知識","q":"戦後、北海道の根釧台地に国によってつくられた、大規模な実験農場を何といいますか。","c":["パイロットファーム","新酪農村","屯田兵村","開拓使"],"e":"戦後につくられた実験農場がパイロットファームで、1970年代にはさらに大規模な新酪農村がつくられました。順番も合わせて覚えましょう。"},
{"id":"I005","u":"水産業・畜産","lv":"基礎","r":78,"f":"知識","q":"根釧台地で夏に濃霧が発生しやすいのは、沖を流れるどの海流のえいきょうですか。","c":["千島海流(親潮)","日本海流(黒潮)","対馬海流","リマン海流"],"e":"冷たい千島海流(親潮)の上を湿った風がふくと冷やされて霧になります。暖流の日本海流(黒潮)と取りちがえないこと。"},
{"id":"I006","u":"水産業・畜産","lv":"基礎","r":80,"f":"知識","q":"鹿児島県や宮崎県に広がるシラス台地は、主に何におおわれていますか。","c":["火山灰など","石灰岩","泥炭","粘土"],"e":"シラス台地は火山灰などにおおわれ、水もちが悪く米作にむかないため、畑作や畜産業が中心です。泥炭は北海道の石狩平野の土です。"},
{"id":"I007","u":"水産業・畜産","lv":"標準","r":70,"f":"知識","q":"昔の日本で、肉類があまり食べられていなかった主な理由はどれですか。","c":["仏教のえいきょうが強かったから","肉を冷やして運ぶ方法がなかったから","家畜を育てる土地がなかったから","外国から肉を輸入できなかったから"],"e":"昔の日本は仏教のえいきょうで肉食がひかえられていました。食生活の多様化(洋風化)で、肉類や乳製品の消費量が大きくふえました。"},
{"id":"I008","u":"水産業・畜産","lv":"標準","r":62,"f":"知識","q":"牛肉の輸入が自由化され、外国産の安い牛肉がたくさん輸入されるようになったのは何年からですか。","c":["1991年","1971年","2001年","1961年"],"e":"1991年に牛肉の輸入が自由化され、牛肉の自給率は大きく下がりました。2001年はBSEが日本で初めて発見された年なので混同しないこと。"},
{"id":"I009","u":"水産業・畜産","lv":"標準","r":68,"f":"知識","q":"牛などに与える「配合飼料」の原料で、いちばん多いものはどれですか。","c":["とうもろこし","大豆","小麦","米"],"e":"配合飼料の主な原料はとうもろこしで、その多くは輸入です。飼料の自給率が低いことにつながります。"},
{"id":"I010","u":"水産業・畜産","lv":"標準","r":66,"f":"知識","q":"岩手県などに見られる、人が住む家と馬屋がL字型につながった家のつくりを何といいますか。","c":["曲り家","合掌造り","校倉造り","書院造"],"e":"昔、馬は田畑を耕したり荷物を運んだりする大切な労働力で、曲り家ではいちばん日当たりのよい南側に馬屋がありました。合掌造りは岐阜県白川郷などの家です。"},
{"id":"I011","u":"水産業・畜産","lv":"基礎","r":78,"f":"知識","q":"牛を聖なる動物とする宗教(ヒンドゥー教)の信者が、最も多い国はどれですか。","c":["インド","タイ","サウジアラビア","中国"],"e":"インドではヒンドゥー教の信者が多く、牛は聖なる動物とされています。宗教と食べ物の関係として覚えましょう。"},
{"id":"I012","u":"水産業・畜産","lv":"応用","r":50,"f":"知識","q":"2001年に日本で初めて発見され、外国から輸入した飼料(肉骨粉)が原因と考えられた、牛の病気はどれですか。","c":["BSE(牛海綿状脳症)","口蹄疫","鳥インフルエンザ","豚熱"],"e":"BSEは2001年に日本で初めて見つかり、肉骨粉の使用が制限されました。口蹄疫は2010年の宮崎県、豚熱は2018年以降の岐阜県などで発生しました。"},
{"id":"I013","u":"水産業・畜産","lv":"基礎","r":82,"f":"知識","q":"家畜の病気が発生したとき、根拠のないうわさやデマによって、その地域の安全な肉やたまごまで売れなくなる被害を何といいますか。","c":["風評被害","冷害","塩害","公害"],"e":"根拠のないうわさで商品が売れなくなるのが風評被害です。感染した家畜の肉やたまごを食べても人に感染することはないといわれています。"},
{"id":"I014","u":"水産業・畜産","lv":"応用","r":48,"f":"知識","q":"ブランドのにわとり「名古屋コーチン」の産地として知られる県はどれですか。","c":["愛知県","秋田県","山形県","三重県"],"e":"名古屋コーチンは愛知県です。秋田県の比内地鶏もにわとりのブランドなので、どちらがどの県か区別して覚えましょう。"},
{"id":"I015","u":"水産業・畜産","lv":"標準","r":58,"f":"まちがい探し","q":"家畜と、飼育数が多い都道府県(上位2つ)の組み合わせとして、まちがっているものはどれですか。","c":["採卵鶏―鹿児島県・宮崎県","肉用若鶏―鹿児島県・宮崎県","肉用牛―北海道・鹿児島県","ぶた―鹿児島県・北海道"],"e":"採卵鶏は千葉県・茨城県が上位です。鹿児島県・宮崎県が1・2位なのは肉用若鶏(ブロイラー)で、たまご用と肉用を取りちがえないこと。"},
{"id":"I016","u":"水産業・畜産","lv":"基礎","r":84,"f":"まちがい探し","q":"牛乳からつくられる乳製品として、ふさわしくないものはどれですか。","c":["マヨネーズ","チーズ","バター","ヨーグルト"],"e":"マヨネーズは主にたまごと油と酢からつくるもので、乳製品ではありません。チーズ・バター・ヨーグルトは牛乳からつくる乳製品です。"},
{"id":"I017","u":"水産業・畜産","lv":"応用","r":45,"f":"まちがい探し","q":"ブランド肉と、その産地の県の組み合わせとして、まちがっているものはどれですか。","c":["前沢牛―山形県","米沢牛―山形県","神戸ビーフ―兵庫県","肥後あか牛―熊本県"],"e":"前沢牛は岩手県のブランド牛です。山形県は米沢牛で、「前沢」と「米沢」の「沢」がまぎらわしいので注意しましょう。"},
{"id":"I018","u":"水産業・畜産","lv":"応用","r":46,"f":"まちがい探し","q":"家畜の病気について説明した文として、まちがっているものはどれですか。","c":["口蹄疫は、2010年に岐阜県で発生し、にわとりに大きな被害が出た","豚熱は、2018年以降、岐阜県や愛知県などでぶたやいのししに広がった","BSEは、2001年に日本で初めて発見された","鳥インフルエンザは、2004年以降たびたび発生している"],"e":"口蹄疫は牛やぶたの病気で、2010年に宮崎県で発生しました。岐阜県や愛知県で広がったのは豚熱です。"},
{"id":"I019","u":"水産業・畜産","lv":"標準","r":60,"f":"まちがい探し","q":"肉用牛を育てる畜産農家について説明した文として、まちがっているものはどれですか。","c":["農家の数はふえているが、1けんあたりの飼育頭数はへっている","農家の数がへっている主な原因は、あとつぎが少ないことである","えさや水をあげる作業を機械で自動化している農家がある","大規模経営で人手や費用をおさえ、安い輸入肉に対抗している"],"e":"農家の数はへっていますが、1けんあたりの飼育頭数はふえていて、大規模な農家がふえています。「へる」「ふえる」が入れかわった文に注意しましょう。"},
{"id":"I020","u":"水産業・畜産","lv":"標準","r":62,"f":"まちがい探し","q":"北海道で畜産業がさかんな理由や様子を説明した文として、まちがっているものはどれですか。","c":["あたたかい気候で、牧草がよく育つ","農家1けんあたりの耕地面積が広い","根釧台地は夏に濃霧が発生し、米作や畑作にむかない","日高山脈のふもとでは、競走馬のサラブレッドが育てられている"],"e":"北海道はすずしい気候で、それが牧草が育つのに適しています。「あたたかい」ではなく「すずしい」が正しい言葉です。"},
{"id":"I021","u":"水産業・畜産","lv":"基礎","r":76,"f":"まちがい探し","q":"シラス台地について説明した文として、まちがっているものはどれですか。","c":["水もちがよいため、米作がさかんである","さつまいもなどの畑作がさかんである","ぶたや肉用牛、肉用若鶏の飼育がさかんである","家畜のふんは、栄養分の少ない土地で貴重な肥料になる"],"e":"シラス台地は火山灰などにおおわれ水もちが悪いので、米作にはむきません。そのため畑作と畜産業が農業の中心です。"},
{"id":"I022","u":"水産業・畜産","lv":"標準","r":58,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI たまごをとる採卵鶏の飼育数は、1位が千葉県、2位が茨城県である。\nII 肉をとる肉用若鶏(ブロイラー)の飼育数は、1位が宮崎県である。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい文です。肉用若鶏の1位は鹿児島県で、宮崎県は2位なので、IIはまちがいです。"},
{"id":"I023","u":"水産業・畜産","lv":"基礎","r":76,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 乳用牛からは肉を、肉用牛からは牛乳をとる。\nII 乳用牛を飼育して生乳をしぼり、牛乳や乳製品をつくる畜産業を酪農という。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"Iは「乳用牛」と「肉用牛」が入れかわっています。乳用牛は牛乳をとる牛、肉用牛は肉をとる牛なので、IIだけが正しい文です。"},
{"id":"I024","u":"水産業・畜産","lv":"応用","r":48,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 1991年から牛肉の輸入が自由化され、牛肉の自給率は大きく上がった。\nII 日本では1980〜90年代に、肉類の輸入量が大きくへった。","c":["Iも IIもまちがっている","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい"],"e":"輸入自由化で安い外国産牛肉がふえ、牛肉の自給率は「下がり」ました。また1980〜90年代には肉類の輸入量は大きく「ふえ」たので、どちらもまちがいです。"},
{"id":"I025","u":"水産業・畜産","lv":"標準","r":66,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 栃木県の那須では、高原のすずしい気候をいかして乳用牛が飼育されている。\nII 大都市の近くで乳用牛を飼うと、とれたての牛乳を新鮮なうちに大都市に運ぶことができる。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"那須は高原のすずしい気候で、しかも大都市に近いので、新鮮な牛乳を出荷できます。どちらの文も正しいです。"},
{"id":"I026","u":"水産業・畜産","lv":"応用","r":50,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 根釧台地では、1970年代にパイロットファームよりさらに大規模な新酪農村がつくられた。\nII 病気に感染した家畜の肉やたまごを食べると、人にも感染するといわれている。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"Iは正しい文です。感染した家畜の肉やたまごを食べても人に感染することはないといわれているので、IIはまちがいです。"},
{"id":"I027","u":"水産業・畜産","lv":"標準","r":64,"f":"資料の読み取り","q":"表は、いくつかの食料と家畜の飼料の自給率(2024年度)です。表から読み取れることとして正しいものはどれですか。","c":["鶏卵は、ほとんどを国内でまかなっている","牛乳・乳製品は、半分以上を輸入にたよっている","肉類の自給率は、飼料の自給率より低い","飼料は、半分以上を国内でまかなっている"],"e":"鶏卵は97%でほとんど国産です。牛乳・乳製品は63%なので輸入は半分未満、飼料は26%で約4分の3を輸入にたよっています。","tb":[["","肉類","牛乳・乳製品","鶏卵","飼料"],["自給率","53%","63%","97%","26%"]]},
{"id":"I028","u":"水産業・畜産","lv":"応用","r":52,"f":"資料の読み取り","q":"表は、主な家畜の飼育数(2024年)です。肉用牛の頭数は、乳用牛の頭数のおよそ何倍ですか。","c":["約2倍","約3倍","約半分","約7倍"],"e":"肉用牛267万頭÷乳用牛131万頭は約2倍です。牛の数をくらべるときは「乳用牛より肉用牛のほうが多い」と覚えておきましょう。","tb":[["家畜","飼育数"],["乳用牛","131万頭"],["肉用牛","267万頭"],["ぶた","880万頭"],["採卵鶏","1億6860万羽"],["肉用若鶏","1億4486万羽"]]},
{"id":"I029","u":"水産業・畜産","lv":"標準","r":60,"f":"資料の読み取り","q":"表は、ある家畜の飼育数が多い都道府県の1位〜3位です。採卵鶏にあてはまるものはどれですか。","c":["表のC","表のD","表のA","表のB"],"e":"千葉・茨城が上位なのは、大都市の近くで新鮮なたまごを出荷できる採卵鶏です。鹿児島・宮崎・岩手のDは肉用若鶏、Aは乳用牛、Bは肉用牛です。","tb":[["","1位","2位","3位"],["A","北海道","栃木県","熊本県"],["B","北海道","鹿児島県","宮崎県"],["C","千葉県","茨城県","鹿児島県"],["D","鹿児島県","宮崎県","岩手県"]]},
{"id":"I030","u":"水産業・畜産","lv":"基礎","r":76,"f":"資料の読み取り","q":"表は、牛ばら肉100gのねだん(2026年3月)です。国内産(和牛)のねだんは、オーストラリア産のおよそ何倍ですか。","c":["約3倍","約2倍","約5倍","約半分"],"e":"804円÷263円は約3倍です。輸入肉は国産より安いため、輸入がふえてきました。","tb":[["産地","ねだん(100g)"],["国内産(和牛)","804円"],["オーストラリア産","263円"]]},
{"id":"I031","u":"水産業・畜産","lv":"過去問型","r":40,"f":"資料の読み取り","q":"表は、5つの家畜の飼育数が多い都道府県の1位〜3位(2024年)です。5つの家畜のうち4つで3位以内に入っている県はどれですか。","c":["鹿児島県","北海道","宮崎県","千葉県"],"e":"鹿児島県は肉用牛2位・ぶた1位・採卵鶏3位・肉用若鶏1位の4つに入っています。北海道と宮崎県は3つずつです。","tb":[["家畜","1位","2位","3位"],["乳用牛","北海道","栃木県","熊本県"],["肉用牛","北海道","鹿児島県","宮崎県"],["ぶた","鹿児島県","北海道","宮崎県"],["採卵鶏","千葉県","茨城県","鹿児島県"],["肉用若鶏","鹿児島県","宮崎県","岩手県"]]},
{"id":"I032","u":"水産業・畜産","lv":"標準","r":64,"f":"記述のことば","q":"「根釧台地で酪農がさかんな理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["千島海流(親潮)・夏の濃霧・米作や畑作にむかない","日本海流(黒潮)・あたたかい・牧草がよく育つ","北西の季節風・大雪・水田が少ない","火山灰・水もちが悪い・さつまいも"],"e":"親潮のえいきょうで夏に濃霧が出て気温が上がらず、米作や畑作にむかないので、広い牧草地をいかした酪農が行われます。原因→結果のつながりを書くのが決め手です。"},
{"id":"I033","u":"水産業・畜産","lv":"標準","r":62,"f":"記述のことば","q":"「鹿児島県や宮崎県で畜産業がさかんな理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["火山灰・シラス台地・米作にむかない","あたたかい気候・早作り・ビニールハウス","大都市に近い・新鮮・すぐに出荷","千島海流(親潮)・濃霧・牧草地"],"e":"火山灰などにおおわれたシラス台地は米作にむかないので、畑作と畜産業が中心になりました。「早作り」は野菜づくりの工夫なので決め手になりません。"},
{"id":"I034","u":"水産業・畜産","lv":"応用","r":50,"f":"記述のことば","q":"「栃木県の那須で乳用牛の飼育がさかんな理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["高原のすずしい気候・大都市に近い・牛乳を新鮮なうちに出荷","耕地面積が広い・大規模経営・機械化","夏の濃霧・米作にむかない・広い牧草地","輸入飼料・とうもろこし・安い"],"e":"那須は高原ですずしく、東京などの大都市に近いので、とれたての牛乳を新鮮なうちに運べます。北海道や根釧台地の理由と区別しましょう。"},
{"id":"I035","u":"水産業・畜産","lv":"過去問型","r":42,"f":"記述のことば","q":"「日本の畜産物の本当の自給率は、数字よりもっと低い」といわれる理由を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["飼料(えさ)・約4分の3・輸入にたよる","牛肉・1991年・輸入の自由化","ブランド肉・ねだんが高い・品質が良い","あとつぎ・農家の数・へっている"],"e":"飼料の自給率は26%で約4分の3を輸入にたよっているため、輸入した飼料で育った家畜は本当の国産とはいいにくく、実際の自給率はもっと低いと考えられます。"},
{"id":"J001","u":"農業の特徴・自給率","lv":"基礎","r":86,"f":"知識","q":"せまい耕地からできるだけ多くの収穫をあげるため、たくさんの人手をかけたり肥料を多く使ったりする農業を何といいますか。","c":["集約農業","大農法","有機農法","近郊農業"],"e":"日本のようにせまい耕地に人手と肥料をつぎこむのが集約農業です。広い耕地で大型機械を使うアメリカの大農法と取りちがえないこと。"},
{"id":"J002","u":"農業の特徴・自給率","lv":"基礎","r":84,"f":"知識","q":"農家1けんあたりの耕地がとても広いアメリカで行われている、大型機械を利用した大規模な農業を何といいますか。","c":["大農法","集約農業","有機農法","輸送園芸農業"],"e":"アメリカは広い耕地でコンバインなど大型機械を使う大農法です。「大きい国=大農法」、「せまい日本=集約農業」とセットで覚えましょう。"},
{"id":"J003","u":"農業の特徴・自給率","lv":"標準","r":68,"f":"知識","q":"日本の農家1けんあたりの耕地面積(全国平均)はどれくらいですか。","c":["約3.7ha","約189ha","約37ha","約0.37ha"],"e":"日本はわずか約3.7haです。約189haはアメリカの数字なので取りちがえないこと。"},
{"id":"J004","u":"農業の特徴・自給率","lv":"基礎","r":82,"f":"知識","q":"化学肥料や農薬にたよらずに作物を育てる方法を何といいますか。","c":["有機農法","集約農業","大農法","早作り(促成栽培)"],"e":"化学肥料や農薬を使わず、たい肥などを使って育てるのが有機農法です。集約農業はむしろ肥料を多く使う農業です。"},
{"id":"J005","u":"農業の特徴・自給率","lv":"標準","r":70,"f":"知識","q":"有機農法では、田んぼにある鳥を放して雑草や害虫を食べてもらうことがあります。この鳥は何ですか。","c":["アイガモ","ニワトリ","ウズラ","ハト"],"e":"アイガモ農法では、アイガモが雑草や害虫を食べ、ふんは肥料にもなります。たい肥とともに有機農法の代表例です。"},
{"id":"J006","u":"農業の特徴・自給率","lv":"標準","r":66,"f":"知識","q":"有機農法で作られた農産物や食品につけられるマークはどれですか。","c":["有機JASマーク","JISマーク","エコマーク","特定保健用食品(トクホ)マーク"],"e":"有機農法で作られた食品には有機JASマークがつきます。JISマークは工業製品、エコマークは環境にやさしい商品のマークです。"},
{"id":"J007","u":"農業の特徴・自給率","lv":"標準","r":62,"f":"知識","q":"日本の農家の数は、1960年とくらべておよそどれくらいにへりましたか。","c":["約4分の1","約3分の2","約2分の1","約10分の1"],"e":"農家の数は約4分の1にへりました。約3分の2は耕地面積のへり方なので、取りちがえに注意。"},
{"id":"J008","u":"農業の特徴・自給率","lv":"基礎","r":78,"f":"知識","q":"主に農業で働く人のうち、65歳以上の人の割合(2025年)はおよそどれくらいですか。","c":["約7割","約3割","約5割","約9割"],"e":"2025年は70%で、高齢化が進んでいます。1990年は27%、2000年に51%と半分をこえました。"},
{"id":"J009","u":"農業の特徴・自給率","lv":"応用","r":50,"f":"知識","q":"農業経営体のうち「副業的経営体」とは、どのような経営体ですか。","c":["65歳未満の働き手がいない経営体","農業以外の収入が中心で、65歳未満の働き手がいる経営体","農業の収入が中心で、65歳未満の働き手がいる経営体","会社などの組織(団体)で農業を行う経営体"],"e":"副業的経営体は「65歳未満の働き手がいない」ものです。2つめは準主業経営体、3つめは主業経営体、4つめは団体経営体です。"},
{"id":"J010","u":"農業の特徴・自給率","lv":"応用","r":52,"f":"知識","q":"農業以外の収入が中心で、65歳未満の働き手がいる個人経営体を何といいますか。","c":["準主業経営体","主業経営体","副業的経営体","団体経営体"],"e":"収入の中心が農業以外でも、65歳未満の働き手がいれば準主業経営体です。65歳未満の働き手がいなければ副業的経営体になります。"},
{"id":"J011","u":"農業の特徴・自給率","lv":"標準","r":64,"f":"知識","q":"食料自給率の説明として正しいものはどれですか。","c":["国内での消費量のうち、国内で生産された量のしめる割合","国内で生産された量のうち、国内で消費された量のしめる割合","国内での消費量のうち、外国から輸入した量のしめる割合","国内で生産された量のうち、外国へ輸出した量のしめる割合"],"e":"自給率は「食べた量(消費量)のうち、国内で作った分が何%か」です。分母が消費量であることがポイントです。"},
{"id":"J012","u":"農業の特徴・自給率","lv":"標準","r":65,"f":"知識","q":"保冷車(冷蔵トラック)や冷蔵コンテナなどを使い、生鮮食品を低温に保ったまま産地から消費地まで届けるしくみを何といいますか。","c":["コールドチェーン","トレーサビリティ","フードマイレージ","地産地消"],"e":"コールドチェーンの発達で、いたみやすい野菜や果物も外国から輸入しやすくなりました。"},
{"id":"J013","u":"農業の特徴・自給率","lv":"標準","r":58,"f":"知識","q":"日本の肉類の輸入先(2024年)の第1位の国はどこですか。","c":["アメリカ","オーストラリア","タイ","ブラジル"],"e":"肉類の輸入先は1位アメリカ、2位タイ、3位オーストラリアです。大豆の1位もアメリカなので、あわせて覚えましょう。"},
{"id":"J014","u":"農業の特徴・自給率","lv":"標準","r":60,"f":"知識","q":"都道府県別の農業産出額(2024年)で、第1位の北海道に次ぐ第2位の県はどこですか。","c":["鹿児島県","茨城県","千葉県","青森県"],"e":"1位北海道(約1兆4817億円)、2位鹿児島県、3位茨城県、4位千葉県、5位青森県です。2位と3位の差は小さいので注意。"},
{"id":"J015","u":"農業の特徴・自給率","lv":"標準","r":60,"f":"まちがい探し","q":"日本の農業の特徴について説明した文として、ふさわしくないものはどれですか。","c":["耕地100haあたりの働き手の数は、アメリカより少ない","農家1けんあたりの耕地面積がとてもせまい","耕地1haあたりの化学肥料の使用量は、アメリカより多い","せまい耕地にたくさんの人手をかけている"],"e":"耕地100haあたりの働き手は日本47人、アメリカ1.7人で、日本の方がずっと多いです。人手も肥料も「日本の方が多い」と覚えましょう。"},
{"id":"J016","u":"農業の特徴・自給率","lv":"応用","r":48,"f":"まちがい探し","q":"アメリカの農業について説明した文として、ふさわしくないものはどれですか。","c":["耕地1haあたりの化学肥料の使用量は、日本より多い","数百haもある畑では、飛行機やヘリコプターで空から農薬をまく","コンバインなどの大型の農業用機械を使う","農家1けんあたりの耕地面積は約189haである"],"e":"化学肥料は日本170kg、アメリカ108kgで、日本の方が多いです。「アメリカは何でも多い」と思いこまないこと。"},

function tbl(q){if(!q.tb||!q.tb.length)return '';return `<div class="tbwrap"><table class="tb">${q.tb.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`}
const SAPIX={focus:['都道府県・都市','国土と気候','野菜・果物','麦・豆・工芸作物','農業の特徴・自給率','米づくり','関東・中部'],weak:[]};
const KIDWEAK=['政令指定都市の特徴(盆地にある・人口がいちばん多い・2つの海に面する県)','「ふさわしくないもの」や「2つの文の○×」で、小さなまちがいを見つける','取りちがえやすいペア(干拓とうめ立て、北西と南東、早作りとおそ作り、野菜の旬)','表や雨温図から都市を選ぶ','記述に入れるべき言葉(決め手の言葉)'];
const LEVELS=['基礎','標準','応用','過去問型'];
