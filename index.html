// 学習記録と追加問題:この端末のブラウザに保存し、Claude上ではアカウントにも保存
const KEY='shakai4-drill-v2';
let store={rec:{},extra:[],updated:0};
try{const v=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('shakai4-drill-v1')||'null');
  if(v){store=v.rec?{rec:v.rec,extra:v.extra||[],updated:v.updated||0}:{rec:v,extra:[],updated:0}}}catch(e){}
let docRef=null,saving=false,again=false,timer=null;
function save(){
  store.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
  if(docRef){clearTimeout(timer);timer=setTimeout(flush,1500)}
}
async function flush(){
  if(!docRef)return;if(saving){again=true;return}
  saving=true;
  try{await docRef.set({rec:store.rec,extra:store.extra,skip:store.skip,updated:store.updated})}
  catch(e){if(e&&e.code!=='unavailable')docRef=null}
  saving=false;if(again){again=false;flush()}
}
store.extra.forEach(fixUnit);if(!store.skip)store.skip={};
const allQ=()=>Q.concat(store.extra);
function R(id){return store.rec[id]||(store.rec[id]={n:0,ok:0,miss:0,streak:0,last:0})}

const skipped=q=>!!store.skip[q.id];
const inReview=q=>{const x=store.rec[q.id];return !skipped(q)&&x&&x.miss>0&&x.streak<2};
const unseen=q=>!store.rec[q.id]||!store.rec[q.id].n;
const priority=q=>{const x=store.rec[q.id]||{miss:1,streak:0};return q.r*(1+0.25*Math.min(x.miss-1,4))+(x.streak===1?-15:0)};
const reviewList=()=>allQ().filter(inReview).sort((a,b)=>priority(b)-priority(a));

function rateLabel(r){return r>=70?'ほぼ全員が正解':r>=55?'合格者は正解する':r>=40?'差がつく問題':'難問'}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let S={view:'home',units:new Set(UNITS.filter(u=>!NOT_YET.includes(u))),levels:new Set(LEVELS),forms:new Set(FORMS),count:10,set:[],i:0,picked:null,order:[],score:0,wrong:[],mode:'normal',confirmReset:false,
  ai:false,gen:{busy:false,msg:''},genUnit:'auto',confirmDel:false};
const app=document.getElementById('app');
const poolNow=()=>allQ().filter(q=>!skipped(q)&&S.units.has(q.u)&&S.levels.has(q.lv)&&S.forms.has(q.f||'知識'));

function buildSet(mode){
  if(mode==='review') return reviewList().slice(0,S.count);
  const pool=mode==='uon'?allQ().filter(q=>!skipped(q)&&isUon(q)):mode==='kion'?allQ().filter(q=>!skipped(q)&&q.kion):poolNow();
  const rv=pool.filter(inReview).sort((a,b)=>priority(b)-priority(a)).slice(0,Math.ceil(S.count*0.4));
  const others=pool.filter(q=>!rv.includes(q));
  // まだ解いていない問題を先に使う
  const rest=shuffle(others.filter(unseen)).concat(shuffle(others.filter(q=>!unseen(q)))).slice(0,S.count-rv.length);
  return shuffle(rv.concat(rest));
}
function start(mode){
  S.mode=mode;S.set=buildSet(mode);if(!S.set.length)return;
  S.i=0;S.score=0;S.wrong=[];S.view='quiz';S.autoDone=false;newQ();render();window.scrollTo(0,0);
}
function newQ(){S.picked=null;S.confirmDel=false;S.order=shuffle([0,1,2,3]);S.wasReview=inReview(S.set[S.i])}
function answer(k){
  if(S.picked!==null)return;
  const q=S.set[S.i];S.picked=k;const ok=S.order[k]===q.a;const x=R(q.id);
  x.n++;x.last=Date.now();
  if(ok){x.ok++;x.streak=x.miss>0?x.streak+1:2;S.score++}else{x.miss++;x.streak=0;S.wrong.push(q)}
  save();render();
  const nb=document.getElementById('next');if(nb)nb.focus({preventScroll:true});
}
function next(){
  if(S.i<S.set.length-1){S.i++;newQ();render()}
  else{S.view='result';render();autoGenerate()}
  window.scrollTo(0,0);
}
function skipCurrent(){
  const q=S.set[S.i];store.skip[q.id]=Date.now();save();
  S.set.splice(S.i,1);
  if(!S.set.length){S.view=S.score||S.wrong.length?'result':'home';render();return}
  if(S.i>=S.set.length){S.view='result';render();return}
  newQ();render();
}
function deleteCurrent(){
  const q=S.set[S.i];
  store.extra=store.extra.filter(x=>x.id!==q.id);delete store.rec[q.id];save();
  S.set.splice(S.i,1);
  if(!S.set.length){S.view='home';render();return}
  if(S.i>=S.set.length){S.view='result';render();return}
  newQ();render();
}

// ---- AIで問題をつくる ----
let sampleFn=null;
function weakestUnit(){
  const units=[...S.units];if(!units.length)return UNITS[0];
  return units.map(u=>{
    const qs=allQ().filter(q=>q.u===u&&S.levels.has(q.lv));
    const left=qs.filter(unseen).length;
    let n=0,ok=0;qs.forEach(q=>{const x=store.rec[q.id];if(x){n+=x.n;ok+=x.ok}});
    const gap=n?(ok/n*100)-qs.reduce((s,q)=>s+q.r,0)/Math.max(qs.length,1):0;
    return{u,score:left*10+gap-(SAPIX.focus.includes(u)?40:0)};
  }).sort((a,b)=>a.score-b.score)[0].u;
}
function buildPrompt(unit,levels,n){
  const existing=allQ().filter(q=>q.u===unit).map(q=>'・'+q.q).slice(-90).join('\n');
  const lvText=levels.map(l=>`${l}(予測正答率${RANGE[l][0]}〜${RANGE[l][1]}%)`).join('、');
  return `あなたは難関中学受験塾の社会科講師です。小学4年生向けに、単元「${unit}」の4択問題を${n}問作ってください。

条件:
- 難易度は次から選び、まんべんなく混ぜる:${lvText}。「過去問型」は難関中学の入試でよく問われる形式(理由を問う、組み合わせ、資料の読み取りの文章化など)のオリジナル問題。
- 小4の塾カリキュラムで習う範囲。事実は教科書・塾テキストで定番の、確実に正しいものだけを使う。年によって順位が入れかわる統計や、最近変わった可能性のある数値は使わない。
- 正解は1つだけ。誤りの選択肢3つは、まぎらわしいが明らかに誤りのもの。
- 小4が読める表記(むずかしい漢字はひらがな)。問題文は1〜2文。解説は1〜2文で、覚え方や関連知識を入れる。
- 次の内容はまだ習っていないので、似た内容も出さない:
${allQ().filter(skipped).slice(-30).map(q=>'・'+q.q).join('\n')||'(なし)'}
- 問われ方を混ぜる:「ふさわしくないもの」を選ぶ問題、2つの文(I・II)の正誤の組み合わせ、表や数字の読み取り、記述に入れるべき言葉の組み合わせを選ぶ問題。2つの文の正誤では、誤りの文は一部の語句(北西⇔南東、干拓⇔うめ立てなど)だけを入れかえる。
- 次の既存の問題と同じ内容は出さない:
${existing}

出力はJSON配列のみ。形式:
[{"lv":"標準","r":62,"q":"問題文","correct":"正解の選択肢","wrong":["誤答1","誤答2","誤答3"],"e":"解説"}]
lvは「基礎」「標準」「応用」「過去問型」のどれか。rは難関校志望の小4生の予測正答率(整数)。`;
}
function addGenerated(arr,unit){
  if(!Array.isArray(arr))return 0;
  const seen=new Set(allQ().map(q=>q.q.replace(/\s/g,'')));
  let k=0;
  arr.forEach((g,i)=>{
    if(!g||typeof g.q!=='string'||typeof g.correct!=='string'||!Array.isArray(g.wrong))return;
    const wrong=g.wrong.filter(w=>typeof w==='string'&&w.trim()&&w!==g.correct).slice(0,3);
    if(wrong.length<3||new Set(wrong).size<3)return;
    const lv=LEVELS.includes(g.lv)?g.lv:'標準';
    const key=g.q.replace(/\s/g,'');if(seen.has(key))return;seen.add(key);
    let r=Math.round(+g.r);if(!(r>0))r=Math.round((RANGE[lv][0]+RANGE[lv][1])/2);
    r=Math.max(RANGE[lv][0],Math.min(RANGE[lv][1],r));
    store.extra.push({id:'ai'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5),u:unit,lv,r,
      q:g.q.trim(),c:[g.correct.trim(),...wrong.map(w=>w.trim())],e:typeof g.e==='string'?g.e.trim():'',a:0,ai:1,t:Date.now()});
    k++;
  });
  if(store.extra.length>800)store.extra=store.extra.slice(-800);
  if(k)save();
  return k;
}
async function generate(unit,auto){
  if(!sampleFn||S.gen.busy)return;
  const levels=S.levels.size?[...S.levels]:LEVELS;
  S.gen={busy:true,msg:`${auto?'問題が少なくなったので、':''}「${unit}」の新しい問題を作っています。30秒〜1分ほどかかります。`};render();
  try{
    const arr=await sampleFn.json(buildPrompt(unit,levels,8),{modelTier:'default',cache:false});
    const k=addGenerated(arr,unit);
    S.gen={busy:false,msg:k?`「${unit}」に新しい問題を${k}問追加しました。次のスタートから出題されます。`:'問題をうまく作れませんでした。もう一度ためしてください。'};
  }catch(e){
    const c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){S.ai=false;S.gen={busy:false,msg:''}}
    else if(c==='rate_limited')S.gen={busy:false,msg:'いまは問題を作れません。しばらく時間をおいてからためしてください。'};
    else if(c==='session_expired')S.gen={busy:false,msg:'Claudeにもう一度ログインしてから、ためしてください。'};
    else S.gen={busy:false,msg:'問題をうまく作れませんでした。もう一度ためしてください。'};
  }
  render();
}
function autoGenerate(){
  // 問題を解き終えたとき、まだ解いていない問題が少なければ自動で追加

  S.autoDone=true;
  if(poolNow().filter(unseen).length<Math.max(S.count,10))generate(weakestUnit(),true);
}

  return `
  <section class="card">
    <div class="qhead"><span class="prog">${S.mode==='review'?'復習 ':''}${S.i+1} / ${S.set.length}問</span><button class="btn ghost" data-act="home" style="padding:6px 12px;font-size:14px">やめる</button></div>
    <div class="pbar"><i style="width:${(S.i+(done?1:0))/S.set.length*100}%"></i></div>
    <div class="meta"><span class="lv lv-${q.lv}">${q.lv}</span><span>${q.u}</span>${q.f&&q.f!=='知識'?`<span class="ftag">${q.f}</span>`:''}${q.ai?'<span class="ai-tag">AI作成</span>':''}${S.wasReview?'<span class="review-tag">復習</span>':''}</div>
    <div class="rate">予測正答率 <b>${q.r}%</b><div class="track"><div class="fill" style="width:${q.r}%"></div></div><span>${rateLabel(q.r)}</span></div>
    <div class="qtext">${qhtml(q.q)}</div>${uzhtml(q)}${tbl(q)}
    <div class="choices">${S.order.map((ci,k)=>{
      let cls='';if(done){if(ci===q.a)cls='ok';else if(k===S.picked)cls='ng'}
      return `<button class="choice ${cls}" data-pick="${k}" ${done?'disabled':''}><span class="k">${'アイウエ'[k]}</span><span>${esc(q.c[ci])}</span></button>`}).join('')}</div>
    ${done?'':`<div class="skiprow"><button class="btn ghost small" data-act="skip">まだ習っていない</button><span class="note">この問題をとばして、出題しないようにします</span></div>`}
    ${done?`<div class="fb ${ok?'ok':'ng'}">
      <div class="mark">${ok?'○ 正解':'× ざんねん'}</div>
      ${ok?'':`<p><b>正解:${esc(q.c[q.a])}</b></p>`}
      <p>${esc(q.e)}</p>
      ${!ok&&q.r>=55?`<div class="alert">合格する人の多くが正解する問題です。復習リストの上位に入れました。</div>`:''}
      ${ok&&S.wasReview?`<p class="note">${R(q.id).streak>=2?'2回連続正解。復習リストから外しました。':'あと1回正解で復習リストから外れます。'}</p>`:''}
      <div class="row"><button class="btn" id="next" data-act="next">${S.i<S.set.length-1?'次の問題へ':'結果を見る'}</button></div>
      ${q.ai?(S.confirmDel?`<div class="confirm" style="margin-top:10px">この問題を削除しますか?<button class="btn alt" data-act="del-yes">削除する</button><button class="btn ghost" data-act="del-no">やめる</button></div>`
        :`<p class="note"><button class="linkbtn" data-act="del">内容がおかしいので、この問題を削除する</button></p>`):''}
    </div>`:''}
  </section>`;
}

function result(){
  const pct=Math.round(S.score/S.set.length*100);
  const exp=Math.round(S.set.reduce((s,q)=>s+q.r,0)/S.set.length);
  return `
  <section class="card">
    <h2>結果</h2>
    <div class="big">${S.score}<small> / ${S.set.length}問</small></div>
    <p>正答率 <b>${pct}%</b>(この問題セットの予測正答率 ${exp}%)。${pct>=exp?'合格ラインを上回っています。':'予測を下回りました。まちがえた問題を復習しよう。'}</p>
    ${genStatus()}
    <div class="row"><button class="btn alt" data-act="review" ${reviewList().length?'':'disabled'}>すぐ復習する</button><button class="btn" data-act="again">続けて解く</button><button class="btn ghost" data-act="home">ホームへ</button></div>
  </section>
  ${S.wrong.length?`<section class="card"><h2>まちがえた問題</h2><div class="list">${S.wrong.map(itemHtml).join('')}</div></section>`:''}`;
}
function itemHtml(q){
  const x=store.rec[q.id]||{miss:0,streak:0};
  return `<div class="item"><div class="m"><span class="lv lv-${q.lv}">${q.lv}</span><span>${q.u}</span>${q.ai?'<span class="ai-tag">AI作成</span>':''}<span>予測正答率 ${q.r}%</span><span>ミス ${x.miss}回</span>${q.r>=55?'<span class="pri">落とせない</span>':''}</div>
  <div class="q">${qhtml(q.q)}</div>${uzhtml(q)}${tbl(q)}<div class="a">正解:${esc(q.c[q.a])}</div><div class="note" style="margin-top:4px">${esc(q.e)}</div></div>`;
}
function list(){
  const rl=reviewList();
  return `<section class="card">
    <div class="qhead"><h2 style="margin:0">復習リスト(${rl.length}問)</h2><button class="btn ghost" data-act="home" style="padding:6px 12px;font-size:14px">ホームへ</button></div>
    <p class="note">優先度の高い順。予測正答率が高く、ミスが多い問題ほど上に来ます。</p>
    ${rl.length?`<div class="list">${rl.map(itemHtml).join('')}</div><div class="row"><button class="btn alt" data-act="review">この順で復習する</button></div>`:'<p class="empty">復習待ちの問題はありません。</p>'}
  </section>`;
}

function skips(){
  const qs=allQ().filter(skipped);
  const by=UNITS.map(u=>[u,qs.filter(q=>q.u===u)]).filter(x=>x[1].length);
  return `<section class="card">
    <div class="qhead"><h2 style="margin:0">まだ習っていない問題(${qs.length}問)</h2><button class="btn ghost" data-act="home" style="padding:6px 12px;font-size:14px">ホームへ</button></div>
    <p class="note">授業で習ったら「習った」を押すと、また出題されるようになります。</p>
    ${qs.length?by.map(([u,l])=>`<h3>${u}(${l.length}問)<button class="linkbtn" data-unskipunit="${u}" style="margin-left:10px">この単元をすべて戻す</button></h3><div class="list">${l.map(q=>`<div class="item"><div class="m"><span class="lv lv-${q.lv}">${q.lv}</span><span>予測正答率 ${q.r}%</span></div><div class="q">${esc(q.q)}</div><div class="row" style="margin-top:6px"><button class="btn ghost small" data-unskip="${q.id}" style="flex:0 0 auto">習った</button></div></div>`).join('')}</div>`).join(''):'<p class="empty">ありません。</p>'}
  </section>`;
}
function render(){
  app.innerHTML=S.view==='home'?home():S.view==='quiz'?quiz():S.view==='result'?result():S.view==='skips'?skips():list();
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.unit){const u=b.dataset.unit;S.units.has(u)?S.units.delete(u):S.units.add(u);render();return}
  if(b.dataset.level){const l=b.dataset.level;S.levels.has(l)?S.levels.delete(l):S.levels.add(l);render();return}
  if(b.dataset.form){const f=b.dataset.form;S.forms.has(f)?S.forms.delete(f):S.forms.add(f);render();return}
  if(b.dataset.count){S.count=+b.dataset.count;render();return}
  if(b.dataset.gen){S.genUnit=b.dataset.gen;render();return}
  if(b.dataset.pick!==undefined){answer(+b.dataset.pick);return}
  if(b.dataset.unskip){delete store.skip[b.dataset.unskip];save();render();return}
  if(b.dataset.unskipunit){allQ().filter(q=>q.u===b.dataset.unskipunit).forEach(q=>delete store.skip[q.id]);save();render();return}
  const a=b.dataset.act;
  if(a==='start')start('normal');
  else if(a==='review')start('review');
  else if(a==='uon')start('uon');
  else if(a==='kion')start('kion');
  else if(a==='again')start(S.mode==='uon'||S.mode==='kion'?S.mode:'normal');
  else if(a==='focus'){S.units=new Set(SAPIX.focus);S.levels=new Set(LEVELS);S.forms=new Set(FORMS);start('normal')}
  else if(a==='focusform'){S.units=new Set(UNITS);S.levels=new Set(LEVELS);S.forms=new Set(FORMS.filter(f=>f!=='知識'));start('normal')}
  else if(a==='next')next();
  else if(a==='gen')generate(S.genUnit==='auto'?weakestUnit():S.genUnit,false);
  else if(a==='skip')skipCurrent();
  else if(a==='skips'){S.view='skips';render();window.scrollTo(0,0)}
  else if(a==='del'){S.confirmDel=true;render()}
  else if(a==='del-no'){S.confirmDel=false;render()}
  else if(a==='del-yes')deleteCurrent();
  else if(a==='list'){S.view='list';render();window.scrollTo(0,0)}
  else if(a==='home'){S.view='home';render();window.scrollTo(0,0)}
  else if(a==='reset'){S.confirmReset=true;render()}
  else if(a==='reset-no'){S.confirmReset=false;render()}
  else if(a==='reset-yes'){store.rec={};save();S.confirmReset=false;render()}
});
render();

// Claude上で開いたとき:AIの問題作成とアカウントへの保存を有効にする
(async()=>{
  if(!window.claude||!claude.use)return;
  try{sampleFn=await claude.use('sample');if(sampleFn){S.ai=true;render()}}catch(e){}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/drill');
    const snap=await ref.get();
    docRef=ref;
    const v=snap.exists?snap.data():null;
    if(v&&(v.updated||0)>(store.updated||0)){
      store={rec:v.rec||{},extra:Array.isArray(v.extra)?v.extra.map(fixUnit):[],skip:v.skip||{},updated:v.updated};
      try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
      if(S.view!=='quiz')render();
    }else if(store.updated){flush()}
  }catch(e){docRef=null}
})();
</script>
