<title>小4社会 合格ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 地図帳のような紙面:等高線の帯、海の青と赤ペンの丸つけ。1カラムのアプリ */
:root{
  --paper:#F4F7F3; --surface:#FFFFFF; --ink:#1E3240; --muted:#5E7180; --line:#D5DED8;
  --sea:#2A6C96; --sea-soft:#E3EEF5; --land:#4F8443; --land-soft:#E5F0E0;
  --red:#CF412C; --red-soft:#FBE6E2; --gold:#B8860B; --gold-soft:#FBF1D9;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11181D; --surface:#1A242B; --ink:#E3ECEA; --muted:#9AAEB8; --line:#2C3A43;
  --sea:#6EB0DB; --sea-soft:#1C3242; --land:#8CC274; --land-soft:#1E3324;
  --red:#F0806C; --red-soft:#3A2220; --gold:#E2B64A; --gold-soft:#36301C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181D; --surface:#1A242B; --ink:#E3ECEA; --muted:#9AAEB8; --line:#2C3A43;
  --sea:#6EB0DB; --sea-soft:#1C3242; --land:#8CC274; --land-soft:#1E3324;
  --red:#F0806C; --red-soft:#3A2220; --gold:#E2B64A; --gold-soft:#36301C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:relative;border-radius:18px;padding:22px 22px 18px;overflow:hidden;background:var(--sea-soft);border:1px solid var(--line)}
header.top::before{content:"";position:absolute;inset:-40% -20% auto auto;width:360px;height:360px;border-radius:50%;
  background:repeating-radial-gradient(circle at center,transparent 0 13px,var(--sea) 13px 14px);opacity:.14;pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--sea);font-weight:700}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,6vw,34px);line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0;max-width:52ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;position:relative}
.stat{background:var(--surface);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.stat.warn b{color:var(--red)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
h2{font-family:var(--display);font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:13px;color:var(--muted);margin:14px 0 8px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--surface);font-weight:700}
.chip:focus-visible,.btn:focus-visible,.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:none;border-radius:12px;padding:13px 18px;cursor:pointer;background:var(--sea);color:var(--surface);font-size:16px}
.btn.alt{background:var(--red)}
.btn.ghost{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1 1 200px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.lv{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.lv-基礎{background:var(--land-soft);color:var(--land)}
.lv-標準{background:var(--sea-soft);color:var(--sea)}
.lv-応用{background:var(--gold-soft);color:var(--gold)}
.lv-過去問型{background:var(--red-soft);color:var(--red)}
.unitbars{display:grid;gap:8px}
.ub{display:grid;grid-template-columns:5.5em 1fr 6.5em;gap:10px;align-items:center;font-size:14px}
.track{height:10px;background:var(--paper);border-radius:6px;position:relative;border:1px solid var(--line)}
.fill{position:absolute;inset:0 auto 0 0;background:var(--land);border-radius:6px}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.ub .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.pbar{height:6px;background:var(--line);border-radius:4px;margin:10px 0 16px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sea);transition:width .3s}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rate{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:13px}
.rate .track{flex:1;max-width:220px}
.rate .fill{background:var(--gold)}
.rate b{font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink)}
.qtext{font-size:18px;font-weight:700;margin:14px 0 16px;line-height:1.75}
.choices{display:grid;gap:10px}
.choice{text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.choice .k{font-family:var(--display);font-weight:900;color:var(--sea);min-width:1.2em}
.choice:hover:not(:disabled){border-color:var(--sea)}
.choice:disabled{cursor:default}
.choice.ok{border-color:var(--land);background:var(--land-soft)}
.choice.ng{border-color:var(--red);background:var(--red-soft)}
.fb{margin-top:16px;border-radius:12px;padding:14px;border:1.5px solid var(--line)}
.fb .mark{font-family:var(--display);font-weight:900;font-size:22px}
.fb.ok .mark{color:var(--land)} .fb.ng .mark{color:var(--red)}
.fb p{margin:6px 0 0}
.alert{margin-top:10px;background:var(--red-soft);color:var(--red);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700}
.review-tag{background:var(--red);color:var(--surface);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
/* lists */
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.item .q{font-weight:700;margin:4px 0}
.item .a{font-size:14px;color:var(--land);font-weight:700}
.item .m{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pri{font-family:var(--display);font-weight:900;color:var(--red);font-size:13px}
.big{font-family:var(--display);font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (max-width:460px){.stats{grid-template-columns:repeat(3,1fr);gap:6px}.stat b{font-size:20px}}
.ai-tag{background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
.gen{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--sea-soft);color:var(--ink);font-size:14px}
.gen.busy{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
.ub small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.chartbox{overflow-x:auto}
svg.dev{width:100%;max-width:520px;height:auto;display:block}
svg.dev .g{stroke:var(--line);stroke-width:1}
svg.dev .ax{fill:var(--muted);font-size:10px;font-family:var(--body)}
svg.dev .v{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--body)}
svg.dev .ln{fill:none;stroke:var(--sea);stroke-width:2.5}
svg.dev .d{fill:var(--sea)} svg.dev .dl{fill:var(--red)}
ul.weak{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:15px}
details.parts{margin-top:14px} details.parts summary{cursor:pointer;color:var(--sea);font-weight:700;font-size:14px}
.chip .yet{margin-left:6px;font-size:10px;color:var(--gold)}
.chip[aria-pressed="true"] .yet{color:inherit}
.ub{grid-template-columns:7.5em 1fr 7.5em}
@media (max-width:460px){.ub{grid-template-columns:6em 1fr 6.4em;font-size:13px}}
.skiprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn.small{padding:7px 12px;font-size:14px}
.ftag{background:var(--sea-soft);color:var(--sea);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
.chip .fnote{display:block;font-size:10px;font-weight:400;opacity:.8;line-height:1.3}
.tbwrap{overflow-x:auto;margin:-4px 0 16px}
table.tb{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%}
table.tb th,table.tb td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
table.tb th{background:var(--paper);font-weight:700}
.item .tbwrap{margin:6px 0}
.uzgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 6px}
.uzgrid.n1{grid-template-columns:minmax(0,320px)}
.uz{margin:0;border:1px solid var(--line);border-radius:10px;padding:6px 6px 4px;background:var(--surface)}
.uz figcaption{font-weight:700;font-size:14px;text-align:center}
.uz svg{width:100%;height:auto;display:block}
.uz .g{stroke:var(--line);stroke-width:.6}.uz .z{stroke:var(--muted);stroke-width:.8}
.uz .bar{fill:var(--sea);opacity:.55}.uz .ln{fill:none;stroke:var(--red);stroke-width:1.8}.uz .dot{fill:var(--red)}
.uz .ax{fill:var(--muted);font-size:12px;font-family:var(--body)}
.uzsum{font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.uzkey{font-size:11px;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.uznum{margin:-6px 0 14px;font-size:13px}.uznum summary{cursor:pointer;color:var(--sea);font-weight:700}.uznum .tbwrap{margin:6px 0 0}
.uzkey .kb{display:inline-block;width:12px;height:10px;background:var(--sea);opacity:.55}
.uzkey .kl{display:inline-block;width:14px;height:2px;background:var(--red);margin-left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
// 問題データ:a は正解の選択肢番号(表示時にシャッフル)/ r は予測正答率(難関校志望の小4生を想定した目安)
const Q=[{"id":"A001","u":"米づくり","lv":"基礎","r":80,"f":"知識","q":"米づくりの作業で、「苗作り」のあとに続く正しい順番はどれですか。","c":["田おこし→しろかき→田植え→稲刈り・脱穀","しろかき→田おこし→田植え→稲刈り・脱穀","田おこし→田植え→しろかき→稲刈り・脱穀","田植え→田おこし→しろかき→稲刈り・脱穀"],"e":"かたくなった土をほり起こす田おこしのあと、水を入れて土をかきまぜ平らにするしろかきをし、それから田植えをします。「おこす→かく→植える」と覚えましょう。"},
{"id":"A002","u":"米づくり","lv":"基礎","r":86,"f":"知識","q":"稲の刈り取りと、穂からもみを取り外す脱穀を同時に行う機械はどれですか。","c":["コンバイン","トラクター","田植え機","カントリーエレベーター"],"e":"コンバインは稲刈りと脱穀を同時に行います。トラクターは田おこし・しろかき、カントリーエレベーターはもみのかんそう・貯蔵・もみすりをする大型の施設です。"},
{"id":"A003","u":"米づくり","lv":"応用","r":50,"f":"知識","q":"江戸時代に使われた農具で、脱穀が終わったあとの米つぶともみがらを、内部で風を起こして分けるものはどれですか。","c":["唐箕","千歯こき","備中ぐわ","石包丁"],"e":"唐箕は風でもみがらやごみを飛ばして選別する道具です。千歯こきは脱穀、備中ぐわは土を深く耕す道具、石包丁は約2000年前に稲の穂をつみとった道具です。"},
{"id":"A004","u":"米づくり","lv":"過去問型","r":42,"f":"まちがい探し","q":"江戸時代の農具とその使いみちの組み合わせとして、まちがっているものはどれですか。","c":["千歯こき―田の土を深く耕す","備中ぐわ―田の土を深く耕す","唐箕―もみがらやごみを風で飛ばして分ける","千歯こき―刈り取った稲の穂からもみを取る"],"e":"千歯こきは鉄の歯の間に稲の穂を通してもみを取る脱穀の道具です。土を深く耕すのは歯先が分かれた備中ぐわです。「千歯=脱穀、唐箕=選別、備中ぐわ=耕す」とセットで覚えましょう。"},
{"id":"A005","u":"米づくり","lv":"標準","r":60,"f":"まちがい探し","q":"米づくりの「中干し」について説明した文として、ふさわしくないものはどれですか。","c":["田植えの前に、田に水を入れて土と水をかきまぜ、平らにする作業である","稲が育っている夏に、田の水をいったんぬいて土をかわかす作業である","雑草がふえるのをふせぎ、稲の根を強くするのに役立つ","地面が固まるので、稲刈りのときに機械がのめりこみにくくなる"],"e":"田植えの前に土と水をかきまぜるのは「しろかき」です。中干しは稲が育つ夏に水をぬいて土をかわかし、根を強くし地面を固める作業です。"},
{"id":"A006","u":"米づくり","lv":"標準","r":62,"f":"資料の読み取り","q":"表は、米作り(10aあたり)にかかる時間の変化です。1960年とくらべて、2024年の時間はおよそ何分の1になっていますか。","c":["約9分の1","約3分の1","約5分の1","約20分の1"],"e":"174÷20=8.7なので、約9分の1です。牛や馬・人の手で行っていた作業が、トラクター・田植え機・コンバインなどの機械化で大きく短くなりました。","tb":[["年","1960年","1980年","2024年"],["時間","174時間","64時間","20時間"]]},
{"id":"A007","u":"米づくり","lv":"基礎","r":82,"f":"知識","q":"石狩平野では、栄養分の少ない泥炭地を改良するため、よそから質の良い土を運び入れました。この工夫を何といいますか。","c":["客土","暗渠排水","干拓","分水路"],"e":"よそから良い土を運び入れるのは客土です。石狩平野では客土と、よぶんな水をぬく暗渠排水の両方が行われ、北海道を代表する米どころになりました。"},
{"id":"A008","u":"米づくり","lv":"標準","r":64,"f":"知識","q":"「暗渠排水」の説明として正しいものはどれですか。","c":["水田の地下に穴のあいた管を通し、地中のよぶんな水を排水路へ流す","川の流れを2つに分け、洪水をふせぐ","浅い海や湖を堤防でしきり、内側の水をぬいて陸地をつくる","川や湖から水を引き、水不足の田畑に送る"],"e":"暗渠とは地下につくられた水路のことで、水はけの悪い土地を改良します(石狩平野・越後平野)。洪水をふせぐのは分水路、陸地をつくるのは干拓、水を送るのは用水です。"},
{"id":"A009","u":"米づくり","lv":"標準","r":58,"f":"まちがい探し","q":"米作りの工夫と、それが行われた主な場所の組み合わせとして、まちがっているものはどれですか。","c":["干拓―石狩平野","分水路―越後平野","用水―讃岐平野","客土―石狩平野"],"e":"干拓が行われたのは八郎潟・児島湾・有明海です。石狩平野は客土と暗渠排水、越後平野は大河津分水路と暗渠排水、讃岐平野は香川用水です。"},
{"id":"A010","u":"米づくり","lv":"標準","r":60,"f":"知識","q":"雨が少ない讃岐平野に水を送っている香川用水は、どの川から水を引いていますか。","c":["吉野川","四万十川","仁淀川","筑後川"],"e":"香川用水は四国山地をトンネルでぬけて、徳島県を流れる吉野川から讃岐平野へ水を引いています。四万十川・仁淀川は高知県、筑後川は九州の川です。"},
{"id":"A011","u":"米づくり","lv":"過去問型","r":40,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 八郎潟は、かつて日本で2番目に大きい湖だったが、うめ立てによってほとんどが陸地になった。\nII 有明海は遠浅で潮の満ち干の差が大きく、古くから干拓が行われてきた。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"八郎潟は堤防でしきって内側の水をぬいた「干拓」なのでIはまちがいです。土砂を運び入れて陸地をつくるのが「うめ立て」で、水をぬくのが「干拓」です。"},
{"id":"A012","u":"米づくり","lv":"標準","r":62,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 干拓は、浅い海や湖を堤防でしきり、内側の水をぬき取って陸地をつくる方法である。\nII 岡山県の児島湾では、古くから干拓が行われてきた。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"どちらも正しい文です。干拓地は八郎潟(秋田県)・児島湾(岡山県)・有明海(九州)をセットで覚えましょう。"},
{"id":"A013","u":"米づくり","lv":"基礎","r":85,"f":"知識","q":"東北地方の太平洋側で夏に吹き、冷害の原因となることがある、冷たくしめった風を何といいますか。","c":["やませ","からっ風","南東の季節風","北西の季節風"],"e":"やませは千島海流(親潮)の上を通ってくる、冷たくしめった北東の風です。夏の気温が上がらず、稲が育たない冷害を起こすことがあります。"},
{"id":"A014","u":"米づくり","lv":"過去問型","r":40,"f":"知識","q":"やませは北東から吹いてくる風です。では、やませが吹いていく(向かっていく)方角はどれですか。","c":["南西","北東","北西","南東"],"e":"北東から吹いてくる風は、南西へ向かって吹いていきます。「吹いてくる方角」と「吹いていく方角」は反対になるので、問題文をよく読みましょう。"},
{"id":"A015","u":"米づくり","lv":"標準","r":56,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI やませは千島海流(親潮)の上を通ってくるため、冷たくしめっている。\nII 1993年の冷害では、夏の気温が上がらず、日照時間が長すぎたため稲が十分に育たなかった。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"1993年は夏の気温が上がらず長雨で、日照時間が「不足した」ため凶作になりました。IIの「長すぎた」がまちがいです。"},
{"id":"A016","u":"米づくり","lv":"基礎","r":84,"f":"知識","q":"日本でもっとも多く作られ、米の作付面積のおよそ3分の1をしめる品種はどれですか。","c":["コシヒカリ","ひとめぼれ","ヒノヒカリ","あきたこまち"],"e":"コシヒカリは新潟県で交配され、福井県で品種として育てられた米で、作付面積の約3分の1をしめます。ひとめぼれは宮城県など、ヒノヒカリは九州など西日本で多く作られます。"},
{"id":"A017","u":"米づくり","lv":"応用","r":50,"f":"まちがい探し","q":"米の品種について説明した文として、まちがっているものはどれですか。","c":["ササニシキは寒さに強く、1993年の冷害でもほとんど被害を受けなかった","コシヒカリはイモチ病にかかりやすく、たけが長いのでたおれやすい","ひとめぼれは、宮城県などで多く作られている","ササニシキはさっぱりした味でねばり気が少なく、和食に合うといわれる"],"e":"ササニシキは寒さに弱く、1993年の冷害でぜんめつに近い被害を受け、作る農家が大きくへりました。今の宮城県ではひとめぼれが多く作られています。"},
{"id":"A018","u":"米づくり","lv":"応用","r":50,"f":"記述のことば","q":"「宮城県でササニシキを作る農家が大きくへった理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["寒さに弱い・1993年・冷害","ねばり気が少ない・和食・さっぱり","イモチ病・たおれやすい・たけが長い","食生活の多様化・消費量・へった"],"e":"決め手は「寒さに弱いので、1993年の冷害で大きな被害を受けた」ことです。イモチ病・たおれやすいはコシヒカリの弱点なので取りちがえないようにしましょう。"},
{"id":"A019","u":"米づくり","lv":"標準","r":70,"f":"知識","q":"1940年代、戦争中の食料不足の中でつくられた、農家が作った米をすべて政府が買い取るしくみを何といいますか。","c":["食糧管理制度","減反政策","自主流通米","生産緑地"],"e":"食糧管理制度では、米は農協などを通ってすべて政府が買い取りました。米があまるようになった1970年ごろに、政府を通さない自主流通米がみとめられました。"},
{"id":"A020","u":"米づくり","lv":"応用","r":48,"f":"知識","q":"米をめぐる制度の移り変わりを古い順にならべたものとして正しいものはどれですか。","c":["食糧管理制度ができる→自主流通米がみとめられる→食糧管理制度が廃止される→政府が中心の減反政策がなくなる","自主流通米がみとめられる→食糧管理制度ができる→食糧管理制度が廃止される→政府が中心の減反政策がなくなる","食糧管理制度ができる→食糧管理制度が廃止される→自主流通米がみとめられる→政府が中心の減反政策がなくなる","食糧管理制度ができる→自主流通米がみとめられる→政府が中心の減反政策がなくなる→食糧管理制度が廃止される"],"e":"1940年代に食糧管理制度、1970年ごろ自主流通米と減反開始、1995年に食糧管理制度廃止、2018年に政府中心の減反がなくなりました。今は政府は備蓄米を買い取るだけです。"},
{"id":"A021","u":"米づくり","lv":"標準","r":68,"f":"知識","q":"減反政策(生産調整)の方法のうち、「転作」の説明として正しいものはどれですか。","c":["田を畑などに変え、米以外の作物を作る","田で作物を作ることをいったんやめる","稲が実る前の、まだ青いうちに刈り取る","田畑の形を整え、農道や用水路を整備する"],"e":"転作=ほかの作物に転じる、休耕=耕すのを休む、青刈り=青いうちに刈る、です。田畑の形を整えるのは耕地整理で、減反の方法ではありません。"},
{"id":"A022","u":"米づくり","lv":"応用","r":48,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 休耕とは、田を畑に変えて米以外の作物を作ることである。\nII 田を畑に変えて大豆などを作ることを、耕地整理という。","c":["Iも IIもまちがっている","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい"],"e":"田を畑に変えて米以外を作るのは「転作」なので、IもIIもまちがいです。休耕は作物を作るのをいったんやめること、耕地整理は田畑の形を整えることです。"},
{"id":"A023","u":"米づくり","lv":"標準","r":56,"f":"記述のことば","q":"「1970年ごろから減反政策が始まった理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["食生活の多様化・米の消費量がへった・米があまった","冷害・米の生産量がへった・輸入","農業機械・作業時間・短くなった","食糧管理制度・政府・買い取る"],"e":"パンや肉など食生活が多様化(洋風化)して米を食べる量がへり、米があまったことが決め手です。「政府が買い取る」だけでは、なぜ減らすのかの理由になりません。"},
{"id":"A024","u":"米づくり","lv":"標準","r":58,"f":"まちがい探し","q":"備蓄米について説明した文として、ふさわしくないものはどれですか。","c":["外国から輸入した安い米をたくわえたものである","米不足にそなえてたくわえられている米である","米が不足したときなどに、政府が市場に売り出すことがある","古くなると、家畜のえさなどに使われることがある"],"e":"備蓄米は国産米で、米不足にそなえて政府がたくわえ、不足したときに市場に出します。古くなったものは家畜のえさなどに回されます。"},
{"id":"A025","u":"米づくり","lv":"標準","r":64,"f":"資料の読み取り","q":"表は、米1kgのねだん(2025年度)をくらべたものです。国産米のねだんは、タイ産のおよそ何倍ですか。","c":["約10倍","約4倍","約2倍","約60倍"],"e":"627÷63=約10倍です。約4倍はアメリカ産とくらべたときの数です。外国産の米が安いことは、国内の米作農家のなやみになっています。","tb":[["産地","国産米","アメリカ産","タイ産"],["1kgのねだん","627円","142円","63円"]]},
{"id":"A026","u":"米づくり","lv":"標準","r":62,"f":"知識","q":"米の自給率は、ふだんは100%近くありますが、1993年度には75%ほどに落ちこみました。その理由として正しいものはどれですか。","c":["冷夏で米がとれず、タイやアメリカなどから米を緊急輸入したから","減反政策が始まり、米の生産量をへらしたから","食糧管理制度が廃止され、米の輸入が自由になったから","米を食べる量がふえ、国内の米が足りなくなったから"],"e":"1993年は「戦後最悪の凶作」で、外国産の米を緊急輸入しました。減反開始は1970年ごろ、食糧管理制度廃止は1995年です。現在の米の自給率は90%台後半です。"},
{"id":"A027","u":"米づくり","lv":"応用","r":52,"f":"資料の読み取り","q":"表は、米の生産量の地方別の割合(2025年産)です。この表から読み取れることとして正しいものはどれですか。","c":["東北と北陸を合わせると、全国の4割をこえる","東北だけで、全国の3分の1をこえる","関東・東山は、北陸の2倍以上である","北陸は、九州・沖縄の2倍以上である"],"e":"28+14=42%で4割をこえます。28%は3分の1(約33%)より少なく、19%は14%の2倍未満です。東北・北陸は「日本の穀倉地帯(米ぐら)」とよばれます。","tb":[["地方","東北","関東・東山","北陸","九州・沖縄","その他"],["割合","28%","19%","14%","10%","29%"]]},
{"id":"A028","u":"米づくり","lv":"標準","r":68,"f":"知識","q":"同じ土地で、1年の間に同じ作物(米など)を2回作ることを何といいますか。","c":["二期作","二毛作","転作","輪作"],"e":"同じ作物を2回が二期作、ちがう作物を2種類作るのが二毛作です。高知平野・宮崎平野ではかつて米の二期作がさかんでしたが、今はほとんど行われていません。"},
{"id":"A029","u":"米づくり","lv":"応用","r":48,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 筑紫平野では、主に米と麦の二期作が行われている。\nII 熊本県の八代平野では、水田の裏作として冬にいぐさが作られている。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"米と麦はちがう作物なので、筑紫平野は「二毛作」です。八代平野のいぐさはたたみ表の原料で、米といぐさの二毛作です。"},
{"id":"A030","u":"米づくり","lv":"応用","r":50,"f":"記述のことば","q":"「北陸地方では耕地にしめる田の割合(水田率)が高い理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["冬は雪が積もる・冬は農業ができない・雪どけ水","夏に気温が高い・梅雨・熱帯性の作物","日本海流・冬でもあたたかい・二期作","台地・火山灰・水持ちが悪い"],"e":"雪国では冬に農業ができないので夏の米作りが中心になり、春の雪どけ水が水田をうるおします。「夏に気温が高い・梅雨」は日本全体の話で、北陸だけの決め手になりません。"},
{"id":"A031","u":"野菜・果物","lv":"基礎","r":82,"f":"知識","q":"夏が旬の野菜の組み合わせはどれですか。","c":["なす・ピーマン","はくさい・だいこん","キャベツ・たけのこ","さといも・にんじん"],"e":"なす・ピーマン・きゅうり・トマトは夏野菜です。はくさい・だいこんは冬、キャベツ・たけのこは春、さといも・にんじんは秋が旬です。"},
{"id":"A032","u":"野菜・果物","lv":"過去問型","r":42,"f":"まちがい探し","q":"野菜とその旬の季節の組み合わせとして、まちがっているものはどれですか。","c":["たけのこ―秋","さつまいも―秋","ほうれんそう―冬","さやえんどう―春"],"e":"たけのこは春が旬です。秋はさつまいも・さといも・にんじん・しめじ、冬はだいこん・はくさい・ねぎ・ほうれんそうです。"},
{"id":"A033","u":"野菜・果物","lv":"基礎","r":80,"f":"知識","q":"高知平野や宮崎平野で、ビニールハウスを使ってなすやピーマンをほかの地域より早く作り、出荷する農業を何といいますか。","c":["早作り(促成栽培)","おそ作り(高冷地農業)","近郊農業","二毛作"],"e":"冬でもあたたかい気候を生かし、夏野菜を冬〜春に出荷するのが早作り(促成栽培)です。高原で夏に冬・春の野菜を作るのは、おそ作り(高冷地農業)です。"},
{"id":"A034","u":"野菜・果物","lv":"標準","r":58,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 高知平野は、近くを日本海流(黒潮)が流れるため、冬でもあたたかい。\nII 野辺山原は標高が高いため、冬でもあたたかい気候である。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"野辺山原は標高が高く「夏でもすずしい」気候です。「冬でもあたたかい」は高知平野・宮崎平野の特徴なので、IIがまちがいです。"},
{"id":"A035","u":"野菜・果物","lv":"過去問型","r":42,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 嬬恋村では、夏でもすずしい気候を生かして、キャベツを早作り(促成栽培)している。\nII 宮崎平野では、ビニールハウスを使ってピーマンが冬の間にも作られている。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"嬬恋村は、ほかの地域より時期をおくらせてキャベツを作る「おそ作り(高冷地農業)」なので、Iがまちがいです。「早作り=あたたかい平野、おそ作り=すずしい高原」です。"},
{"id":"A036","u":"野菜・果物","lv":"標準","r":60,"f":"資料の読み取り","q":"表は、野辺山原の様子を示したものです。八ヶ岳の赤岳と、JR野辺山駅の標高差はおよそ何mですか。","c":["約1550m","約1350m","約2900m","約4250m"],"e":"2899−1346=1553なので、約1550mです。野辺山原は八ヶ岳のふもとの、標高1300m前後の高原で、夏でもすずしく高原野菜が作られます。","tb":[["場所","八ヶ岳(赤岳)","JR野辺山駅"],["標高","約2899m","約1346m"]]},
{"id":"A037","u":"野菜・果物","lv":"標準","r":66,"f":"資料の読み取り","q":"表は、ある2つの地域の野菜作りカレンダーの一例です。表のBにあてはまる地域はどれですか。","c":["嬬恋村","高知平野","宮崎平野","武蔵野"],"e":"Bは春に種をまき、夏から秋にキャベツ・はくさいを収穫するので、夏でもすずしい高原の嬬恋村(おそ作り)です。Aは冬もなす・ピーマンを収穫する高知平野や宮崎平野(早作り)です。","tb":[["地域","作物","種をまく","収穫する"],["A","なす・ピーマン","7〜8月","9月下旬〜翌6月"],["B","キャベツ・はくさい","3〜5月","6〜10月"]]},
{"id":"A038","u":"野菜・果物","lv":"応用","r":50,"f":"記述のことば","q":"「高知平野で、なすを旬ではない冬に作って出荷する理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["ほかの地域でとれない時期・出荷量が少ない・高いねだんで売れる","冬でもあたたかい・ビニールハウス・日本海流","大都市に近い・新鮮・輸送費","旬・味が良い・安い"],"e":"理由(なぜ)の決め手は「出荷量が少ない時期なので高く売れる」ことです。「冬でもあたたかい・ビニールハウス」は、どうやって作れるのか(方法)の説明です。"},
{"id":"A039","u":"野菜・果物","lv":"基礎","r":84,"f":"知識","q":"武蔵野や下総台地などで、大都市の周辺から大都市向けに野菜や花を作って出荷する農業を何といいますか。","c":["近郊農業","高冷地農業","促成栽培","酪農"],"e":"大都市の近く(近郊)で行うので近郊農業です。消費地に近く、新鮮なうちに届けられ、輸送費もおさえられます。"},
{"id":"A040","u":"野菜・果物","lv":"標準","r":60,"f":"まちがい探し","q":"関東地方の武蔵野や下総台地について説明した文として、ふさわしくないものはどれですか。","c":["水持ちが良いので、昔から水田が広がっていた","関東ローム層とよばれる、火山灰が積もった地層におおわれている","大都市に近いので、いたみやすい野菜も新鮮なうちに届けられる","下総台地は千葉県北部に広がり、にんじんやらっかせいなどが作られている"],"e":"台地は地下水が手に入りにくく水持ちが悪いため、水田にはむきません。そのかわり大都市に近いことを生かし、野菜作り(近郊農業)がさかんです。"},
{"id":"A041","u":"野菜・果物","lv":"過去問型","r":45,"f":"記述のことば","q":"「千葉県の下総台地で近郊農業がさかんな理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["大消費地に近い・新鮮なうちに届けられる・輸送費をおさえられる","日本海流・冬でもあたたかい・ビニールハウス","標高が高い・夏でもすずしい・おそ作り","関東ローム層・水持ちが悪い・水田にむかない"],"e":"近郊農業の決め手は東京などの大消費地に近いことです。「水持ちが悪い・水田にむかない」は米作りにむかない理由で、野菜作りがさかんな理由としては足りません。"},
{"id":"A042","u":"野菜・果物","lv":"基礎","r":78,"f":"知識","q":"野菜を生産地から消費地まで、冷やしたまま運ぶしくみを何といいますか。","c":["コールドチェーン","フードロス","生産調整","近郊農業"],"e":"保冷車(冷蔵トラック)や低温コンテナで冷やしたまま運ぶしくみをコールドチェーンといいます。高速道路の発達もあり、大都市から遠い産地も出荷できるようになりました。"},
{"id":"A043","u":"野菜・果物","lv":"標準","r":62,"f":"まちがい探し","q":"野菜の輸送について説明した文として、ふさわしくないものはどれですか。","c":["野菜は収穫するともう呼吸をしないので、箱につめても中の温度は上がらない","保冷車や高速道路の発達で、大都市から遠い産地も野菜を出荷できるようになった","沖縄県では、とれた野菜や花を飛行機で運ぶこともある","遠くから運ぶには燃料を使うため、二酸化炭素を多く出すという問題もある"],"e":"野菜は収穫後も生きて呼吸をしていて、その熱で箱の中の温度が上がりいたみやすくなります。だから冷やしたまま運ぶコールドチェーンが必要なのです。"},
{"id":"A044","u":"野菜・果物","lv":"基礎","r":84,"f":"知識","q":"作物がたくさんとれすぎたためにねだんが下がり、売ってももうからなくなってしまうことを何といいますか。","c":["豊作びんぼう","減反","冷害","フードロス"],"e":"とれすぎて売られる量が多くなると、ねだんが下がります。これを豊作びんぼうといい、さけるために作物をつぶして出荷量をへらすこともあります。"},
{"id":"A045","u":"野菜・果物","lv":"標準","r":60,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI もののねだんは、ふつう売られている量が多いほど高くなる。\nII 豊作びんぼうをさけるために、とれすぎたキャベツをトラクターでつぶすことがある。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"売られる量が多く、みんながあまりほしがらないものは「安く」なります。だから出荷量をへらしてねだんが下がらないようにするのです。"},
{"id":"A046","u":"野菜・果物","lv":"標準","r":62,"f":"資料の読み取り","q":"表は、東京都で生産されている主な野菜(2024年産)です。この表から読み取れることとして正しいものはどれですか。","c":["全国にしめる割合がいちばん高いのは、こまつなである","だいこんは、全国にしめる割合がほうれんそうより高い","ほうれんそうの収穫量は、キャベツより多い","にんじんの収穫量は、ほうれんそうより多い"],"e":"こまつなは6.3%でいちばん高く、収穫量も最多です。ほうれんそう(3990t)はキャベツ(6110t)より少なく、にんじん(2570t)より多いです。","tb":[["野菜","収穫量","全国にしめる割合"],["こまつな","7410t","6.3%"],["だいこん","6920t","0.6%"],["キャベツ","6110t","0.5%"],["ほうれんそう","3990t","2.1%"],["にんじん","2570t","0.5%"]]},
{"id":"A047","u":"野菜・果物","lv":"応用","r":50,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 日本の野菜の自給率は30%ほどで、ほとんどを輸入にたよっている。\nII 日本の野菜の輸入先の1位は、アメリカである。","c":["Iも IIもまちがっている","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい"],"e":"野菜は新鮮さがもとめられるため自給率は比較的高く、約8割です。輸入先の1位は中国なので、IもIIもまちがいです。"},
{"id":"A048","u":"野菜・果物","lv":"標準","r":62,"f":"知識","q":"スーパーでは果物売り場にならぶことが多いものの、草になる実なので野菜のなかまともいわれるものはどれですか。","c":["いちご","りんご","さくらんぼ","もも"],"e":"いちごは木ではなく草になる実なので、野菜のなかまともいわれます。りんご・さくらんぼ・ももは木になる果物です。"},
{"id":"A049","u":"野菜・果物","lv":"標準","r":58,"f":"知識","q":"大都市の中の畑を開発から守るため、市や区が指定し、許可なくマンションや駐車場をつくれないようにした農地を何といいますか。","c":["生産緑地","休耕田","国立公園","保安林"],"e":"生産緑地では、こまつななどの野菜が作られ、災害のときのひなん場所や環境保護にも役立ちます。東京都では多摩地区や練馬区・世田谷区などに多くあります。"},
{"id":"A050","u":"野菜・果物","lv":"標準","r":60,"f":"知識","q":"なすの旬である夏には群馬県や栃木県産が多く出回ります。では、旬ではない冬に多く出回るなすの主な産地はどこですか。","c":["高知県","群馬県","栃木県","長野県"],"e":"冬は、日本海流(黒潮)のえいきょうで冬でもあたたかい高知県などで、ビニールハウスを使って作られたなすが出回ります(早作り)。"},
{"id":"A051","u":"水産業・畜産","lv":"基礎","r":80,"f":"知識","q":"千島海流(親潮)と日本海流(黒潮)のように、寒流と暖流がぶつかるところを何といいますか。","c":["潮目","大陸棚","リアス海岸","海溝"],"e":"潮目にはプランクトンが多く、暖流魚と寒流魚の両方が集まる好漁場になります。三陸海岸の沖が代表的です。"},
{"id":"A052","u":"水産業・畜産","lv":"標準","r":68,"f":"知識","q":"海岸から続く、深さ約200mまでのゆるやかに傾いた海底で、東シナ海に広く見られるものを何といいますか。","c":["大陸棚","潮目","海溝","環礁"],"e":"大陸棚は日光がとどきプランクトンや海藻が育つため、魚が多く集まります。潮目は寒流と暖流のぶつかるところです。"},
{"id":"A053","u":"水産業・畜産","lv":"標準","r":60,"f":"まちがい探し","q":"魚と、その魚が主にすむ海流の組み合わせとして、まちがっているものはどれですか。","c":["さんま―暖流","まぐろ―暖流","いわし―暖流","さけ―寒流"],"e":"さんまは、さけと同じく寒流魚です。まぐろ・いわしは暖流魚です。"},
{"id":"A054","u":"水産業・畜産","lv":"標準","r":64,"f":"知識","q":"北海道のサロマ湖や青森県の陸奥湾で養殖がさかんな水産物はどれですか。","c":["ほたて","かき","真珠","うなぎ"],"e":"ほたてはサロマ湖・陸奥湾、かきは広島湾・仙台湾、真珠は英虞湾・宇和海、うなぎは志布志湾・三河湾が知られています。"},
{"id":"A055","u":"水産業・畜産","lv":"応用","r":52,"f":"まちがい探し","q":"養殖される水産物と、養殖がさかんな場所の組み合わせとして、まちがっているものはどれですか。","c":["真珠―サロマ湖","かき―広島湾","わかめ―三陸海岸","たい―宇和海"],"e":"真珠の養殖がさかんなのは英虞湾(三重県)や宇和海(愛媛県)です。サロマ湖はほたての養殖で知られます。"},
{"id":"A056","u":"水産業・畜産","lv":"標準","r":62,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 三重県の英虞湾や愛媛県の宇和海では、真珠の養殖がさかんである。\nII かきの養殖は、広島湾や仙台湾でさかんである。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"どちらも正しい文です。養殖は「ほたて=サロマ湖・陸奥湾、かき=広島湾・仙台湾、真珠=英虞湾・宇和海」と場所をセットで覚えましょう。"},
{"id":"A057","u":"水産業・畜産","lv":"基礎","r":76,"f":"資料の読み取り","q":"表は、いくつかの食料の自給率(2023年)です。自給率が50%を下回っているものの組み合わせはどれですか。","c":["小麦と大豆","魚介類と肉類","肉類と小麦","魚介類と大豆"],"e":"小麦17%と大豆7%が50%を下回ります。魚介類54%、肉類53%は半分をこえています。","tb":[["食料","魚介類","肉類","小麦","大豆"],["自給率","54%","53%","17%","7%"]]},
{"id":"A058","u":"水産業・畜産","lv":"標準","r":58,"f":"知識","q":"乳用牛の飼育頭数が、北海道についで多い県はどれですか。","c":["栃木県","鹿児島県","宮崎県","群馬県"],"e":"乳用牛は1位北海道・2位栃木県です。鹿児島県は肉用牛・ぶた・ブロイラー、宮崎県はブロイラーで上位です。"},
{"id":"A059","u":"水産業・畜産","lv":"応用","r":50,"f":"資料の読み取り","q":"表は、家畜の飼育数が多い都道府県の1位と2位です。ぶたにあてはまるものはどれですか。","c":["表のC","表のA","表のB","表のD"],"e":"ぶたは1位鹿児島・2位北海道です。Aは乳用牛(北海道・栃木)、Bは肉用牛(北海道・鹿児島)、Dはブロイラー(鹿児島・宮崎)です。","tb":[["","1位","2位"],["A","北海道","栃木"],["B","北海道","鹿児島"],["C","鹿児島","北海道"],["D","鹿児島","宮崎"]]},
{"id":"A060","u":"水産業・畜産","lv":"過去問型","r":40,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 根釧台地では夏に濃霧が発生しやすく、気温が上がりにくいため、酪農がさかんである。\nII 根釧台地の濃霧は、冬に吹く北西の季節風によって起こる。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"根釧台地の濃霧は、夏の南東の季節風が冷たい千島海流(親潮)の上で冷やされて起こります。「夏=南東、冬=北西」の季節風の向きをまちがえないようにしましょう。"},
{"id":"A061","u":"水産業・畜産","lv":"標準","r":66,"f":"知識","q":"ブランド牛の「松阪牛」が育てられている県はどれですか。","c":["三重県","兵庫県","熊本県","鹿児島県"],"e":"松阪牛は三重県、神戸ビーフは兵庫県、あか牛は熊本県の阿蘇が知られています。"},
{"id":"A062","u":"水産業・畜産","lv":"標準","r":62,"f":"知識","q":"日本の牛肉の輸入先で、1位と2位の組み合わせとして正しいものはどれですか。","c":["1位オーストラリア・2位アメリカ","1位アメリカ・2位オーストラリア","1位オーストラリア・2位カナダ","1位アメリカ・2位カナダ"],"e":"牛肉の輸入先は1位オーストラリア(約5割)、2位アメリカ、3位カナダです。外国産は安いため多く輸入され、牛肉の自給率は4割ほどです。"},
{"id":"A063","u":"水産業・畜産","lv":"応用","r":52,"f":"記述のことば","q":"「三陸海岸の沖が良い漁場になっている理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["潮目・寒流と暖流がぶつかる・プランクトンが多い","リアス海岸・波がおだやか・養殖","大陸棚・浅い海・東シナ海","千島海流・やませ・冷害"],"e":"沖合の漁場の決め手は、親潮と黒潮がぶつかる潮目でプランクトンが多く、魚が集まることです。「リアス海岸・波がおだやか」は湾内の養殖がさかんな理由です。"},
{"id":"A064","u":"水産業・畜産","lv":"標準","r":58,"f":"知識","q":"日本で1人あたりに消費される肉の量について説明した文として、正しいものはどれですか。","c":["牛肉は、ぶた肉やとり肉より少ない","牛肉は、ぶた肉やとり肉より多い","ぶた肉は、牛肉より少ない","とり肉は、牛肉より少ない"],"e":"肉の消費量はとり肉・ぶた肉が多く、牛肉がいちばん少ないです。牛肉はねだんが高いためです。食生活の多様化(洋風化)で、肉類や牛乳・乳製品の消費はふえてきました。"},
{"id":"A065","u":"水産業・畜産","lv":"標準","r":62,"f":"まちがい探し","q":"日本の畜産について説明した文として、まちがっているものはどれですか。","c":["ブロイラーとは、たまごをとるために育てられるにわとりのことである","根釧台地では、乳用牛を育てる酪農がさかんである","鹿児島県ではぶたの飼育がさかんで、黒豚が知られている","宮崎県では、ブロイラーの飼育がさかんである"],"e":"ブロイラーは短い期間で育てる肉用のにわとりです。たまごをとるにわとりは採卵鶏とよびます。"},
{"id":"A066","u":"加工食品","lv":"基礎","r":84,"f":"まちがい探し","q":"次の食品のうち、主な原料に大豆を使っていないものはどれですか。","c":["かまぼこ","みそ","しょうゆ","納豆"],"e":"かまぼこは魚が原料です。大豆は「畑の肉」とよばれ、みそ・しょうゆ・納豆・とうふなどの原料になります。"},
{"id":"A067","u":"加工食品","lv":"標準","r":70,"f":"知識","q":"大豆からつくった豆乳を固めて、とうふにするときに加えるものはどれですか。","c":["にがり","こうじ","酢","塩水"],"e":"豆乳ににがりを加えて固めるととうふになります。こうじはみそ・しょうゆなどの発酵に使います。"},
{"id":"A068","u":"加工食品","lv":"標準","r":60,"f":"知識","q":"しょうゆの主な原料の組み合わせとして正しいものはどれですか。","c":["大豆・小麦・塩","大豆・米・塩","小麦・牛乳・塩","米・こうじ・砂糖"],"e":"しょうゆは大豆と小麦にこうじと塩水を加えて発酵させます。大豆・米(または大麦)・塩はみその原料なので、取りちがえに注意しましょう。"},
{"id":"A069","u":"加工食品","lv":"標準","r":66,"f":"資料の読み取り","q":"表は、日本の大豆の輸入先の割合です。アメリカとブラジルを合わせると、輸入量のおよそどれくらいですか。","c":["約9割","約7割","約5割","約3割"],"e":"66+23=89%なので約9割です。大豆の自給率は約7%しかなく、ほとんどを輸入にたよっています。","tb":[["輸入先","アメリカ","ブラジル","カナダ","その他"],["割合","66%","23%","10%","1%"]]},
{"id":"A070","u":"加工食品","lv":"標準","r":58,"f":"まちがい探し","q":"次の食品のうち、発酵食品でないものはどれですか。","c":["たらこ","納豆","キムチ","チーズ"],"e":"たらこはすけとうだらのたまごを塩づけにしたもので、発酵食品ではありません。納豆・キムチ・チーズ・みそ・しょうゆは発酵食品です。"},
{"id":"A071","u":"加工食品","lv":"応用","r":50,"f":"知識","q":"ぶたのばら肉を塩づけにし、けむりでいぶしてつくる加工食品はどれですか。","c":["ベーコン","ソーセージ","コンビーフ","バター"],"e":"ばら肉を使うのがベーコンです。ソーセージはひき肉を腸につめたもの、コンビーフは牛肉の加工品、バターは牛乳の脂肪分からつくります。"},
{"id":"A072","u":"加工食品","lv":"標準","r":56,"f":"まちがい探し","q":"加工食品とその主な原料の組み合わせとして、まちがっているものはどれですか。","c":["マーガリン―牛乳","かまぼこ―魚","バター―牛乳","ハム―ぶた肉"],"e":"マーガリンは植物油からつくられます。牛乳からつくるのはバター・チーズ・生クリームなどです。"},
{"id":"A073","u":"加工食品","lv":"標準","r":62,"f":"2文の正誤","q":"次の2つの文の正誤の組み合わせとして正しいものを選びなさい。\nI 食品表示ラベルには、原材料名・賞味期限・保存方法・製造者などが書かれている。\nII 有機JASマークは、農薬や化学肥料にたよらずに作られた食品などにつけられる。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"どちらも正しい文です。食品表示は食品表示法などで決められ、有機JASマークは有機農法で作られたことを示します。"},
{"id":"A074","u":"加工食品","lv":"標準","r":60,"f":"記述のことば","q":"「レトルト食品の消費量がふえた理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["温めるだけ・すぐ食べられる・常温で長く保存できる","国産の原料・安全・JASマーク","発酵・こうじ・熟成","保冷車・冷やしたまま・コールドチェーン"],"e":"いそがしいときでも調理せずにすぐ食べられ、常温で長く保存できるので非常食にもなることが決め手です。電子レンジの普及も消費をふやしました。"},
{"id":"A075","u":"加工食品","lv":"基礎","r":76,"f":"知識","q":"牛乳や肉を、チーズやハムなどに加工する大きな理由として、もっともふさわしいものはどれですか。","c":["くさりやすいので、長く保存できるようにするため","ねだんを安くして、たくさん売るため","輸入した原料だけで作れるようにするため","カロリーを低くするため"],"e":"牛乳や肉はくさりやすいので、発酵・熟成させたり塩やけむりでいぶしたりして保存できるようにします。"},
{"id":"B001","u":"紙・木・衣服","lv":"基礎","r":86,"f":"知識","q":"和紙の原料として、千年以上前から使われてきた植物の組み合わせはどれですか。","c":["こうぞ・みつまた","すぎ・ひのき","ぶな・まつ","綿花・羊毛"],"e":"和紙はこうぞ・みつまたの皮を煮てすいてつくり、お札の原料にもなっています。すぎ・ひのきなどの木材から作るのは洋紙です。"},
{"id":"B002","u":"紙・木・衣服","lv":"標準","r":64,"f":"知識","q":"洋紙ができるまでの順番として正しいものはどれですか。","c":["木材→チップ→パルプ→紙","木材→パルプ→チップ→紙","チップ→木材→パルプ→紙","パルプ→チップ→木材→紙"],"e":"木材を細かくくだいたものがチップ、チップをとかしてせんいをとり出したものがパルプです。「くだく(チップ)→とかす(パルプ)→すく(紙)」の順で覚えましょう。"},
{"id":"B003","u":"紙・木・衣服","lv":"標準","r":62,"f":"知識","q":"富士市を中心に紙の生産がさかんで、紙の生産額が日本一の県はどこですか。","c":["静岡県","愛媛県","埼玉県","北海道"],"e":"富士山のふもとの富士市は豊かな地下水を利用して製紙業がさかんで、静岡県が日本一です。愛媛県・埼玉県・北海道も紙の生産が多い道県ですが1位ではありません。"},
{"id":"B004","u":"紙・木・衣服","lv":"応用","r":52,"f":"知識","q":"三大和紙と、それがつくられている県の組み合わせとして正しいものはどれですか。","c":["越前和紙-福井県、美濃和紙-岐阜県、土佐和紙-高知県","越前和紙-岐阜県、美濃和紙-福井県、土佐和紙-高知県","越前和紙-福井県、美濃和紙-岐阜県、土佐和紙-愛媛県","越前和紙-石川県、美濃和紙-岐阜県、土佐和紙-高知県"],"e":"越前は福井県、美濃は岐阜県、土佐は高知県の昔の国名です。旧国名と県をセットで覚えると取りちがえません。"},
{"id":"B005","u":"紙・木・衣服","lv":"基礎","r":80,"f":"まちがい探し","q":"紙の特ちょうや使われ方の説明として、ふさわしくないものはどれですか。","c":["水に強く燃えにくいので、大切なものを長く保存するのに向いている","うすくて軽く、切ったり折ったり加工しやすい","文字を書いて記録したり、伝えたりするのに使われてきた","使い終わった紙を古紙として回収し、再生紙をつくることができる"],"e":"紙の短所は「水に弱く燃えやすい」ことです。長所(うすい・軽い・加工しやすい)と短所をセットで覚えましょう。"},
{"id":"B006","u":"紙・木・衣服","lv":"標準","r":58,"f":"2文の正誤","q":"次のI・IIの文の正誤の組み合わせとして正しいものはどれですか。\nI 日本には、約1400年前に朝鮮から来た僧が紙のつくり方を伝えたといわれている。\nII 日本の古紙回収率は、世界平均とくらべて低い。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"日本の古紙回収率は約80%で、世界平均(約62%)より高いので、IIは「低い」が誤りです。日本は古紙のリサイクルが進んだ国です。"},
{"id":"B007","u":"紙・木・衣服","lv":"標準","r":60,"f":"資料の読み取り","q":"次の表は、古紙回収率と古紙利用率(2023年)を表しています。表から読み取れることとして正しいものはどれですか。","c":["日本は世界平均とくらべて、回収率も利用率も高い","日本は世界平均とくらべて、回収率が低い","日本では回収した古紙が、すべて紙の原料として利用されている","世界平均では、利用率のほうが回収率より高い"],"e":"日本は回収率80%・利用率68%で、どちらも世界平均の62%を上回ります。回収率と利用率の数字はちがうので「すべて利用」とは言えません。","tb":[["","古紙回収率","古紙利用率"],["日本","80%","68%"],["世界平均","62%","62%"]]},
{"id":"B008","u":"紙・木・衣服","lv":"基礎","r":84,"f":"知識","q":"聖徳太子が建てたとされ、現存する世界最古の木造建築といわれる奈良県の寺はどれですか。","c":["法隆寺","東大寺","正倉院","金閣"],"e":"法隆寺は約1400年前にひのきで建てられ、世界最古の木造建築です。正倉院(約1300年前)は校倉造の倉で、寺ではありません。"},
{"id":"B009","u":"紙・木・衣服","lv":"標準","r":58,"f":"まちがい探し","q":"日本の森林についての説明として、ふさわしくないものはどれですか。","c":["すぎやひのきなどの広葉樹は、生長が早いので建築用に植林されてきた","国土の約3分の2が森林におおわれている","落ち葉が積もった土が水をたくわえるので、森林は「緑のダム」とよばれる","北海道には、とどまつなど寒さに強い木が多い"],"e":"すぎ・ひのき・まつは葉が細い針葉樹です。ぶな・さくらなど葉が平たく広いものが広葉樹です。「針=細い葉、広=広い葉」で区別しましょう。"},
{"id":"B010","u":"紙・木・衣服","lv":"標準","r":56,"f":"2文の正誤","q":"次のI・IIの文の正誤の組み合わせとして正しいものはどれですか。\nI 白神山地は青森県と秋田県にまたがり、ぶなの原生林が世界自然遺産に登録されている。\nII 樹齢千年をこえる屋久すぎで知られる屋久島は、沖縄県にある。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"屋久島は鹿児島県の島なので、IIがまちがいです。白神山地=ぶな(青森・秋田)、屋久島=すぎ(鹿児島)とセットで覚えましょう。"},
{"id":"B011","u":"紙・木・衣服","lv":"基礎","r":78,"f":"知識","q":"岐阜県の白川郷などに見られる合掌造りの家の屋根が、急なかたむきになっているのはなぜですか。","c":["雪が積もりにくく、雪の重みで家がこわれないようにするため","夏の強い日差しをさえぎるため","台風の強い風を受け流すため","冬の強い季節風から家を守るため"],"e":"合掌造りは豪雪地帯の家で、急な屋根で雪を落とします。冬の強い風から家を守るのは、関東内陸部の屋敷森です。"},
{"id":"B012","u":"紙・木・衣服","lv":"標準","r":58,"f":"資料の読み取り","q":"次の表は、日本の土地の使われ方の割合を表しています。森林の面積は、農地の面積のおよそ何倍ですか。","c":["約5.5倍","約2倍","約3倍","約13倍"],"e":"66÷12=5.5なので約5.5倍です。宅地(5%)とくらべると約13倍になります。どの数とどの数を比べるかを問題文で確かめましょう。","tb":[["土地の使われ方","割合"],["森林","66%"],["農地","12%"],["宅地","5%"],["その他","17%"]]},
{"id":"B013","u":"紙・木・衣服","lv":"応用","r":48,"f":"資料の読み取り","q":"次の表は、いくつかの国の森林率(国土にしめる森林の割合)を表しています。表から読み取れることとして正しいものはどれですか。","c":["日本の森林率は、世界平均の2倍以上である","日本の森林率は、表の国の中で最も高い","カナダの森林率は、日本より高い","中国の森林率は、世界平均より高い"],"e":"66÷31は2より大きいので2倍以上です。フィンランド(74%)は日本より高く、中国(24%)は世界平均(31%)より低くなっています。","tb":[["国","森林率"],["フィンランド","74%"],["日本","66%"],["ブラジル","59%"],["カナダ","40%"],["中国","24%"],["世界平均","31%"]]},
{"id":"B014","u":"紙・木・衣服","lv":"応用","r":44,"f":"記述のことば","q":"「森林が多い日本が、木材の半分以上を外国から輸入している理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["山地が多くけわしい・切り出して運ぶのにお金がかかる・外国産のほうが安い","森林が少ない・木が育ちにくい・外国産のほうが安い","山地が多い・森林がある・輸入がふえた","すぎが多い・建築に向かない・外国の木はじょうぶ"],"e":"日本の国土の約4分の3は山地でけわしく、木を切り出したり運んだりする費用が高くつくため、安い外国産が多く使われます。「なぜ国産が高いのか」まで書くのが決め手です。"},
{"id":"B015","u":"紙・木・衣服","lv":"基礎","r":86,"f":"知識","q":"絹織物の原料になるものはどれですか。","c":["かいこのまゆからとった生糸","綿花のワタ","羊の毛","石油"],"e":"かいこ(ガの仲間)は桑の葉を食べてまゆをつくり、1つのまゆから1000m以上の糸がとれます。綿花=綿織物、羊毛=毛織物、石油=化学せんいです。"},
{"id":"B016","u":"紙・木・衣服","lv":"標準","r":66,"f":"知識","q":"水分をよく吸い、肌ざわりがよいので、タオルや下着によく使われる織物はどれですか。","c":["綿織物","麻織物","毛織物","絹織物"],"e":"綿織物は吸水性と肌ざわりが特ちょうです。麻=風通しがよく夏向き、毛=保温性が高くセーター、絹=なめらかで光沢があり着物、と性質と使い道をセットで覚えましょう。"},

{"id":"B019","u":"紙・木・衣服","lv":"応用","r":48,"f":"2文の正誤","q":"次のI・IIの文の正誤の組み合わせとして正しいものはどれですか。\nI 絹織物は、約300年前ごろから人々のふだん着として広まった。\nII 蚊帳は綿や麻などでつくられ、夏の夜に蚊をふせぐために使われた。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"約300年前ごろからふだん着として広まったのは綿織物です。絹織物は約1000年前の貴族の衣服(十二単など)に使われた高級品でした。"},
{"id":"B020","u":"紙・木・衣服","lv":"応用","r":46,"f":"記述のことば","q":"「砂漠に住む人々が、暑いのに全身をおおう服を着る理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["強い日差し・砂・かんそうから体を守る","寒さ・雪・冷たい風から体を守る","強い日差し・雨・しめり気から体を守る","虫・けもの・夜の暗さから体を守る"],"e":"砂漠は日差しが強く、砂が舞い、とてもかんそうしているので、肌を出さないほうが体を守れます。「雨」「しめり気」は砂漠に合いません。"},
{"id":"B021","u":"電気・自動車・お店","lv":"基礎","r":84,"f":"知識","q":"火力発電所が海ぞいに多い理由として最もふさわしいものはどれですか。","c":["燃料の石油・石炭・天然ガスのほとんどを輸入し、船で運んでくるから","ダムをつくるのに適した地形だから","地下の熱を利用しやすいから","一年中強い風が吹くから"],"e":"火力発電の燃料はほとんど外国から船で運ぶので、港をつくりやすい海ぞいに発電所が建てられます。大都市に近く、たくさんの電気をつくれるのも特ちょうです。"},
{"id":"B022","u":"電気・自動車・お店","lv":"標準","r":64,"f":"知識","q":"地熱発電所が多くつくられているのは、どのような場所ですか。","c":["大分県など、火山や温泉が多い地域","福井県の若狭湾ぞいなど、海に面した地域","富山県の黒部など、山あいのダムのある地域","青森県など、風の強い海岸ぞいの地域"],"e":"地熱発電は地下のマグマの熱を利用するので、火山や温泉の近く(大分県が日本一、東北・九州)につくられます。若狭湾=原子力、黒部=水力、青森=風力です。"},
{"id":"B023","u":"電気・自動車・お店","lv":"標準","r":60,"f":"まちがい探し","q":"発電方法と、発電所が多い場所の組み合わせとして、ふさわしくないものはどれですか。","c":["地熱発電-大都市に近い平野","火力発電-海ぞい","水力発電-山あい","原子力発電-海ぞい"],"e":"地熱発電は火山や温泉の近くにつくられます。原子力発電はウランを燃料とし、熱を冷やす大量の水が必要なので海ぞいにあります。"},
{"id":"B024","u":"電気・自動車・お店","lv":"標準","r":58,"f":"知識","q":"原子力発電所が海ぞいに建てられる主な理由として、最もふさわしいものはどれですか。","c":["発電のときに出る熱を冷やすのに、大量の水が必要だから","海水から燃料のウランをとり出すから","海の波の力を利用して発電するから","まわりに山がなく、強い風が吹くから"],"e":"原子力発電は、ウランの核分裂の熱で発電し、その熱を冷やすために大量の水(冷却水)が必要です。火力発電の「燃料を船で運ぶから」と理由を区別しましょう。"},

{"id":"B028","u":"電気・自動車・お店","lv":"標準","r":56,"f":"資料の読み取り","q":"次の表は、1人あたりの電力消費量(2021年、kWh)です。表から読み取れることとして正しいものはどれですか。","c":["日本の1人あたりの電力消費量は、世界平均の2倍以上である","中国の1人あたりの電力消費量は、日本より多い","アメリカの1人あたりの電力消費量は、表の国で最も多い","日本の1人あたりの電力消費量は、世界平均の3倍以上である"],"e":"8425÷3599は約2.3なので、2倍以上ですが3倍には届きません。表で最も多いのはカナダです。","tb":[["国","1人あたり電力消費量"],["カナダ","15610"],["アメリカ","13098"],["日本","8425"],["中国","5975"],["世界平均","3599"]]},
{"id":"B029","u":"電気・自動車・お店","lv":"応用","r":50,"f":"まちがい探し","q":"風力・太陽光・地熱などの新しい発電(再生可能エネルギー)についての説明として、ふさわしくないものはどれですか。","c":["天気に左右されないので、いつでも同じ量の電気を安定してつくれる","使ってもなくならないエネルギーを利用している","発電に向いた場所がかぎられ、どこでもつくれるわけではない","太陽光パネルを置くために森林を切り開くことが問題になっている"],"e":"太陽光は夜や雨の日、風力は風がない日には発電量がへり、不安定なのが大きな問題点です。電気はためておくのが難しいことも課題です。"},
{"id":"B030","u":"電気・自動車・お店","lv":"応用","r":46,"f":"2文の正誤","q":"次のI・IIの文の正誤の組み合わせとして正しいものはどれですか。\nI 原子力発電の割合は、1980~1990年代にへっていった。\nII 火力発電は、燃やす燃料の量によって発電量を調整することができる。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"原子力発電の割合は1980~1990年代にふえ、2000年には約3割になりました。火力は燃料の量で発電量を調整できるのが長所です。"},
{"id":"B031","u":"電気・自動車・お店","lv":"応用","r":44,"f":"記述のことば","q":"「火力発電が地球環境にあたえる問題点」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["化石燃料を燃やす・二酸化炭素が出る・地球温暖化","ウランを使う・放射性物質・事故","ダムをつくる・自然をこわす・送電で失われる","燃料を燃やす・けむりが出る・天気に左右される"],"e":"火力発電は石油・石炭・天然ガス(化石燃料)を燃やすので、温室効果ガスの二酸化炭素を大量に出し、地球温暖化の原因になります。「けむり」だけでは決め手が足りません。"},
{"id":"B032","u":"電気・自動車・お店","lv":"基礎","r":86,"f":"知識","q":"日本有数の自動車工業都市である豊田市がある県はどこですか。","c":["愛知県","静岡県","神奈川県","岐阜県"],"e":"豊田市は愛知県にあり、完成した自動車は名古屋港などから外国へ輸出されます。"},
{"id":"B033","u":"電気・自動車・お店","lv":"標準","r":62,"f":"知識","q":"自動車工場で自動車ができるまでの順番として正しいものはどれですか。","c":["プレス→溶接→塗装→組み立て→検査","溶接→プレス→塗装→組み立て→検査","プレス→塗装→溶接→組み立て→検査","プレス→溶接→組み立て→塗装→検査"],"e":"鉄板を型でぬき(プレス)、つなぎ合わせ(溶接)、色をぬって(塗装)から部品を取りつけます(組み立て)。最後に検査をして完成です。"},
{"id":"B034","u":"電気・自動車・お店","lv":"標準","r":55,"f":"まちがい探し","q":"日本の自動車工業についての説明として、ふさわしくないものはどれですか。","c":["部品は大きな工場でつくり、それを多くの中小工場で組み立てている","産業用ロボットを使い、作業の多くを自動化している","工場は広い土地があり、高速道路や貿易港に近い場所につくられることが多い","外国の工場で自動車を生産する海外生産がふえている"],"e":"部品をつくるのは多くの中小工場(関連工場)で、それを大きな組み立て工場で自動車に仕上げます。逆にした文に注意しましょう。"},
{"id":"B035","u":"電気・自動車・お店","lv":"標準","r":62,"f":"知識","q":"水素を燃料にして電気をおこして走り、水しか出さない自動車はどれですか。","c":["燃料電池車","電気自動車","ハイブリッドカー","ガソリン車"],"e":"燃料電池車は水素ステーションで水素を入れます。電気自動車は充電した電気、ハイブリッドカーはガソリンと電気モーターの組み合わせで走ります。"},
{"id":"B036","u":"電気・自動車・お店","lv":"標準","r":60,"f":"2文の正誤","q":"次のI・IIの文の正誤の組み合わせとして正しいものはどれですか。\nI ハイブリッドカーは、ガソリンエンジンと電気モーターを組み合わせて走る。\nII 電気自動車は、充電した電気でモーターを回して走り、走行中に二酸化炭素を出さない。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"どちらも正しい文です。走行中に二酸化炭素を出さないのは電気自動車と燃料電池車で、ハイブリッドカーはガソリンも使うので少しは出します。"},
{"id":"B037","u":"電気・自動車・お店","lv":"標準","r":62,"f":"資料の読み取り","q":"次の表は、日本の旅客輸送(人を運ぶ)の割合(%)です。表から読み取れることとして正しいものはどれですか。","c":["1965年は鉄道が最も多かったが、2022年は自動車が最も多い","飛行機の割合はへっている","2022年は、船が2番目に多い","鉄道の割合は2倍以上にふえた"],"e":"自動車は行きたいところへ直接行けて便利なため、割合が大きくふえました。飛行機は0.8%から6.9%にふえています。","tb":[["年","鉄道","自動車","船","飛行機"],["1965年","66.8","31.6","0.9","0.8"],["2022年","28.0","65.0","0.1","6.9"]]},
{"id":"B038","u":"電気・自動車・お店","lv":"応用","r":48,"f":"資料の読み取り","q":"次の表は、日本の貨物輸送(物を運ぶ)の割合(%)です。1965年から2022年にかけて、割合が最も大きくへったものはどれですか。","c":["鉄道","船","自動車","どれもへっていない"],"e":"鉄道は30.7%から4.4%へ、約26ポイントへりました。船は43.3%から39.7%で少しへっただけで、自動車は大きくふえています。","tb":[["年","船","鉄道","自動車"],["1965年","43.3","30.7","26.0"],["2022年","39.7","4.4","55.7"]]},
{"id":"B039","u":"電気・自動車・お店","lv":"標準","r":64,"f":"知識","q":"現在、自動車の生産台数が世界で最も多い国はどこですか。","c":["中国","アメリカ","日本","ドイツ"],"e":"現在の1位は中国で、アメリカがそれに続き、日本も上位です。1980年代には日本が世界一になったこともありましたが、2009年ごろから中国が1位です。"},
{"id":"B040","u":"電気・自動車・お店","lv":"基礎","r":82,"f":"知識","q":"商品が生産者から消費者に届くまでの流れ(流通)として正しいものはどれですか。","c":["生産者→卸売→小売→消費者","生産者→小売→卸売→消費者","卸売→生産者→小売→消費者","生産者→消費者→卸売→小売"],"e":"市場などで大量に売り買いするのが卸売、お店で消費者に売るのが小売です。大型スーパーやインターネット通販では、生産者から直接買うこともあります。"},
{"id":"B041","u":"電気・自動車・お店","lv":"標準","r":66,"f":"知識","q":"中央卸売市場の「せり」の説明として正しいものはどれですか。","c":["買い手が値段をきそい合い、いちばん高い値段をつけた人に売る","買い手が値段をきそい合い、いちばん安い値段をつけた人に売る","決まった値段で、先に来た人から順番に売る","生産者が消費者に直接売る"],"e":"せりは朝早くに行われ、品物はいちばん高い値段をつけた買い手が買います。品物が少ないときは値段が高くなりやすくなります。"},
{"id":"B042","u":"電気・自動車・お店","lv":"標準","r":58,"f":"まちがい探し","q":"商店街と大型スーパーマーケットをくらべた説明として、ふさわしくないものはどれですか。","c":["商店街は広い駐車場があり、自動車でのまとめ買いに便利である","商店街では、店の人のくわしい説明を聞きながら買い物ができる","大型スーパーは大きな道路ぞいにあり、1つの建物でいろいろな物がそろう","大型スーパーに客が流れ、店が閉まったままのシャッター通りになった商店街もある"],"e":"駐車場が広く自動車でまとめ買いしやすいのは大型スーパーです。駅前の商店街には駐車場がほとんどありません。"},
{"id":"B043","u":"電気・自動車・お店","lv":"応用","r":48,"f":"2文の正誤","q":"次のI・IIの文の正誤の組み合わせとして正しいものはどれですか。\nI 宮崎平野のピーマンは、おそ作り(高冷地農業)でつくられ、保冷車とカーフェリーで運ばれる。\nII 野辺山原のレタスは、主に東名高速道路を使って東京に運ばれる。","c":["Iも IIもまちがっている","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい"],"e":"宮崎平野のピーマンは早作り(促成栽培)です。野辺山原(長野県)のレタスは中央自動車道で運ばれます。東名高速道路は太平洋ぞいの道路です。"},
{"id":"B044","u":"電気・自動車・お店","lv":"応用","r":46,"f":"記述のことば","q":"「遠くの産地の野菜が、新鮮なまま東京のスーパーに並ぶようになった理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["保冷車・高速道路・コールドチェーン","カーフェリー・せり・卸売市場","飛行機・鉄道・トラックターミナル","保冷車・アーケード・バリアフリー"],"e":"冷やしたまま運ぶ保冷車、速く運べる高速道路、産地から店まで低温を保つしくみ(コールドチェーン)が決め手です。せりや市場は値段を決めるしくみです。"},
{"id":"B045","u":"電気・自動車・お店","lv":"標準","r":58,"f":"まちがい探し","q":"「買い物難民(買い物弱者)」についての説明として、ふさわしくないものはどれですか。","c":["駅前の商店街がにぎわう、大都市の中心部に多い","高齢者や、人口の少ない地域に住む人に多い","トラックで品物を運んで売る移動スーパーが対策の1つになっている","注文した品物を家まで届ける配達サービスが対策の1つになっている"],"e":"買い物難民は、近くの店が閉まったり、車を運転できなかったりして買い物に困る人のことで、高齢者や人口の少ない地域に多く見られます。"},
{"id":"B046","u":"ごみ・くらし","lv":"基礎","r":84,"f":"知識","q":"3Rのうち「リデュース」にあてはまるものはどれですか。","c":["マイバッグを持って行き、レジぶくろをもらわない","びん牛乳のびんを洗って、くり返し使う","ペットボトルを回収して、服のせんいにつくりかえる","ごみを燃やした熱で発電する"],"e":"リデュース=ごみになるものをへらす、リユース=くり返し使う、リサイクル=資源としてつくりかえる、です。3Rは「へらす→くり返し使う→つくりかえる」の順に大切とされます。"},
{"id":"B047","u":"ごみ・くらし","lv":"標準","r":62,"f":"まちがい探し","q":"次のうち、リサイクルにあてはまらないものはどれですか。","c":["ビールびんを洗って、何度もびんとして使う","ペットボトルをくだいて、服のせんいにする","古紙を原料に、トイレットペーパーをつくる","アルミ缶をとかして、新しいアルミ缶をつくる"],"e":"びんを洗ってそのまま使うのはリユース(くり返し使う)です。一度とかしたりくだいたりして別の物につくりかえるのがリサイクルです。"},
{"id":"B048","u":"ごみ・くらし","lv":"基礎","r":80,"f":"知識","q":"燃えるごみを燃やして処理する施設はどれですか。","c":["清掃工場","最終処分場","浄水場","下水処理場"],"e":"清掃工場で燃やしたあとの灰は、最終処分場にうめ立てられたり、リサイクルされたりします。浄水場・下水処理場は水をきれいにする施設です。"},
{"id":"B049","u":"ごみ・くらし","lv":"標準","r":60,"f":"2文の正誤","q":"次のI・IIの文の正誤の組み合わせとして正しいものはどれですか。\nI 清掃工場では、ごみを燃やしたときの熱を利用して発電をしているところがある。\nII 清掃工場でごみを燃やしたあとの灰は、最終処分場にうめ立てられたり、リサイクルされたりする。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"どちらも正しい文です。最終処分場はうめ立てる場所がかぎられているので、灰をセメントなどの原料にリサイクルして、うめ立てる量をへらしています。"},
{"id":"B050","u":"ごみ・くらし","lv":"標準","r":58,"f":"知識","q":"グリーンマークが表しているものとして正しいものはどれですか。","c":["古紙を原料に使った製品であること","古紙として回収に出すものであること","プラスチック製の容器や包装であること","環境にやさしい商品全般であること"],"e":"グリーンマークは古紙を利用した製品につけられる表示で、回収用のマークではありません。環境にやさしい商品全般を表すのはエコマークです。"},
{"id":"B051","u":"ごみ・くらし","lv":"応用","r":46,"f":"まちがい探し","q":"プラマークについての説明として、ふさわしくないものはどれですか。","c":["文房具やおもちゃなど、プラスチックでできたすべての製品につけられている","プラスチック製の容器や包装につけられている","分別して出すと、資源として回収される","ペットボトルには、プラマークとは別のマークがつけられている"],"e":"プラマークは、商品を入れる容器や包装に使われたプラスチックにつけられるマークです。ペットボトルには別のPETボトルのマークがあります。"},
{"id":"B052","u":"ごみ・くらし","lv":"過去問型","r":42,"f":"資料の読み取り","q":"次の表は、ある市の燃えるごみ用ふくろのねだんです。1Lあたりのねだんが最も安いふくろはどれですか。","c":["5Lのふくろ","10Lのふくろ","20Lのふくろ","45Lのふくろ"],"e":"1Lあたりは、5L=80÷5=16円、10L=17円、20L=18円、45L=19円で、小さいふくろほど安くなります。大きいほうが得とは限らないので、必ずわり算で比べましょう。","tb":[["ふくろの大きさ","1まいのねだん"],["5L","80円"],["10L","170円"],["20L","360円"],["45L","855円"]]},
{"id":"B053","u":"ごみ・くらし","lv":"標準","r":55,"f":"資料の読み取り","q":"次の表は、ある市でごみぶくろを有料にする前と後の、1人が1年間に出したごみの量です。有料化の後、ごみの量は何割へりましたか。","c":["2割","6割","8割","3割"],"e":"300kgから240kgへ60kgへったので、60÷300=0.2で2割です。有料化には、ごみをへらす意識を高めてもらうねらいがあります。","tb":[["","1人1年あたりのごみの量"],["有料化の前","300kg"],["有料化の後","240kg"]]},
{"id":"B054","u":"ごみ・くらし","lv":"標準","r":68,"f":"知識","q":"たんすやテーブルなど、大きくて決められたごみぶくろに入らないごみを何といいますか。","c":["粗大ごみ","不燃ごみ","資源ごみ","可燃ごみ"],"e":"粗大ごみは、多くの市町村で申しこみをして手数料を払い、出す日を決めて回収してもらいます。"},
{"id":"B055","u":"ごみ・くらし","lv":"標準","r":58,"f":"資料の読み取り","q":"次の表は、ある市のごみの量(万t)の移り変わりです。表から読み取れることとして正しいものはどれですか。","c":["出したごみの量はへったが、リサイクルされた量はふえた","うめ立てた量は2倍にふえた","出したごみの量は半分以下になった","2020年は、リサイクルされた量が出したごみの量の半分をこえた"],"e":"出したごみは50から40へへり、リサイクルは5から10へふえ、うめ立ては10から3へ大きくへりました。10は40の半分(20)より少ないので、最後の文はまちがいです。","tb":[["年","出したごみ","リサイクルされた量","うめ立てた量"],["2000年","50","5","10"],["2020年","40","10","3"]]},
{"id":"B056","u":"ごみ・くらし","lv":"過去問型","r":40,"f":"記述のことば","q":"「最終処分場にうめ立てるごみの量がへってきた理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["出すごみの量全体がへった・燃やした灰をリサイクルする","市町村が工夫した・だんだん・へってきた","清掃工場がふえた・ごみをたくさん燃やす","最終処分場が広くなった・うめ立てる場所がふえた"],"e":"「市町村の工夫でへった」だけでは、何がへったのか決め手がありません。「ごみの量全体がへった」「灰をリサイクルするようになった」と具体的に書きましょう。"},
{"id":"B057","u":"ごみ・くらし","lv":"標準","r":62,"f":"知識","q":"家庭や工場で使ってよごれた水をきれいにして、川や海にもどす施設はどれですか。","c":["下水処理場","浄水場","清掃工場","ダム"],"e":"下水処理場=使ったよごれた水をきれいにして川や海へ、浄水場=川やダムの水を飲める水にして家庭へ、と水の流れの「後」と「前」で区別しましょう。"},
{"id":"B058","u":"ごみ・くらし","lv":"応用","r":50,"f":"2文の正誤","q":"次のI・IIの文の正誤の組み合わせとして正しいものはどれですか。\nI 下水処理場では、川やダムからとり入れた水をきれいにして、飲める水にしている。\nII 浄水場できれいにされた水は、水道管を通って家庭に送られる。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"川やダムの水を飲める水にするのは浄水場です。下水処理場は使ったあとのよごれた水をきれいにして川や海にもどします。"},
{"id":"B059","u":"ごみ・くらし","lv":"標準","r":66,"f":"知識","q":"ハザードマップの説明として正しいものはどれですか。","c":["災害が起きたときに被害が予想される場所や、ひなん場所などを示した地図","道路の渋滞が起きやすい場所を示した地図","過去に起きた地震の震源をまとめた地図","土地の高さを等高線で表した地図"],"e":"ハザードマップは市町村などがつくり、洪水・土砂くずれ・津波などの危険な場所やひなん場所・ひなん経路を示しています。等高線で土地の高さを表すのは地形図です。"},
{"id":"B060","u":"ごみ・くらし","lv":"標準","r":62,"f":"知識","q":"災害のとき、近所の人どうしで声をかけ合い、助け合ってひなんすることを何といいますか。","c":["共助","自助","公助","救助"],"e":"自助=自分や家族の身は自分で守る、共助=地域の人どうしで助け合う、公助=国や市町村などが助ける、です。「自分・みんな・おおやけ」で覚えましょう。"},
{"id":"B061","u":"ごみ・くらし","lv":"応用","r":46,"f":"2文の正誤","q":"次のI・IIの文の正誤の組み合わせとして正しいものはどれですか。\nI 家に水や食料をたくわえておくことは「公助」にあたる。\nII 国や市町村が避難所を用意し、救助活動をすることは「共助」にあたる。","c":["Iも IIもまちがっている","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい"],"e":"自分で水や食料を備えるのは「自助」、国や市町村が行うのは「公助」です。「共助」は地域の人どうしの助け合いです。"},
{"id":"B062","u":"ごみ・くらし","lv":"過去問型","r":40,"f":"まちがい探し","q":"スーパーマーケットの駐車場にある、車いすマークがかかれた区画についての説明として、ふさわしくないものはどれですか。","c":["車いすを貸し出している場所であることを示している","体の不自由な人などが使うための駐車スペースである","店の出入口の近くにつくられることが多い","車いすで乗りおりしやすいように、ふつうより広くつくられている"],"e":"駐車場の車いすマークは、体の不自由な人のための駐車スペースを表します。車いす置き場や貸し出し場所を表すものではありません。"},
{"id":"B063","u":"ごみ・くらし","lv":"標準","r":64,"f":"知識","q":"段差の横にゆるやかなスロープをつけるなど、高齢者や障がいのある人のさまたげになるものをとりのぞくことを何といいますか。","c":["バリアフリー","ユニバーサルデザイン","リサイクル","ハザードマップ"],"e":"バリア(さまたげ)をフリー(なくす)するのがバリアフリーです。ユニバーサルデザインは、はじめからだれもが使いやすいようにつくる考え方です。"},
{"id":"B064","u":"ごみ・くらし","lv":"標準","r":60,"f":"まちがい探し","q":"目の不自由な人のための設備として、ふさわしくないものはどれですか。","c":["車いすでも入れる広い個室トイレ","駅のホームや歩道にある点字ブロック","音が出て青になったことを知らせる信号機","点字がついた案内板やエレベーターのボタン"],"e":"広い個室トイレは、主に車いすを使う人などのための設備です。目の不自由な人のためには、さわったり音で知らせたりする工夫がされています。"},
{"id":"B065","u":"ごみ・くらし","lv":"応用","r":46,"f":"記述のことば","q":"「夏に地面に打ち水をするとすずしくなる理由」を書くとき、必ず入れたい言葉の組み合わせはどれですか。","c":["まいた水・蒸発する・まわりの熱をうばう","まいた水・冷たい・ほこりがたたない","すだれ・日差し・さえぎる","風・とおる・しめり気"],"e":"まいた水が蒸発するときにまわりの熱をうばうので、地面や空気の温度が下がります。すだれ・よしずは日差しをさえぎる、別の暑さ対策です。"},
{"id":"C001","u":"国土と気候","lv":"基礎","r":85,"f":"知識","q":"冬に日本海側で雪が多くなる原因の季節風は、どの方角からふいてくるか。","c":["北西","南東","北東","南西"],"e":"冬の季節風はユーラシア大陸から日本海をわたって北西からふき、山地にぶつかって日本海側に雪を降らせる。夏の季節風は太平洋から南東からふくので「冬=北西・夏=南東」とセットで覚える。"},
{"id":"C002","u":"国土と気候","lv":"標準","r":60,"f":"2文の正誤","q":"季節風について、次の2つの文の正誤を答えなさい。\nI 夏の季節風は太平洋から南東の方角からふき、太平洋側に多くの雨を降らせる。\nII 冬の季節風は日本海をわたるとき、水分を失ってかわいた風になる。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"冬の季節風は日本海をわたるときに水分をふくんで「しめった風」になり、日本海側に雪を降らせる。かわいた風になるのは山地をこえたあとの太平洋側。"},
{"id":"C003","u":"国土と気候","lv":"基礎","r":80,"f":"知識","q":"瀬戸内海ぞいの地域で一年を通して降水量が少ないのは、どの山地が季節風をさえぎるからか。","c":["中国山地と四国山地","紀伊山地と四国山地","中国山地と九州山地","越後山脈と奥羽山脈"],"e":"夏の南東の季節風は四国山地に、冬の北西の季節風は中国山地にさえぎられるため、瀬戸内には一年中かわいた風がふく。中央高地も同じしくみで雨が少ない。"},
{"id":"C004","u":"国土と気候","lv":"基礎","r":82,"f":"資料の読み取り","q":"次の表は4つの都市の気温と降水量の平年値です。北海道の気候に属する札幌市はどれか。","c":["表のB","表のA","表のC","表のD"],"e":"1月の平均気温が0℃を下回り、年降水量が少ないBが札幌市。Aは東京、Cは1月でも17℃をこえる那覇、Dは雨の少ない高松。","tb":[["","1月の気温","8月の気温","年降水量"],["A","5.4℃","26.9℃","1598mm"],["B","-3.2℃","22.3℃","1146mm"],["C","17.3℃","29.0℃","2161mm"],["D","5.9℃","28.6℃","1150mm"]]},
{"id":"C005","u":"国土と気候","lv":"標準","r":70,"f":"資料の読み取り","q":"次の表は4つの都市の降水量の平年値です。日本海側の気候に属する金沢市はどれか。","c":["表のC","表のA","表のB","表のD"],"e":"1月(冬)の降水量が8月より多いCが日本海側の金沢市。北西の季節風が雪を降らせるため冬に降水量が多くなる。Dの那覇は年降水量は多いが夏に多い。","tb":[["","1月の降水量","8月の降水量","年降水量"],["A","60mm","155mm","1598mm"],["B","39mm","87mm","1150mm"],["C","256mm","179mm","2402mm"],["D","101mm","241mm","2161mm"]]},
{"id":"C006","u":"国土と気候","lv":"標準","r":62,"f":"資料の読み取り","q":"次の表は4つの都市の気温と降水量の平年値です。中央高地の気候に属する長野県松本市はどれか。","c":["表のB","表のA","表のC","表のD"],"e":"年降水量が少なく、1月の気温が0℃を下回るBが松本市。Aの高松も雨は少ないが、海に近く標高も低いので冬があたたかい。","tb":[["","1月の気温","8月の気温","年降水量"],["A","5.9℃","28.6℃","1150mm"],["B","-0.3℃","25.1℃","1045mm"],["C","2.8℃","26.6℃","1845mm"],["D","5.4℃","26.9℃","1598mm"]]},
{"id":"C007","u":"国土と気候","lv":"応用","r":50,"f":"資料の読み取り","q":"次の表は4つの都市の気温と降水量の平年値です。瀬戸内の気候に属する岡山市はどれか。","c":["表のC","表のA","表のB","表のD"],"e":"年降水量が少なく、1月の気温が0℃を上回るCが岡山市。Aは雨が少ないが冬に0℃を下回る中央高地の長野市、Dは夏の降水量が多い太平洋側の東京。","tb":[["","1月の気温","8月の気温","8月の降水量","年降水量"],["A","-0.6℃","25.2℃","98mm","965mm"],["B","2.8℃","26.6℃","141mm","1845mm"],["C","4.9℃","28.3℃","98mm","1143mm"],["D","5.4℃","26.9℃","155mm","1598mm"]]},
{"id":"C008","u":"国土と気候","lv":"標準","r":68,"f":"資料の読み取り","q":"次の表は4つの都市の気温と降水量の平年値です。紀伊半島の東側にある三重県尾鷲市はどれか。","c":["表のB","表のA","表のC","表のD"],"e":"年降水量が3000mmをこえるBが尾鷲市。夏の南東の季節風が紀伊山地にぶつかり、日本有数の多雨地帯になっている。","tb":[["","1月の気温","8月の気温","8月の降水量","年降水量"],["A","5.4℃","26.9℃","155mm","1598mm"],["B","6.5℃","26.7℃","375mm","3849mm"],["C","17.3℃","29.0℃","241mm","2161mm"],["D","4.0℃","27.3℃","179mm","2402mm"]]},
{"id":"C009","u":"国土と気候","lv":"過去問型","r":30,"f":"資料の読み取り","q":"次の表は4つの地点の気温と降水量の平年値です。キャベツの高原野菜づくりがさかんな群馬県嬬恋村はどれか。","c":["表のB","表のA","表のC","表のD"],"e":"標高が高いため冬は最も寒く8月も20℃前後とすずしく、冬の降水量が少ないBが嬬恋村。Aの札幌は冬の降水(雪)が多く、8月は嬬恋村より少し暑い。","tb":[["","1月の気温","8月の気温","1月の降水量","年降水量"],["A","-3.2℃","22.3℃","108mm","1146mm"],["B","-4.5℃","19.6℃","38mm","1503mm"],["C","5.4℃","26.9℃","60mm","1598mm"],["D","2.8℃","26.6℃","186mm","1845mm"]]},
{"id":"C010","u":"国土と気候","lv":"応用","r":48,"f":"資料の読み取り","q":"表のX・Yは、岩手県宮古市と秋田県秋田市のどちらかです。宮古市にあたるものと、夏がすずしい理由の正しい組み合わせはどれか。","c":["表のX・寒流の千島海流(親潮)","表のY・寒流の千島海流(親潮)","表のX・暖流の対馬海流","表のY・暖流の対馬海流"],"e":"8月の気温が低いXが太平洋側の宮古市で、沖を流れる寒流の千島海流(親潮)の影響ですずしい。日本海側の秋田市は暖流の対馬海流の影響で宮古市よりあたたかい。","tb":[["","年平均気温","8月の気温","年降水量"],["X","10.8℃","22.1℃","1371mm"],["Y","12.1℃","25.0℃","1742mm"]]},
{"id":"C011","u":"国土と気候","lv":"応用","r":50,"f":"資料の読み取り","q":"次の表は4つの都市の1月と7月の日照時間(日が照った時間)です。冬に雪やくもりの日が多い日本海側の金沢市はどれか。","c":["表のB","表のA","表のC","表のD"],"e":"1月の日照時間が極端に少ないBが金沢市。冬の北西の季節風が雪雲を運ぶため日本海側は冬に日が照らない。太平洋側や瀬戸内は冬にかわいた風がふき、晴れの日が多い。","tb":[["","1月の日照時間","7月の日照時間"],["A","193時間","153時間"],["B","62時間","175時間"],["C","190時間","205時間"],["D","145時間","210時間"]]},
{"id":"C012","u":"国土と気候","lv":"標準","r":65,"f":"知識","q":"山をこえて山のふもとにふき下りてきた風が、かわいて高温になる現象を何というか。","c":["フェーン現象","やませ","ヒートアイランド現象","からっ風"],"e":"フェーン現象では山をこえた側の気温が「上がる」。夏に奥羽山脈をこえた風で秋田など日本海側が高温になるのが代表例。"},
{"id":"C013","u":"国土と気候","lv":"過去問型","r":40,"f":"2文の正誤","q":"東北地方の気候について、次の2つの文の正誤を答えなさい。\nI 夏に奥羽山脈をこえた風がふき下りると、フェーン現象によって秋田平野の気温が下がる。\nII 夏に東北地方の太平洋側にふく冷たい風は、寒流の千島海流の上を通ってくる。","c":["Iはまちがっているが、IIは正しい","Iも IIも正しい","Iは正しいが、IIはまちがっている","Iも IIもまちがっている"],"e":"フェーン現象では山をこえた側の気温が「上がる」ので I はまちがい。II のやませは千島海流(親潮)の上を通ってくるので冷たい。"},
{"id":"C014","u":"国土と気候","lv":"標準","r":70,"f":"知識","q":"夏に東北地方の太平洋側にふく冷たい風「やませ」は、どの方角からふいてくるか。","c":["北東","南西","北西","南東"],"e":"やませは北東からふいてきて南西へ向かう。冬の季節風の「北西」と取りちがえないこと。"},
{"id":"C015","u":"国土と気候","lv":"過去問型","r":42,"f":"知識","q":"やませは、どの方角へ向かってふいていく風か。","c":["南西","北東","南東","北西"],"e":"やませは北東から「ふいてくる」風なので、「ふいていく」方角は反対の南西。問題文が「くる」か「いく」かを必ず確認する。"},
{"id":"C016","u":"国土と気候","lv":"標準","r":60,"f":"2文の正誤","q":"やませについて、次の2つの文の正誤を答えなさい。\nI やませは夏に北東の方角からふいてくる、しめった冷たい風である。\nII やませがふき続けると気温が上がり、米の収かく量が多くなる。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"やませがふくと気温が上がらず、日照も少なくなり冷害が起こって米の収かく量が減る。そのため寒さに強い品種の改良が進められた。"},
{"id":"C017","u":"国土と気候","lv":"基礎","r":88,"f":"資料の読み取り","q":"次の表は4つの都市の気温と降水量の平年値です。南西諸島の気候に属する那覇市はどれか。","c":["表のC","表のA","表のB","表のD"],"e":"1月でも17℃をこえ一年中あたたかいCが那覇市。年降水量はDの尾鷲の方が多いので、雨の量だけで判断しないこと。","tb":[["","1月の気温","8月の気温","年降水量"],["A","5.9℃","28.6℃","1150mm"],["B","5.4℃","26.9℃","1598mm"],["C","17.3℃","29.0℃","2161mm"],["D","6.5℃","26.7℃","3849mm"]]},
{"id":"C018","u":"国土と気候","lv":"標準","r":62,"f":"まちがい探し","q":"日本の気候区分について説明した文として、まちがっているものはどれか。","c":["北海道の気候は、梅雨の時期に雨が多く、夏は暑い。","日本海側の気候は、冬に雪が多く降る。","南西諸島の気候は、一年を通してあたたかく、台風の通り道になりやすい。","太平洋側の気候は、夏に雨が多く、冬は晴れてかんそうする。"],"e":"北海道には梅雨がほとんどなく、夏もすずしいので1つ目がまちがい。北海道は台風の影響も受けにくい。"},
{"id":"C019","u":"国土と気候","lv":"標準","r":58,"f":"まちがい探し","q":"中央高地の気候について説明した文として、まちがっているものはどれか。","c":["海に近いので、夏と冬の気温差が小さい。","まわりを山に囲まれ、一年を通して降水量が少ない。","標高が高いので、同じくらいの緯度の地域より気温が低い。","冬の寒さがきびしく、1月の平均気温が0℃を下回る地点もある。"],"e":"中央高地は海から遠い内陸にあるので、夏と冬の気温差が大きい。地面はあたたまりやすく冷めやすいためである。"},
{"id":"C020","u":"国土と気候","lv":"標準","r":55,"f":"記述のことば","q":"「瀬戸内海ぞいの地域は一年を通して降水量が少ない。その理由を説明しなさい」という問題で、解答に必ず入れたいことばの組み合わせはどれか。","c":["中国山地・四国山地・季節風をさえぎる","瀬戸内海・暖流・気温が高い","季節風・梅雨・台風が少ない","中国山地・冬の季節風・雪が降る"],"e":"夏の季節風を四国山地が、冬の季節風を中国山地がさえぎるため、一年中かわいた風がふく。2つの山地と「さえぎる」が決め手。"},
{"id":"C021","u":"国土と気候","lv":"標準","r":58,"f":"記述のことば","q":"「日本海側で冬に雪が多い理由」を説明するとき、必ず入れたいことばの組み合わせはどれか。","c":["北西の季節風・日本海で水分をふくむ・山地にぶつかる","南東の季節風・太平洋で水分をふくむ・山地にぶつかる","北西の季節風・かわいた風・気温が下がる","対馬海流・気温が高い・雪がとける"],"e":"大陸からの北西の季節風が日本海で水分をふくんでしめった風になり、山地にぶつかって雪を降らせる。方角と「水分をふくむ」「山地」の3つがそろって説明になる。"},
{"id":"C022","u":"国土と気候","lv":"基礎","r":78,"f":"まちがい探し","q":"日本の国土について説明した文として、まちがっているものはどれか。","c":["国土の約4分の3が平地(平野や盆地)である。","国土の約3分の2が森林である。","日本でいちばん広い平野は関東平野である。","日本は約1万4千の島々からなる。"],"e":"国土の約4分の3は山地(丘陵地をふくむ)で、平地は約4分の1しかない。森林は約3分の2なので、山地と森林の割合を取りちがえないこと。"},
{"id":"C023","u":"国土と気候","lv":"基礎","r":76,"f":"知識","q":"日本でいちばん長い川はどれか。","c":["信濃川","利根川","石狩川","木曽川"],"e":"いちばん長いのは信濃川(367km)。利根川は流域面積(雨水が集まる範囲)が日本一で、「長さ=信濃川・流域面積=利根川」と区別する。"},
{"id":"C024","u":"国土と気候","lv":"基礎","r":80,"f":"まちがい探し","q":"日本の川の特色として、ふさわしくないものはどれか。","c":["外国の川にくらべて長く、流れがゆるやかである。","かたむきが急で、雨が降るとすぐに海へ流れ出る。","梅雨や台風の時期に水の量が大きくふえる。","いちばん長い信濃川でも400kmに満たない。"],"e":"日本の川は国土がせまく山地が多いため、外国の川にくらべて短く流れが急である。"},
{"id":"C025","u":"国土と気候","lv":"標準","r":65,"f":"2文の正誤","q":"川がつくる地形について、次の2つの文の正誤を答えなさい。\nI 扇状地は、川が山地から平地に出るところに土砂が積もってできる。\nII 三角州は、川の上流の山あいに土砂が積もってできる。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"三角州は川の河口付近にできる地形(広島市など)。扇状地は山のふもと(甲府盆地など)にでき、果樹園に利用される。"},
{"id":"C026","u":"国土と気候","lv":"標準","r":64,"f":"まちがい探し","q":"日本のまわりを流れる海流について、まちがっているものはどれか。","c":["対馬海流は寒流で、日本海を北へ流れる。","日本海流(黒潮)は暖流で、太平洋側を北へ流れる。","千島海流(親潮)は寒流で、プランクトンが多い。","リマン海流は寒流で、日本海を南へ流れる。"],"e":"対馬海流は暖流。暖流=日本海流(黒潮)・対馬海流、寒流=千島海流(親潮)・リマン海流と2つずつ覚える。"},
{"id":"C027","u":"国土と気候","lv":"基礎","r":75,"f":"2文の正誤","q":"日本の海岸について、次の2つの文の正誤を答えなさい。\nI 三陸海岸の南部は、のこぎりの歯のように入り組んだリアス海岸である。\nII 千葉県の九十九里浜は、入り組んだリアス海岸である。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"九十九里浜は約66kmも続く砂浜海岸で、海水浴に利用される。リアス海岸は谷に海が入りこんでできた海岸で、波がおだやかで港に向く。"},
{"id":"C028","u":"国土と気候","lv":"標準","r":60,"f":"まちがい探し","q":"気候区分と、その気候に属する都市の組み合わせとして、まちがっているものはどれか。","c":["瀬戸内の気候-高知市","日本海側の気候-新潟市","中央高地の気候-長野市","太平洋側の気候-東京"],"e":"高知市は四国山地の南側にあり、夏の南東の季節風で雨が多い太平洋側の気候。瀬戸内の気候は高松市・岡山市など。"},
{"id":"C029","u":"国土と気候","lv":"標準","r":63,"f":"2文の正誤","q":"日本の雨について、次の2つの文の正誤を答えなさい。\nI 東京で9月の降水量が多いのは、台風の影響を受けるからである。\nII 北海道は梅雨の影響を強く受けるので、6月の降水量がとくに多い。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"6・7月は梅雨、9月は台風で太平洋側の降水量がふえる。北海道には梅雨がほとんどなく、6月の降水量は少ない。"},
{"id":"C030","u":"国土と気候","lv":"応用","r":50,"f":"記述のことば","q":"「日本の川が外国の川にくらべて短く、流れが急である理由」を説明するとき、必ず入れたいことばの組み合わせはどれか。","c":["国土がせまい・山地が多い・山から海までのきょりが短い","雨が多い・梅雨・台風","国土が南北に長い・気候がちがう","川の数が多い・ダムが多い・水が少ない"],"e":"国土がせまく山地が多いので、山から海までが近く、かたむきも急になる。「雨が多い」は水量の変化の理由で、短く急な理由にはならない。"},
{"id":"C031","u":"地図の見方","lv":"基礎","r":78,"f":"資料の読み取り","q":"2万5千分の1の地形図で、2つの建物の間が4cmありました。実際のきょりは何kmか。","c":["1km","100m","2km","10km"],"e":"4cm×25000=100000cm=1000m=1km。地図上の長さ×縮尺の分母=実際のきょり。cm→m→kmの単位直しに注意。"},
{"id":"C032","u":"地図の見方","lv":"標準","r":66,"f":"資料の読み取り","q":"5万分の1の地形図で、地図上の長さが3cmのとき、実際のきょりは何mか。","c":["1500m","750m","150m","15000m"],"e":"3cm×50000=150000cm=1500m。750mは2万5千分の1で計算した場合の答え。"},
{"id":"C033","u":"地図の見方","lv":"標準","r":62,"f":"資料の読み取り","q":"実際のきょりが2kmの道は、2万5千分の1の地形図では何cmで表されるか。","c":["8cm","4cm","80cm","0.8cm"],"e":"2km=200000cm、200000÷25000=8cm。実際のきょり÷縮尺の分母=地図上の長さ。5万分の1なら4cmになる。"},
{"id":"C034","u":"地図の見方","lv":"応用","r":50,"f":"資料の読み取り","q":"5万分の1の地図上で6cmの道のりを、2万5千分の1の地図で表すと何cmになるか。","c":["12cm","3cm","6cm","24cm"],"e":"実際のきょりは6×50000=300000cm=3km。2万5千分の1では300000÷25000=12cm。分母が半分の地図は、同じきょりが2倍の長さでかかれる。"},
{"id":"C035","u":"地図の見方","lv":"標準","r":63,"f":"知識","q":"2万5千分の1の地形図で、細い等高線(主曲線)は何mごとに引かれているか。","c":["10m","20m","50m","100m"],"e":"2万5千分の1では細い線が10mごと、太い線(計曲線)が50mごと。5万分の1では細い線が20mごと、太い線が100mごと。"},
{"id":"C036","u":"地図の見方","lv":"標準","r":60,"f":"まちがい探し","q":"等高線について説明した文として、まちがっているものはどれか。","c":["等高線の間かくがせまいところほど、かたむきがゆるやかである。","等高線は、海面からの高さが等しいところを結んだ線である。","同じ等高線の上にある地点は、同じ標高である。","海の深さを表す線は等深線という。"],"e":"等高線の間かくがせまいほどかたむきは急、広いほどゆるやか。"},
{"id":"C037","u":"地図の見方","lv":"応用","r":52,"f":"知識","q":"5万分の1の地形図で、太い等高線(計曲線)は何mごとに引かれているか。","c":["100m","50m","20m","200m"],"e":"5万分の1は細い線20mごと・太い線100mごと。2万5千分の1(細い線10m・太い線50m)のちょうど2倍と覚える。"},
{"id":"C038","u":"地図の見方","lv":"応用","r":45,"f":"2文の正誤","q":"地形図の等高線について、次の2つの文の正誤を答えなさい。\nI 5万分の1の地形図では、細い等高線が20mごとに引かれている。\nII 谷は、等高線が標高の低い方へ向かってはり出しているところである。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"等高線が低い方へはり出しているのは尾根。谷は等高線が高い方へ食いこんでいるところ。"},
{"id":"C039","u":"地図の見方","lv":"基礎","r":85,"f":"知識","q":"八方位で「北東」の反対の方位はどれか。","c":["南西","南東","北西","南南西"],"e":"北の反対は南、東の反対は西なので北東の反対は南西。南南西は南と南西の間の十六方位。"},
{"id":"C040","u":"地図の見方","lv":"標準","r":70,"f":"知識","q":"十六方位で、北と北東のちょうど間の方位はどれか。","c":["北北東","東北東","北東北","東北"],"e":"十六方位では、北と北東の間を「北北東」、北東と東の間を「東北東」という。近い方の四方位を先につける。"},
{"id":"C041","u":"地図の見方","lv":"応用","r":42,"f":"資料の読み取り","q":"ある地図の方位記号の矢印が、地図の右を向いていました。この地図の上はどの方位か。","c":["西","東","南","北"],"e":"矢印の向き(右)が北。北から時計回りに東・南・西なので、東が下、南が左、西が上になる。"},
{"id":"C042","u":"地図の見方","lv":"基礎","r":80,"f":"知識","q":"消防署の地図記号は、昔の火消しが使った道具の形がもとになっている。その道具は何か。","c":["さすまた","警棒","まとい","歯車"],"e":"消防署はさすまた、警察署は交差した警棒。交番は警棒を交差させた「×」の形。"},
{"id":"C043","u":"地図の見方","lv":"基礎","r":82,"f":"知識","q":"郵便局の地図記号「〒」は、明治時代に郵便を担当した役所の名前の頭文字「テ」がもとになっている。その役所はどれか。","c":["逓信省","大蔵省","郵政省","内務省"],"e":"郵便局の記号は逓信省(ていしんしょう)の「テ」を図案化したもの。"},
{"id":"C044","u":"地図の見方","lv":"標準","r":66,"f":"まちがい探し","q":"地図記号とそのもとになったものの組み合わせとして、まちがっているものはどれか。","c":["畑-稲をかり取ったあとのようす","工場-歯車","果樹園-くだものの実","茶畑-茶の実を輪切りにした形"],"e":"稲をかり取ったあとのようすは田の記号。畑の記号は植物の「ふたば」の形。"},
{"id":"C045","u":"地図の見方","lv":"標準","r":62,"f":"知識","q":"全国の小・中学生から募集したデザインをもとに作られた地図記号はどれか。","c":["老人ホーム","博物館","自然災害伝承碑","図書館"],"e":"老人ホームの記号は、建物の中につえをえがいたもので、小・中学生の募集作品がもとになった(風車の記号も同じ募集から生まれた)。博物館や図書館は募集でできた記号ではない。"},
{"id":"C046","u":"地図の見方","lv":"標準","r":58,"f":"知識","q":"過去に起きた洪水や津波などの災害の教訓を伝える石碑を表すため、記念碑の記号に碑文を加えて新しく作られた地図記号はどれか。","c":["自然災害伝承碑","史跡・名勝・天然記念物","記念碑","城あと"],"e":"自然災害伝承碑は、記念碑の記号にたての線(碑文)を加えた形。国土地理院が災害への備えのために新しく作った。"},
{"id":"C047","u":"地図の見方","lv":"標準","r":64,"f":"知識","q":"メルカトル図法の特色として正しいものはどれか。","c":["角度が正しく表され、航海図に使われる。","面積が正しく表される。","中心からのきょりと方位が正しく表される。","高緯度ほど陸地が小さく表される。"],"e":"メルカトル図法は角度が正しいので航海に使われるが、高緯度ほど面積が大きく表される(グリーンランドが大きく見える)。"},
{"id":"C048","u":"地図の見方","lv":"標準","r":66,"f":"知識","q":"東京からニューヨークまでの正しいきょりと方位を調べるのに最も適した地図はどれか。","c":["東京を中心にした正距方位図法の地図","メルカトル図法の地図","モルワイデ図法の地図","グード図法の地図"],"e":"正距方位図法は、地図の中心からのきょりと方位が正しい。中心を東京にした地図を使う。"},
{"id":"C049","u":"地図の見方","lv":"応用","r":45,"f":"2文の正誤","q":"地図の図法について、次の2つの文の正誤を答えなさい。\nI メルカトル図法は角度が正しいので、航海用の地図に使われてきた。\nII 正距方位図法では、地図上のどの2地点の間のきょりも正しく表される。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"正距方位図法で正しいのは「中心から」のきょりと方位だけ。中心以外の2地点の間のきょりは正しくない。"},
{"id":"C050","u":"地図の見方","lv":"基礎","r":80,"f":"知識","q":"経度0度の経線(本初子午線)が通る都市はどこか。","c":["ロンドン","パリ","ニューヨーク","明石市"],"e":"イギリスの首都ロンドン(旧グリニッジ天文台)を通る経線が経度0度。明石市を通るのは日本の標準時子午線(東経135度)。"},
{"id":"C051","u":"地図の見方","lv":"基礎","r":78,"f":"知識","q":"日本の標準時子午線は東経何度の経線で、どの都市を通るか。","c":["東経135度・兵庫県明石市","東経140度・秋田県大潟村","東経135度・京都府京都市","東経140度・兵庫県明石市"],"e":"日本の時刻の基準は東経135度で、兵庫県明石市を通る。東経140度は八郎潟の干拓地(大潟村)を通る線。"},
{"id":"C052","u":"地図の見方","lv":"過去問型","r":40,"f":"知識","q":"日本最大の干拓地である秋田県の八郎潟では、ある緯線と経線が交わっています。正しい組み合わせはどれか。","c":["北緯40度・東経140度","北緯40度・東経135度","北緯35度・東経140度","北緯45度・東経140度"],"e":"八郎潟では北緯40度と東経140度が交わる。東経135度(明石)と取りちがえないこと。"},
{"id":"C053","u":"地図の見方","lv":"応用","r":48,"f":"資料の読み取り","q":"経度15度で1時間の時差が生じます。イギリスのロンドン(経度0度)が午前2時のとき、日本(東経135度)は何時か。","c":["午前11時","午後5時","午前9時","午後3時"],"e":"135÷15=9時間。日本はロンドンより東にあり時刻が進んでいるので、午前2時+9時間=午前11時。"},
{"id":"C054","u":"地図の見方","lv":"標準","r":66,"f":"2文の正誤","q":"日本の位置について、次の2つの文の正誤を答えなさい。\nI 日本は赤道より北にあるので、北緯で表される。\nII 日本はロンドンを通る経度0度の線より西にあるので、西経で表される。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"日本はロンドンより東にあるので東経で表される(東経約123度~154度)。北緯は約20度~46度。"},
{"id":"C055","u":"地図の見方","lv":"標準","r":60,"f":"記述のことば","q":"「伊能忠敬の日本地図が正確だった理由」を説明するとき、必ず入れたいことばの組み合わせはどれか。","c":["全国・歩いて・測量した","外国・地図・参考にした","江戸幕府・命令・多くの人","人工衛星・写真・使った"],"e":"伊能忠敬は自分の足で全国の海岸線を歩いて測量した(約4万km)。「歩いて測量した」ことが正確さの決め手。"},
{"id":"C056","u":"都道府県・都市","lv":"過去問型","r":32,"f":"知識","q":"政令指定都市のうち、周りを山に囲まれた盆地にある都市はどれか。","c":["京都市","大阪市","名古屋市","神戸市"],"e":"京都市は京都盆地にあり、夏は暑く冬は寒い。大阪市は大阪平野、名古屋市は濃尾平野にある。"},
{"id":"C057","u":"都道府県・都市","lv":"標準","r":65,"f":"知識","q":"政令指定都市の中で、人口が最も多い都市はどれか。","c":["横浜市","大阪市","名古屋市","札幌市"],"e":"人口が最も多い政令指定都市は神奈川県の横浜市(約375万人)。東京23区は政令指定都市ではない。"},
{"id":"C058","u":"都道府県・都市","lv":"過去問型","r":45,"f":"知識","q":"北は日本海、南は瀬戸内海と、2つの海に面した県にある政令指定都市はどれか。","c":["神戸市","広島市","岡山市","京都市"],"e":"兵庫県は北が日本海、南が瀬戸内海に面しており、県庁所在地の神戸市が政令指定都市。広島県・岡山県は瀬戸内海にしか面していない。"},
{"id":"C059","u":"都道府県・都市","lv":"標準","r":62,"f":"知識","q":"政令指定都市の中で、最も南にある都市はどれか。","c":["熊本市","福岡市","北九州市","広島市"],"e":"九州にある政令指定都市は北九州市・福岡市・熊本市の3つで、最も南は熊本市。"},
{"id":"C060","u":"都道府県・都市","lv":"基礎","r":85,"f":"知識","q":"政令指定都市の中で、最も北にある都市はどれか。","c":["札幌市","仙台市","新潟市","さいたま市"],"e":"北海道の道庁所在地である札幌市が最も北の政令指定都市。東北地方の政令指定都市は仙台市だけ。"},
{"id":"C061","u":"都道府県・都市","lv":"応用","r":48,"f":"知識","q":"海に面していない内陸県にある、ただ1つの政令指定都市はどれか。","c":["さいたま市","京都市","相模原市","千葉市"],"e":"埼玉県は内陸県で、さいたま市が政令指定都市。京都府は北が日本海に面しているので内陸県ではない。"},
{"id":"C062","u":"都道府県・都市","lv":"応用","r":50,"f":"知識","q":"県庁所在地ではない政令指定都市はどれか。","c":["浜松市","静岡市","千葉市","新潟市"],"e":"浜松市は静岡県の政令指定都市だが、県庁所在地は静岡市。ほかに川崎市・相模原市・堺市・北九州市も県庁所在地ではない。"},
{"id":"C063","u":"都道府県・都市","lv":"応用","r":45,"f":"知識","q":"政令指定都市が3つあり、全国で最も多い県はどれか。","c":["神奈川県","大阪府","福岡県","静岡県"],"e":"神奈川県には横浜市・川崎市・相模原市の3つがある。大阪府(大阪市・堺市)、福岡県(福岡市・北九州市)、静岡県(静岡市・浜松市)は2つずつ。"},
{"id":"C064","u":"都道府県・都市","lv":"基礎","r":80,"f":"知識","q":"東北地方にある、ただ1つの政令指定都市はどれか。","c":["仙台市","盛岡市","秋田市","福島市"],"e":"東北地方の政令指定都市は宮城県の仙台市だけ。七夕まつりで知られる。"},
{"id":"C065","u":"都道府県・都市","lv":"標準","r":60,"f":"知識","q":"太田川の河口に広がる三角州の上に発達した政令指定都市はどれか。","c":["広島市","岡山市","北九州市","新潟市"],"e":"広島市は太田川の三角州にできた都市。新潟市は信濃川の河口にある。"},
{"id":"C066","u":"都道府県・都市","lv":"標準","r":58,"f":"まちがい探し","q":"政令指定都市について説明した文として、まちがっているものはどれか。","c":["四国地方には政令指定都市が2つある。","政令指定都市は全国に20市ある。","九州地方には政令指定都市が3つある。","中国地方の政令指定都市は岡山市と広島市である。"],"e":"四国地方には政令指定都市が1つもない。九州は北九州市・福岡市・熊本市の3つ。"},
{"id":"C067","u":"都道府県・都市","lv":"標準","r":60,"f":"2文の正誤","q":"政令指定都市について、次の2つの文の正誤を答えなさい。\nI 大阪府には、大阪市と堺市の2つの政令指定都市がある。\nII 福岡県の政令指定都市は、福岡市だけである。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"福岡県には福岡市と北九州市の2つの政令指定都市がある。堺市には日本最大の古墳である大仙古墳がある。"},
{"id":"C068","u":"都道府県・都市","lv":"標準","r":64,"f":"知識","q":"県名と県庁所在地名がちがう県はどれか。","c":["島根県","鳥取県","福井県","長崎県"],"e":"島根県の県庁所在地は松江市。鳥取市・福井市・長崎市は県名と同じ。"},
{"id":"C069","u":"都道府県・都市","lv":"標準","r":62,"f":"まちがい探し","q":"県と県庁所在地の組み合わせとして、まちがっているものはどれか。","c":["三重県-四日市市","滋賀県-大津市","山梨県-甲府市","茨城県-水戸市"],"e":"三重県の県庁所在地は伊勢湾ぞいの津市。四日市市は石油化学工業がさかんな都市だが県庁所在地ではない。"},
{"id":"C070","u":"都道府県・都市","lv":"標準","r":64,"f":"まちがい探し","q":"海に面していない内陸県ではないものはどれか。","c":["三重県","岐阜県","滋賀県","奈良県"],"e":"三重県は伊勢湾や熊野灘に面している。内陸県は栃木・群馬・埼玉・山梨・長野・岐阜・滋賀・奈良の8県。"},
{"id":"C071","u":"都道府県・都市","lv":"応用","r":48,"f":"2文の正誤","q":"内陸県について、次の2つの文の正誤を答えなさい。\nI 関東地方の内陸県は、栃木県・群馬県・埼玉県の3つである。\nII 近畿地方の内陸県は、滋賀県・奈良県・京都府の3つである。","c":["Iは正しいが、IIはまちがっている","Iも IIも正しい","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"京都府は北部が日本海に面しているので内陸県ではない。近畿地方の内陸県は滋賀県と奈良県の2つ。"},
{"id":"C072","u":"都道府県・都市","lv":"標準","r":64,"f":"知識","q":"県名に動物を表す漢字が入っている県の組み合わせとして正しいものはどれか。","c":["熊本県・群馬県・鳥取県・鹿児島県","熊本県・群馬県・鳥取県・徳島県","熊本県・千葉県・鳥取県・鹿児島県","熊本県・群馬県・宮崎県・鹿児島県"],"e":"熊(熊本)・馬(群馬)・鳥(鳥取)・鹿(鹿児島)の4県。徳島の「島」や宮崎の「崎」は動物ではない。"},
{"id":"C073","u":"都道府県・都市","lv":"標準","r":56,"f":"記述のことば","q":"「熊本県・群馬県・鳥取県・鹿児島県に共通する点」を書くとき、必ず入れたいことばの組み合わせはどれか。","c":["県の名前・動物・漢字","九州地方・火山・温泉","県の名前・県庁所在地・同じ","内陸県・海に面していない"],"e":"4県とも県名に動物を表す漢字(熊・馬・鳥・鹿)が入っている。群馬県は内陸県だが、ほかの3県は海に面している。"},
{"id":"C074","u":"都道府県・都市","lv":"標準","r":62,"f":"知識","q":"「蝦夷富士」とよばれる北海道の山はどれか。","c":["羊蹄山","岩木山","大雪山","有珠山"],"e":"蝦夷富士=羊蹄山(北海道)、津軽富士=岩木山(青森県)、伯耆富士=大山(鳥取県)、薩摩富士=開聞岳(鹿児島県)。"},
{"id":"C075","u":"都道府県・都市","lv":"応用","r":52,"f":"知識","q":"「伯耆富士」とよばれる大山がある県はどれか。","c":["鳥取県","島根県","岡山県","広島県"],"e":"伯耆(ほうき)は今の鳥取県西部の昔の国名で、大山は中国地方で最も高い山。"},
{"id":"C076","u":"都道府県・都市","lv":"応用","r":48,"f":"まちがい探し","q":"「〇〇富士」とよばれる山の組み合わせとして、まちがっているものはどれか。","c":["津軽富士-鳥海山","蝦夷富士-羊蹄山","薩摩富士-開聞岳","伯耆富士-大山"],"e":"津軽富士は青森県の岩木山。鳥海山(山形県・秋田県)は出羽富士とよばれる。"},
{"id":"C077","u":"都道府県・都市","lv":"過去問型","r":32,"f":"記述のことば","q":"「東京都が南北にとても長い理由」を書くとき、必ず入れたいことばの組み合わせはどれか。","c":["沖ノ鳥島・日本最南端・東京都に属する","島がはなれている・一番遠い・はかる","南鳥島・日本最東端・東京都に属する","伊豆諸島・小笠原諸島・たくさんある"],"e":"日本最南端の沖ノ鳥島が東京都に属しているため、東京都は南北に長い。「島がはなれている」だけでは決め手がなく、島の名前と「最南端」が必要。"},
{"id":"C078","u":"都道府県・都市","lv":"基礎","r":80,"f":"知識","q":"中部地方には、いくつの県があるか。","c":["9","7","8","6"],"e":"地方ごとの数は、北海道1・東北6・関東7・中部9・近畿7(2府5県)・中国5・四国4・九州8(沖縄をふくむ)。"},
{"id":"C079","u":"都道府県・都市","lv":"基礎","r":75,"f":"2文の正誤","q":"地方区分について、次の2つの文の正誤を答えなさい。\nI 九州地方は、沖縄県をふくめて8つの県からなる。\nII 近畿地方は、2つの府と5つの県からなる。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"九州地方は福岡・佐賀・長崎・熊本・大分・宮崎・鹿児島・沖縄の8県。近畿地方は大阪府・京都府と兵庫・奈良・和歌山・滋賀・三重の5県。"},
{"id":"C080","u":"都道府県・都市","lv":"基礎","r":76,"f":"まちがい探し","q":"県とそれが属する地方の組み合わせとして、まちがっているものはどれか。","c":["新潟県-関東地方","三重県-近畿地方","山口県-中国地方","福島県-東北地方"],"e":"新潟県は中部地方(北陸)に属する。三重県は近畿地方に入ることに注意。"},
{"id":"C081","u":"都道府県・都市","lv":"標準","r":66,"f":"2文の正誤","q":"都道府県について、次の2つの文の正誤を答えなさい。\nI 「府」がつくのは、大阪府と京都府の2つである。\nII 「道」がつくのは、北海道だけである。","c":["Iも IIも正しい","Iは正しいが、IIはまちがっている","Iはまちがっているが、IIは正しい","Iも IIもまちがっている"],"e":"都道府県は都1・道1・府2・県43の合計47。"},
{"id":"C082","u":"都道府県・都市","lv":"標準","r":60,"f":"知識","q":"47都道府県の中で、島の数が最も多い県はどれか。","c":["長崎県","鹿児島県","沖縄県","東京都"],"e":"長崎県は五島列島や対馬・壱岐など多くの島をもち、島の数が全国で最も多い。"},
{"id":"C083","u":"都道府県・都市","lv":"応用","r":50,"f":"知識","q":"都道府県名で最も多く使われている漢字はどれか。","c":["山","島","川","岡"],"e":"「山」は山形・山梨・山口・富山・岡山・和歌山の6つ。「島」は福島・島根・広島・徳島・鹿児島の5つで2番目。"},
{"id":"C084","u":"都道府県・都市","lv":"標準","r":64,"f":"まちがい探し","q":"政令指定都市とそれがある府県の組み合わせとして、まちがっているものはどれか。","c":["浜松市-愛知県","堺市-大阪府","北九州市-福岡県","相模原市-神奈川県"],"e":"浜松市は静岡県にある。静岡県には静岡市と浜松市の2つの政令指定都市がある。"},
{"id":"C085","u":"都道府県・都市","lv":"応用","r":50,"f":"記述のことば","q":"「京都市が夏は暑く、冬は寒い理由」を説明するとき、必ず入れたいことばの組み合わせはどれか。","c":["盆地・まわりを山に囲まれている・海からはなれている","平野・川が多い・海に近い","北西の季節風・雪・日本海","南東の季節風・台風・太平洋"],"e":"京都市は盆地にあり、山に囲まれ海からはなれているため、夏と冬の気温差が大きい。"},

{"id":"C087","u":"世界の中の日本","lv":"応用","r":50,"f":"資料の読み取り","q":"次の表は面積が世界で最も広い4か国の面積と人口です。アメリカ合衆国はどれか。","c":["表のC","表のA","表のB","表のD"],"e":"面積がCとDで近いが、人口が14億人をこえるDは中華人民共和国、約3億4500万人のCがアメリカ合衆国。面積が2位で人口が少ないBはカナダ。","tb":[["","面積","人口"],["A","1710万km²","1億4500万人"],["B","999万km²","4100万人"],["C","983万km²","3億4500万人"],["D","960万km²","14億1900万人"]]},
