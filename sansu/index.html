<script>
// ---- 作図の道具(座標から計算して描く) ----
const D=Math.PI/180;
const P=(x,y)=>({x,y});
const add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y),unit=a=>mul(a,1/len(a));
const dir=deg=>P(Math.cos(deg*D),Math.sin(deg*D)); // 画面座標(下向きが+y)
const seg=(a,b,c='s')=>`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" class="${c}"/>`;
const poly=(pts,c='s')=>`<polygon points="${pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}" class="${c}"/>`;
const txt=(p,t,c='lbl',anchor='middle')=>`<text x="${p.x.toFixed(1)}" y="${(p.y+5).toFixed(1)}" text-anchor="${anchor}" class="${c}">${t}</text>`;
// 頂点の名前を図形の外側に置く
const name=(p,t,center,d=16)=>txt(add(p,mul(unit(sub(p,center)),d)),t);
// 角の印(小さいほうの角)とラベル
function arc(V,A,B,r,label,cls='arc',lr){
  const u1=unit(sub(A,V)),u2=unit(sub(B,V));
  const s=add(V,mul(u1,r)),e=add(V,mul(u2,r));
  const sweep=(u1.x*u2.y-u1.y*u2.x)>0?1:0;
  const bis=unit(add(u1,u2));
  const lp=add(V,mul(bis,lr||r+14));
  return `<path d="M${s.x.toFixed(1)},${s.y.toFixed(1)} A${r},${r} 0 0 ${sweep} ${e.x.toFixed(1)},${e.y.toFixed(1)}" class="${cls}"/>`+(label?txt(lp,label,cls==='arcx'?'lblx':'ang'):'');
}
function right(V,A,B,r=12){const u1=unit(sub(A,V)),u2=unit(sub(B,V));const p1=add(V,mul(u1,r)),p3=add(V,mul(u2,r)),p2=add(p1,mul(u2,r));
  return `<polyline points="${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}" class="arc"/>`}
// 同じ長さの印
function tick(a,b,n=1){const m=mul(add(a,b),.5),u=unit(sub(b,a)),nv=P(-u.y,u.x);let s='';
  for(let i=0;i<n;i++){const c=add(m,mul(u,(i-(n-1)/2)*5));s+=seg(add(c,mul(nv,7)),add(c,mul(nv,-7)),'tick')}return s}
const svg=(w,h,body)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="問題の図">${body}</svg>`;

// ---- 問題 ----
function inter(p1,d1,p2,d2){const den=d1.x*d2.y-d1.y*d2.x,t=((p2.x-p1.x)*d2.y-(p2.y-p1.y)*d2.x)/den;return add(p1,mul(d1,t))}
const PROBS=[
{id:1,cat:'規則性',r:18,unit:'',title:'数字の列',
 q:'1から順に整数をすき間なく並べて、数字の列をつくります。<br>1234567891011121314……<br>左から数えて2026番目の数字は何ですか。',
 ans:7,
 hints:['1けた・2けた・3けたの数で、数字をそれぞれ何個使うか分けて数えよう。','1〜99まででは、9+2×90=189個の数字を使います。残りは3けたの数で、3個ずつ使います。'],
 sol:['1〜9で9個、10〜99で2×90=180個。ここまでで189個。','残りは 2026−189=1837個。3けたの数は1つで3個の数字を使うので、1837÷3=612あまり1。','100から数えて612個目の数(711)までで、ちょうど使い切る。あまりの1個は、次の数712の1けた目。','よって、2026番目の数字は 7。'],
 key:'けた数ごとに分けて数えるのが基本。「わり算のあまり」が、次の数の何けた目かを表すことに気をつけよう。'},
{id:2,cat:'規則性',r:22,unit:'',title:'奇数のピラミッド',
 q:'奇数を、1段目に1個、2段目に2個、3段目に3個……と順に並べます。<br>1段目:1<br>2段目:3, 5<br>3段目:7, 9, 11<br>10段目に並ぶ数の和はいくつですか。',
 ans:1000,
 hints:['1段目、2段目、3段目の和を計算してみよう。何か気づくかな。','1、8、27……は、1×1×1、2×2×2、3×3×3 です。'],
 sol:['1段目の和=1、2段目=3+5=8、3段目=7+9+11=27、4段目=13+15+17+19=64。','和は 1×1×1、2×2×2、3×3×3、4×4×4 と、段の数を3回かけた数になる。','10段目の和は 10×10×10=1000。','(確かめ:9段目までに45個の奇数があるので、10段目は46番目の奇数91から109まで。(91+109)×10÷2=1000)'],
 key:'いくつか書き出して「きまり」を見つけ、最後に別の方法で確かめると安心です。'},
{id:3,cat:'数の性質',r:15,unit:'個',title:'0がいくつ続く?',
 q:'1から100までの整数をすべてかけた数 1×2×3×……×100 は、一の位から0が何個続きますか。',
 ans:24,
 hints:['0が1個できるのは、2と5を1組かけたとき(10)です。','2は5よりずっと多くふくまれるので、5が何個ふくまれるかを数えればよい。25=5×5 に注意。'],
 sol:['0は「2×5=10」から1個ずつできる。2は十分にあるので、5の個数を数える。','5の倍数は 100÷5=20個。','25の倍数(25・50・75・100)は5を2個ふくむので、さらに 100÷25=4個たす。','5は全部で 20+4=24個。よって0は24個続く。'],
 key:'「5の倍数の個数+25の倍数の個数」を忘れずに。25の倍数をたし忘れて20と答えるのが一番多いまちがいです。'},
{id:4,cat:'数の性質',r:25,unit:'',title:'2つのあまり',
 q:'7で割ると3あまり、9で割ると5あまる整数のうち、3けたでいちばん小さい数は何ですか。',
 ans:122,
 hints:['3あまり、5あまり……あと何をたすと割り切れるかな。','7で割って3あまる数に4をたすと7の倍数、9で割って5あまる数に4をたすと9の倍数になります。'],
 sol:['どちらも「あと4で割り切れる」ので、求める数に4をたすと、7でも9でも割り切れる。','7と9の最小公倍数は63なので、求める数は 63の倍数−4。','63−4=59(2けた)、126−4=122(3けた)。','よって 122。'],
 key:'「あまり」がちがっても「不足」がそろっていれば、公倍数からひけば求められます。'},
{id:5,cat:'数の性質',r:20,unit:'個',title:'どれでも割り切れない数',
 q:'1から300までの整数のうち、2でも3でも5でも割り切れない数は何個ありますか。',
 ans:80,
 hints:['2・3・5の最小公倍数は30。1から30までで調べてみよう。','1から30までに、2でも3でも5でも割り切れない数は8個あります(1,7,11,13,17,19,23,29)。'],
 sol:['2・3・5の最小公倍数30ごとに、同じ並び方がくり返される。','1から30までで、2でも3でも5でも割り切れない数は 1,7,11,13,17,19,23,29 の8個。','300÷30=10なので、8×10=80個。'],
 key:'ベン図で数えることもできますが、「最小公倍数のくり返し」を使うと速くて確実です。'},
{id:6,cat:'数の性質',r:12,unit:'個',title:'約数が6個ある数',
 q:'約数がちょうど6個ある2けたの整数は、全部で何個ありますか。',
 ans:16,
 hints:['約数が6個ある数は、「□×□×□×□×□(同じ素数を5回)」か「□×□×○(□と○はちがう素数)」の形です。','2けたで□×□×○になるのは、4×○、9×○、25×○、49×○ の形です(○は□とちがう素数)。'],
 sol:['約数が6個の数は、(ア)同じ素数を5回かけた数か、(イ)□×□×○(□と○はちがう素数)。','(ア)2×2×2×2×2=32 の1個。','(イ)4×○:○=3,5,7,11,13,17,19,23 → 12,20,28,44,52,68,76,92 の8個。9×○:○=2,5,7,11 → 18,45,63,99 の4個。25×○:○=2,3 → 50,75 の2個。49×○:○=2 → 98 の1個。','合計 1+8+4+2+1=16個。'],
 key:'約数の個数は「同じ素数がいくつかけ合わされているか」で決まります。12=2×2×3 の約数は(2+1)×(1+1)=6個。'},
{id:7,cat:'場合の数',r:20,unit:'個',title:'カードで3の倍数',
 q:'0、1、2、3、4 の5枚のカードから3枚を選んで並べ、3けたの整数をつくります。3の倍数は何個できますか。',
 ans:20,
 hints:['3の倍数は、各位の数字の和が3の倍数になる数です。','和が3の倍数になる3枚の組み合わせをすべて書き出そう(4組あります)。0をふくむ組は、百の位に0を置けないことに注意。'],
 sol:['和が3の倍数になる3枚の組:{0,1,2}(3)、{0,2,4}(6)、{1,2,3}(6)、{2,3,4}(9)の4組だけ。','0をふくむ組 {0,1,2}{0,2,4}:百の位は0以外の2通り、残り2通り、1通り → 2×2×1=4個ずつで、8個。','0をふくまない組 {1,2,3}{2,3,4}:3×2×1=6個ずつで、12個。','合計 8+12=20個。'],
 key:'「組み合わせを先に選ぶ→並べ方を数える」の2段階で。0は百の位に来られないので、0をふくむ組は別に数えます。'},
{id:8,cat:'場合の数',r:28,unit:'通り',title:'通れない交差点',
 q:'図のような道があります。AからBまで遠回りせずに行く道順は何通りありますか。ただし、×の交差点は通れません。',
 fig(){const ox=50,oy=230,c=70;let b='';
   for(let i=0;i<=4;i++)b+=seg(P(ox+i*c,oy),P(ox+i*c,oy-3*c));
   for(let j=0;j<=3;j++)b+=seg(P(ox,oy-j*c),P(ox+4*c,oy-j*c));
   const X=P(ox+2*c,oy-c);b+=seg(add(X,P(-9,-9)),add(X,P(9,9)),'arcx')+seg(add(X,P(-9,9)),add(X,P(9,-9)),'arcx');
   b+=`<circle cx="${ox}" cy="${oy}" r="5" class="dot"/><circle cx="${ox+4*c}" cy="${oy-3*c}" r="5" class="dot"/>`;
   b+=txt(P(ox-16,oy+16),'A')+txt(P(ox+4*c+16,oy-3*c-14),'B');
   return svg(380,260,b)},
 ans:17,
 hints:['交差点ごとに「そこまで行く道順の数」を書きこんでいこう(となりの2つの数をたす)。','×の交差点には0を書きます。'],
 sol:['Aから右と上にだけ進む。各交差点に、左と下の交差点の数をたした数を書いていく。','×の交差点は0とする。','B(右に4、上に3)にたどりつく数は17。','(別の考え方:全部で35通り。×を通る道順は 3×6=18通り。35−18=17通り)'],
 key:'「たし算で道順を書きこむ」方法なら、通れない点や通らなければならない点があっても確実に数えられます。図に書きこんでみよう。'},
{id:9,cat:'和と差',r:30,unit:'個',title:'3人のおはじき',
 q:'A、B、Cの3人がおはじきを合わせて120個持っています。AはBの2倍より6個多く、CはBより10個少なく持っています。Aは何個持っていますか。',
 ans:68,
 hints:['Bの個数を「①」として、AとCを①を使って表そう。','A=②+6、C=①−10 です。3人の合計は④+6−10。'],
 sol:['Bを①とすると、A=②+6、C=①−10。','合計は ①+②+6+①−10=④−4=120。','④=124 なので ①=31。','A=31×2+6=68(個)。'],
 key:'いちばん小さい量や、ほかの2人の基準になっている人を①にすると、式がかんたんになります。'},
{id:10,cat:'和と差',r:24,unit:'円',title:'くだものの値段',
 q:'りんご2個とみかん1個で290円、みかん2個とかき1個で180円、かき2個とりんご1個で280円です。みかん1個は何円ですか。',
 ans:50,
 hints:['3つの式を全部たすと、りんご・みかん・かきがそれぞれ何個になるかな。','3つの式をたすと、りんご3個・みかん3個・かき3個で750円。1個ずつだと250円です。'],
 sol:['3つの式をたすと、りんご3個+みかん3個+かき3個=290+180+280=750円。','りんご1個+みかん1個+かき1個=250円。','「りんご2個+みかん1個=290円」と組み合わせる方法などで解くと、りんご120円、みかん50円、かき80円。','(確かめ:みかん2個+かき1個=100+80=180円 ○)'],

{id:11,cat:'平面図形',r:30,unit:'cm²',title:'正方形の中の三角形',
 q:'1辺が12cmの正方形ABCDで、Mは辺BCの真ん中の点、Nは辺CDの真ん中の点です。三角形AMNの面積は何cm²ですか。',
 fig(){const A=P(80,30),B=P(80,270),C=P(320,270),Dd=P(320,30),M=P(200,270),N=P(320,150),cen=P(200,150);
   let b=poly([A,B,C,Dd])+poly([A,M,N],'s')+`<polygon points="${A.x},${A.y} ${M.x},${M.y} ${N.x},${N.y}" style="fill:var(--red-soft);stroke:var(--red);stroke-width:2"/>`;
   b+=tick(B,M,1)+tick(M,C,1)+tick(C,N,2)+tick(N,Dd,2);

 ans:54,
 hints:['三角形AMNを直接求めるのはむずかしい。まわりの部分を正方形からひこう。','まわりには直角三角形が3つあります。'],
 sol:['正方形の面積は 12×12=144cm²。','三角形ABM=12×6÷2=36、三角形ADN=12×6÷2=36、三角形MCN=6×6÷2=18。','三角形AMN=144−36−36−18=54(cm²)。'],

{id:12,cat:'角度',r:6,unit:'度',title:'20°の二等辺三角形(超難問)',
 q:'AB=AC、角Aが20°の二等辺三角形ABCがあります。辺AC上に、角DBCが60°になる点Dを、辺AB上に、角ECBが50°になる点Eをとります。角EDB(x)は何度ですか。',
 fig(){const B=P(150,370),C=P(270,370),A=P(210,370-60*Math.tan(80*D));
   const Dp=inter(B,dir(-60),C,unit(sub(A,C))),E=inter(C,dir(-130),B,unit(sub(A,B))),cen=P(210,250);
   let b=poly([A,B,C])+seg(B,Dp)+seg(C,E)+seg(E,Dp);
   b+=arc(A,B,C,30,'20°','arc',48)+arc(B,C,Dp,24,'60°','arc',40)+arc(C,E,B,24,'50°','arc',40)+arc(Dp,E,B,16,'x','arcx',30);
   b+=name(A,'A',cen)+name(B,'B',cen)+name(C,'C',cen)+txt(add(Dp,P(16,0)),'D')+txt(add(E,P(-16,0)),'E');
   return svg(400,400,b)},
 ans:30,
 hints:['角度を全部書きこんでも、x はすぐには求まりません。補助線が必要です。','辺AC上に、角FBC=20°となる点Fをとってみよう(BF=BCになります)。二等辺三角形と正三角形が見えてきます。'],
 sol:['角ABC=角ACB=80°。辺AC上に、角FBC=20°となる点Fをとると、三角形BCFは BC=BF の二等辺三角形(角BFC=80°)。','角EBC=80°、角ECB=50°より角BEC=50°なので、三角形BCEは BC=BE の二等辺三角形。よって BE=BC=BF。','角EBF=80−20=60°で BE=BF なので、三角形BEFは正三角形。EF=BF。','角FBD=60−20=40°、角BDF(=角BDC)=180−60−80=40°なので、三角形BFDは FB=FD の二等辺三角形。よって FE=FD。','角BFD=180−80=100°、角BFE=60°なので、角EFD=100−60=40°。FE=FDより、角FDE=(180−40)÷2=70°。','x=角EDB=角FDE−角FDB=70−40=30(°)。'],
 key:'「ラングレーの問題」とよばれる、世界的に有名な超難問です。補助線で正三角形と二等辺三角形をつくるのが決め手。答えを知っていても、説明できるまでくり返す価値があります。'},
{id:13,cat:'立体図形',r:26,unit:'個',title:'ぬられた立方体',
 q:'1辺1cmの立方体を、たて3個・横4個・高さ5個に積んで直方体をつくりました。この直方体の表面全体に色をぬってから、ばらばらにします。ちょうど2つの面だけに色がぬられた立方体は何個ありますか。',
 ans:24,
 hints:['ちょうど2面がぬられているのは、直方体の「辺」の上にあって、かどではない立方体です。','直方体の辺は12本。たての辺・横の辺・高さの辺が4本ずつあります。それぞれ、かどの2個をのぞいて数えよう。'],
 sol:['2面だけぬられた立方体は、辺の上にあり、かど(3面ぬられた立方体)ではないもの。','たて3個の辺:かどをのぞくと 3−2=1個。これが4本で4個。','横4個の辺:4−2=2個。4本で8個。','高さ5個の辺:5−2=3個。4本で12個。','合計 4+8+12=24個。'],
 key:'3面=かど(8個)、2面=辺(かどをのぞく)、1面=面のまん中、0面=中にかくれた部分。それぞれの場所を立体で思いうかべることが大切です。'},
{id:14,cat:'規則性',r:30,unit:'回',title:'13日の金曜日',
 q:'2026年1月1日は木曜日です。2026年の1年間に、「13日の金曜日」は何回ありますか。',
 ans:3,
 hints:['まず1月13日が何曜日かを考えよう。7日ごとに同じ曜日になります。','1か月の日数を7で割ったあまりだけ、次の月の同じ日の曜日がずれます(31日なら3つ、30日なら2つ、2026年の2月は28日で0)。'],
 sol:['1月1日が木曜日なので、1月13日は12日後で、12÷7=1あまり5 → 木曜日から5つ進んで火曜日。','次の月の13日は、その月の日数を7で割ったあまりだけ曜日が進む。31日→3つ、30日→2つ、28日→0。','1月火、2月金、3月金、4月月、5月水、6月土、7月月、8月木、9月日、10月火、11月金、12月日。','金曜日は2月・3月・11月の3回。'],
 key:'日暦算は「日数を7で割ったあまり」だけを考えます。2月が28日の年は、2月と3月の同じ日が同じ曜日になります。'},
{id:15,cat:'規則性',r:28,unit:'個',title:'フィボナッチの偶数',
 q:'1, 1, 2, 3, 5, 8, 13, 21, …… のように、3番目からは、すぐ前の2つの数をたした数を並べていきます。はじめから100番目までの数のうち、偶数は何個ありますか。',
 ans:33,
 hints:['数そのものではなく、「奇数か偶数か」だけを書き出してみよう。','奇・奇・偶・奇・奇・偶……と、3つずつのくり返しになります。'],
 sol:['奇数+奇数=偶数、奇数+偶数=奇数、偶数+奇数=奇数。','並びは「奇・奇・偶」の3つのくり返し。3番目、6番目、9番目……が偶数。','100÷3=33あまり1 なので、偶数は33個。'],
 key:'大きな数を計算しなくても、「偶数か奇数か」「一の位」などに注目するとくり返しが見つかります。'},
{id:16,cat:'規則性',r:24,unit:'回',title:'数字の1を書く回数',
 q:'1から199までの整数を、すべて書き並べます。数字の「1」は、全部で何回書きますか。',
 ans:140,
 hints:['一の位、十の位、百の位に分けて、1が何回出てくるかを数えよう。','百の位の1は、100〜199の100回あります。'],
 sol:['一の位の1:1,11,21,……,191 で、10ごとに1回 → 20回。','十の位の1:10〜19 と 110〜119 で、10回ずつ → 20回。','百の位の1:100〜199 の100回。','合計 20+20+100=140回。'],
 key:'「数の個数」ではなく「数字の個数」を、位ごとに分けて数えるのがコツです。'},
{id:17,cat:'数の性質',r:18,unit:'回',title:'3で何回割れる?',
 q:'1から100までの整数をすべてかけた数 1×2×3×……×100 は、3で何回割り切れますか。(割った答えがまた3で割り切れる限り、割り続けます。)',
 ans:48,
 hints:['かけた数の中に、3がいくつふくまれているかを数えよう。','3の倍数、9の倍数、27の倍数、81の倍数の個数をそれぞれ数えてたします。'],
 sol:['3の倍数は 100÷3=33個(3を1つ以上ふくむ)。','9の倍数は 100÷9=11個(もう1つ多くふくむ)。','27の倍数は 100÷27=3個、81の倍数は1個。','合計 33+11+3+1=48回。'],
 key:'問題3(0の個数)と同じ考え方です。9=3×3、27=3×3×3、81=3×3×3×3 の分をたし忘れないように。'},
{id:18,cat:'場合の数',r:22,unit:'通り',title:'はらえる金額',
 q:'50円玉が1枚、10円玉が4枚、5円玉が3枚、1円玉が4枚あります。これらの一部または全部を使って、おつりなしではらえる金額は何通りありますか。',
 ans:109,
 hints:['1円玉と5円玉だけで、1円から何円まで1円きざみではらえるかな。','1円玉と5円玉で0〜19円がすべてはらえます。10円玉を使うと、それが10円ずつずれて重なります。'],
 sol:['1円玉4枚と5円玉3枚で、0円〜19円のすべてがはらえる(20通り)。','10円玉は0〜4枚なので、0〜40円をたせる。0〜19円に0〜40円をたすと、0円〜59円がすべてはらえる(60通り)。','50円玉を使うと 50円〜109円もはらえる。0〜59円と合わせて、0円〜109円がすべてはらえる。','0円をのぞいて、1円〜109円の109通り。'],
 key:'硬貨の組み合わせの数(2×5×4×5=200通り)をそのまま答えにしないこと。同じ金額になる組み合わせがあるので「金額」で数えます。'},
{id:19,cat:'場合の数',r:26,unit:'通り',title:'階段の上り方',
 q:'10段の階段を、1回に1段か2段ずつ上ります。上り方は全部で何通りありますか。',
 ans:89,
 hints:['1段目、2段目、3段目……まで上る方法を、少ない段から順に数えよう。','ある段に着く方法は、「1つ下の段から1段」か「2つ下の段から2段」。だから、その2つの段の数をたせばよい。'],
 sol:['1段目まで1通り、2段目まで2通り。','3段目=1+2=3、4段目=2+3=5、5段目=8、6段目=13、7段目=21、8段目=34、9段目=55。','10段目=34+55=89通り。'],
 key:'問題15と同じ「前の2つをたす」並びが出てきます。最後の1歩が1段か2段かで分けて考えるのがポイント。'},
{id:20,cat:'場合の数',r:20,unit:'通り',title:'プレゼント交換',
 q:'A、B、C、Dの4人が1つずつプレゼントを持ちより、交換します。だれも自分が持ってきたプレゼントを受け取らないような分け方は、何通りありますか。',
 ans:9,
 hints:['Aが受け取るのはB・C・Dのどれか、の3通りに分けて考えよう。','AがBのプレゼントを受け取る場合を、樹形図ですべて書き出してみよう(3通りあります)。'],
 sol:['AがBのプレゼントを受け取るとき、B・C・Dの受け取り方を書き出すと、(B,C,D)=(A,D,C)、(C,D,A)、(D,A,C) の3通り。','AがCのとき、AがDのときも同じように3通りずつ。','3×3=9通り。'],
 key:'「自分のものを受け取らない」は樹形図で数えるのが確実です。4人で9通り、と覚えておくと検算にも使えます。'},
{id:21,cat:'特殊算',r:30,unit:'個',title:'中空方陣',
 q:'碁石を、まわりの1辺に12個ずつ並ぶ正方形の形にし、外側から3列だけ並べて、中が空いた方陣をつくりました。碁石は全部で何個使いましたか。',
 fig(){let b='';const o=40,g=20;for(let i=0;i<12;i++)for(let j=0;j<12;j++){const ring=Math.min(i,j,11-i,11-j);if(ring<3)b+=`<circle cx="${o+i*g}" cy="${o+j*g}" r="7" class="dot"/>`}
   return svg(300,300,b)},
 ans:108,
 hints:['いちばん外側の1周には何個あるかな。1辺12個でも、4×12=48個ではありません(かどを2回数えてしまう)。','1辺が12個、10個、8個の3つの「わく」に分けて考えよう。'],
 sol:['1辺に□個並ぶ正方形の1周は、(□−1)×4個。','いちばん外側:(12−1)×4=44個。2列目:1辺10個なので (10−1)×4=36個。3列目:1辺8個なので (8−1)×4=28個。','合計 44+36+28=108個。','(別の考え方:12×12−6×6=144−36=108個)'],
 key:'方陣は「かどを2回数えない」がいちばん大事。全体の正方形から中の正方形をひく方法でも確かめられます。'},
{id:22,cat:'特殊算',r:24,unit:'個',title:'3種類のつるかめ算',
 q:'1個50円のガム、1個80円のチョコ、1個120円のクッキーを合わせて20個買ったら、代金は1770円でした。チョコの個数はガムの個数より2個多くなっています。クッキーは何個買いましたか。',
 ans:8,
 hints:['チョコの2個分(160円)を先に取りのぞくと、ガムとチョコの個数が同じになります。','ガム1個とチョコ1個を「セット(130円・2個)」にして、セットとクッキーのつるかめ算にしよう。'],
 sol:['チョコ2個分をひくと、個数は 20−2=18個、代金は 1770−160=1610円。ここではガムとチョコが同じ数。','ガムとチョコを1個ずつのセット(2個で130円)と考える。全部クッキーだと、18個で 120×18=2160円。','クッキー2個(240円)をセット1つ(130円)にかえると、110円へる。2160−1610=550円なので、550÷110=5セット。','セットは5つ(ガム5個・チョコ5個)なので、クッキーは 18−10=8個。(チョコは5+2=7個)'],
 key:'3種類のつるかめ算は、「条件で2種類をまとめて1つにする」のが定番です。'},
{id:23,cat:'特殊算',r:32,unit:'個',title:'あめの過不足算',
 q:'何人かの子どもにあめを配ります。1人に5個ずつ配ると8個あまります。1人に7個ずつ配ると、最後の1人だけは3個しかもらえません。あめは何個ありますか。',
 ans:38,
 hints:['「最後の1人が3個」は、7個ずつ配るには何個足りないということかな。','7個ずつ配るには4個足りません。「5個ずつで8個あまり、7個ずつで4個不足」の過不足算です。'],
 sol:['7個ずつ配るには 7−3=4個足りない。','1人あたり 7−5=2個ふやすと、全体で 8+4=12個多く必要になる。','人数は 12÷2=6人。','あめは 5×6+8=38個。'],
 key:'「最後の1人だけ□個」は、不足の数に直してから過不足算にします。'},
{id:24,cat:'特殊算',r:30,unit:'本',title:'池のまわりの木とくい',
 q:'1周180mの池のまわりに、6mおきに木を植えます。さらに、となり合う木と木の間に、2mおきにくいを打ちます(木のある場所には打ちません)。くいは全部で何本打ちますか。',
 ans:60,
 hints:['池のまわり(1周)では、木の本数と間の数は同じです。','木と木の間6mには、2mおきに何本くいが打てるかな(両はしは木)。'],
 sol:['1周なので、木の本数=間の数=180÷6=30本。','木と木の間6mに2mおきに打つと、2mと4mの地点の2本(両はしは木なので打たない)。','くいは 2×30=60本。'],
 key:'植木算は、「1周(池)」か「直線」か、「両はしに植えるか」で式が変わります。小さい図をかいて確かめよう。'},
{id:25,cat:'特殊算',r:34,unit:'年後',title:'父と子の年齢',
 q:'父は45歳、3人の子どもは10歳、7歳、4歳です。父の年齢が、3人の子どもの年齢の和と等しくなるのは何年後ですか。',
 ans:12,
 hints:['今の差はいくつかな。','1年たつと、父は1歳、子ども3人の和は3歳ふえます。差は1年で何歳ちぢまるかな。'],
 sol:['今、子ども3人の年齢の和は 10+7+4=21歳。父との差は 45−21=24歳。','1年ごとに、父は1歳、子どもの和は3歳ふえるので、差は 3−1=2歳ずつちぢまる。','24÷2=12年後。','(確かめ:父57歳、子ども22+19+16=57歳 ○)'],
 key:'年齢算で人数がちがうときは、「1年で和が何歳ふえるか」が人数によってちがうことに注目します。'},
{id:26,cat:'和と差',r:32,unit:'円',title:'りんごとみかん',
 q:'りんご3個とみかん5個を買うと750円、りんご5個とみかん3個を買うと850円です。りんご1個は何円ですか。',
 ans:125,
 hints:['2つの買い方を合わせると、りんごとみかんは何個ずつになるかな。','2つの買い方の差を考えると、「りんご2個とみかん2個の差」がわかります。'],
 sol:['2つを合わせると、りんご8個とみかん8個で 750+850=1600円。りんご1個+みかん1個=200円。','2つの差は、りんごが2個多くみかんが2個少ない分で 850−750=100円。りんご1個はみかん1個より50円高い。','和が200円、差が50円なので、りんごは (200+50)÷2=125円。'],
 key:'個数が入れかわった形の消去算は、「たす」と「ひく」で和と差を作ると一気に解けます。'},
{id:27,cat:'平面図形',r:20,unit:'cm²',title:'回した正方形の重なり',
 q:'1辺10cmの正方形ABCDの、対角線が交わる点Oに、同じ大きさの正方形の1つの頂点を重ね、図のように少し回して置きました。2つの正方形が重なった部分(色のついた部分)の面積は何cm²ですか。',
 fig(){const A=P(60,60),B=P(60,260),C=P(260,260),Dd=P(260,60),O=P(160,160),u=dir(20),v=dir(110);
   const X=P(260,160+100*Math.tan(20*D)),Y=P(160-100*Math.tan(20*D),260);
   let b=`<polygon points="${O.x},${O.y} ${X.x},${X.y} ${C.x},${C.y} ${Y.x},${Y.y}" style="fill:var(--red-soft);stroke:none"/>`;
   b+=poly([A,B,C,Dd])+poly([O,add(O,mul(u,200)),add(add(O,mul(u,200)),mul(v,200)),add(O,mul(v,200))],'s')+seg(A,C,'aux')+seg(B,Dd,'aux');
   const cen=P(160,160);b+=name(A,'A',cen)+name(B,'B',cen)+name(C,'C',cen)+name(Dd,'D',cen)+txt(add(O,P(0,-14)),'O');
   return svg(380,440,b)},
 ans:25,
 hints:['回す角度を変えても、重なった部分の面積は変わるかな。','Oから正方形ABCDの辺に垂直な線を引くと、合同な2つの三角形が見えてきます。'],
 sol:['Oから辺BCと辺CDに垂直な線を下ろすと、重なり部分は、Oをかどにする1辺5cmの正方形から三角形を1つ切り取り、別の場所に同じ三角形をつけた形になる。','切り取る三角形とつける三角形は、Oのまわりの角が等しく、辺の長さも5cmで等しいので合同。','よって重なり部分は、正方形ABCDの4分の1と同じ面積。10×10÷4=25(cm²)。'],
 key:'「どんなに回しても面積は同じ」と見ぬけるかが勝負。回す角度を0°にした場合を考えると、答えの見当がつきます。'},
{id:28,cat:'角度',r:28,unit:'度',title:'正方形と正三角形',
 q:'正方形ABCDの内側に、辺BCを1辺とする正三角形EBCをかきました。角AED(x)は何度ですか。',
 fig(){const A=P(80,50),B=P(80,270),C=P(300,270),Dd=P(300,50),E=P(190,270-220*Math.sin(60*D)),cen=P(190,160);
   let b=poly([A,B,C,Dd])+poly([E,B,C])+seg(A,E)+seg(Dd,E);
   b+=arc(E,A,Dd,12,'x','arcx',22)+tick(A,B,1)+tick(B,E,1)+tick(E,C,1)+tick(C,Dd,1);
   b+=name(A,'A',cen)+name(B,'B',cen)+name(C,'C',cen)+name(Dd,'D',cen)+txt(add(E,P(0,24)),'E');
   return svg(380,310,b)},
 ans:150,
 hints:['正方形の辺と正三角形の辺は、長さが同じです。BAとBEの長さに注目しよう。','三角形ABEは BA=BE の二等辺三角形。角ABEは 90−60=30° です。'],
 sol:['BA=BC=BE なので、三角形ABEは二等辺三角形。角ABE=90−60=30°。','角BEA=(180−30)÷2=75°。同じように、三角形DCEで角CED=75°。','点Eのまわりは360°なので、x=360−75−75−60=150(°)。'],
 key:'「正方形+正三角形」は、同じ長さの辺から二等辺三角形を見つけるのが定番。75°と15°がよく出てきます。'},
{id:29,cat:'平面図形',r:30,unit:'本',title:'多角形の対角線',
 q:'内角の和が1980°になる多角形があります。この多角形の対角線は、全部で何本ありますか。',
 ans:65,
 hints:['□角形の内角の和は 180×(□−2) 度です。','1つの頂点からは、自分ととなりの2つをのぞいた頂点に対角線が引けます。'],
 sol:['1980÷180=11 なので、□−2=11、□=13。十三角形。','1つの頂点から引ける対角線は 13−3=10本。','13個の頂点から10本ずつだと、同じ対角線を2回数えるので、13×10÷2=65本。'],

{id:30,cat:'立体図形',r:24,unit:'cm²',title:'積み上げた立体の表面積',

{id:31,cat:'立体図形',r:22,unit:'個',title:'穴のあいた立方体',
 q:'1辺1cmの立方体27個で、3×3×3の大きな立方体をつくりました。6つの面それぞれのまん中の立方体から反対側の面まで、まっすぐに立方体をぬき取ります(たて・横・高さの3方向)。残った立方体は何個ですか。',

];
const CATS=['規則性','数の性質','場合の数','特殊算','和と差','平面図形','角度','立体図形'];
PROBS.sort((a,b)=>CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||a.id-b.id);
// ---- 画面 ----
const KEY='sansu-chonanmon-v1';
let REC={};try{REC=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){REC={}}
function saveRec(){try{localStorage.setItem(KEY,JSON.stringify(REC))}catch(e){}}
const rec=p=>REC[p.id]||(REC[p.id]={ok:false,miss:0,peek:false});
const S={i:0,memoOpen:false,confirmReset:false,st:PROBS.map(p=>({input:'',res:(REC[p.id]&&REC[p.id].ok)?'ok':null,hint:0,sol:false,fig:[],memo:[],undo:[]}))};
{const k=PROBS.findIndex(p=>!(REC[p.id]&&REC[p.id].ok));if(k>0)S.i=k}
const navCls=(p,i)=>S.st[i].res==='ok'?'ok':(REC[p.id]&&(REC[p.id].miss||REC[p.id].peek))?'ng':'';
// ---- 書きこみ(図と計算用紙で共通) ----
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLORS=[{k:'ink',n:'黒',v:()=>css('--ink')},{k:'red',n:'赤',v:()=>css('--red')},{k:'blue',n:'青',v:()=>css('--pen')},{k:'green',n:'緑',v:()=>css('--green')}];
const T={tool:'line',color:'red'};
const boards={};
function snapshot(st){st.undo.push(JSON.stringify({fig:st.fig,memo:st.memo}));if(st.undo.length>60)st.undo.shift()}
function setupBoard(id,key,withSnaps){
  const cv=document.getElementById(id);if(!cv)return;
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const B={cv,ctx,key,snaps:[],cur:null,erasing:false};boards[key]=B;
  if(withSnaps){
    // 図の点(線の端・頂点・円の中心)を集めて、補助線をくっつける先にする
    const svgEl=cv.previousElementSibling,vb=svgEl.viewBox.baseVal,k=Math.min(r.width/vb.width,r.height/vb.height),ox=(r.width-vb.width*k)/2,oy=(r.height-vb.height*k)/2;
    const toN=(x,y)=>({x:(ox+x*k)/r.width,y:(oy+y*k)/r.height});
    svgEl.querySelectorAll('line.s').forEach(l=>B.snaps.push(toN(+l.getAttribute('x1'),+l.getAttribute('y1')),toN(+l.getAttribute('x2'),+l.getAttribute('y2'))));
    svgEl.querySelectorAll('polygon.s').forEach(g=>g.getAttribute('points').trim().split(/\s+/).forEach(pp=>{const [x,y]=pp.split(',').map(Number);B.snaps.push(toN(x,y))}));
    svgEl.querySelectorAll('circle').forEach(c=>B.snaps.push(toN(+c.getAttribute('cx'),+c.getAttribute('cy'))));
  }
  const st=()=>S.st[S.i];
  const pt=(e,snap)=>{const rr=cv.getBoundingClientRect();let p={x:(e.clientX-rr.left)/rr.width,y:(e.clientY-rr.top)/rr.height};
    if(snap&&B.snaps.length){let best=null,bd=16;B.snaps.forEach(q=>{const d=Math.hypot((q.x-p.x)*rr.width,(q.y-p.y)*rr.height);if(d<bd){bd=d;best=q}});if(best)p={...best}}return p};
  const eraseAt=p=>{const w=cv.clientWidth,h=cv.clientHeight,list=st()[key];
    const near=s=>{for(let i=0;i<s.pts.length;i++){const a=s.pts[i],b=s.pts[Math.min(i+1,s.pts.length-1)];
      const ax=a.x*w,ay=a.y*h,bx=b.x*w,by=b.y*h,px=p.x*w,py=p.y*h,dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
      const t=L?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/L)):0;if(Math.hypot(ax+t*dx-px,ay+t*dy-py)<14)return true}return false};
    const keep=list.filter(s=>!near(s));if(keep.length!==list.length){if(!B.erasing){snapshot(st());B.erasing=true}st()[key]=keep;drawB(B)}};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);
    if(T.tool==='eraser'){B.erasing=false;B.cur={erase:true};eraseAt(pt(e,false));return}
    const tool=T.tool==='line'?'line':'pen',p=pt(e,tool==='line');B.cur={t:tool,c:T.color,pts:[p,p]};drawB(B)};
  cv.onpointermove=e=>{if(!B.cur)return;if(B.cur.erase){eraseAt(pt(e,false));return}
    const p=pt(e,B.cur.t==='line');if(B.cur.t==='pen')B.cur.pts.push(p);else B.cur.pts[1]=p;drawB(B)};
  const end=()=>{const c=B.cur;if(!c)return;B.cur=null;
    if(c.erase){if(B.erasing)render();return}
    const a=c.pts[0],b=c.pts[c.pts.length-1];
    if(c.t==='pen'?c.pts.length>2:Math.hypot((a.x-b.x)*cv.clientWidth,(a.y-b.y)*cv.clientHeight)>6){snapshot(st());st()[key].push(c);render()}else drawB(B)};
  cv.onpointerup=end;cv.onpointercancel=end;
  drawB(B);
}
function drawB(B){const {cv,ctx}=B,w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);
  [...S.st[S.i][B.key],...(B.cur&&!B.cur.erase?[B.cur]:[])].forEach(s=>{ctx.strokeStyle=(COLORS.find(c=>c.k===s.c)||COLORS[0]).v();ctx.lineWidth=s.t==='pen'?2.5:2;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.setLineDash(s.t==='line'&&B.key==='fig'?[7,5]:[]);ctx.beginPath();s.pts.forEach((q,i)=>i?ctx.lineTo(q.x*w,q.y*h):ctx.moveTo(q.x*w,q.y*h));ctx.stroke()});
  ctx.setLineDash([]);}
function toolbar(){const st=S.st[S.i];return `<div class="tools" role="toolbar" aria-label="書きこみの道具">
      <button class="tool" data-tool="line" aria-pressed="${T.tool==='line'}">／ 直線</button>
      <button class="tool" data-tool="pen" aria-pressed="${T.tool==='pen'}">✎ ペン</button>
      <button class="tool" data-tool="eraser" aria-pressed="${T.tool==='eraser'}">◻ 消しゴム</button>
      <span class="sep"></span>
      ${COLORS.map(c=>`<button class="tool swb" data-color="${c.k}" aria-pressed="${T.color===c.k}" aria-label="${c.n}" title="${c.n}"><span class="sw" style="background:${c.v()}"></span></button>`).join('')}
      <span class="sep"></span>
      <button class="tool" data-act="undo" ${st.undo.length?'':'disabled'}>↶ 戻す</button>
    </div>`}
window.addEventListener('resize',()=>{setupBoard('cv','fig',true);setupBoard('memo','memo',false)});
const app=document.getElementById('app');
function render(){
  const p=PROBS[S.i],st=S.st[S.i];
  app.innerHTML=`
  <header class="top">
    <div class="eyebrow">難関校受験対策・小学4年 算数</div>
    <h1>算数 超難問ドリル</h1>
    <p class="sub">小4までに習う範囲から、難関校レベルの超難問を31問。予測正答率が35%以下の問題ばかりです。解いた記録は、この端末のブラウザに残ります。ヒントは2段階、答えのあとに考え方が出ます。</p>
    <div class="nav">${PROBS.map((q,i)=>`<button data-go="${i}" aria-current="${i===S.i}" class="${navCls(q,i)}" aria-label="問題${i+1}">${i+1}</button>`).join('')}</div>
    ${(()=>{const done=PROBS.filter(p=>REC[p.id]&&REC[p.id].ok).length,ng=PROBS.filter(p=>REC[p.id]&&!REC[p.id].ok&&(REC[p.id].miss||REC[p.id].peek)).length;
      return `<div class="sum"><span><b>${done}</b> / ${PROBS.length}問 正解</span><span class="sng">復習 <b>${ng}</b>問</span>${done<PROBS.length?`<button class="tool" data-act="nextopen">まだ解けていない問題へ</button>`:''}</div>
      <p class="note2" style="margin:6px 0 0">緑=正解ずみ/赤=まちがえた・答えを先に見た(もう一度ちょうせん)</p>`})()}
  </header>
  <section class="card">
    <div class="meta"><span class="lv lv-過去問型">超難問</span><span class="cat">${p.cat}</span><span>問題${S.i+1}・${p.title}</span></div>
    <div class="rate">予測正答率 <b>${p.r}%</b><div class="track"><div class="fill" style="width:${p.r}%"></div></div></div>
    <div class="qtext">${p.q}</div>
    ${p.fig?`<div class="fig"><div class="figwrap">${p.fig()}<canvas id="cv" aria-label="書きこみ用のスペース"></canvas></div>${p.id===12?'<p class="note">※図はほぼ正確な大きさでかいています</p>':''}</div>
    ${toolbar()}
    <div class="row" style="margin-top:6px"><button class="tool" data-act="clearfig" ${st.fig.length?'':'disabled'}>図の書きこみを全部消す</button></div>
    <p class="note2" style="margin:4px 0 0">直線は、点の近くから引くと点にぴったりくっつきます。消しゴムは、なぞった線を1本ずつ消します。</p>`:''}
    <form class="ans" id="f">
      <label for="in">${p.unit==="度"?"x =":"答え"}</label><input id="in" inputmode="decimal" autocomplete="off" value="${st.input}" ${st.res==='ok'?'disabled':''}><span>${p.unit}</span>
      <button class="btn" ${st.res==='ok'?'disabled':''}>答え合わせ</button>
    </form>
    ${st.res==='ok'?`<div class="fb ok">○ 正解! ${p.ans}${p.unit}</div>`:st.res==='ng'?`<div class="fb ng">× ちがいます。ヒントを見て、もう一度考えてみよう。</div>`:''}
    ${p.hints.slice(0,st.hint).map((h,k)=>`<div class="hint"><b>ヒント${k+1}</b> ${h}</div>`).join('')}
    <div class="row">
      ${st.hint<p.hints.length&&st.res!=='ok'?`<button class="btn ghost" data-act="hint">ヒント${st.hint+1}を見る</button>`:''}
      ${!st.sol?`<button class="btn ghost" data-act="sol">${st.res==='ok'?'考え方を見る':'答えと考え方を見る'}</button>`:''}
      ${st.res==='ok'?`<button class="btn ghost" data-act="retry">もう一度とく</button>`:''}${S.i<PROBS.length-1?`<button class="btn" data-act="next">次の問題へ</button>`:''}
    </div>
    ${st.sol?`<div class="sol"><h3>答え ${p.ans}${p.unit}</h3><ol>${p.sol.map(s=>`<li>${s}</li>`).join('')}</ol><p class="key"><b>ポイント</b> ${p.key}</p></div>`:''}
  </section>
  <section class="card memo-card">
    <div class="memo-head"><h2>計算用紙</h2><button class="btn ghost" data-act="memo">${S.memoOpen?'とじる':'ひらく'}</button></div>
    ${S.memoOpen?`${toolbar()}
    <div class="memo-wrap ${S.memoBig?'big':''}"><canvas id="memo" aria-label="計算用紙"></canvas></div>
    <div class="row" style="margin-top:8px"><button class="tool" data-act="memobig">${S.memoBig?'小さくする':'広くする'}</button><button class="tool" data-act="clearmemo" ${st.memo.length?'':'disabled'}>計算用紙を全部消す</button></div>`:`<p class="note2" style="margin:6px 0 0">式や筆算を書くスペースです。問題ごとに別の紙になります。</p>`}
  </section>
  <p class="note2">書きこみは問題ごとに残ります(ページを閉じると消えます)。すぐに解けなくて当たり前の問題です。ヒント1→ヒント2の順に見て、自分の力で1歩でも先に進めることを大切にしよう。答えを先に見た問題は、あとで自力で正解すると緑になります。</p>
  <p class="note2">${S.confirmReset?`記録を全部消しますか? <button class="tool" data-act="resetyes">消す</button> <button class="tool" data-act="resetno">やめる</button>`:`<button class="tool" data-act="reset">記録を全部消す</button>`}</p>`;
  setupBoard('cv','fig',true);setupBoard('memo','memo',false);
}
app.addEventListener('submit',e=>{e.preventDefault();const st=S.st[S.i],v=document.getElementById('in').value.trim().replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/cm²|cm2/g,'').replace(/[^0-9.]/g,'');
  if(!v)return;st.input=v;st.res=(+v===PROBS[S.i].ans)?'ok':'ng';const r=rec(PROBS[S.i]);if(st.res==='ok'){if(!st.sol)r.ok=true}else r.miss++;saveRec();render();});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){S.i=+b.dataset.go;render();window.scrollTo(0,0);return}
  if(b.dataset.tool){T.tool=b.dataset.tool;render();return}
  if(b.dataset.color){T.color=b.dataset.color;render();return}
  const st=S.st[S.i],a=b.dataset.act;
  if(a==='undo'){const u=st.undo.pop();if(u){const o=JSON.parse(u);st.fig=o.fig;st.memo=o.memo}render();return}
  if(a==='clearfig'){snapshot(st);st.fig=[];render();return}
  if(a==='clearmemo'){snapshot(st);st.memo=[];render();return}
  if(a==='memo'){S.memoOpen=!S.memoOpen;if(S.memoOpen&&T.tool==='line')T.tool='pen';render();return}
  if(a==='memobig'){S.memoBig=!S.memoBig;render();return}
  if(a==='hint'){st.hint++;render()}
  else if(a==='sol'){st.sol=true;const r=rec(PROBS[S.i]);if(!r.ok){r.peek=true;saveRec()}render()}
  else if(a==='retry'){Object.assign(st,{input:'',res:null,hint:0,sol:false});render()}
  else if(a==='nextopen'){const n=PROBS.length;for(let k=1;k<=n;k++){const j=(S.i+k)%n;if(S.st[j].res!=='ok'){S.i=j;break}}render();window.scrollTo(0,0)}
  else if(a==='reset'){S.confirmReset=true;render()}
  else if(a==='resetno'){S.confirmReset=false;render()}
  else if(a==='resetyes'){REC={};saveRec();S.confirmReset=false;S.st.forEach(x=>Object.assign(x,{input:'',res:null,hint:0,sol:false}));S.i=0;render();window.scrollTo(0,0)}
  else if(a==='next'){S.i++;render();window.scrollTo(0,0)}
});
render();
</script>
